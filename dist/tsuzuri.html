        branch(x2, y2, a - 0.5 + jit(rnd, 0.15), len * 0.68, w * 0.65, d - 1);
        branch(x2, y2, a + 0.45 + jit(rnd, 0.15), len * 0.62, w * 0.65, d - 1);
      }
    };
    branch(0, 0, -Math.PI / 2 + jit(rnd, 0.1), 5.5, 1.6, 3);
  }

  function bush(ctx, rnd, C) {
    const lobes = [circ(-2, -2.2, 2.3), circ(1.8, -2.4, 2.5), circ(0, -3.8, 2.2)];
    union(ctx, lobes, C.leaf, C.ink, 0.55);
    ctx.save();
    clipShapes(ctx, lobes);
    ctx.beginPath();
    ctx.arc(2.5, -1, 2.6, 0, TAU);
    fs(ctx, C.leafShade);
    ctx.restore();
  }

  function grassTuft(ctx, rnd, C) {
    ctx.strokeStyle = C.grass;
    ctx.lineWidth = 0.75;
    for (let k = 0; k < 5; k++) {
      const a = -Math.PI / 2 + (k - 2) * 0.32 + jit(rnd, 0.08);
      const len = 3 + rnd() * 2.2;
      ctx.beginPath();
      ctx.moveTo((k - 2) * 0.6, 0);
      ctx.quadraticCurveTo((k - 2) * 0.6 + Math.cos(a) * len * 0.4, -len * 0.6, (k - 2) * 0.6 + Math.cos(a) * len, Math.sin(a) * len);
      ctx.stroke();
    }
  }

  function reeds(ctx, rnd, C) {
    ctx.strokeStyle = C.water;
    ctx.lineWidth = 0.7;
    line(ctx, -6, 0.6, -1.5, 0.6);
    line(ctx, 1, 1.4, 5.5, 1.4);
    ctx.strokeStyle = C.grass;
    ctx.lineWidth = 0.7;
    for (let k = 0; k < 4; k++) {
      const x = -3 + k * 2 + jit(rnd, 0.4);
      const hh = 4 + rnd() * 3;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.quadraticCurveTo(x + 0.3, -hh * 0.6, x + jit(rnd, 1), -hh);
      ctx.stroke();
      if (k % 2 === 0) {
        ctx.beginPath();
        ctx.ellipse(x + 0.1, -hh * 0.75, 0.5, 1.3, 0, 0, TAU);
        fs(ctx, C.trunk);
      }
    }
  }

  function giantTree(ctx, rnd, C) {
    ctx.save();
    ctx.scale(2.6, 2.6);
    treeRound(ctx, rnd, C, { r: 4.2, trunk: 3.6, fill: C.jungle, shade: C.jungleShade });
    ctx.restore();
    // 根
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 1;
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.moveTo(k * 0.8, -2);
      ctx.quadraticCurveTo(k * 2.5, -0.5, k * 4.5, 0.6);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,240,170,0.9)';
    for (let k = 0; k < 6; k++) {
      ctx.beginPath();
      ctx.arc(jit(rnd, 7), -18 - rnd() * 14, 0.6, 0, TAU);
      ctx.fill();
    }
  }

  // ───── 建物 ─────
  /** 2.5D の家（x,y は正面の下端中央） */
  function house(ctx, C, x, y, w, h, roof, roofShade, d) {
    d = d == null ? w * 0.45 : d;
    const x0 = x - w / 2;
    const x1 = x + w / 2;
    const top = y - h;
    const ridgeY = top - w * 0.5;
    ctx.lineWidth = 0.7;
    ctx.strokeStyle = C.ink;
    poly(ctx, [[x1, y], [x1 + d, y - d * 0.5], [x1 + d, top - d * 0.5], [x1, top]], true);
    fs(ctx, C.wallShade, C.ink, 0.7);
    poly(ctx, [[x0, y], [x1, y], [x1, top], [x0, top]], true);
    fs(ctx, C.wall, C.ink, 0.7);
    poly(ctx, [[x, ridgeY], [x + d, ridgeY - d * 0.5], [x1 + d + 0.5, top - d * 0.5], [x1 + 0.5, top]], true);
    fs(ctx, roofShade, C.ink, 0.7);
    poly(ctx, [[x0 - 0.6, top], [x, ridgeY], [x1 + 0.6, top]], true);
    fs(ctx, roof, C.ink, 0.7);
    ctx.fillStyle = C.ink;
    ctx.fillRect(x - w * 0.12, y - h * 0.55, w * 0.24, h * 0.55);
  }

  function towerShape(ctx, C, x, y, w, h, roof, roofShade, opts) {
    opts = opts || {};
    const x0 = x - w / 2;
    const top = y - h;
    poly(ctx, [[x0, y], [x0 + w, y], [x0 + w, top], [x0, top]], true);
    fs(ctx, C.wall);
    poly(ctx, [[x, y], [x0 + w, y], [x0 + w, top], [x, top]], true);
    fs(ctx, C.wallShade);
    poly(ctx, [[x0, y], [x0 + w, y], [x0 + w, top], [x0, top]], true);
    fs(ctx, null, C.ink, 0.75);
    if (opts.flat) {
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i === 2 ? C.wallShade : C.wall;
        ctx.fillRect(x0 + i * w / 3 + 0.2, top - 1.4, w / 3 - 0.9, 1.4);
        ctx.strokeRect(x0 + i * w / 3 + 0.2, top - 1.4, w / 3 - 0.9, 1.4);
      }
    } else {
      poly(ctx, [[x0 - 0.8, top], [x, top - w * 1.25], [x0 + w + 0.8, top]], true);
      fs(ctx, roof, C.ink, 0.7);
      poly(ctx, [[x, top - w * 1.25], [x0 + w + 0.8, top], [x + 0.3, top]], true);
      fs(ctx, roofShade, C.ink, 0.7);
      if (opts.flag) {
        ctx.lineWidth = 0.6;
        line(ctx, x, top - w * 1.25, x, top - w * 1.25 - 4);
        poly(ctx, [[x, top - w * 1.25 - 4], [x + 3.2, top - w * 1.25 - 3.2], [x, top - w * 1.25 - 2.4]], true);
        fs(ctx, C.red, C.ink, 0.4);
      }
    }
    ctx.fillStyle = C.ink;
    ctx.fillRect(x - 0.45, top + h * 0.28, 0.9, 1.6);
  }

  function wallSeg(ctx, C, x0, y0, x1, y1, hh) {
    poly(ctx, [[x0, y0], [x1, y1], [x1, y1 - hh], [x0, y0 - hh]], true);
    fs(ctx, C.stone, C.ink, 0.65);
    const n = Math.max(2, Math.round(Math.hypot(x1 - x0, y1 - y0) / 1.8));
    ctx.fillStyle = C.stone;
    for (let i = 0; i < n; i += 2) {
      const t0 = i / n;
      const t1 = (i + 1) / n;
      const ax = x0 + (x1 - x0) * t0;
      const ay = y0 + (y1 - y0) * t0 - hh;
      const bx = x0 + (x1 - x0) * t1;
      const by = y0 + (y1 - y0) * t1 - hh;
      poly(ctx, [[ax, ay], [bx, by], [bx, by - 1.2], [ax, ay - 1.2]], true);
      fs(ctx, C.stone, C.ink, 0.5);
    }
  }

  function castle(ctx, rnd, C) {
    wallSeg(ctx, C, -11, 0, 11, 0, 5);
    towerShape(ctx, C, -10, 1, 4.2, 11, C.roof, C.roofShade, { flag: false });
    towerShape(ctx, C, 10, 1, 4.2, 11, C.roof, C.roofShade, {});
    towerShape(ctx, C, 0, -1.5, 7, 15, C.roof2, C.roof2Shade, { flag: true });
    towerShape(ctx, C, -4.5, 0.5, 3.2, 9, C.roof2, C.roof2Shade, {});
    towerShape(ctx, C, 4.5, 0.5, 3.2, 9, C.roof2, C.roof2Shade, {});
    ctx.beginPath();
    ctx.arc(0, -1.5, 1.6, Math.PI, 0);
    ctx.lineTo(1.6, -1.5);
    fs(ctx, C.ink);
  }

  function city(ctx, rnd, C) {
    const back = [];
    for (let i = 0; i < 7; i++) back.push([-11 + i * 3.6 + jit(rnd, 0.6), -5 - rnd() * 2.5]);
    back.forEach(([x, y], i) => house(ctx, C, x, y, 3.2 + rnd() * 1.2, 2.6 + rnd() * 1.5, i % 3 === 0 ? C.roof2 : C.roof, i % 3 === 0 ? C.roof2Shade : C.roofShade, 1.4));
    towerShape(ctx, C, -3, -3.5, 3.4, 12, C.roof2, C.roof2Shade, { flag: true });
    towerShape(ctx, C, 6, -3, 2.6, 9, C.roof, C.roofShade, {});
    for (let i = 0; i < 5; i++) {
      const x = -9 + i * 4.3 + jit(rnd, 0.5);
      house(ctx, C, x, -0.8 + jit(rnd, 0.4), 3.6, 3.2 + rnd(), i % 2 ? C.roof : C.roof2, i % 2 ? C.roofShade : C.roof2Shade, 1.5);
    }
    wallSeg(ctx, C, -13, 1.5, 13, 1.5, 2.6);
    towerShape(ctx, C, -13, 2.2, 2.6, 5, C.roof, C.roofShade, { flat: true });
    towerShape(ctx, C, 13, 2.2, 2.6, 5, C.roof, C.roofShade, { flat: true });
  }

  function town(ctx, rnd, C) {
    towerShape(ctx, C, 1.5, -2.5, 2.6, 10, C.roof2, C.roof2Shade, {});
    const spots = [[-7, -2.5], [-2.5, -3], [5.5, -2.2], [-5, 0.8], [0, 1], [5, 1.2]];
    spots.forEach(([x, y], i) => house(ctx, C, x + jit(rnd, 0.5), y, 3.6 + rnd(), 3 + rnd() * 1.2, i % 3 === 1 ? C.roof2 : C.roof, i % 3 === 1 ? C.roof2Shade : C.roofShade, 1.6));
  }

  function village(ctx, rnd, C) {
    house(ctx, C, -4 + jit(rnd, 0.5), -1.5, 4, 3.2, C.roof, C.roofShade, 1.8);
    house(ctx, C, 3.5 + jit(rnd, 0.5), -2.3, 3.6, 3, C.roof, C.roofShade, 1.6);
    house(ctx, C, 0 + jit(rnd, 0.5), 1, 3.8, 3.2, C.wood, C.woodShade, 1.7);
  }

  function houseAsset(ctx, rnd, C) {
    house(ctx, C, 0, 0, 5.5, 4.5, rnd() < 0.5 ? C.roof : C.roof2, rnd() < 0.5 ? C.roofShade : C.roof2Shade, 2.4);
  }

  function tower(ctx, rnd, C) {
    towerShape(ctx, C, 0, 0, 4.4, 17, C.roof2, C.roof2Shade, { flag: true });
    ctx.fillStyle = C.ink;
    ctx.fillRect(-0.5, -12, 1, 2);
  }

  function fort(ctx, rnd, C) {
    wallSeg(ctx, C, -10, -3, 0, -7, 4);
    wallSeg(ctx, C, 0, -7, 10, -3, 4);
    towerShape(ctx, C, 0, -6.5, 4, 9, C.wood, C.woodShade, {});
    wallSeg(ctx, C, -10, -3, 0, 1, 4);
    wallSeg(ctx, C, 0, 1, 10, -3, 4);
    towerShape(ctx, C, -10, -2.5, 3, 7, C.wood, C.woodShade, { flat: true });
    towerShape(ctx, C, 10, -2.5, 3, 7, C.wood, C.woodShade, { flat: true });
    towerShape(ctx, C, 0, 1.5, 3, 7, C.wood, C.woodShade, { flat: true });
  }

  function temple(ctx, rnd, C) {
    poly(ctx, [[-11, 0], [11, 0], [10, -2], [-10, -2]], true);
    fs(ctx, C.stone, C.ink, 0.7);
    for (let i = 0; i < 6; i++) {
      const x = -8 + i * 3.2;
      poly(ctx, [[x - 0.9, -2], [x + 0.9, -2], [x + 0.9, -10], [x - 0.9, -10]], true);
      fs(ctx, i > 2 ? C.wallShade : C.wall, C.ink, 0.6);
    }
    poly(ctx, [[-10.5, -10], [10.5, -10], [10.5, -11.5], [-10.5, -11.5]], true);
    fs(ctx, C.wall, C.ink, 0.7);
    poly(ctx, [[-11.5, -11.5], [0, -16.5], [11.5, -11.5]], true);
    fs(ctx, C.wall, C.ink, 0.8);
    poly(ctx, [[0, -16.5], [11.5, -11.5], [0, -11.5]], true);
    fs(ctx, C.wallShade);
    poly(ctx, [[-11.5, -11.5], [0, -16.5], [11.5, -11.5]], true);
    fs(ctx, null, C.ink, 0.8);
  }

  function church(ctx, rnd, C) {
    house(ctx, C, 2.5, 0, 9, 5.5, C.roof2, C.roof2Shade, 3);
    towerShape(ctx, C, -4.5, 0.5, 4, 11, C.roof2, C.roof2Shade, {});
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 0.7;
    line(ctx, -4.5, -15.5, -4.5, -18.5);
    line(ctx, -5.6, -17.4, -3.4, -17.4);
  }

  function windmill(ctx, rnd, C) {
    poly(ctx, [[-3.5, 0], [3.5, 0], [2.2, -11], [-2.2, -11]], true);
    fs(ctx, C.wall, C.ink, 0.75);
    poly(ctx, [[0, 0], [3.5, 0], [2.2, -11], [0, -11]], true);
    fs(ctx, C.wallShade);
    poly(ctx, [[-3.5, 0], [3.5, 0], [2.2, -11], [-2.2, -11]], true);
    fs(ctx, null, C.ink, 0.75);
    poly(ctx, [[-2.8, -11], [0, -14], [2.8, -11]], true);
    fs(ctx, C.roof, C.ink, 0.7);
    const a0 = rnd() * Math.PI / 2;
    for (let k = 0; k < 4; k++) {
      const a = a0 + k * Math.PI / 2;
      const ca = Math.cos(a);
      const sa = Math.sin(a);
      const pts = [[0, -11.5], [ca * 10 - sa * 0.9, -11.5 + sa * 10 + ca * 0.9], [ca * 10 + sa * 0.9, -11.5 + sa * 10 - ca * 0.9]];
      poly(ctx, [[0, -11.5], [ca * 2.5 + sa * 1.6, -11.5 + sa * 2.5 - ca * 1.6], pts[2], pts[1], [ca * 2.5 - sa * 1.6, -11.5 + sa * 2.5 + ca * 1.6]], true);
      fs(ctx, C.wall, C.ink, 0.55);
    }
    ctx.beginPath();
    ctx.arc(0, -11.5, 0.9, 0, TAU);
    fs(ctx, C.ink);
  }

  function lighthouse(ctx, rnd, C) {
    poly(ctx, [[-6, 0], [6, 0], [4.5, -2.5], [-4.5, -2.5]], true);
    fs(ctx, C.stone, C.ink, 0.7);
    poly(ctx, [[-3, -2.5], [3, -2.5], [2, -17], [-2, -17]], true);
    fs(ctx, C.wall, C.ink, 0.75);
    for (let i = 0; i < 3; i++) {
      const y0 = -4.5 - i * 4.5;
      poly(ctx, [[-2.85 + i * 0.3, y0], [2.85 - i * 0.3, y0], [2.7 - i * 0.3, y0 - 2], [-2.7 + i * 0.3, y0 - 2]], true);
      fs(ctx, C.red, C.ink, 0.5);
    }
    poly(ctx, [[-2.4, -17], [2.4, -17], [2.4, -20], [-2.4, -20]], true);
    fs(ctx, C.gold, C.ink, 0.7);
    poly(ctx, [[-2.8, -20], [0, -22.5], [2.8, -20]], true);
    fs(ctx, C.roof, C.ink, 0.7);
    ctx.strokeStyle = 'rgba(240,200,80,0.7)';
    ctx.lineWidth = 0.9;
    [[-1, -0.25], [-1, 0.15], [1, -0.25], [1, 0.15]].forEach(([sx, sy]) => line(ctx, sx * 3.5, -18.5, sx * 11, -18.5 + sy * 22));
  }

  function farm(ctx, rnd, C) {
    const fields = [[-12, -6, 9, 5], [-2, -7, 8, 5.5], [-11, 0, 8, 4.5], [7, -5, 6, 5]];
    fields.forEach(([x, y, w, hh], i) => {
      poly(ctx, [[x, y + hh], [x + w, y + hh], [x + w + 1.5, y], [x + 1.5, y]], true);
      fs(ctx, i % 2 ? C.field : C.field2, C.ink, 0.55);
      ctx.strokeStyle = C.hatch;
      ctx.lineWidth = 0.45;
      for (let k = 1; k < 5; k++) line(ctx, x + k * w / 5, y + hh, x + 1.5 + k * w / 5, y);
    });
    house(ctx, C, 4, 1.5, 5.5, 4, C.roof, C.roofShade, 2);
  }

  function camp(ctx, rnd, C) {
    const tent = (x, y, w, hh, col) => {
      poly(ctx, [[x - w, y], [x, y - hh], [x + w, y]], true);
      fs(ctx, col, C.ink, 0.7);
      poly(ctx, [[x, y - hh], [x + w, y], [x + 0.5, y]], true);
      fs(ctx, 'rgba(0,0,0,0.15)');
      ctx.fillStyle = C.ink;
      poly(ctx, [[x - 0.8, y], [x, y - hh * 0.45], [x + 0.8, y]], true);
      ctx.fill();
    };
    tent(-5, -2, 4, 6, C.wall);
    tent(4.5, -3, 3.6, 5.5, C.field);
    tent(0, 1.5, 3.8, 5.5, C.wall);
    ctx.beginPath();
    ctx.moveTo(8, 2);
    ctx.quadraticCurveTo(9.5, -1, 9, -3);
    ctx.quadraticCurveTo(11, -0.5, 10, 2);
    ctx.closePath();
    fs(ctx, C.lava, C.ink, 0.5);
  }

  function port(ctx, rnd, C) {
    ctx.strokeStyle = C.waterLight;
    ctx.lineWidth = 0.8;
    for (let k = 0; k < 3; k++) line(ctx, -12 + k * 3, 3 + k, -6 + k * 3, 3 + k);
    poly(ctx, [[-3, 4.5], [10, 4.5], [10, 2.5], [-3, 2.5]], true);
    fs(ctx, C.wood, C.ink, 0.6);
    for (let k = 0; k < 5; k++) line(ctx, -1 + k * 2.6, 2.5, -1 + k * 2.6, 4.5);
    house(ctx, C, -6, 0, 5, 3.6, C.roof, C.roofShade, 2);
    ship(ctx, rnd, C, 6.5, 1.8, 0.55);
  }

  function bridge(ctx, rnd, C) {
    ctx.beginPath();
    ctx.moveTo(-12, 0);
    ctx.quadraticCurveTo(0, -9, 12, 0);
    ctx.lineTo(12, -2.5);
    ctx.quadraticCurveTo(0, -11.5, -12, -2.5);
    ctx.closePath();
    fs(ctx, C.stone, C.ink, 0.8);
    ctx.beginPath();
    ctx.moveTo(-6.5, -2.2);
    ctx.quadraticCurveTo(0, -6.2, 6.5, -2.2);
    ctx.lineTo(6.5, 0);
    ctx.lineTo(-6.5, 0);
    ctx.closePath();
    fs(ctx, C.waterLight, C.ink, 0.6);
  }

  // ───── 和風 ─────
  function jRoof(ctx, C, x, y, w, hh) {
    ctx.beginPath();
    ctx.moveTo(x - w, y);
    ctx.quadraticCurveTo(x - w * 0.55, y - hh * 0.35, x - w * 0.35, y - hh);
    ctx.lineTo(x + w * 0.35, y - hh);
    ctx.quadraticCurveTo(x + w * 0.55, y - hh * 0.35, x + w, y);
    ctx.quadraticCurveTo(x, y - hh * 0.35, x - w, y);
    ctx.closePath();
    fs(ctx, C.roofJ, C.ink, 0.7);
    ctx.beginPath();
    ctx.moveTo(x, y - hh);
    ctx.lineTo(x + w * 0.35, y - hh);
    ctx.quadraticCurveTo(x + w * 0.55, y - hh * 0.35, x + w, y);
    ctx.quadraticCurveTo(x + w * 0.5, y - hh * 0.25, x, y - hh * 0.2);
    ctx.closePath();
    fs(ctx, C.roofJShade);
  }

  function jCastle(ctx, rnd, C) {
    poly(ctx, [[-11, 0], [11, 0], [8.5, -6], [-8.5, -6]], true);
    fs(ctx, C.stone, C.ink, 0.8);
    ctx.strokeStyle = C.hatch;
    ctx.lineWidth = 0.4;
    for (let k = 1; k < 3; k++) line(ctx, -11 + k * 0.85, -k * 2, 11 - k * 0.85, -k * 2);
    const tiers = [[-7.5, -6, 15, 4.5], [-5.6, -12.5, 11.2, 3.8], [-3.8, -18, 7.6, 3.4]];
    tiers.forEach(([x, y, w, hh], i) => {
      poly(ctx, [[x, y], [x + w, y], [x + w, y - hh], [x, y - hh]], true);
      fs(ctx, C.wall, C.ink, 0.6);
      ctx.fillStyle = C.ink;
      for (let k = 0; k < 3; k++) ctx.fillRect(x + w * (0.2 + k * 0.28), y - hh * 0.65, 0.8, 1);
      jRoof(ctx, C, x + w / 2, y - hh, w / 2 + 2, 2.6);
    });
    ctx.fillStyle = C.gold;
    ctx.beginPath();
    ctx.arc(-1.8, -24.2, 0.7, 0, TAU);
    ctx.arc(1.8, -24.2, 0.7, 0, TAU);
    ctx.fill();
  }

  function pagoda(ctx, rnd, C) {
    let y = 0;
    for (let i = 0; i < 5; i++) {
      const w = 5.6 - i * 0.7;
      const hh = 2.6;
      poly(ctx, [[-w * 0.55, y], [w * 0.55, y], [w * 0.55, y - hh], [-w * 0.55, y - hh]], true);
      fs(ctx, C.red, C.ink, 0.6);
      jRoof(ctx, C, 0, y - hh, w + 1.2, 1.8);
      y -= hh + 1.4;
    }
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 0.9;
    line(ctx, 0, y + 1.2, 0, y - 4);
    for (let k = 0; k < 4; k++) line(ctx, -0.8, y - k, 0.8, y - k);
  }

  function torii(ctx, rnd, C) {
    ctx.lineCap = 'butt';
    poly(ctx, [[-5.5, 0], [-4.3, 0], [-3.7, -11], [-4.9, -11]], true);
    fs(ctx, C.red, C.ink, 0.6);
    poly(ctx, [[5.5, 0], [4.3, 0], [3.7, -11], [4.9, -11]], true);
    fs(ctx, C.red, C.ink, 0.6);
    poly(ctx, [[-6.5, -8.5], [6.5, -8.5], [6.5, -7.4], [-6.5, -7.4]], true);
    fs(ctx, C.red, C.ink, 0.6);
    ctx.beginPath();
    ctx.moveTo(-8.5, -12.6);
    ctx.quadraticCurveTo(0, -11, 8.5, -12.6);
    ctx.lineTo(8, -11);
    ctx.quadraticCurveTo(0, -9.6, -8, -11);
    ctx.closePath();
    fs(ctx, C.ink);
    ctx.beginPath();
    ctx.moveTo(-7.6, -11);
    ctx.quadraticCurveTo(0, -9.6, 7.6, -11);
    ctx.lineTo(7.4, -10);
    ctx.quadraticCurveTo(0, -8.7, -7.4, -10);
    ctx.closePath();
    fs(ctx, C.red, C.ink, 0.5);
  }

  function shrine(ctx, rnd, C) {
    poly(ctx, [[-6, 0], [6, 0], [6, -5], [-6, -5]], true);
    fs(ctx, C.wood, C.ink, 0.7);
    poly(ctx, [[0, 0], [6, 0], [6, -5], [0, -5]], true);
    fs(ctx, C.woodShade);
    poly(ctx, [[-6, 0], [6, 0], [6, -5], [-6, -5]], true);
    fs(ctx, null, C.ink, 0.7);
    jRoof(ctx, C, 0, -5, 8.5, 5);
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 0.6;
    line(ctx, -2.5, -10, -1.2, -11.8);
    line(ctx, 2.5, -10, 1.2, -11.8);
  }

  function jVillage(ctx, rnd, C) {
    const thatch = (x, y, w, hh) => {
      poly(ctx, [[x - w / 2, y], [x + w / 2, y], [x + w / 2, y - hh], [x - w / 2, y - hh]], true);
      fs(ctx, C.wall, C.ink, 0.6);
      ctx.beginPath();
      ctx.moveTo(x - w / 2 - 1.2, y - hh);
      ctx.lineTo(x - w * 0.15, y - hh - w * 0.55);
      ctx.lineTo(x + w * 0.15, y - hh - w * 0.55);
      ctx.lineTo(x + w / 2 + 1.2, y - hh);
      ctx.closePath();
      fs(ctx, C.field2, C.ink, 0.6);
      ctx.strokeStyle = C.hatch;
      ctx.lineWidth = 0.4;
      for (let k = 1; k < 4; k++) line(ctx, x - w / 2 + k * w / 4, y - hh, x - w * 0.15 + k * w * 0.075, y - hh - w * 0.5);
    };
    thatch(-4.5, -1.5, 5, 3);
    thatch(4, -2.2, 4.6, 2.8);
    thatch(0, 1.2, 5.2, 3);
  }

  // ───── 不思議・遺跡 ─────
  function ruins(ctx, rnd, C) {
    poly(ctx, [[-10, 0.5], [10, 0.5], [9, -1.5], [-9, -1.5]], true);
    fs(ctx, C.stone, C.ink, 0.6);
    const cols = [[-7, 9], [-3.5, 5], [0.5, 11], [4.5, 3.5], [7.5, 7.5]];
    cols.forEach(([x, hh]) => {
      poly(ctx, [[x - 1, -1.5], [x + 1, -1.5], [x + 1, -1.5 - hh], [x + 0.2, -1.5 - hh + 0.8], [x - 1, -1.5 - hh + 0.2]], true);
      fs(ctx, C.wall, C.ink, 0.6);
      poly(ctx, [[x, -1.5], [x + 1, -1.5], [x + 1, -1.5 - hh], [x, -1.5 - hh + 0.4]], true);
      fs(ctx, C.wallShade);
    });
    poly(ctx, [[-7.8, -10.5], [1.4, -12.5], [1.4, -11.3], [-7.8, -9.3]], true);
    fs(ctx, C.wall, C.ink, 0.6);
    ctx.fillStyle = C.stoneShade;
    for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(jit(rnd, 9), 0.4 + rnd() * 0.6, 0.7, 0, TAU); ctx.fill(); }
  }

  function cave(ctx, rnd, C) {
    ctx.beginPath();
    ctx.moveTo(-12, 0);
    ctx.quadraticCurveTo(-11, -9, -3, -11);
    ctx.quadraticCurveTo(5, -13, 9, -7);
    ctx.quadraticCurveTo(12, -3, 12, 0);
    ctx.closePath();
    fs(ctx, C.rock, C.ink, 1);
    ctx.beginPath();
    ctx.moveTo(2, -11.8);
    ctx.quadraticCurveTo(7, -11, 9, -7);
    ctx.quadraticCurveTo(12, -3, 12, 0);
    ctx.lineTo(4, 0);
    ctx.closePath();
    fs(ctx, C.rockShade);
    ctx.beginPath();
    ctx.moveTo(-4.5, 0);
    ctx.quadraticCurveTo(-4.5, -7, 0, -7);
    ctx.quadraticCurveTo(4.5, -7, 4.5, 0);
    ctx.closePath();
    fs(ctx, C.ink);
  }

  function stones(ctx, rnd, C) {
    const n = 7;
    const items = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      items.push([Math.cos(a) * 9, Math.sin(a) * 3.2]);
    }
    items.sort((a, b) => a[1] - b[1]).forEach(([x, y]) => {
      const hh = 5 + rnd() * 2;
      poly(ctx, [[x - 1.4, y], [x + 1.4, y], [x + 1.1, y - hh], [x - 1.2, y - hh + 0.4]], true);
      fs(ctx, C.stone, C.ink, 0.65);
      poly(ctx, [[x, y], [x + 1.4, y], [x + 1.1, y - hh], [x, y - hh + 0.2]], true);
      fs(ctx, C.stoneShade);
    });
  }

  function crystal(ctx, rnd, C) {
    const shards = [[-4, 0, 2, 9, -0.25], [0, 0.5, 2.6, 13, 0.05], [4, 0, 2, 8, 0.3], [-1.5, 1, 1.6, 6, -0.5]];
    shards.forEach(([x, y, w, hh, a]) => {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(a);
      poly(ctx, [[-w, 0], [-w, -hh * 0.75], [0, -hh], [w, -hh * 0.75], [w, 0]], true);
      fs(ctx, C.crystal, C.ink, 0.65);
      poly(ctx, [[0, 0], [0, -hh], [w, -hh * 0.75], [w, 0]], true);
      fs(ctx, C.crystalShade);
      poly(ctx, [[-w, 0], [-w, -hh * 0.75], [0, -hh], [w, -hh * 0.75], [w, 0]], true);
      fs(ctx, null, C.ink, 0.65);
      ctx.restore();
    });
  }

  function skull(ctx, rnd, C) {
    ctx.beginPath();
    ctx.arc(0, -7, 5, Math.PI * 0.9, Math.PI * 0.1);
    ctx.lineTo(3.4, -2.8);
    ctx.lineTo(2.6, -0.5);
    ctx.lineTo(-2.6, -0.5);
    ctx.lineTo(-3.4, -2.8);
    ctx.closePath();
    fs(ctx, C.paper, C.ink, 0.9);
    ctx.fillStyle = C.ink;
    ctx.beginPath(); ctx.arc(-1.9, -6.2, 1.3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(1.9, -6.2, 1.3, 0, TAU); ctx.fill();
    poly(ctx, [[0, -4.6], [-0.6, -3.4], [0.6, -3.4]], true);
    ctx.fill();
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 0.5;
    for (let k = -1; k <= 1; k++) line(ctx, k * 1.1, -2.2, k * 1.1, -0.6);
  }

  function portal(ctx, rnd, C) {
    const g = ctx.createRadialGradient(0, -8, 1, 0, -8, 8);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.5, C.glow);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, -8, 6, 8, 0, 0, TAU);
    ctx.fill();
    ctx.lineWidth = 2.4;
    ctx.strokeStyle = C.ink;
    ctx.beginPath();
    ctx.ellipse(0, -8, 5.4, 7.6, 0, 0, TAU);
    ctx.stroke();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = C.stone;
    ctx.stroke();
    poly(ctx, [[-7, 0.5], [7, 0.5], [5.5, -1], [-5.5, -1]], true);
    fs(ctx, C.stone, C.ink, 0.6);
  }

  function obelisk(ctx, rnd, C) {
    poly(ctx, [[-2.2, 0], [2.2, 0], [1.4, -15], [0, -17], [-1.4, -15]], true);
    fs(ctx, C.stone, C.ink, 0.8);
    poly(ctx, [[0, 0], [2.2, 0], [1.4, -15], [0, -17]], true);
    fs(ctx, C.stoneShade);
    ctx.strokeStyle = C.glow;
    ctx.lineWidth = 0.6;
    for (let k = 0; k < 4; k++) line(ctx, -0.8, -4 - k * 2.8, 0.2, -4 - k * 2.8);
  }

  // ───── 海 ─────
  function ship(ctx, rnd, C, ox, oy, sc) {
    ox = ox || 0;
    oy = oy || 0;
    sc = sc || 1;
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(sc, sc);
    ctx.beginPath();
    ctx.moveTo(-9, -3);
    ctx.lineTo(9, -3);
    ctx.quadraticCurveTo(7, 1, 4, 1.2);
    ctx.lineTo(-6, 1.2);
    ctx.quadraticCurveTo(-8.5, 0.5, -9, -3);
    ctx.closePath();
    fs(ctx, C.wood, C.ink, 0.8);
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 0.8;
    line(ctx, -1.5, -3, -1.5, -17);
    line(ctx, 4.5, -3, 4.5, -13);
    const sail = (x, top, bot, w) => {
      ctx.beginPath();
      ctx.moveTo(x - w, top);
      ctx.quadraticCurveTo(x + w * 0.4, (top + bot) / 2, x - w, bot);
      ctx.lineTo(x + w, bot);
      ctx.quadraticCurveTo(x + w * 1.6, (top + bot) / 2, x + w, top);
      ctx.closePath();
      fs(ctx, C.paper, C.ink, 0.7);
    };
    sail(-1.5, -16, -9, 4.2);
    sail(-1.5, -8.6, -4, 4.8);
    sail(4.5, -12.5, -5, 3.2);
    poly(ctx, [[-1.5, -17], [1.8, -16.4], [-1.5, -15.7]], true);
    fs(ctx, C.red, C.ink, 0.4);
    ctx.restore();
    ctx.strokeStyle = C.waterLight;
    ctx.lineWidth = 0.7;
    line(ctx, ox - 11 * sc, oy + 2.2 * sc, ox - 5 * sc, oy + 2.2 * sc);
    line(ctx, ox + 3 * sc, oy + 2.6 * sc, ox + 10 * sc, oy + 2.6 * sc);
  }

  function serpent(ctx, rnd, C) {
    const hump = (x, w, hh) => {
      ctx.beginPath();
      ctx.moveTo(x - w, 0);
      ctx.bezierCurveTo(x - w, -hh * 1.3, x + w, -hh * 1.3, x + w, 0);
      ctx.lineTo(x + w * 0.55, 0);
      ctx.bezierCurveTo(x + w * 0.55, -hh * 0.6, x - w * 0.55, -hh * 0.6, x - w * 0.55, 0);
      ctx.closePath();
      fs(ctx, C.serpent, C.ink, 0.8);
    };
    hump(-7, 3.2, 6);
    hump(1, 3.6, 7);
    ctx.beginPath();
    ctx.moveTo(7, 0);
    ctx.quadraticCurveTo(7, -9, 11, -11);
    ctx.quadraticCurveTo(14.5, -11.5, 14.5, -9);
    ctx.quadraticCurveTo(12, -8.4, 10.8, -7.5);
    ctx.quadraticCurveTo(9.8, -5, 10, 0);
    ctx.closePath();
    fs(ctx, C.serpent, C.ink, 0.8);
    ctx.fillStyle = C.ink;
    ctx.beginPath(); ctx.arc(12.3, -10, 0.5, 0, TAU); ctx.fill();
    ctx.strokeStyle = C.waterLight;
    ctx.lineWidth = 0.8;
    for (let k = 0; k < 4; k++) line(ctx, -12 + k * 6.5, 0.6, -9 + k * 6.5, 0.6);
  }

  function whirlpool(ctx, rnd, C) {
    ctx.strokeStyle = C.waterLight;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let t = 0; t < 4 * Math.PI; t += 0.2) {
      const r = 1 + t * 0.85;
      const x = Math.cos(t) * r;
      const y = Math.sin(t) * r * 0.55;
      if (t === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  function seaRock(ctx, rnd, C) {
    poly(ctx, [[-6, 0], [-4.5, -5], [-1, -7], [2.5, -4.5], [5.5, -2], [6.5, 0]], true);
    fs(ctx, C.stone, C.ink, 0.8);
    poly(ctx, [[-1, -7], [2.5, -4.5], [5.5, -2], [6.5, 0], [0, 0]], true);
    fs(ctx, C.stoneShade);
    ctx.strokeStyle = C.foam;
    ctx.lineWidth = 1;
    line(ctx, -8, 0.8, -3, 0.8);
    line(ctx, 3, 1.2, 9, 1.2);
  }

  function wave(ctx, rnd, C) {
    ctx.strokeStyle = C.ink;
    ctx.lineWidth = 0.7;
    for (let k = 0; k < 2; k++) {
      const x = k * 7 - 6;
      ctx.beginPath();
      ctx.moveTo(x - 5, 0);
      ctx.quadraticCurveTo(x - 2, -3.5, x + 1, -1.6);
      ctx.quadraticCurveTo(x - 1, -0.6, x, 0.6);
      ctx.stroke();
    }
  }

  // ───── 装飾 ─────
  function compass(ctx, rnd, C, ornate) {
    const R = ornate ? 30 : 20;
    ctx.save();
    ctx.lineWidth = 0.9;
    ctx.strokeStyle = C.ink;
    if (ornate) {
      ctx.beginPath(); ctx.arc(0, 0, R * 0.78, 0, TAU); fs(ctx, 'rgba(255,255,255,0.35)', C.ink, 0.8);
      ctx.beginPath(); ctx.arc(0, 0, R * 0.7, 0, TAU); ctx.stroke();
      for (let i = 0; i < 64; i++) {
        const a = (i / 64) * TAU;
        const r0 = R * (i % 4 ? 0.72 : 0.68);
        line(ctx, Math.cos(a) * r0, Math.sin(a) * r0, Math.cos(a) * R * 0.76, Math.sin(a) * R * 0.76);
      }
    } else {
      ctx.beginPath(); ctx.arc(0, 0, R * 0.55, 0, TAU); ctx.stroke();
    }
    const points = ornate ? 16 : 8;
    for (let pass = 0; pass < 3; pass++) {
      for (let i = 0; i < points; i++) {
        const level = i % 4 === 0 ? 0 : i % 2 === 0 ? 1 : 2;
        if (level !== 2 - pass) continue;
        const a = (i / points) * TAU - Math.PI / 2;
        const len = R * [1, 0.68, 0.45][level];
        const wid = R * [0.13, 0.1, 0.07][level];
        ctx.save();
        ctx.rotate(a);
        poly(ctx, [[len, 0], [0, -wid], [0, 0]], true);
        fs(ctx, C.ink);
        poly(ctx, [[len, 0], [0, wid], [0, 0]], true);
        fs(ctx, level === 0 ? C.paper : C.gold, C.ink, 0.6);
        ctx.restore();
      }
    }
    ctx.beginPath(); ctx.arc(0, 0, R * 0.07, 0, TAU); fs(ctx, C.paper, C.ink, 0.7);
    ctx.fillStyle = C.ink;
    ctx.font = `700 ${R * 0.28}px "Noto Serif JP", serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('N', 0, -R * 1.15);
    ctx.restore();
  }

  // ───── 地図記号（現代の地図にも） ─────
  function sym(type) {
    return function (ctx, rnd, C) {
      const x = 0;
      const y = 0;
      const paper = C.paper;
      ctx.strokeStyle = C.ink;
      ctx.lineWidth = 1.3;
      const circle = (r, fill) => { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); fs(ctx, fill, C.ink, 1.3); };
      switch (type) {
        case 'capital':
          circle(7.5, paper);
          ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            const a = -Math.PI / 2 + i * Math.PI / 5;
            const r = i % 2 ? 2.4 : 5.6;
            ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
          }
          ctx.closePath();
          fs(ctx, C.red);
          break;
        case 'city': circle(5.2, paper); ctx.beginPath(); ctx.arc(x, y, 2.6, 0, TAU); fs(ctx, C.ink); break;
        case 'town': circle(3.6, C.ink); break;
        case 'village': circle(2.3, paper); break;
        case 'castle':
          poly(ctx, [[-5.5, 4], [-5.5, -4], [-3.3, -4], [-3.3, -2.4], [-1.1, -2.4], [-1.1, -4], [1.1, -4], [1.1, -2.4], [3.3, -2.4], [3.3, -4], [5.5, -4], [5.5, 4]], true);
          fs(ctx, paper, C.ink, 1.3);
          ctx.beginPath(); ctx.arc(0, 4, 1.8, Math.PI, 0); fs(ctx, C.ink);
          break;
        case 'fort': ctx.beginPath(); ctx.rect(-4, -4, 8, 8); fs(ctx, paper, C.ink, 1.3); ctx.fillStyle = C.ink; ctx.fillRect(-1.6, -1.6, 3.2, 3.2); break;
        case 'port':
          circle(5.5, paper);
          ctx.beginPath();
          ctx.moveTo(0, -3.6); ctx.lineTo(0, 3.4);
          ctx.moveTo(-2.2, -1.8); ctx.lineTo(2.2, -1.8);
          ctx.moveTo(-3, 1); ctx.quadraticCurveTo(0, 5, 3, 1);
          ctx.stroke();
          break;
        case 'temple':
          poly(ctx, [[-5.5, -1.5], [0, -5.5], [5.5, -1.5]], true); fs(ctx, paper, C.ink, 1.3);
          ctx.beginPath(); ctx.rect(-4, -1.5, 8, 5.5); fs(ctx, paper, C.ink, 1.3);
          break;
        case 'ruin':
          ctx.beginPath();
          ctx.moveTo(-4.5, 4); ctx.lineTo(-4.5, -3); ctx.lineTo(-2.5, -4.5); ctx.lineTo(-2.5, 4);
          ctx.moveTo(1, 4); ctx.lineTo(1, -1); ctx.lineTo(3.5, -2.2); ctx.lineTo(3.5, 4);
          ctx.moveTo(-5.5, 4); ctx.lineTo(5, 4);
          ctx.stroke();
          break;
        case 'cave':
          ctx.beginPath(); ctx.moveTo(-6, 3.5); ctx.quadraticCurveTo(0, -8, 6, 3.5); ctx.closePath(); fs(ctx, paper, C.ink, 1.3);
          ctx.beginPath(); ctx.moveTo(-2.4, 3.5); ctx.quadraticCurveTo(0, -2.6, 2.4, 3.5); ctx.closePath(); fs(ctx, C.ink);
          break;
        case 'tower':
          poly(ctx, [[-2.6, 5], [-1.8, -4], [1.8, -4], [2.6, 5]], true); fs(ctx, paper, C.ink, 1.3);
          poly(ctx, [[-2.6, -4], [0, -7.5], [2.6, -4]], true); fs(ctx, C.ink);
          break;
        case 'peak': poly(ctx, [[-5, 3.5], [0, -5], [5, 3.5]], true); fs(ctx, C.ink); break;
        case 'station': ctx.beginPath(); ctx.rect(-6, -2.8, 12, 5.6); fs(ctx, paper, C.ink, 1.3); ctx.fillStyle = C.ink; ctx.fillRect(-6, -2.8, 6, 5.6); break;
        case 'school':
          circle(5.5, paper);
          ctx.fillStyle = C.ink;
          ctx.font = '700 7px "Noto Serif JP", serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('文', 0, 0.4);
          break;
        case 'hospital': circle(5.5, paper); ctx.strokeStyle = C.red; ctx.lineWidth = 1.8; line(ctx, 0, -3.2, 0, 3.2); line(ctx, -3.2, 0, 3.2, 0); break;
        case 'shrine':
          ctx.strokeStyle = C.red;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-5.5, -4); ctx.quadraticCurveTo(0, -5.4, 5.5, -4);
          ctx.moveTo(-4, -1.8); ctx.lineTo(4, -1.8);
          ctx.moveTo(-3, -4.6); ctx.lineTo(-3.4, 4.5);
          ctx.moveTo(3, -4.6); ctx.lineTo(3.4, 4.5);
          ctx.stroke();
          break;
        case 'shop':
          ctx.beginPath(); ctx.rect(-4, -2, 8, 6); fs(ctx, paper, C.ink, 1.3);
          poly(ctx, [[-5, -2], [-3.5, -5], [3.5, -5], [5, -2]], true); fs(ctx, C.gold, C.ink, 1.3);
          break;
        case 'house': poly(ctx, [[-4, 4], [-4, -1], [0, -4.5], [4, -1], [4, 4]], true); fs(ctx, paper, C.ink, 1.3); break;
        case 'park': ctx.beginPath(); ctx.arc(0, -1.5, 4, 0, TAU); fs(ctx, '#6a994e', C.ink, 1.3); line(ctx, 0, 2.5, 0, 5); break;
        default:
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-5, -6, -5, -12, 0, -12);
          ctx.bezierCurveTo(5, -12, 5, -6, 0, 0);
          fs(ctx, C.red, C.ink, 1.3);
          ctx.beginPath(); ctx.arc(0, -8, 1.8, 0, TAU); fs(ctx, paper);
      }
    };
  }

  // ───── 素材の一覧 ─────
  // box: [x0, y0, x1, y1]（素材の基準点＝足元からの範囲）。label: 名前の表示位置
  const A = [];
  function def(id, cat, label, box, draw, o) {
    A.push(Object.assign({ id, cat, label, box, draw, variants: 4, labelPos: 'below' }, o || {}));
  }
  def('mountain', '山・丘', '山', [-20, -34, 20, 3], (c, r, C) => mountain(c, r, C, {}), { variants: 8, size: 26 });
  def('mountain-tall', '山・丘', '高い山', [-18, -44, 18, 3], (c, r, C) => mountain(c, r, C, { w: 11, h: 34, snow: r() < 0.5 }), { variants: 6, size: 34 });
  def('mountain-snow', '山・丘', '雪山', [-20, -36, 20, 3], (c, r, C) => mountain(c, r, C, { snow: true, h: 25 }), { variants: 6, size: 28 });
  def('mountain-range', '山・丘', '連山', [-28, -36, 24, 3], (c, r, C) => {
    c.save(); c.translate(-9, -3); c.scale(0.75, 0.75); mountain(c, r, C, { snow: r() < 0.4 }); c.restore();
    c.save(); c.translate(8, -2); c.scale(0.7, 0.7); mountain(c, r, C, {}); c.restore();

      'aria-label': label ? null : (opts.title || null),
      onclick: opts.onClick,
      disabled: opts.disabled,
    }, opts.icon ? icon(opts.icon, opts.iconSize) : null, label ? h('span', null, label) : null);
    return b;
  }

  let toastTimer = null;
  function toast(msg, kind) {
    let el = document.getElementById('toast');
    if (!el) {
      el = h('div', { id: 'toast', role: 'status', 'aria-live': 'polite' });
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.className = 'show' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 2600);
  }

  /** モーダル。actions: [{label, primary, danger, onClick(close) -> false で閉じない}] */
  function modal(opts) {
    const prevFocus = document.activeElement;
    const overlay = h('div', { class: 'modal-overlay' });
    const close = () => {
      overlay.remove();
      document.removeEventListener('keydown', onKey, true);
      if (opts.onClose) opts.onClose();
      if (prevFocus && prevFocus.focus) prevFocus.focus();
    };
    const onKey = (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); close(); }
    };
    const footer = h('div', { class: 'modal-footer' });
    (opts.actions || []).forEach((a) => {
      footer.appendChild(btn(a.label, {
        primary: a.primary, danger: a.danger, ghost: a.ghost,
        onClick: async () => {
          const r = a.onClick ? await a.onClick(close) : undefined;
          if (r !== false) close();
        },
      }));
    });
    const box = h('div', { class: 'modal' + (opts.wide ? ' modal-wide' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title },
      h('div', { class: 'modal-header' },
        h('h2', null, opts.title || ''),
        btn('', { icon: 'x', ghost: true, title: '閉じる', onClick: close })),
      h('div', { class: 'modal-body' }, opts.body),
      opts.actions && opts.actions.length ? footer : null);
    overlay.appendChild(box);
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) close(); });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(overlay);
    setTimeout(() => {
      const f = box.querySelector('[autofocus], input, textarea, select');
      if (f) f.focus();
    }, 30);
    return close;
  }

  function prompt(title, value, opts) {
    opts = opts || {};
    return new Promise((resolve) => {
      let done = false;
      const input = opts.multiline
        ? h('textarea', { class: 'input', rows: 4, value: value || '', placeholder: opts.placeholder || '' })
        : h('input', { class: 'input', type: 'text', value: value || '', placeholder: opts.placeholder || '' });
      const body = h('div', { class: 'stack' }, opts.message ? h('p', { class: 'muted' }, opts.message) : null, input);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (!opts.multiline || e.ctrlKey || e.metaKey) && !e.isComposing) {
          e.preventDefault();
          done = true;
          resolve(input.value);
          closeFn();
        }
      });
      const closeFn = modal({
        title,
        body,
        onClose: () => { if (!done) resolve(null); },
        actions: [
          { label: 'キャンセル', ghost: true },
          { label: opts.okLabel || 'OK', primary: true, onClick: () => { done = true; resolve(input.value); } },
        ],
      });
      setTimeout(() => { input.focus(); if (input.select) input.select(); }, 40);
    });
  }

  function confirm(message, opts) {
    opts = opts || {};
    return new Promise((resolve) => {
      let done = false;
      modal({
        title: opts.title || '確認',
        body: h('p', null, message),
        onClose: () => { if (!done) resolve(false); },
        actions: [
          { label: 'キャンセル', ghost: true },
          { label: opts.okLabel || 'OK', primary: !opts.danger, danger: !!opts.danger, onClick: () => { done = true; resolve(true); } },
        ],
      });
    });
  }

  /** ポップアップメニュー。items: [{label, icon, onClick, danger}] or null(区切り) */
  function menu(anchor, items) {
    document.querySelectorAll('.popmenu').forEach((m) => m.remove());
    const m = h('div', { class: 'popmenu', role: 'menu' });
    items.forEach((it) => {
      if (!it) { m.appendChild(h('div', { class: 'popmenu-sep' })); return; }
      m.appendChild(h('button', {
        type: 'button', role: 'menuitem', class: 'popmenu-item' + (it.danger ? ' danger' : ''),
        onclick: () => { m.remove(); it.onClick && it.onClick(); },
      }, it.icon ? icon(it.icon, 16) : h('span', { class: 'icon-spacer' }), it.label));
    });
    document.body.appendChild(m);
    const r = anchor.getBoundingClientRect();
    const mw = m.offsetWidth;
    const mh = m.offsetHeight;
    let left = r.right - mw;
    if (left < 8) left = Math.min(r.left, window.innerWidth - mw - 8);
    let top = r.bottom + 4;
    if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
    m.style.left = Math.max(8, left) + 'px';
    m.style.top = top + 'px';
    const off = (e) => {
      if (!m.contains(e.target)) { m.remove(); document.removeEventListener('mousedown', off, true); }
    };
    setTimeout(() => document.addEventListener('mousedown', off, true), 0);
    const first = m.querySelector('button');
    if (first) first.focus();
    m.addEventListener('keydown', (e) => { if (e.key === 'Escape') m.remove(); });
    return m;
  }

  /** 任意の中身を持つポップオーバー */
  function popover(anchor, content, opts) {
    opts = opts || {};
    document.querySelectorAll('.popover').forEach((m) => m.remove());
    const m = h('div', { class: 'popover', role: 'dialog' }, content);
    document.body.appendChild(m);
    const r = anchor.getBoundingClientRect();
    const mw = m.offsetWidth;
    const mh = m.offsetHeight;
    let left = opts.alignLeft ? r.left : r.right - mw;
    left = Math.max(8, Math.min(left, window.innerWidth - mw - 8));
    let top = r.bottom + 6;
    if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
    m.style.left = left + 'px';
    m.style.top = top + 'px';
    const close = () => { m.remove(); document.removeEventListener('mousedown', off, true); document.removeEventListener('keydown', onKey, true); };
    const off = (e) => { if (!m.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) close(); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    setTimeout(() => { document.addEventListener('mousedown', off, true); document.addEventListener('keydown', onKey, true); }, 0);
    return close;
  }

  function debounce(fn, ms) {
    let t = null;
    const d = function () {
      const args = arguments;
      clearTimeout(t);
      t = setTimeout(() => fn.apply(null, args), ms);
    };
    d.flush = () => { clearTimeout(t); fn(); };
    d.cancel = () => clearTimeout(t);
    return d;
  }

  function uid(prefix) {
    return (prefix || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function download(filename, content, type) {
    const blob = content instanceof Blob ? content : new Blob([content], { type: type || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  function pickFile(accept) {
    return new Promise((resolve) => {
      const input = h('input', { type: 'file', accept: accept || '' });
      input.addEventListener('change', () => resolve(input.files && input.files[0] ? input.files[0] : null));
      input.click();
    });
  }

  function readFileText(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result));
      r.onerror = () => reject(r.error);
      r.readAsText(file);
    });
  }

  function fmtDate(ts, withTime) {
    if (!ts) return '';
    const d = new Date(ts);
    const pad = (n) => String(n).padStart(2, '0');
    const s = `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}`;
    return withTime ? `${s} ${pad(d.getHours())}:${pad(d.getMinutes())}` : s;
  }

  function relTime(ts) {
    if (!ts) return '';
    const diff = (Date.now() - ts) / 1000;
    if (diff < 60) return 'たった今';
    if (diff < 3600) return Math.floor(diff / 60) + '分前';
    if (diff < 86400) return Math.floor(diff / 3600) + '時間前';
    if (diff < 86400 * 7) return Math.floor(diff / 86400) + '日前';
    return fmtDate(ts);
  }

  function today() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function fmtNum(n) {
    return Math.round(n).toLocaleString('ja-JP');
  }

  function safeFilename(s) {
    return String(s || '無題').replace(/[\\/:*?"<>|\n\r]+/g, '_').slice(0, 60);
  }

  /** フォーム行（ラベル + 入力） */
  function field(label, input, hint) {
    return h('label', { class: 'field' }, h('span', { class: 'field-label' }, label), input, hint ? h('span', { class: 'field-hint' }, hint) : null);
  }

  function lsGet(key, fallback) {
    try {
      const v = localStorage.getItem(key);
      return v == null ? fallback : JSON.parse(v);
    } catch (e) {
      return fallback;
    }
  }

  function lsSet(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      return false;
    }
  }

  const SWATCHES = ['#c8553d', '#d9a441', '#6a994e', '#3d7ea6', '#5f4b8b', '#b5838d', '#6c757d', '#2b9348'];

  NS.UI = {
    h, append, clear, icon, btn, toast, modal, prompt, confirm, menu, popover, debounce, uid, download, pickFile, readFileText,
    fmtDate, relTime, today, fmtNum, safeFilename, field, lsGet, lsSet, SWATCHES,
  };
})(window.Tsuzuri = window.Tsuzuri || {});

<script>
// js/store.js
/*
 * 綴り — 保存（IndexedDB。使えない環境では localStorage → メモリの順にフォールバック）
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const DB_NAME = 'tsuzuri';
  const STORE = 'kv';
  const mem = new Map();
  let db = null;
  let mode = 'mem';

  function openDB() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) { reject(new Error('no idb')); return; }
      let req;
      try { req = indexedDB.open(DB_NAME, 1); } catch (e) { reject(e); return; }
      req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('blocked'));
    });
  }

  async function init() {
    try {
      db = await openDB();
      mode = 'idb';
    } catch (e) {
      try {
        localStorage.setItem('tsuzuri.__probe', '1');
        localStorage.removeItem('tsuzuri.__probe');
        mode = 'ls';
      } catch (e2) {
        mode = 'mem';
      }
    }
    return mode;
  }

  function tx(kind, fn) {
    return new Promise((resolve, reject) => {
      const t = db.transaction(STORE, kind);
      const st = t.objectStore(STORE);
      const req = fn(st);
      t.oncomplete = () => resolve(req ? req.result : undefined);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }

  async function get(key) {
    if (mode === 'idb') return tx('readonly', (st) => st.get(key));
    if (mode === 'ls') {
      try { const v = localStorage.getItem('tsuzuri.kv.' + key); return v == null ? undefined : JSON.parse(v); } catch (e) { return undefined; }
    }
    return mem.has(key) ? JSON.parse(mem.get(key)) : undefined;
  }

  async function set(key, value) {
    if (mode === 'idb') return tx('readwrite', (st) => st.put(value, key));
    const json = JSON.stringify(value);
    if (mode === 'ls') { localStorage.setItem('tsuzuri.kv.' + key, json); return; }
    mem.set(key, json);
  }

  async function del(key) {
    if (mode === 'idb') return tx('readwrite', (st) => st.delete(key));
    if (mode === 'ls') { localStorage.removeItem('tsuzuri.kv.' + key); return; }
    mem.delete(key);
  }

  function newChapter(title, body) {
    return { id: UI.uid('ch'), title: title || '新しい話', body: body || '', memo: '', ignored: [], snapshots: [], updatedAt: Date.now() };
  }

  function newProject(title) {
    const now = Date.now();
    return normalize({
      id: UI.uid('p'),
      title: title || '無題の作品',
      createdAt: now,
      updatedAt: now,
      chapters: [newChapter('第一話')],
    });
  }

  /** 古いデータや欠けた項目を補う */
  function normalize(p) {
    p.version = 1;
    p.title = p.title || '無題の作品';
    p.author = p.author || '';
    p.synopsis = p.synopsis || '';
    p.chapters = Array.isArray(p.chapters) && p.chapters.length ? p.chapters : [newChapter('第一話')];
    p.chapters.forEach((c) => {
      c.id = c.id || UI.uid('ch');
      c.title = c.title == null ? '無題' : c.title;
      c.body = c.body || '';
      c.memo = c.memo || '';
      c.ignored = Array.isArray(c.ignored) ? c.ignored : [];
      c.snapshots = Array.isArray(c.snapshots) ? c.snapshots : [];
    });
    p.entries = Array.isArray(p.entries) ? p.entries : [];
    p.entries.forEach((e) => {
      e.id = e.id || UI.uid('e');
      e.type = e.type || 'character';
      e.aliases = Array.isArray(e.aliases) ? e.aliases : [];
      e.fields = e.fields || {};
      e.custom = Array.isArray(e.custom) ? e.custom : [];
      e.relations = Array.isArray(e.relations) ? e.relations : [];
      e.appear = e.appear || {};
      e.notes = e.notes || '';
    });
    p.rules = p.rules || {};
    p.rules.ng = Array.isArray(p.rules.ng) ? p.rules.ng : [];
    p.rules.style = Array.isArray(p.rules.style) ? p.rules.style : [];
    p.rules.world = p.rules.world || '';
    p.timeline = Array.isArray(p.timeline) ? p.timeline : [];
    p.ideas = Array.isArray(p.ideas) ? p.ideas : [];
    p.plot = p.plot || {};
    p.plot.columns = Array.isArray(p.plot.columns) && p.plot.columns.length ? p.plot.columns
      : ['起', '承', '転', '結'].map((t) => ({ id: UI.uid('col'), title: t }));
    p.plot.cards = Array.isArray(p.plot.cards) ? p.plot.cards : [];
    p.maps = Array.isArray(p.maps) ? p.maps : [];
    p.log = p.log || {};
    p.goal = p.goal || {};
    if (p.goal.daily == null) p.goal.daily = 2000;
    if (p.goal.total == null) p.goal.total = 100000;
    return p;
  }

  function totalChars(p) {
    let n = 0;
    p.chapters.forEach((c) => { n += NS.Text.stats(c.body).charsNoSpace; });
    return n;
  }

  async function listProjects() {
    const list = (await get('projects')) || [];
    return list.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  }

  async function loadProject(id) {
    const p = await get('project:' + id);
    return p ? normalize(p) : null;
  }

  async function saveProject(p) {
    p.updatedAt = Date.now();
    await set('project:' + p.id, JSON.parse(JSON.stringify(p)));
    const list = (await get('projects')) || [];
    const meta = { id: p.id, title: p.title, updatedAt: p.updatedAt, chars: totalChars(p), chapters: p.chapters.length };
    const i = list.findIndex((x) => x.id === p.id);
    if (i >= 0) list[i] = meta; else list.push(meta);
    await set('projects', list);
  }

  async function deleteProject(id) {
    await del('project:' + id);
    const list = ((await get('projects')) || []).filter((x) => x.id !== id);
    await set('projects', list);
  }

  /** 作品をまるごと複製して新しい ID で取り込む */
  async function importProject(data) {
    const p = normalize(JSON.parse(JSON.stringify(data)));
    const list = (await get('projects')) || [];
    if (list.some((x) => x.id === p.id)) {
      p.id = UI.uid('p');
      p.title = p.title + '（読み込み）';
    }
    await saveProject(p);
    return p;
  }

  NS.Store = {
    init, get, set, del, get mode() { return mode; },
    newProject, newChapter, normalize, listProjects, loadProject, saveProject, deleteProject, importProject, totalChars,
  };
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
<script>
// js/app.js
/*
 * 綴り — アプリ本体（起動・画面切り替え・保存・設定・書き出し）
 */
(function (NS) {
  'use strict';
  const { h, icon, btn, toast, modal, clear, UI } = Object.assign({ UI: NS.UI }, NS.UI);
  const Store = NS.Store;
  NS.Views = NS.Views || {};

  const DEFAULT_SETTINGS = {
    theme: 'auto',
    font: 'serif',
    fontSize: 17,
    lineHeight: 1.9,
    rules: {},
    consistency: {},
    maxSentenceLength: 100,
    maxCommas: 4,
    endingRepeat: 3,
    aiModel: 'claude-opus-5-5',
    aiEffort: 'medium',
  };

  const ROUTES = [
    { id: 'home', label: '作品', icon: 'home' },
    { id: 'write', label: '執筆', icon: 'pen' },
    { id: 'lore', label: '設定資料', icon: 'users' },
    { id: 'ideas', label: 'アイデア', icon: 'bulb' },
    { id: 'plot', label: 'プロット', icon: 'columns' },
    { id: 'map', label: '地図', icon: 'map' },
  ];

  const App = {
    project: null,
    settings: Object.assign({}, DEFAULT_SETTINGS, UI.lsGet('tsuzuri.settings', {})),
    route: null,
    params: {},
    current: null,
    saveState: 'saved',
  };

  // ───── 設定 ─────
  App.saveSettings = function () {
    UI.lsSet('tsuzuri.settings', App.settings);
    App.applySettings();
  };
  App.applySettings = function () {
    const root = document.documentElement;
    if (App.settings.theme === 'auto') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', App.settings.theme);
    root.style.setProperty('--editor-font', App.settings.font === 'sans' ? 'var(--font-sans)' : 'var(--font-serif)');
    root.style.setProperty('--editor-size', App.settings.fontSize + 'px');
    root.style.setProperty('--editor-lh', String(App.settings.lineHeight));
  };

  // ───── 保存 ─────
  const doSave = async () => {
    if (!App.project) return;
    App.setSaveState('saving');
    try {
      updateLog(App.project);
      await Store.saveProject(App.project);
      UI.lsSet('tsuzuri.current', App.project.id);
      App.setSaveState('saved');
    } catch (e) {
      console.error(e);
      App.setSaveState('error');
      toast('保存できませんでした：' + (e && e.message ? e.message : e), 'error');
    }
  };
  const saveDebounced = UI.debounce(doSave, 700);
  App.touch = function () {
    App.setSaveState('dirty');
    saveDebounced();
  };
  App.saveNow = async function () {
    saveDebounced.cancel();
    await doSave();
  };
  App.setSaveState = function (s) {
    App.saveState = s;
    const el = document.getElementById('save-state');
    if (!el) return;
    el.dataset.state = s;
    el.textContent = { saved: '保存済み', saving: '保存中…', dirty: '編集中', error: '保存エラー' }[s] || '';
  };

  function updateLog(p) {
    const total = Store.totalChars(p);
    const d = UI.today();
    if (!p.log[d]) {
      const keys = Object.keys(p.log).sort();
      const prev = keys.length ? p.log[keys[keys.length - 1]].last : total;
      p.log[d] = { start: prev, last: total };
    } else {
      p.log[d].last = total;
    }
    const keys = Object.keys(p.log).sort();
    while (keys.length > 120) delete p.log[keys.shift()];
  }

  App.todayWritten = function () {
    const p = App.project;
    if (!p) return 0;
    const d = p.log[UI.today()];
    if (!d) return 0;
    return Math.max(0, d.last - d.start);
  };

  // ───── 作品の切り替え ─────
  App.openProject = async function (id, route) {
    if (App.project && App.saveState !== 'saved') await App.saveNow();
    const p = await Store.loadProject(id);
    if (!p) { toast('作品が見つかりません', 'error'); return; }
    App.project = p;
    UI.lsSet('tsuzuri.current', p.id);
    renderChrome();
    App.navigate(route || 'write');
  };

  App.createProject = async function (title) {
    const p = Store.newProject(title);
    await Store.saveProject(p);
    await App.openProject(p.id, 'write');
  };

  // ───── ルーティング ─────
  App.navigate = function (route, params) {
    const hash = '#/' + route + (params && params.id ? '/' + encodeURIComponent(params.id) : '');
    if (location.hash !== hash) {
      history.pushState(null, '', hash);
    }
    render(route, params || {});
  };

  function parseHash() {
    const m = location.hash.match(/^#\/([a-z]+)(?:\/(.+))?/);
    return m ? { route: m[1], params: m[2] ? { id: decodeURIComponent(m[2]) } : {} } : { route: 'home', params: {} };
  }

  function render(route, params) {
    if (!App.project && route !== 'home') route = 'home';
    if (App.current && App.current.unmount) {
      try { App.current.unmount(); } catch (e) { console.error(e); }
    }
    App.route = route;
    App.params = params;
    const view = document.getElementById('view');
    clear(view);
    view.className = 'view view-' + route;
    document.querySelectorAll('.nav-item').forEach((a) => {
      a.classList.toggle('active', a.dataset.route === route);
      a.toggleAttribute('aria-current', a.dataset.route === route);
    });
    document.querySelectorAll('.nav-item[data-needs-project]').forEach((a) => {
      a.classList.toggle('disabled', !App.project);
    });
    const r = ROUTES.find((x) => x.id === route);
    document.getElementById('view-title').textContent = r ? r.label : '';
    const V = route === 'home' ? Home : NS.Views[route];
    App.current = V || null;
    if (V && V.mount) V.mount(view, params);
  }

  // ───── 画面の枠（サイドバー・上部バー） ─────
  function renderChrome() {
    const nav = document.getElementById('sidebar');
    clear(nav);
    nav.appendChild(h('div', { class: 'brand', title: '綴り — 小説執筆スタジオ' },
      h('span', { class: 'brand-mark' }, '綴'), h('span', { class: 'brand-name' }, '綴り')));
    ROUTES.forEach((r) => {
      nav.appendChild(h('a', {
        href: '#/' + r.id, class: 'nav-item', dataset: { route: r.id, needsProject: r.id === 'home' ? undefined : '1' },
        onclick: (e) => {
          e.preventDefault();
          if (r.id !== 'home' && !App.project) { toast('先に作品を選んでください'); return; }
          App.navigate(r.id);
        },
      }, icon(r.icon, 20), h('span', null, r.label)));
    });
    nav.appendChild(h('div', { class: 'nav-spacer' }));
    nav.appendChild(h('a', {
      href: '#', class: 'nav-item nav-settings', onclick: (e) => { e.preventDefault(); App.openSettings(); },
    }, icon('sliders', 20), h('span', null, '設定')));

    const titleEl = document.getElementById('project-title');
    clear(titleEl);
    if (App.project) {
      titleEl.appendChild(h('button', {
        type: 'button', class: 'project-title-btn', title: '作品名を変更',
        onclick: async () => {
          const v = await UI.prompt('作品名', App.project.title);
          if (v != null && v.trim()) { App.project.title = v.trim(); App.touch(); renderChrome(); }
        },
      }, App.project.title));
    } else {
      titleEl.appendChild(h('span', { class: 'muted' }, '作品を選んでください'));
    }
    const actions = document.getElementById('top-actions');
    clear(actions);
    actions.appendChild(h('span', { id: 'save-state', class: 'save-state', dataset: { state: App.saveState } }, App.project ? '保存済み' : ''));
    if (App.project) {
      const exportBtn = btn('', { icon: 'download', ghost: true, title: '書き出し・バックアップ' });
      exportBtn.addEventListener('click', () => UI.menu(exportBtn, [
        { label: '表示中の話をテキストで書き出す', icon: 'file', onClick: () => App.exportChapterTxt() },
        { label: '全話をテキストで書き出す', icon: 'book', onClick: () => App.exportAllTxt() },
        { label: '設定資料をMarkdownで書き出す', icon: 'users', onClick: () => App.exportLoreMd() },
        null,
        { label: '作品のバックアップ（.json）', icon: 'save', onClick: () => App.exportBackup() },
      ]));
      actions.appendChild(exportBtn);
    }
    App.setSaveState(App.saveState);
  }
  App.renderChrome = renderChrome;

  // ───── 書き出し ─────
  App.currentChapter = function () {
    const p = App.project;
    if (!p) return null;
    const id = App.params && App.params.id;
    return p.chapters.find((c) => c.id === id) || p.chapters.find((c) => c.id === p.lastChapterId) || p.chapters[0];
  };
  App.exportChapterTxt = function () {
    const c = App.currentChapter();
    if (!c) return;
    UI.download(UI.safeFilename(App.project.title + '_' + c.title) + '.txt', c.title + '\n\n' + c.body);
  };
  App.exportAllTxt = function () {
    const p = App.project;
    const parts = [p.title, ''];
    p.chapters.forEach((c) => { parts.push('', c.title, '', c.body, ''); });
    UI.download(UI.safeFilename(p.title) + '.txt', parts.join('\n'));
  };
  App.exportBackup = function () {
    const p = App.project;
    UI.download(UI.safeFilename(p.title) + '_' + UI.today() + '.tsuzuri.json', JSON.stringify({ app: 'tsuzuri', version: 1, project: p }, null, 1), 'application/json');
    toast('バックアップを書き出しました');
  };
  App.exportLoreMd = function () {
    UI.download(UI.safeFilename(App.project.title) + '_設定資料.md', NS.LoreFormat.toMarkdown(App.project), 'text/markdown;charset=utf-8');
  };

  // ───── 設定画面 ─────
  App.openSettings = function () {
    const s = App.settings;
    const tabs = [
      { id: 'view', label: '表示' },
      { id: 'rules', label: '添削ルール' },
      { id: 'cons', label: '設定チェック' },
      { id: 'ai', label: 'AI' },
      { id: 'data', label: 'データ' },
    ];
    const body = h('div', { class: 'settings' });
    const tabBar = h('div', { class: 'tabs', role: 'tablist' });
    const pane = h('div', { class: 'settings-pane' });
    body.append(tabBar, pane);
    const show = (id) => {
      tabBar.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === id));
      clear(pane);
      pane.appendChild(SETTINGS_PANES[id]());
    };
    tabs.forEach((t) => tabBar.appendChild(h('button', { type: 'button', class: 'tab', role: 'tab', dataset: { tab: t.id }, onclick: () => show(t.id) }, t.label)));

    const changed = () => {
      App.saveSettings();
      if (App.current && App.current.onSettingsChanged) App.current.onSettingsChanged();
    };
    const select = (value, options, onChange) => {
      const sel = h('select', { class: 'input', onchange: (e) => onChange(e.target.value) });
      options.forEach(([v, l]) => sel.appendChild(h('option', { value: v, selected: String(v) === String(value) }, l)));
      return sel;
    };
    const number = (value, min, max, step, onChange) => h('input', {
      class: 'input input-num', type: 'number', min, max, step, value,
      onchange: (e) => { const n = parseFloat(e.target.value); if (!isNaN(n)) onChange(n); },
    });
    const toggleList = (rules, store) => h('div', { class: 'rule-list' }, rules.map((r) => {
      const on = Object.prototype.hasOwnProperty.call(store, r.id) ? store[r.id] : r.default;
      return h('label', { class: 'rule-row' },
        h('input', { type: 'checkbox', checked: on, onchange: (e) => { store[r.id] = e.target.checked; changed(); } }),
        h('span', { class: 'rule-text' }, h('strong', null, r.name), h('span', { class: 'muted small' }, r.desc || '')));
    }));

    const SETTINGS_PANES = {
      view: () => h('div', { class: 'stack' },
        UI.field('テーマ', select(s.theme, [['auto', '端末に合わせる'], ['light', 'ライト'], ['sepia', 'セピア（原稿用紙風）'], ['dark', 'ダーク']], (v) => { s.theme = v; changed(); })),
        UI.field('本文の書体', select(s.font, [['serif', '明朝体'], ['sans', 'ゴシック体']], (v) => { s.font = v; changed(); })),
        UI.field('本文の文字サイズ（px）', number(s.fontSize, 12, 32, 1, (v) => { s.fontSize = v; changed(); })),
        UI.field('行間', number(s.lineHeight, 1.3, 3, 0.1, (v) => { s.lineHeight = v; changed(); }))),
      rules: () => h('div', { class: 'stack' },
        h('div', { class: 'grid-3' },
          UI.field('一文の最大文字数', number(s.maxSentenceLength, 30, 400, 5, (v) => { s.maxSentenceLength = v; changed(); })),
          UI.field('一文の読点の上限', number(s.maxCommas, 1, 20, 1, (v) => { s.maxCommas = v; changed(); })),
          UI.field('同じ文末の連続', number(s.endingRepeat, 2, 10, 1, (v) => { s.endingRepeat = v; changed(); }))),
        toggleList(NS.Proofread.RULES, s.rules)),
      cons: () => h('div', { class: 'stack' },
        h('p', { class: 'muted small' }, '設定資料（人物の一人称・呼び方・髪や瞳の色・年齢・登場範囲、世界観ルール）と本文を照らし合わせます。台詞の話者は「」の前後の文から推定します。'),
        toggleList(NS.Consistency.RULES, s.consistency)),
      ai: () => NS.AIPanel ? NS.AIPanel.settingsPane(changed) : h('p', null, 'AI機能を読み込めませんでした'),
      data: () => {
        const info = h('p', { class: 'muted small' },
          '作品データはこの端末のブラウザ内（' + ({ idb: 'IndexedDB', ls: 'localStorage', mem: 'メモリのみ・再読み込みで消えます' }[Store.mode]) +
          '）に保存されます。ブラウザのデータ消去で消えるため、定期的にバックアップを書き出してください。');
        return h('div', { class: 'stack' }, info,
          h('div', { class: 'row wrap' },
            btn('すべての作品をバックアップ', { icon: 'save', onClick: App.exportAll }),
            btn('バックアップから読み込む', { icon: 'upload', onClick: App.importBackup })));
      },
    };
    modal({ title: '設定', body, wide: true });
    show('view');
  };

  App.exportAll = async function () {
    if (App.project) await App.saveNow();
    const list = await Store.listProjects();
    const projects = [];
    for (const m of list) {
      const p = await Store.loadProject(m.id);
      if (p) projects.push(p);
    }
    UI.download('tsuzuri_all_' + UI.today() + '.tsuzuri.json', JSON.stringify({ app: 'tsuzuri', version: 1, projects }, null, 1), 'application/json');
  };

  App.importBackup = async function () {
    const file = await UI.pickFile('.json,application/json');
    if (!file) return;
    try {
      const data = JSON.parse(await UI.readFileText(file));
      const projects = data.projects || (data.project ? [data.project] : (data.chapters ? [data] : []));
      if (!projects.length) throw new Error('作品データが見つかりません');
      let last = null;
      for (const p of projects) last = await Store.importProject(p);
      toast(projects.length + '件の作品を読み込みました');
      if (App.route === 'home') render('home', {});
      if (projects.length === 1 && last) App.openProject(last.id);
    } catch (e) {
      toast('読み込めませんでした：' + e.message, 'error');
    }
  };

  // ───── 作品一覧（ホーム） ─────
  const Home = {
    async mount(view) {
      const wrap = h('div', { class: 'home' });
      view.appendChild(wrap);
      wrap.appendChild(h('section', { class: 'home-hero' },
        h('h1', null, '綴り', h('small', null, '小説執筆スタジオ')),
        h('p', { class: 'muted' }, '原稿・添削・設定資料・設定矛盾チェック・アイデア帳・プロット・空想地図を、ひとつの作品ごとにまとめて管理できます。データはこの端末のブラウザ内に保存されます。'),
        h('div', { class: 'row wrap' },
          btn('新しい作品', { icon: 'plus', primary: true, onClick: async () => {
            const t = await UI.prompt('新しい作品', '', { placeholder: '作品名', okLabel: '作成' });
            if (t != null) App.createProject(t.trim() || '無題の作品');
          } }),
          btn('サンプル作品を開く', { icon: 'sparkles', onClick: async () => {
            const p = NS.Sample.create();
            await Store.saveProject(p);
            App.openProject(p.id, 'write');
          } }),
          btn('バックアップから読み込む', { icon: 'upload', ghost: true, onClick: App.importBackup }))));
      const listEl = h('section', { class: 'project-grid' });
      wrap.appendChild(h('h2', { class: 'section-title' }, '作品'));
      wrap.appendChild(listEl);
      const list = await Store.listProjects();
      if (!list.length) {
        listEl.appendChild(h('div', { class: 'empty' }, h('p', null, 'まだ作品がありません。「新しい作品」か「サンプル作品を開く」から始めましょう。')));
      }
      list.forEach((m) => {
        const more = btn('', { icon: 'more', ghost: true, small: true, title: 'その他の操作' });
        more.addEventListener('click', (e) => {
          e.stopPropagation();
          UI.menu(more, [
            { label: '名前を変更', icon: 'pen', onClick: async () => {
              const p = await Store.loadProject(m.id);
              const t = await UI.prompt('作品名', p.title);
              if (t && t.trim()) { p.title = t.trim(); await Store.saveProject(p); if (App.project && App.project.id === p.id) { App.project.title = p.title; renderChrome(); } render('home', {}); }
            } },
            { label: '複製', icon: 'copy', onClick: async () => {
              const p = await Store.loadProject(m.id);
              p.id = UI.uid('p');
              p.title += '（コピー）';
              await Store.saveProject(p);
              render('home', {});
            } },
            { label: 'バックアップを書き出す', icon: 'save', onClick: async () => {
              const p = await Store.loadProject(m.id);
              UI.download(UI.safeFilename(p.title) + '_' + UI.today() + '.tsuzuri.json', JSON.stringify({ app: 'tsuzuri', version: 1, project: p }, null, 1), 'application/json');
            } },
            null,
            { label: '削除', icon: 'trash', danger: true, onClick: async () => {
              if (!(await UI.confirm(`「${m.title}」を削除します。元に戻せません。`, { danger: true, okLabel: '削除' }))) return;
              await Store.deleteProject(m.id);
              if (App.project && App.project.id === m.id) { App.project = null; renderChrome(); }
              render('home', {});
            } },
          ]);
        });
        const card = h('div', {
          class: 'project-card' + (App.project && App.project.id === m.id ? ' current' : ''), tabindex: 0, role: 'button',
          onclick: () => App.openProject(m.id),
          onkeydown: (e) => { if (e.key === 'Enter') App.openProject(m.id); },
        },
        h('div', { class: 'project-card-head' }, h('h3', null, m.title), more),
        h('div', { class: 'project-card-meta' },
          h('span', null, UI.fmtNum(m.chars || 0) + '字'),
          h('span', null, (m.chapters || 0) + '話'),
          h('span', null, '更新 ' + UI.relTime(m.updatedAt))));
        listEl.appendChild(card);
      });
    },
  };

  // ───── 起動 ─────
  async function start() {
    App.applySettings();
    await Store.init();
    window.addEventListener('popstate', () => {
      const r = parseHash();
      render(r.route, r.params);
    });
    window.addEventListener('beforeunload', (e) => {
      if (App.saveState === 'dirty' || App.saveState === 'saving') {
        saveDebounced.flush();
        e.preventDefault();
        e.returnValue = '';
      }
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && App.saveState === 'dirty') App.saveNow();
    });
    const lastId = UI.lsGet('tsuzuri.current', null);
    if (lastId) {
      const p = await Store.loadProject(lastId);
      if (p) App.project = p;
    }
    renderChrome();
    const r = parseHash();
    render(App.project ? r.route : 'home', r.params);
    if (Store.mode === 'mem') toast('このブラウザでは保存できません。バックアップを書き出してください', 'error');
  }

  NS.App = App;
  NS.ROUTES = ROUTES;
  document.addEventListener('DOMContentLoaded', start);
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
<script>
// js/views/editor.js
/*
 * 綴り — 執筆画面
 * 話の一覧・本文エディタ（指摘のハイライト付き）・添削/設定チェック/AI/資料/統計パネル・縦書きプレビュー・検索置換・履歴。
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const { h, icon, btn, clear, toast } = UI;
  const T = NS.Text;
  const SEV_ORDER = { error: 3, warning: 2, info: 1 };
  const SEV_LABEL = { error: '要修正', warning: '注意', info: '提案' };

  const V = {};
  let S = null; // 画面の状態
  // 話を切り替えても保つ表示設定
  const PREF = Object.assign({ panelTab: 'proof', hideChapters: null, hidePanel: null }, UI.lsGet('tsuzuri.editorPref', {}));
  const savePref = () => UI.lsSet('tsuzuri.editorPref', PREF);
  // この画面を開いている間の、話ごとのスクロール位置とカーソル
  const VIEWPOS = new Map();
  // 話ごとの文字数のキャッシュ
  const COUNT = new Map();
  function countOf(c, body) {
    const b = body == null ? c.body : body;
    const hit = COUNT.get(c.id);
    if (hit && hit.body === b) return hit.n;
    const n = T.stats(b).charsNoSpace;
    COUNT.set(c.id, { body: b, n });
    return n;
  }

  function App() { return NS.App; }
  function P() { return NS.App.project; }

  V.mount = function (view, params) {
    const p = P();
    let ch = p.chapters.find((c) => c.id === params.id);
    if (!ch) ch = p.chapters.find((c) => c.id === p.lastChapterId) || p.chapters[0];
    p.lastChapterId = ch.id;
    const narrow = window.innerWidth < 900;
    S = {
      view, ch, issues: [], cons: null, active: -1, panelTab: PREF.panelTab || 'proof',
      filter: 'all', find: { open: false, q: '', r: '', matches: [], cur: -1 }, preview: false,
      lastText: ch.body, openedBody: ch.body, openedAt: Date.now(),
      hideChapters: narrow ? true : (PREF.hideChapters != null ? PREF.hideChapters : false),
      hidePanel: narrow ? true : (PREF.hidePanel != null ? PREF.hidePanel : window.innerWidth < 1200),
      aiIssues: [],
    };
    build();
    runAnalysis();
    const pos = VIEWPOS.get(ch.id);
    if (pos) {
      requestAnimationFrame(() => {
        if (!S || S.ch.id !== ch.id) return;
        S.scroll.scrollTop = pos.scroll;
        try { S.textarea.setSelectionRange(pos.caret, pos.caret); } catch (e) { /* 無視 */ }
      });
    }
  };

  V.unmount = function () {
    if (!S) return;
    VIEWPOS.set(S.ch.id, { scroll: S.scroll.scrollTop, caret: S.textarea.selectionStart });
    autoSnapshot();
    if (S.analysisTimer) clearTimeout(S.analysisTimer);
    if (S.onKey) document.removeEventListener('keydown', S.onKey);
    if (S.ro) S.ro.disconnect();
    S = null;
  };

  V.onSettingsChanged = function () {
    if (S) runAnalysis(true);
  };

  V.state = function () { return S; };

  // ───── レイアウト ─────
  function build() {
    const view = S.view;
    clear(view);
    const layout = h('div', { class: 'write-layout' });
    S.layout = layout;
    layout.classList.toggle('hide-chapters', S.hideChapters);
    layout.classList.toggle('hide-panel', S.hidePanel);

    // 話の一覧
    S.chapterList = h('ul', { class: 'chapter-list', role: 'list' });
    const chapters = h('aside', { class: 'chapters', 'aria-label': '話の一覧' },
      h('div', { class: 'pane-head' },
        h('h2', null, '話'),
        btn('', { icon: 'plus', ghost: true, small: true, title: '新しい話を追加', onClick: addChapter }),
        btn('', { icon: 'x', ghost: true, small: true, class: 'only-mobile', title: '閉じる', onClick: () => toggleChapters(true) })),
      S.chapterList,
      S.chapterTotal = h('div', { class: 'pane-foot muted small' }));

    // 本文
    S.titleInput = h('input', {
      class: 'chapter-title-input', type: 'text', value: S.ch.title, 'aria-label': '話のタイトル', placeholder: '話のタイトル',
      oninput: (e) => { S.ch.title = e.target.value; S.ch.updatedAt = Date.now(); App().touch(); renderChapterList(); },
    });
    const toolbar = h('div', { class: 'editor-toolbar' },
      btn('', { icon: 'sidebar', ghost: true, title: '話の一覧を表示/隠す', onClick: () => toggleChapters() }),
      S.titleInput,
      h('div', { class: 'toolbar-group' },
        tbtn('「」', '鉤括弧', () => wrapOrInsert('「', '」')),
        tbtn('『』', '二重鉤括弧', () => wrapOrInsert('『', '』')),
        tbtn('……', '三点リーダー', () => insertText('……')),
        tbtn('――', 'ダッシュ', () => insertText('――')),
        tbtn('ルビ', 'ルビを振る（|漢字《かんじ》）', insertRuby),
        tbtn('傍点', '傍点（《《強調》》）', () => wrapOrInsert('《《', '》》'))),
      h('div', { class: 'toolbar-group' },
        btn('', { icon: 'search', ghost: true, title: '検索・置換（Ctrl+F）', onClick: () => openFind() }),
        S.previewBtn = btn('', { icon: 'vertical', ghost: true, title: '縦書きプレビュー', onClick: togglePreview }),
        btn('', { icon: 'history', ghost: true, title: '版の保存と履歴', onClick: openHistory }),
        btn('', { icon: 'panel', ghost: true, title: '添削パネルを表示/隠す', onClick: () => togglePanel() })));

    S.findBar = h('div', { class: 'findbar', hidden: true });

    S.backdrop = h('div', { class: 'editor-backdrop', 'aria-hidden': 'true' });
    S.textarea = h('textarea', {
      class: 'editor-input', spellcheck: false, 'aria-label': '本文', placeholder: 'ここに本文を書きます。\n\n段落の頭は全角スペースで字下げ、会話は「」で囲みます。ルビは |漢字《かんじ》 、傍点は《《強調》》と書けます。',
    });
    S.textarea.value = S.ch.body;
    S.sheet = h('div', { class: 'editor-sheet' }, S.backdrop, S.textarea);
    S.scroll = h('div', { class: 'editor-scroll' }, S.sheet);
    S.previewEl = h('div', { class: 'preview-vertical', hidden: true, tabindex: 0, 'aria-label': '縦書きプレビュー' });
    S.issueBar = h('div', { class: 'issue-bar', hidden: true });
    S.status = h('div', { class: 'editor-status' });

    const main = h('section', { class: 'editor-main' }, toolbar, S.findBar, S.scroll, S.previewEl, S.issueBar, S.status);

    // パネル
    S.panelTabs = h('div', { class: 'tabs panel-tabs', role: 'tablist' });
    [['proof', '添削'], ['cons', '設定チェック'], ['ai', 'AI'], ['ref', '資料'], ['stats', '統計']].forEach(([id, label]) => {
      S.panelTabs.appendChild(h('button', {
        type: 'button', role: 'tab', class: 'tab', dataset: { tab: id },
        onclick: () => { S.panelTab = id; PREF.panelTab = id; savePref(); renderPanel(); },
      }, label, h('span', { class: 'tab-badge', dataset: { badge: id } })));
    });
    S.panelBody = h('div', { class: 'panel-body' });
    const panel = h('aside', { class: 'side-panel', 'aria-label': '添削・チェック' },
      h('div', { class: 'pane-head' }, S.panelTabs,
        btn('', { icon: 'x', ghost: true, small: true, class: 'only-mobile', title: '閉じる', onClick: () => togglePanel(true) })),
      S.panelBody);

    layout.append(chapters, main, panel, h('div', { class: 'drawer-scrim', onclick: () => { toggleChapters(true); togglePanel(true); } }));
    view.appendChild(layout);

    // イベント
    S.textarea.addEventListener('input', onInput);
    S.textarea.addEventListener('scroll', () => { S.backdrop.scrollTop = S.textarea.scrollTop; });
    S.textarea.addEventListener('click', onCaret);
    S.textarea.addEventListener('keyup', (e) => { if (/Arrow|Home|End|Page/.test(e.key)) onCaret(); });
    S.onKey = (e) => {
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); App().saveNow().then(() => toast('保存しました')); }
      else if (mod && e.key.toLowerCase() === 'f') { e.preventDefault(); openFind(); }
      else if (e.key === 'Escape' && S.find.open && document.activeElement && S.findBar.contains(document.activeElement)) closeFind();
    };
    document.addEventListener('keydown', S.onKey);
    S.ro = new ResizeObserver(() => fitTextarea());
    S.ro.observe(S.sheet);

    renderChapterList();
    renderBackdrop();
    renderStatus();
    renderPanel();
    fitTextarea();
  }

  function tbtn(label, title, fn) {
    return h('button', { type: 'button', class: 'btn btn-ghost btn-text', title, 'aria-label': title, onclick: fn }, label);
  }

  function toggleChapters(forceHide) {
    S.hideChapters = forceHide === true ? true : !S.hideChapters;
    S.layout.classList.toggle('hide-chapters', S.hideChapters);
    if (window.innerWidth < 900) {
      if (!S.hideChapters) { S.hidePanel = true; S.layout.classList.add('hide-panel'); }
    } else { PREF.hideChapters = S.hideChapters; savePref(); }
  }
  function togglePanel(forceHide) {
    S.hidePanel = forceHide === true ? true : !S.hidePanel;
    S.layout.classList.toggle('hide-panel', S.hidePanel);
    if (window.innerWidth < 900) {
      if (!S.hidePanel) { S.hideChapters = true; S.layout.classList.add('hide-chapters'); }
    } else { PREF.hidePanel = S.hidePanel; savePref(); }
  }

  // テキストエリアの高さを本文に合わせる（スクロールは外側の .editor-scroll が担当）
  function fitTextarea() {
    if (!S) return;
    S.textarea.style.height = S.backdrop.offsetHeight + 'px';
    if (S.textarea.scrollHeight > S.textarea.clientHeight + 2) S.textarea.style.height = S.textarea.scrollHeight + 'px';
  }

  // ───── 話の一覧 ─────
  function renderChapterList() {
    const p = P();
    clear(S.chapterList);
    let total = 0;
    p.chapters.forEach((c, i) => {
      const n = countOf(c, c.id === S.ch.id && S.textarea ? S.textarea.value : c.body);
      total += n;
      const more = btn('', { icon: 'more', ghost: true, small: true, title: 'その他の操作' });
      more.addEventListener('click', (e) => { e.stopPropagation(); chapterMenu(more, c, i); });
      const li = h('li', {
        class: 'chapter-item' + (c.id === S.ch.id ? ' active' : ''), draggable: true, tabindex: 0,
        onclick: () => switchChapter(c.id),
        onkeydown: (e) => { if (e.key === 'Enter') switchChapter(c.id); },
        ondblclick: () => renameChapter(c),
      },
      h('span', { class: 'chapter-no' }, String(i + 1)),
      h('span', { class: 'chapter-name' }, c.title || '無題'),
      h('span', { class: 'chapter-count' }, UI.fmtNum(n)),
      more);
      li.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', c.id); li.classList.add('dragging'); });
      li.addEventListener('dragend', () => li.classList.remove('dragging'));
      li.addEventListener('dragover', (e) => { e.preventDefault(); li.classList.add('drop-target'); });
      li.addEventListener('dragleave', () => li.classList.remove('drop-target'));
      li.addEventListener('drop', (e) => {
        e.preventDefault();
        li.classList.remove('drop-target');
        const id = e.dataTransfer.getData('text/plain');
        const from = p.chapters.findIndex((x) => x.id === id);
        if (from < 0 || from === i) return;
        const [moved] = p.chapters.splice(from, 1);
        p.chapters.splice(i, 0, moved);
        App().touch();
        renderChapterList();
        runAnalysis(true);
      });
      S.chapterList.appendChild(li);
    });
    S.chapterTotal.textContent = `全${p.chapters.length}話・${UI.fmtNum(total)}字`;
  }

  function chapterMenu(anchor, c, i) {
    const p = P();
    UI.menu(anchor, [
      { label: '名前を変更', icon: 'pen', onClick: () => renameChapter(c) },
      { label: '上へ移動', icon: 'up', onClick: () => moveChapter(i, -1) },
      { label: '下へ移動', icon: 'down', onClick: () => moveChapter(i, 1) },
      { label: '複製', icon: 'copy', onClick: () => {
        syncBody();
        const copy = NS.Store.newChapter(c.title + '（複製）', c.body);
        copy.memo = c.memo;
        p.chapters.splice(i + 1, 0, copy);
        App().touch();
        renderChapterList();
      } },
      { label: 'テキストで書き出す', icon: 'download', onClick: () => { syncBody(); UI.download(UI.safeFilename(c.title) + '.txt', c.title + '\n\n' + c.body); } },
      null,
      { label: '削除', icon: 'trash', danger: true, onClick: async () => {
        if (p.chapters.length <= 1) { toast('最後の話は削除できません'); return; }
        if (!(await UI.confirm(`「${c.title}」を削除します。元に戻せません。`, { danger: true, okLabel: '削除' }))) return;
        p.chapters.splice(i, 1);
        App().touch();
        if (c.id === S.ch.id) App().navigate('write', { id: p.chapters[Math.max(0, i - 1)].id });
        else renderChapterList();
      } },
    ]);
  }

  function moveChapter(i, d) {
    const p = P();
    const j = i + d;
    if (j < 0 || j >= p.chapters.length) return;
    const [c] = p.chapters.splice(i, 1);
    p.chapters.splice(j, 0, c);
    App().touch();
    renderChapterList();
    runAnalysis(true);
  }

  async function renameChapter(c) {
    const t = await UI.prompt('話のタイトル', c.title);
    if (t == null) return;
    c.title = t;
    if (c.id === S.ch.id) S.titleInput.value = t;
    App().touch();
    renderChapterList();
  }

  function addChapter() {
    const p = P();
    syncBody();
    const c = NS.Store.newChapter('第' + T.toKanjiNumber(p.chapters.length + 1) + '話');
    const idx = p.chapters.findIndex((x) => x.id === S.ch.id);
    p.chapters.splice(idx + 1, 0, c);
    App().touch();
    App().navigate('write', { id: c.id });
  }

  function switchChapter(id) {
    if (S && id === S.ch.id) { if (window.innerWidth < 900) toggleChapters(true); return; }
    syncBody();
    App().navigate('write', { id });
  }

  function syncBody() {
    if (!S) return;
    if (S.ch.body !== S.textarea.value) {
      S.ch.body = S.textarea.value;
      S.ch.updatedAt = Date.now();
      App().touch();
    }
  }

  // ───── 入力とハイライト ─────
  function onInput() {
    const text = S.textarea.value;
    const diff = T.diffRange(S.lastText, text);
    S.issues = T.shiftRanges(S.issues, diff);
    S.aiIssues = T.shiftRanges(S.aiIssues || [], diff);
    if (S.find.open) computeFind();
    S.lastText = text;
    S.ch.body = text;
    S.ch.updatedAt = Date.now();
    App().touch();
    renderBackdrop();
    fitTextarea();
    scheduleAnalysis();
    renderStatusSoon();
  }
