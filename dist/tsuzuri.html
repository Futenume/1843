<title>綴り 小説執筆スタジオ</title>
<meta name="description" content="小説だけに特化した執筆アプリ。添削、設定資料と設定矛盾チェック、アイデア帳、プロットボード、空想地図をひとつに。">
<meta name="theme-color" content="#f4f1ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233a5a9b'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='serif'%3E綴%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600;700&family=Shippori+Mincho:wght@500;700&family=Zen+Antique&family=Yuji+Syuku&family=Klee+One:wght@600&family=Dela+Gothic+One&display=swap">
<style>
/* 綴り — 小説執筆スタジオ */

:root {
  --bg: #f4f1ea;
  --surface: #fffdf8;
  --surface-2: #f6f1e7;
  --surface-3: #ede6d8;
  --paper: #fffdf8;
  --ink: #2a2521;
  --ink-2: #5a5248;
  --muted: #887f74;
  --line: #e4ddd0;
  --line-strong: #cfc5b4;
  --accent: #34528f;
  --accent-ink: #ffffff;
  --accent-soft: #e2e8f5;
  --danger: #b03d2a;
  --sev-error: #d0442c;
  --sev-warning: #d4900f;
  --sev-info: #4a87c0;
  --mark-error: rgba(208, 68, 44, 0.13);
  --mark-warning: rgba(212, 144, 15, 0.15);
  --mark-info: rgba(74, 135, 192, 0.10);
  --mark-active: rgba(52, 82, 143, 0.24);
  --mark-find: rgba(255, 205, 40, 0.5);
  --mark-find-cur: rgba(255, 140, 0, 0.6);
  --map-bg: #e9e4da;
  --shadow: 0 1px 2px rgba(40, 30, 20, 0.06), 0 6px 20px rgba(40, 30, 20, 0.07);
  --shadow-lg: 0 10px 40px rgba(30, 20, 10, 0.18);
  --radius: 10px;
  --font-sans: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans CJK JP", "Source Han Sans JP", "IPAexGothic", "IPAGothic", system-ui, sans-serif;
  --font-serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif CJK JP", "Source Han Serif JP", "IPAexMincho", "IPAMincho", serif;
  --editor-font: var(--font-serif);
  --editor-size: 17px;
  --editor-lh: 1.9;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="sepia"]) {
    --bg: #161514;
    --surface: #1f1d1b;
    --surface-2: #272421;
    --surface-3: #312d29;
    --paper: #1c1a18;
    --ink: #ebe5db;
    --ink-2: #c3bbaf;
    --muted: #958c80;
    --line: #33302b;
    --line-strong: #4a443c;
    --accent: #93abe6;
    --accent-ink: #10141d;
    --accent-soft: #263150;
    --danger: #f08a75;
    --sev-error: #f0745d;
    --sev-warning: #e8b04a;
    --sev-info: #7fb2e5;
    --mark-error: rgba(240, 116, 93, 0.2);
    --mark-warning: rgba(232, 176, 74, 0.2);
    --mark-info: rgba(127, 178, 229, 0.14);
    --mark-active: rgba(147, 171, 230, 0.3);
    --mark-find: rgba(255, 205, 40, 0.35);
    --mark-find-cur: rgba(255, 140, 0, 0.5);
    --map-bg: #121110;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161514;
  --surface: #1f1d1b;
  --surface-2: #272421;
  --surface-3: #312d29;
  --paper: #1c1a18;
  --ink: #ebe5db;
  --ink-2: #c3bbaf;
  --muted: #958c80;
  --line: #33302b;
  --line-strong: #4a443c;
  --accent: #93abe6;
  --accent-ink: #10141d;
  --accent-soft: #263150;
  --danger: #f08a75;
  --sev-error: #f0745d;
  --sev-warning: #e8b04a;
  --sev-info: #7fb2e5;
  --mark-error: rgba(240, 116, 93, 0.2);
  --mark-warning: rgba(232, 176, 74, 0.2);
  --mark-info: rgba(127, 178, 229, 0.14);
  --mark-active: rgba(147, 171, 230, 0.3);
  --mark-find: rgba(255, 205, 40, 0.35);
  --mark-find-cur: rgba(255, 140, 0, 0.5);
  --map-bg: #121110;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
:root[data-theme="sepia"] {
  --bg: #e9dfca;
  --surface: #f6eedc;
  --surface-2: #efe4cd;
  --surface-3: #e5d7bb;
  --paper: #f8f0de;
  --ink: #3a2e22;
  --ink-2: #625240;
  --muted: #8f7d66;
  --line: #ddcfb3;
  --line-strong: #c9b794;
  --accent: #8a4b2a;
  --accent-ink: #fffaf0;
  --accent-soft: #ecd9c2;
  --map-bg: #e2d6bd;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.35; }
p { margin: 0; }
a { color: var(--accent); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon { flex: none; }

/* ───── 枠 ───── */
#app {
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}
#sidebar {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
  padding: 10px 6px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  overflow-y: auto;
}
.brand { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0 12px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font-family: var(--font-serif); font-size: 22px; font-weight: 700;
}
.brand-name { font-family: var(--font-serif); font-size: 11px; color: var(--muted); letter-spacing: 0.2em; }
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px; border-radius: 10px;
  color: var(--ink-2); text-decoration: none; font-size: 11.5px; line-height: 1.2; text-align: center;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item.disabled { opacity: 0.4; }
.nav-spacer { flex: 1; }
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#topbar {
  height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.project-title { min-width: 0; flex: 1; display: flex; }
.project-title-btn {
  border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: pointer; max-width: 100%;
  font-family: var(--font-serif); font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.project-title-btn:hover { background: var(--surface-2); }
.view-title { color: var(--muted); font-size: 13px; white-space: nowrap; }
.top-actions { display: flex; align-items: center; gap: 6px; }
.save-state { font-size: 12px; color: var(--muted); white-space: nowrap; }
.save-state[data-state="dirty"], .save-state[data-state="saving"] { color: var(--sev-warning); }
.save-state[data-state="error"] { color: var(--danger); font-weight: 600; }
.view { flex: 1; min-height: 0; overflow: auto; }
.view-write, .view-map, .view-lore, .view-plot { overflow: hidden; }

/* ───── 部品 ───── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px;
  border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-size: 14px; line-height: 1.3; cursor: pointer; white-space: nowrap; transition: background 0.12s, border-color 0.12s;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-danger { color: var(--danger); }
.btn-sm { padding: 4px 9px; font-size: 13px; border-radius: 7px; }
.btn-icon { padding: 6px; }
.btn-icon.btn-sm { padding: 4px; }
.btn.active { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.btn-text { font-family: var(--font-serif); padding: 5px 8px; font-size: 14px; }
.input {
  width: 100%; min-width: 0; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--surface); color: var(--ink); font-size: 14px; line-height: 1.5;
}
textarea.input { resize: vertical; line-height: 1.65; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input-num { width: 120px; }
select.input { padding-right: 28px; }
.range { width: 100%; accent-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field-label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.field-hint { font-size: 11.5px; color: var(--muted); }
.field-checked .field-label::after {
  content: "照合"; margin-left: 6px; font-size: 10px; padding: 0 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent);
}
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.check input { accent-color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: end; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; }
.span-2 { grid-column: span 2; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.empty { padding: 28px 20px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty.small { padding: 16px; font-size: 13px; color: var(--muted); }
.empty.big { padding: 60px 24px; max-width: 520px; margin: 0 auto; }
.empty .icon { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 2px 10px;
  font-size: 12.5px; cursor: pointer; color: var(--ink-2);
}
.chip.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.chip.static { cursor: default; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab {
  border: 0; background: none; padding: 9px 10px 8px; border-bottom: 2px solid transparent; cursor: pointer;
  color: var(--ink-2); white-space: nowrap; font-size: 13px; display: inline-flex; align-items: center; gap: 4px;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab-badge:not(:empty) {
  font-size: 10.5px; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); font-weight: 500; text-align: center;
}
.sev-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; vertical-align: middle; margin-right: 2px; }
.sev-dot.sev-error { background: var(--sev-error); }
.sev-dot.sev-warning { background: var(--sev-warning); }
.sev-dot.sev-info { background: var(--sev-info); }
.meter { display: inline-block; width: 60px; height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; vertical-align: middle; margin-left: 6px; }
.meter > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meter.big { display: block; width: 100%; height: 8px; margin: 4px 0 0; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line-strong); cursor: pointer; padding: 0;
  background-image: linear-gradient(135deg, transparent 45%, var(--line-strong) 45%, var(--line-strong) 55%, transparent 55%);
}
.swatch[style*="rgb"], .swatch[style*="#"] { background-image: none; }
.swatch.active { box-shadow: 0 0 0 2px var(--accent); }
.color-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.type-badge {
  font-size: 11px; padding: 1px 7px; border-radius: 5px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; flex: none;
}
.type-badge.t-character { background: rgba(61, 126, 166, 0.15); color: #2f6a8f; }
.type-badge.t-place { background: rgba(106, 153, 78, 0.16); color: #4c7a36; }
.type-badge.t-term { background: rgba(217, 164, 65, 0.18); color: #946812; }
.type-badge.t-org { background: rgba(140, 59, 94, 0.14); color: #8c3b5e; }
:root[data-theme="dark"] .type-badge { filter: brightness(1.6); }
.spinner {
  width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--accent);
  animation: spin 0.8s linear infinite; flex: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

/* モーダル・メニュー・トースト */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(20, 16, 12, 0.45); display: flex; align-items: center; justify-content: center;
  padding: 16px; z-index: 100;
}
.modal {
  background: var(--surface); border-radius: 14px; width: min(520px, 100%); max-height: calc(100dvh - 32px);
  display: flex; flex-direction: column; box-shadow: var(--shadow-lg);
}
.modal-wide { width: min(860px, 100%); }
.modal-header { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px 20px; border-bottom: 1px solid var(--line); }
.modal-header h2 { flex: 1; font-size: 16px; }
.modal-body { padding: 16px 20px; overflow: auto; }
.modal-footer { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
.popmenu {
  position: fixed; z-index: 200; min-width: 200px; max-width: calc(100vw - 16px); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow-lg); padding: 5px;
}
.popmenu-item {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 0; background: none; border-radius: 7px;
  cursor: pointer; text-align: left; font-size: 13.5px;
}
.popmenu-item:hover, .popmenu-item:focus { background: var(--surface-2); outline: none; }
.popmenu-item.danger { color: var(--danger); }
.popmenu-sep { height: 1px; background: var(--line); margin: 4px 6px; }
.icon-spacer { width: 16px; }
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: var(--surface);
  padding: 9px 16px; border-radius: 10px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
  z-index: 300; max-width: calc(100vw - 32px); box-shadow: var(--shadow-lg);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.error { background: var(--danger); color: #fff; }

/* ───── ホーム ───── */
.home { max-width: 1040px; margin: 0 auto; padding: 32px 24px 60px; }
.home-hero { display: flex; flex-direction: column; gap: 14px; padding: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.home-hero h1 { font-family: var(--font-serif); font-size: 34px; letter-spacing: 0.08em; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.home-hero h1 small { font-size: 15px; color: var(--muted); letter-spacing: 0.2em; font-weight: 400; }
.home-hero p { max-width: 640px; }
.section-title { font-size: 15px; margin: 28px 0 12px; color: var(--ink-2); }
.project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.project-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; cursor: pointer;
  display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); transition: border-color 0.15s, transform 0.15s;
}
.project-card:hover { border-color: var(--accent); }
.project-card.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.project-card-head { display: flex; align-items: flex-start; gap: 6px; }
.project-card h3 { flex: 1; font-family: var(--font-serif); font-size: 16px; }
.project-card-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }

/* ───── 執筆 ───── */
.write-layout {
  --ch: 240px; --pn: 360px;
  display: grid; grid-template-columns: var(--ch) minmax(0, 1fr) var(--pn); height: 100%; position: relative;
}
.write-layout.hide-chapters { --ch: 0px; }
.write-layout.hide-panel { --pn: 0px; }
.write-layout.hide-chapters .chapters, .write-layout.hide-panel .side-panel { display: none; }
.drawer-scrim { display: none; }
.chapters { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--line); }
.pane-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px 6px 14px; border-bottom: 1px solid var(--line); min-height: 44px; }
.pane-head h2 { flex: 1; font-size: 14px; }
.side-panel .pane-head { padding: 0 6px 0 8px; }
.side-panel .pane-head .tabs { flex: 1; }
.pane-foot { padding: 8px 14px; border-top: 1px solid var(--line); }
.chapter-list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
.chapter-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 4px 7px 8px; border-radius: 8px; cursor: pointer; font-size: 13.5px;
}
.chapter-item:hover { background: var(--surface-2); }
.chapter-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chapter-item.dragging { opacity: 0.4; }
.chapter-item.drop-target { box-shadow: inset 0 2px 0 var(--accent); }
.chapter-no { width: 20px; text-align: right; color: var(--muted); font-size: 11.5px; flex: none; }
.chapter-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chapter-count { font-size: 11px; color: var(--muted); font-weight: 400; }
.chapter-item .btn { opacity: 0; }
.chapter-item:hover .btn, .chapter-item.active .btn, .chapter-item:focus-within .btn { opacity: 1; }

.editor-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.editor-toolbar {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--surface); border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.chapter-title-input {
  flex: 1; min-width: 120px; border: 0; background: none; font-family: var(--font-serif); font-size: 16px; font-weight: 600; padding: 5px 6px; border-radius: 6px;
}
.chapter-title-input:hover { background: var(--surface-2); }
.chapter-title-input:focus { outline: none; background: var(--surface-2); }
.toolbar-group { display: flex; align-items: center; gap: 2px; padding-left: 6px; border-left: 1px solid var(--line); }
.findbar {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.findbar .input { width: 180px; padding: 5px 8px; }
.find-count { min-width: 40px; }
.editor-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 16px 80px; }
.editor-sheet {
  position: relative; max-width: calc(var(--editor-size) * 42 + 112px); margin: 0 auto; background: var(--paper);
  border-radius: 6px; box-shadow: var(--shadow); border: 1px solid var(--line);
}
.editor-backdrop, .editor-input {
  margin: 0; border: 0; padding: 44px 56px 60px; width: 100%;
  font-family: var(--editor-font); font-size: var(--editor-size); line-height: var(--editor-lh); letter-spacing: 0.03em;
  white-space: pre-wrap; overflow-wrap: break-word; word-break: normal; tab-size: 4; font-kerning: none;
  text-rendering: optimizeSpeed; font-variant-ligatures: none;
}
.editor-backdrop { color: transparent; min-height: 62vh; pointer-events: none; }
.editor-input {
  position: absolute; top: 0; left: 0; height: 100%; resize: none; overflow: hidden; background: transparent; color: var(--ink);
  caret-color: var(--accent); outline: none; display: block;
}
.editor-input::placeholder { color: var(--muted); opacity: 0.8; }
.editor-backdrop mark { color: transparent; background: none; border-radius: 2px; }
.editor-backdrop .mk.sev-error { background: var(--mark-error); text-decoration: underline wavy var(--sev-error); text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
.editor-backdrop .mk.sev-warning { background: var(--mark-warning); text-decoration: underline wavy var(--sev-warning); text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
.editor-backdrop .mk.sev-info { background: var(--mark-info); text-decoration: underline dotted var(--sev-info); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.editor-backdrop .mk.mk-ai { box-shadow: inset 0 -2px 0 rgba(140, 80, 200, 0.35); }
.editor-backdrop .mk.active { background: var(--mark-active); }
.editor-backdrop .mk-find { background: var(--mark-find); }
.editor-backdrop .mk-find.cur { background: var(--mark-find-cur); }
ruby rt { font-size: 0.5em; }
.issue-bar {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border-top: 1px solid var(--line); font-size: 13px;
}
.issue-bar-msg { flex: 1; min-width: 0; }
.editor-status {
  display: flex; align-items: center; gap: 16px; padding: 6px 14px; background: var(--surface); border-top: 1px solid var(--line);
  font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap;
}
.editor-status strong { color: var(--ink); font-weight: 600; margin: 0 1px; }
.status-issues { margin-left: auto; display: inline-flex; gap: 2px; align-items: center; }

.side-panel { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); }
.panel-body { flex: 1; overflow-y: auto; padding: 12px; }
.panel-intro { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.panel-h { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.issue-list { display: flex; flex-direction: column; gap: 8px; }
.issue-card {
  border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; background: var(--surface); cursor: pointer;
  display: flex; flex-direction: column; gap: 5px; transition: border-color 0.12s, background 0.12s;
}
.issue-card:hover { border-color: var(--line-strong); }
.issue-card.active { border-color: var(--accent); background: var(--accent-soft); }
.issue-head { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.issue-rule { font-weight: 600; flex: 1; min-width: 0; }
.issue-cat { color: var(--muted); font-size: 11px; }
.issue-excerpt { font-family: var(--font-serif); font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.issue-excerpt .ctx { color: var(--muted); }
.issue-excerpt mark { background: var(--mark-warning); color: var(--ink); padding: 0 1px; border-radius: 2px; }
.issue-msg { font-size: 12.5px; color: var(--ink-2); }
.issue-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.sub-section { border-top: 1px solid var(--line); padding-top: 10px; }
.sub-section summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.speaker-list { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; max-height: 260px; overflow-y: auto; }
.speaker-row { display: flex; gap: 8px; text-align: left; border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
.speaker-row:hover { background: var(--surface-2); }
.speaker-name { flex: none; width: 7em; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.speaker-line { font-family: var(--font-serif); color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref-list { display: flex; flex-direction: column; gap: 6px; }
.ref-item { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.ref-item summary { cursor: pointer; display: flex; align-items: center; gap: 6px; list-style: none; }
.ref-item summary::-webkit-details-marker { display: none; }
.ref-body { padding: 8px 0 4px; display: flex; flex-direction: column; gap: 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-size: 12.5px; }
.kv dt { color: var(--muted); white-space: nowrap; }
.kv dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.memo { font-family: var(--font-serif); }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.stat dt { font-size: 11px; color: var(--muted); }
.stat dd { margin: 0; font-size: 16px; font-weight: 600; }
.goal-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; font-weight: 600; }
.day-bars { display: flex; align-items: flex-end; gap: 4px; height: 90px; padding-top: 6px; }
.day-bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 2px; }
.day-bar-fill { width: 100%; max-width: 18px; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
.day-bar-label { font-size: 10px; color: var(--muted); }
.mini-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.mini-table td { padding: 4px 4px; border-bottom: 1px solid var(--line); }
.mini-table td:first-child { color: var(--muted); width: 2em; }
.mini-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.mini-table tr.current td { color: var(--accent); font-weight: 600; }
.snapshot-list { display: flex; flex-direction: column; gap: 8px; }
.snapshot { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; flex-wrap: wrap; }
.snapshot-meta { flex: 1; min-width: 160px; display: flex; flex-direction: column; }
.snapshot-text { white-space: pre-wrap; font-family: var(--font-serif); font-size: 14px; line-height: 1.8; margin: 0; }
.ai-panel .seg { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.ai-panel .seg label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.ai-panel .seg label.disabled { opacity: 0.5; }
.ai-status { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; font-size: 13px; }
.ai-status .ai-progress { flex: 1; }
.ai-results { display: flex; flex-direction: column; gap: 8px; }
.ai-summary { background: var(--surface-2); border-radius: 9px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.ai-summary-head { display: flex; align-items: center; gap: 6px; color: #7b4fb0; }
:root[data-theme="dark"] .ai-summary-head { color: #c4a3ef; }
.ai-summary-head .muted { margin-left: auto; }
.ai-card { cursor: default; }
.ai-card.stale { opacity: 0.6; }
.ai-suggest { font-family: var(--font-serif); font-size: 13px; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; }
.ai-answer-box { background: var(--surface-2); border-radius: 9px; padding: 12px; }
.ai-answer { white-space: pre-wrap; font-size: 13.5px; line-height: 1.75; overflow-wrap: anywhere; }

/* ───── 辞書 ───── */
.dict { display: flex; flex-direction: column; gap: 10px; }
.dict-search .input { flex: 1; }
.dict-results { display: flex; flex-direction: column; gap: 12px; }
.dict-section { display: flex; flex-direction: column; gap: 8px; }
.dict-list, .dict-cat { display: flex; flex-direction: column; gap: 6px; }
.dict-item { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; display: flex; flex-direction: column; gap: 4px; }
.dict-item-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dict-item-head strong { font-family: var(--font-serif); font-size: 15px; }
.dict-spacer { flex: 1; }
.dict-swatch { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.15); flex: none; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
.dict-card { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.dict-card-head { display: flex; align-items: baseline; gap: 8px; }
.dict-card-head a { margin-left: auto; }
.dict-defs { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.dict-pos { display: inline-block; font-size: 10.5px; padding: 0 5px; margin-right: 6px; border-radius: 4px; background: var(--surface-3); color: var(--ink-2); }
.dict-wp { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.7; }
.dict-wp img { width: 72px; height: auto; border-radius: 6px; flex: none; }
.dict-net { display: flex; flex-direction: column; gap: 8px; }
.dict-compact .dict-wp img { width: 56px; }
.reading-row.static { cursor: default; }
.link-btn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font: inherit; display: inline-flex; align-items: center; gap: 4px; }
.link-btn:hover { text-decoration: underline; }
.status-sel:empty { display: none; }

/* ───── プレビュー ───── */
.pv-overlay {
  --pv-bg: #f3eddf; --pv-paper: #fbf8f0; --pv-ink: #2b2520; --pv-sub: #8a7f72; --pv-line: #e2d9c6;
  position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; background: var(--pv-bg); color: var(--pv-ink);
}
.pv-overlay.pv-theme-white { --pv-bg: #ecebea; --pv-paper: #ffffff; --pv-ink: #1d1d1d; --pv-sub: #888; --pv-line: #e3e3e3; }
.pv-overlay.pv-theme-dark { --pv-bg: #111213; --pv-paper: #1d1e20; --pv-ink: #e4e0d8; --pv-sub: #8d877e; --pv-line: #2e2f32; }
.pv-overlay:focus { outline: none; }
.pv-bar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--pv-line); background: var(--pv-paper); flex-wrap: wrap; }
.pv-bar .btn { color: var(--pv-ink); }
.pv-heading { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.3; }
.pv-work { font-size: 11.5px; color: var(--pv-sub); }
.pv-chapter { font-family: var(--font-serif); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pv-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pv-seg { display: inline-flex; border: 1px solid var(--pv-line); border-radius: 8px; overflow: hidden; }
.pv-seg-btn { border: 0; background: transparent; color: var(--pv-ink); padding: 4px 9px; cursor: pointer; font-size: 12.5px; }
.pv-seg-btn + .pv-seg-btn { border-left: 1px solid var(--pv-line); }
.pv-seg-btn.active { background: var(--accent); color: var(--accent-ink); }
.pv-check { color: var(--pv-ink); }
.pv-main { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pv-foot { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 4px 12px 8px; color: var(--pv-sub); }
.pv-foot .btn { color: var(--pv-ink); }
.pv-book { display: flex; gap: 24px; align-items: center; justify-content: center; }
.pv-page {
  position: relative; background: var(--pv-paper); box-shadow: 0 2px 6px rgba(0,0,0,0.12), 0 10px 30px rgba(0,0,0,0.1);
  padding: 32px 28px; display: flex; align-items: center; justify-content: center; border-radius: 3px;
}
.pv-book.spread .pv-page:first-child { border-radius: 3px 0 0 3px; }
.pv-book.spread .pv-page:last-child { border-radius: 0 3px 3px 0; }
.pv-page.pv-empty .pv-content { visibility: hidden; }
.pv-content {
  writing-mode: vertical-rl; -webkit-writing-mode: vertical-rl; overflow: hidden; font-family: var(--pv-font); font-size: var(--pv-size);
  letter-spacing: 0.02em; text-align: justify; line-break: strict; font-feature-settings: "palt" 0;
}
.pv-content p { margin: 0; }
.pv-content .pv-blank { visibility: hidden; }
.pv-content .pv-title { font-size: 1.35em; font-weight: 600; margin: 0 0 0 var(--pv-lh, 2em); padding: 0; line-height: var(--pv-lh, 2em); letter-spacing: 0.1em; }
.pv-content .pv-pad { height: 1px; flex: none; }
.pv-content ruby { line-height: 1; }
.pv-content ruby rt, .pv-article ruby rt { font-size: 0.5em; }
.pv-content .tcy { text-combine-upright: all; -webkit-text-combine: horizontal; }
.pv-content .boten, .pv-article .boten { font-style: normal; -webkit-text-emphasis: filled sesame; text-emphasis: filled sesame; }
.pv-article .boten { text-emphasis-position: over right; }
.pv-running { position: absolute; top: 10px; left: 16px; font-size: 10.5px; color: var(--pv-sub); writing-mode: horizontal-tb; }
.pv-nombre { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--pv-sub); }
.pv-scroll { position: absolute; inset: 0; overflow-y: auto; padding: 32px 16px 60px; }
.pv-article { max-width: 36em; margin: 0 auto; font-family: var(--pv-font); font-size: var(--pv-size); line-height: 1.95; letter-spacing: 0.02em; }
.pv-article p { margin: 0; }
.pv-article .pv-blank { height: 1.95em; }
.pv-article .pv-title { font-size: 1.4em; margin: 0 0 1.4em; font-weight: 600; }
.pv-chapter-nav { max-width: 36em; margin: 3em auto 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pv-print { display: none; }

@media print {
  body.printing { overflow: visible; background: #fff; }
  body.printing #app, body.printing .pv-overlay, body.printing #toast, body.printing .modal-overlay { display: none !important; }
  body.printing .pv-print { display: block; color: #000; font-family: var(--pv-font, var(--font-serif)); font-size: 10.5pt; }
  .pv-print-cover { break-after: page; display: flex; flex-direction: column; justify-content: center; min-height: 80vh; text-align: center; }
  .pv-print-cover h1 { font-size: 24pt; letter-spacing: 0.2em; }
  .pv-print-chapter { break-before: page; }
  .pv-print p { margin: 0; }
  .pv-print .pv-blank { visibility: hidden; }
  .pv-print .pv-title { font-size: 14pt; font-weight: 600; }
  .pv-print-tate .pv-print-chapter { writing-mode: vertical-rl; line-height: 1.9; height: 100vh; }
  .pv-print-tate .pv-title { margin: 0 0 0 2em; }
  .pv-print-yoko { line-height: 1.9; }
  .pv-print-yoko .pv-title { margin: 0 0 1.5em; }
  .pv-print .tcy { text-combine-upright: all; }
  .pv-print .boten { font-style: normal; text-emphasis: filled sesame; }
  @page { margin: 18mm 16mm; }
}

/* ───── 設定資料 ───── */
.lore-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100%; }
.lore-side { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--line); }
.lore-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 12px; border-bottom: 1px solid var(--line); }
.lore-tab {
  display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 8px; border: 0; background: none; cursor: pointer;
  font-size: 13px; color: var(--ink-2); text-align: left; min-width: 0;
}
.lore-tab span:not(.count) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lore-tab:hover { background: var(--surface-2); }
.lore-tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.lore-tab .count, .plot-col-head .count { font-size: 11px; color: var(--muted); font-weight: 400; }
.lore-list-pane { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.entry-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.entry-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.entry-item:hover { background: var(--surface-2); }
.entry-item.active { background: var(--accent-soft); }
.entry-item-text { display: flex; flex-direction: column; min-width: 0; }
.entry-item-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty-li { padding: 10px; }
.lore-detail { overflow-y: auto; padding: 24px 28px 60px; min-width: 0; }
.lore-back-row { display: none; }
.entry-form { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.entry-head { display: flex; align-items: center; gap: 10px; }
.entry-name-input { font-family: var(--font-serif); font-size: 22px; font-weight: 600; padding: 6px 10px; }
.pane-title { font-family: var(--font-serif); font-size: 22px; }
.form-section { font-size: 13.5px; color: var(--ink-2); padding-top: 10px; border-top: 1px solid var(--line); margin-top: 6px; display: flex; align-items: center; gap: 8px; }
.check-note { font-size: 11px; font-weight: 400; padding: 0 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.table-like { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.table-like > div { width: 100%; }
.rel-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.8fr) minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 6px; align-items: center; }
.ng-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 0.9fr) minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.kv-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto; gap: 6px; align-items: center; }
.tl-head { font-size: 11.5px; color: var(--muted); }
.timeline { display: flex; flex-direction: column; gap: 0; position: relative; padding-left: 18px; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: var(--line-strong); }
.tl-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 8px 0; position: relative; }
.tl-dot { position: absolute; left: -17px; top: 18px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--bg); }
.tl-fields { display: flex; flex-direction: column; gap: 6px; }
.tl-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 6px; }
.tl-actions { display: flex; flex-direction: column; }
.mention-bars { display: flex; flex-direction: column; gap: 4px; }
.mention-row { display: grid; grid-template-columns: 4.5em 1fr 3em; align-items: center; gap: 8px; border: 0; background: none; padding: 2px 4px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
.mention-row:hover { background: var(--surface-2); }
.mention-bar { height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
.mention-bar span { display: block; height: 100%; background: var(--accent); }
.mention-n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.hit-list { display: flex; flex-direction: column; gap: 2px; }
.hit-row { display: flex; gap: 10px; align-items: baseline; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-family: var(--font-serif); }
.hit-row:hover { background: var(--surface-2); }
.hit-row mark { background: var(--mark-find); color: inherit; }
.linked-entry { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

/* ───── 相関図 ───── */
.lore-detail.full { padding: 0; overflow: hidden; display: flex; }
.relmap { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
.relmap-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.relmap-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 280px; }
.relmap-stage { position: relative; min-width: 0; min-height: 0; background: var(--paper); background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px; }
.relmap-svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
.relmap-svg.connecting { cursor: crosshair; }
.relmap-node { cursor: pointer; }
.relmap-node .node-shape { stroke: var(--paper); stroke-width: 3px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.18)); }
.relmap-node.selected .node-shape { stroke: var(--accent); stroke-width: 4px; }
.relmap-node.dead .node-shape { opacity: 0.55; }
.node-initial { fill: #fff; font-size: 22px; font-weight: 700; pointer-events: none; }
.node-name { fill: var(--ink); font-size: 14px; font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; pointer-events: none; }
.node-sub { fill: var(--muted); font-size: 11px; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; pointer-events: none; }
.relmap-edge { pointer-events: none; }
.relmap-edge-hit { fill: none; stroke: transparent; stroke-width: 14px; cursor: pointer; }
.relmap-label { cursor: pointer; }
.rl-note { font-size: 12px; font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; }
.rl-calls { fill: var(--ink-2); font-size: 11px; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; }
.relmap-ghost { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; }
.relmap-empty { fill: var(--muted); font-size: 14px; }
.relmap-legend { position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: calc(100% - 20px); padding: 6px 10px; background: color-mix(in srgb, var(--surface) 92%, transparent); border-radius: 8px; box-shadow: var(--shadow); font-size: 11.5px; color: var(--ink-2); }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.legend-line { display: inline-block; width: 22px; border-top: 2.5px solid; flex: none; }
.relmap-side { border-left: 1px solid var(--line); background: var(--surface); padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.color-dot.big { width: 16px; height: 16px; }
.rel-list { display: flex; flex-direction: column; gap: 2px; }
.rel-item { display: flex; align-items: center; gap: 8px; text-align: left; border: 0; background: none; padding: 6px; border-radius: 6px; cursor: pointer; }
.rel-item:hover { background: var(--surface-2); }

/* ───── アイデア ───── */
.ideas { max-width: 1120px; margin: 0 auto; padding: 24px 24px 60px; display: flex; flex-direction: column; gap: 16px; }
.quick-add { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.quick-input { font-family: var(--font-serif); font-size: 15px; border: 0; padding: 6px 4px; box-shadow: none !important; }
.quick-add .row select { width: auto; }
.quick-add .row input { flex: 1; min-width: 140px; }
.idea-filters { display: flex; flex-direction: column; gap: 10px; }
.idea-filters > .input { max-width: 360px; }
.idea-grid { columns: 260px; column-gap: 14px; }
.idea-card {
  break-inside: avoid; margin-bottom: 14px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid transparent;
  border-radius: 10px; padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow);
}
.idea-card.pinned { border-color: var(--line-strong); }
.idea-head { display: flex; align-items: center; gap: 6px; }
.idea-date { margin-left: auto; }
.kind-badge { font-size: 11px; padding: 1px 7px; border-radius: 5px; background: var(--surface-3); color: var(--ink-2); }
.idea-body { font-family: var(--font-serif); font-size: 14px; line-height: 1.75; overflow-wrap: anywhere; }
.idea-body strong { font-weight: 600; display: block; }
.idea-body p { white-space: pre-wrap; color: var(--ink-2); margin-top: 4px; }
.idea-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 11.5px; color: var(--accent); }

.reading-inputs { display: flex; flex-direction: column; gap: 6px; padding: 4px 4px 8px; border-bottom: 1px dashed var(--line); }
.reading-inputs .input { max-width: 220px; }
.reading-big { font-family: var(--font-serif); font-size: 22px; line-height: 2; }
.reading-big rt { font-size: 0.45em; color: var(--accent); }
.reading-list { display: flex; flex-direction: column; gap: 2px; margin: 6px 0; }
.reading-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-family: var(--font-serif); font-size: 15px; line-height: 2; text-align: left; }
.reading-row:hover { background: var(--surface-2); }
.reading-row rt { font-size: 0.5em; color: var(--accent); }

/* ───── プロット ───── */
.plot { height: 100%; display: flex; flex-direction: column; padding: 14px 16px 0; gap: 10px; }
.plot-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.plot-board { display: flex; gap: 14px; overflow-x: auto; flex: 1; min-height: 0; align-items: flex-start; padding-bottom: 16px; }
.plot-col {
  flex: 0 0 272px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column;
  max-height: 100%; min-height: 0;
}
.plot-col-head { display: flex; align-items: center; gap: 6px; padding: 10px 8px 6px 14px; }
.plot-col-head h3 { font-family: var(--font-serif); font-size: 17px; }
.plot-col-head .count { flex: 1; }
.plot-cards { overflow-y: auto; padding: 4px 8px 8px; min-height: 56px; display: flex; flex-direction: column; gap: 8px; border-radius: 8px; }
.plot-cards.drop-target { background: var(--accent-soft); }
.plot-card {
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line-strong); border-radius: 8px; padding: 9px 11px;
  cursor: grab; display: flex; flex-direction: column; gap: 4px; box-shadow: var(--shadow);
}
.plot-card.dragging { opacity: 0.4; }
.plot-card strong { font-family: var(--font-serif); font-size: 14px; }
.plot-card p { font-size: 12.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
.chapter-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--accent); }
.plot-add { margin: 0 8px 10px; justify-content: flex-start; }

/* ───── 地図 ───── */
.view-map { display: flex; flex-direction: column; }
.map-topbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.map-select { width: auto; max-width: 240px; }
.map-layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 70px minmax(0, 1fr) 0; position: relative; }
.map-layout.sheet-open { grid-template-columns: 70px minmax(0, 1fr) 316px; }
.map-layout:not(.sheet-open) .map-inspector { display: none; }
.map-tools { display: flex; flex-direction: column; gap: 2px; padding: 6px; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); }
.map-tool {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 8px; border: 0; background: none;
  cursor: pointer; font-size: 11px; color: var(--ink-2); white-space: nowrap;
}
.map-tool:hover { background: var(--surface-2); color: var(--ink); }
.map-tool.active { background: var(--accent); color: var(--accent-ink); }
.map-stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--map-bg); }
.map-canvas { display: block; touch-action: none; cursor: crosshair; }
.map-canvas:focus { outline: none; }
.map-canvas[data-tool="select"] { cursor: default; }
.map-canvas[data-tool="pan"] { cursor: grab; }
.map-canvas[data-tool="stamp"] { cursor: copy; }
.map-canvas.panning { cursor: grabbing; }
.map-hint {
  position: absolute; left: 12px; bottom: 12px; max-width: min(560px, calc(100% - 24px)); padding: 6px 10px; border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 90%, transparent); color: var(--ink-2); font-size: 12px; pointer-events: none; box-shadow: var(--shadow);
}
.map-hint:empty { display: none; }
.map-draftbar {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 6px 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); z-index: 5; max-width: calc(100% - 16px); flex-wrap: wrap;
}
.map-progress {
  position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 8px; background: var(--surface); box-shadow: var(--shadow);
  font-size: 12px; color: var(--ink-2); pointer-events: none;
}
.map-inspector { overflow-y: auto; background: var(--surface); border-left: 1px solid var(--line); padding: 0 0 24px; min-width: 0; }
.sheet-handle { display: none; }
.insp-section { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.insp-section h3 { font-size: 13px; color: var(--ink-2); }
.range-out { min-width: 3.2em; text-align: right; }
.swatch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.swatch-btn {
  display: flex; align-items: center; gap: 6px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface);
  cursor: pointer; font-size: 12px; text-align: left; min-width: 0;
}
.swatch-btn:hover { border-color: var(--line-strong); }
.swatch-btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.swatch-btn .swatch { width: 16px; height: 16px; cursor: inherit; flex: none; }
.asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 4px; }
.asset-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px 5px; border: 1px solid var(--line); border-radius: 8px;
  background: #f6efdc; cursor: pointer; font-size: 10.5px; color: #4a3f33; min-width: 0;
}
.asset-btn span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.asset-btn:hover { border-color: var(--line-strong); }
.asset-btn.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.asset-thumb { display: block; flex: none; }
.line-sample { width: 22px; height: 0; flex: none; border-top: 2px solid; }
.ls-river { border-color: #4c7aa3; border-top-width: 3px; }
.ls-stream { border-color: #4c7aa3; border-top-width: 1.5px; }
.ls-highway { border-color: #8b5a3c; border-top-width: 4px; }
.ls-road { border-color: #8b5a3c; }
.ls-trail { border-color: #8b5a3c; border-top-style: dashed; }
.ls-rail { border-color: #2b2b2b; border-top-width: 3px; border-top-style: dashed; }
.ls-border { border-color: #8c3b5e; border-top-style: dotted; border-top-width: 3px; }
.ls-wall { border-color: #8f8676; border-top-width: 4px; }
.ls-route { border-color: #6a5a4a; border-top-style: dashed; border-top-width: 1px; }
.check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; }
.marker-list { display: flex; flex-direction: column; gap: 2px; max-height: 220px; overflow-y: auto; }
.marker-row { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; text-align: left; border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.marker-row:hover { background: var(--surface-2); }
.hint-list { margin: 6px 0 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.hint-details summary { cursor: pointer; color: var(--ink-2); }
.map-empty { height: 100%; display: grid; place-items: center; overflow: auto; }
.gen-dialog { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.gen-preview-wrap { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.gen-preview { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: var(--map-bg); }
.popover {
  position: fixed; z-index: 200; min-width: 220px; max-width: calc(100vw - 16px); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow-lg); padding: 10px;
}
.layers-pane { display: flex; flex-direction: column; gap: 2px; }
.layer-row { display: grid; grid-template-columns: 1fr 32px 32px; align-items: center; gap: 2px; padding: 2px 0 2px 4px; font-size: 13.5px; }
.layer-row.off span:first-child { color: var(--muted); text-decoration: line-through; }

/* ───── 設定画面 ───── */
.settings { display: flex; flex-direction: column; gap: 14px; }
.settings .tabs { border-bottom: 1px solid var(--line); }
.settings-pane { min-height: 280px; }
.rule-list { display: flex; flex-direction: column; gap: 2px; }
.rule-row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.rule-row:hover { background: var(--surface-2); }
.rule-row input { margin-top: 4px; accent-color: var(--accent); }
.rule-text { display: flex; flex-direction: column; }
.rule-text strong { font-weight: 600; font-size: 13.5px; }

.only-mobile { display: none !important; }

/* ───── 狭い画面 ───── */
@media (max-width: 1100px) {
  .write-layout { --pn: 320px; --ch: 210px; }
  .lore-layout { grid-template-columns: 250px minmax(0, 1fr); }
}
@media (max-width: 899px) {
  .only-mobile { display: inline-flex !important; }
  .write-layout { grid-template-columns: minmax(0, 1fr); }
  .write-layout .chapters, .write-layout .side-panel {
    position: absolute; z-index: 20; top: 0; bottom: 0; box-shadow: var(--shadow-lg);
  }
  .write-layout .chapters { left: 0; width: min(300px, 86vw); }
  .write-layout .side-panel { right: 0; width: min(420px, 100vw); }
  .write-layout:not(.hide-chapters) .drawer-scrim, .write-layout:not(.hide-panel) .drawer-scrim {
    display: block; position: absolute; inset: 0; z-index: 15; background: rgba(20, 16, 12, 0.35);
  }
  .editor-main { grid-column: 1; grid-row: 1; }
  .editor-scroll { padding: 10px 0 60px; }
  .editor-sheet { border-radius: 0; border-left: 0; border-right: 0; }
  .editor-backdrop, .editor-input { padding: 24px 18px 40px; }
  .toolbar-group { border-left: 0; padding-left: 0; }
  .editor-toolbar { gap: 2px; }
  /* 設定資料：一覧 → 詳細の切り替え（画面全体を1つのスクロールに） */
  .view-lore { overflow-y: auto; overflow-x: hidden; }
  .lore-layout { display: block; height: auto; }
  .lore-side { display: contents; }
  .lore-tabs {
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 12px; position: sticky; top: 0; z-index: 6;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .lore-tabs::-webkit-scrollbar { display: none; }
  .lore-tab { flex: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
  .lore-tab span:not(.count) { flex: none; overflow: visible; }
  .lore-tab.active { border-color: transparent; }
  .lore-list-pane { overflow: visible; padding: 12px 16px 40px; }
  .entry-item { padding: 12px 10px; }
  .lore-layout.has-selection .lore-list-pane { display: none; }
  .lore-layout:not(.has-selection):not(.no-list) .lore-detail { display: none; }
  .lore-detail { overflow: visible; padding: 10px 16px 60px; }
  .lore-detail.full { display: block; overflow: visible; padding: 0; }
  .lore-detail.full .relmap-body { height: 72vh; }
  .lore-back-row { display: block; max-width: 860px; margin: 0 auto 6px; }
  .map-layout, .map-layout.sheet-open { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .map-tools { grid-row: 2; flex-direction: row; overflow-x: auto; border-right: 0; border-top: 1px solid var(--line); padding: 4px; }
  .map-tool { flex: 0 0 54px; }
  .map-stage { grid-row: 1; grid-column: 1; }
  .map-inspector {
    position: absolute; z-index: 20; right: 0; left: 0; bottom: 62px; max-height: 46%; border-left: 0; border-top: 1px solid var(--line);
    box-shadow: var(--shadow-lg); border-radius: 14px 14px 0 0;
  }
  .sheet-handle { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 0 14px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .map-topbar .map-select { max-width: 150px; }
  .gen-dialog { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 759px) {
  .pv-bar { gap: 6px; padding: 6px 8px; }
  .pv-page { padding: 24px 14px; }
  .pv-tools { width: 100%; }
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  #sidebar {
    grid-row: 2; flex-direction: row; justify-content: space-around; padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
    border-right: 0; border-top: 1px solid var(--line); overflow-x: auto; overflow-y: hidden;
  }
  .brand, .nav-spacer { display: none; }
  .nav-item { flex: 1 0 52px; padding: 5px 2px; font-size: 10.5px; }
  #main { grid-row: 1; }
  #topbar { padding: 0 8px 0 12px; gap: 6px; }
  .view-title { display: none; }
  .home { padding: 16px 16px 40px; }
  .home-hero { padding: 20px; }
  .home-hero h1 { font-size: 28px; }
  .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); }
  .span-2 { grid-column: auto; }
  .rel-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
  .rel-row > :nth-child(3) { grid-column: 1 / 2; grid-row: 2; }
  .rel-row > :nth-child(4) { grid-column: 2 / 3; grid-row: 2; }
  .rel-row > :last-child { grid-column: 3; grid-row: 1; }
  .ng-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; }
  .ng-row > :nth-child(3) { grid-column: 1 / 2; grid-row: 2; }
  .ng-row > :nth-child(4) { grid-column: 2 / 3; grid-row: 2; }
  .ng-row > :last-child { grid-column: 3; grid-row: 1; }
  .lore-detail.full .relmap-body { display: flex; flex-direction: column; height: auto; }
  .relmap-stage { display: flex; flex-direction: column; height: 68vh; min-height: 340px; flex: none; }
  .relmap-svg { flex: 1; min-height: 0; height: auto; }
  .relmap-legend { position: static; max-width: none; border-radius: 0; box-shadow: none; border-top: 1px solid var(--line); font-size: 11px; padding: 6px 12px; }
  .relmap-side { border-left: 0; border-top: 1px solid var(--line); }
  .tl-head { display: none !important; }
  .tl-row { grid-template-columns: minmax(0, 1fr); }
  .tl-actions { flex-direction: column; }
  .ideas { padding: 16px 16px 40px; }
  .findbar .input { width: 100%; flex: 1 1 140px; }
  .modal-overlay { padding: 8px; align-items: flex-end; }
  .modal { max-height: calc(100dvh - 16px); }
  .editor-status { gap: 10px; }
}

/* ───── 投稿サイト用の書き出し ───── */
.publish { display: flex; flex-direction: column; gap: 10px; }
.publish .chips .chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.publish-opts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.publish-out { font-family: var(--font-sans); font-size: 13px; line-height: 1.7; min-height: 220px; resize: vertical; white-space: pre-wrap; }
.publish-info { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.publish-info .warn { color: var(--danger); }
@media (max-width: 759px) { .publish-opts { grid-template-columns: minmax(0, 1fr); } }

/* ───── 読み上げ ───── */
.editor-backdrop mark.mk-speak { background: color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 3px; text-decoration: none; }
.speak-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--surface); }
.speak-bar[hidden] { display: none; }
.speak-state { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.speak-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: speakPulse 1.2s ease-in-out infinite; }
.speak-dot.paused { animation: none; opacity: 0.4; }
@keyframes speakPulse { 50% { opacity: 0.35; transform: scale(0.8); } }
@media (prefers-reduced-motion: reduce) { .speak-dot { animation: none; } }
.speak-opt { display: inline-flex; align-items: center; gap: 6px; }
.speak-opt .input { width: auto; padding-top: 3px; padding-bottom: 3px; }

/* ───── 伏線 ───── */
.fs-line { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.fs-badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--warn, #c98a1b) 18%, transparent); color: var(--ink); }
.fs-badge.done { background: color-mix(in srgb, #4c8a4c 20%, transparent); }
.fs-item { display: flex; flex-direction: column; gap: 2px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.fs-item:last-child { border-bottom: 0; }
.fs-done { text-decoration: line-through; color: var(--muted); }

/* ───── バックアップのお知らせ ───── */
.backup-notice { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; padding: 12px 16px; margin: 4px 0 8px; border-radius: 10px;
  background: color-mix(in srgb, #d9a441 16%, var(--surface)); border: 1px solid color-mix(in srgb, #d9a441 45%, transparent); font-size: 13.5px; }
.backup-notice > span { flex: 1 1 280px; }

/* ───── 別のタブでの更新 ───── */
.save-state[data-state="conflict"] { color: var(--danger); font-weight: 600; }
.conflict-bar { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 120; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px;
  max-width: min(760px, calc(100vw - 24px)); padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--danger); box-shadow: var(--shadow-lg); font-size: 13.5px; }
.conflict-bar > span { flex: 1 1 260px; }

/* 狭い画面：添削パネルのタブが横にはみ出すことを示す */
@media (max-width: 759px) {
  .panel-tabs { -webkit-mask-image: linear-gradient(90deg, #000 86%, transparent); mask-image: linear-gradient(90deg, #000 86%, transparent); padding-right: 24px; }
}

</style>

<body>
<div id="app">
  <nav id="sidebar" aria-label="メインメニュー"></nav>
  <div id="main">
    <header id="topbar">
      <div id="project-title" class="project-title"></div>
      <div id="view-title" class="view-title"></div>
      <div id="top-actions" class="top-actions"></div>
    </header>
    <main id="view" class="view"></main>

<script>
// js/textstats.js
/*
 * 綴り — 文章解析ユーティリティ
 * 文・段落・会話文の分割、ルビ記法の処理、文字数などの統計。
 * ブラウザでも Node でも動く純粋関数のみ。
 */
(function (NS) {
  'use strict';

  // ルビ記法などを「位置を保ったまま」無視するための埋め字（私用領域の文字）
  const FILLER = '';

  const QUOTE_OPEN = '「『（(【〈〔［“';
  const PAIRS = {
    '「': '」', '『': '』', '（': '）', '(': ')', '【': '】',
    '〈': '〉', '〔': '〕', '［': '］', '“': '”', '《': '》',
  };
  const CLOSERS = {};
  Object.keys(PAIRS).forEach((k) => { CLOSERS[PAIRS[k]] = k; });

  const KANJI = '一-鿿㐀-䶿々〆ヵヶ';
  const RE_KANJI_RUBY = new RegExp('([' + KANJI + ']+)《([^《》\\n]{1,30})》', 'g');
  const RE_PIPE_RUBY = /[|｜]([^|｜《》\n]{1,20})《([^《》\n]{1,30})》/g;
  const RE_EMPHASIS = /《《([^《》\n]*)》》/g;

  /** ルビ・傍点の記法を、文字位置を変えずに埋め字へ置き換える（本文の解析用） */
  function maskRuby(text) {
    return text
      .replace(RE_EMPHASIS, (m, inner) => FILLER + FILLER + inner + FILLER + FILLER)
      .replace(RE_PIPE_RUBY, (m, base, ruby) => FILLER + base + FILLER.repeat(ruby.length + 2))
      .replace(RE_KANJI_RUBY, (m, base, ruby) => base + FILLER.repeat(ruby.length + 2));
  }

  /** ルビ・傍点の記法を取り除いた素の本文 */
  function stripRuby(text) {
    return text
      .replace(RE_EMPHASIS, '$1')
      .replace(RE_PIPE_RUBY, '$1')
      .replace(RE_KANJI_RUBY, '$1');
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** プレビュー用：ルビ・傍点・縦中横を HTML に変換（1 段落分） */
  function rubyToHtml(text, opts) {
    const vertical = !opts || opts.vertical !== false;
    let s = escapeHtml(text);
    s = s.replace(RE_EMPHASIS, '<em class="boten">$1</em>');
    s = s.replace(RE_PIPE_RUBY, '<ruby>$1<rt>$2</rt></ruby>');
    s = s.replace(RE_KANJI_RUBY, '<ruby>$1<rt>$2</rt></ruby>');
    if (vertical) {
      s = s.replace(/(^|[^0-9A-Za-z])([0-9]{2})(?![0-9A-Za-z])/g, '$1<span class="tcy">$2</span>');
      s = s.replace(/[!！][?？]|[?？][!！]|!!|！！|\?\?|？？/g, (m) => '<span class="tcy">' + m.replace(/！/g, '!').replace(/？/g, '?') + '</span>');
    }
    return s;
  }

  /** 段落（改行区切り） */
  function splitParagraphs(text) {
    const out = [];
    let start = 0;
    for (let i = 0; i <= text.length; i++) {
      if (i === text.length || text[i] === '\n') {
        out.push({ start, end: i, text: text.slice(start, i) });
        start = i + 1;
      }

    return out;

  function isSpace(c) {
    return c === ' ' || c === '　' || c === '\t' || c === '\r';

  /**
   * 本文を解析し、段落・文・会話文の位置を返す。
   * - sentences: 地の文/会話文の「文」単位（会話を含む地の文は 1 文として扱う）
   * - dialogues: 最上位の「」『』の範囲

  function analyze(rawText) {
    const text = maskRuby(rawText);
    const paragraphs = splitParagraphs(text);
    const sentences = [];
    const dialogues = [];
    const inDialogue = new Uint8Array(text.length);

    paragraphs.forEach((p, pIndex) => {
      const stack = [];
      let sStart = p.start;
      let dlg = null;
      const pushSentence = (end) => {
        let s = sStart;
        while (s < end && isSpace(text[s])) s++;

          const t = text.slice(s, end);
          const first = t[0];
          let kind = 'narration';
          if ((first === '「' || first === '『') && dialogues.length) {
            const d = dialogues[dialogues.length - 1];
            if (d.start === s && d.end === end) kind = 'dialogue';
          }
          sentences.push({ start: s, end, text: t, kind, para: pIndex });
        }
        sStart = end;
      };

      for (let i = p.start; i < p.end; i++) {
        const c = text[i];
        if (QUOTE_OPEN.indexOf(c) >= 0) {
          if (stack.length === 0 && (c === '「' || c === '『')) {
            dlg = { start: i, innerStart: i + 1, para: pIndex, open: c };
          }
          stack.push(c);
          continue;
        }
        if (CLOSERS[c] && QUOTE_OPEN.indexOf(CLOSERS[c]) >= 0) {
          if (stack.length && PAIRS[stack[stack.length - 1]] === c) {
            stack.pop();

              dlg.innerEnd = i;
              dlg.end = i + 1;
              dlg.closed = true;
              dialogues.push(dlg);
              dlg = null;
              // 会話の直後が次の会話 or 段落末なら文の区切り
              let j = i + 1;
              while (j < p.end && isSpace(text[j])) j++;
              if (j >= p.end || text[j] === '「' || text[j] === '『') {
                pushSentence(i + 1);
              }
            }
          }
          continue;
        }
        if (stack.length === 0 && '。！？!?'.indexOf(c) >= 0) {
          let j = i + 1;
          while (j < p.end && '。！？!?'.indexOf(text[j]) >= 0) j++;
          pushSentence(j);
          i = j - 1;
        }
      }
      if (dlg) {
        dlg.innerEnd = p.end;
        dlg.end = p.end;
        dlg.closed = false;
        dialogues.push(dlg);
      }

      for (let i = d.start; i < d.end; i++) inDialogue[i] = 1;

  function innerSentences(masked, d) {
    const out = [];
    const TERM = '。！？!?';
    let s = d.innerStart;
    let i = d.innerStart;
    while (i < d.innerEnd) {
      if (TERM.indexOf(masked[i]) >= 0) {
        let j = i + 1;
        while (j < d.innerEnd && TERM.indexOf(masked[j]) >= 0) j++;
        out.push({ start: s, end: j, text: masked.slice(s, j), kind: 'dialogue-inner' });
        s = j;
        i = j;
      } else {
        i++;
      }
    }
    if (s < d.innerEnd) out.push({ start: s, end: d.innerEnd, text: masked.slice(s, d.innerEnd), kind: 'dialogue-inner' });
    return out;
  }

  function visibleLength(s) {
    let n = 0;
    for (const c of s) {
      if (c === FILLER || c === '\n' || isSpace(c)) continue;
      n++;
    }
    return n;
  }

  /** 文字数・原稿用紙換算などの統計 */
  function stats(rawText) {
    const plain = stripRuby(rawText || '');
    const chars = plain.replace(/\n/g, '').length;
    const charsNoSpace = plain.replace(/[\s　]/g, '').length;
    const lines = plain.replace(/\n+$/, '').split('\n');
    let gridLines = 0;
    if (plain.trim()) {
      lines.forEach((line) => { gridLines += Math.max(1, Math.ceil(line.length / 20)); });
    }
    const pages = gridLines ? Math.ceil(gridLines / 20) : 0;
    const a = analyze(plain);
    let dialogueChars = 0;
    a.dialogues.forEach((d) => { dialogueChars += visibleLength(plain.slice(d.innerStart, d.innerEnd)); });
    const kanji = (plain.match(/[一-鿿㐀-䶿々]/g) || []).length;
    const kana = (plain.match(/[ぁ-ゖァ-ヺー]/g) || []).length;
    const sentenceCount = a.sentences.length;
    const paraCount = a.paragraphs.filter((p) => p.text.trim()).length;
    return {
      chars,
      charsNoSpace,
      pages,
      gridLines,
      dialogueRatio: charsNoSpace ? dialogueChars / charsNoSpace : 0,
      kanjiRatio: kanji + kana ? kanji / (kanji + kana) : 0,
      sentences: sentenceCount,
      paragraphs: paraCount,
      avgSentence: sentenceCount ? charsNoSpace / sentenceCount : 0,
      dialogues: a.dialogues.length,
      readingMinutes: charsNoSpace / 500,
    };
  }

  const KANJI_DIGITS = { '〇': 0, '零': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };

  /** 「17」「１７」「十七」「二〇二六」などを数値に */
  function parseJaNumber(str) {
    let s = String(str).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
    if (/^\d+$/.test(s)) return parseInt(s, 10);
    if (/^[〇零一二三四五六七八九]{2,}$/.test(s)) {
      return parseInt(Array.from(s).map((c) => KANJI_DIGITS[c]).join(''), 10);
    }
    let total = 0;
    let cur = 0;
    for (const c of s) {
      if (c in KANJI_DIGITS) cur = KANJI_DIGITS[c];
      else if (c === '十') { total += (cur || 1) * 10; cur = 0; }
      else if (c === '百') { total += (cur || 1) * 100; cur = 0; }
      else if (c === '千') { total += (cur || 1) * 1000; cur = 0; }
      else return NaN;
    }
    return total + cur;
  }

  /** 数値を漢数字に（縦書き向けの提案用） */
  function toKanjiNumber(n) {
    const digits = '〇一二三四五六七八九';
    if (!isFinite(n) || n < 0) return String(n);
    if (n === 0) return '〇';
    if (n >= 10000) return String(n).split('').map((c) => digits[+c]).join('');
    let s = '';
    [[1000, '千'], [100, '百'], [10, '十']].forEach(([u, ch]) => {
      const q = Math.floor(n / u);
      if (q) { s += (q === 1 ? '' : digits[q]) + ch; n %= u; }
    });
    if (n) s += digits[n];
    return s;
  }

  /** 二つの本文の差分位置（入力中のハイライト位置補正用） */
  function diffRange(a, b) {
    let start = 0;
    const min = Math.min(a.length, b.length);
    while (start < min && a.charCodeAt(start) === b.charCodeAt(start)) start++;
    let endA = a.length;
    let endB = b.length;
    while (endA > start && endB > start && a.charCodeAt(endA - 1) === b.charCodeAt(endB - 1)) { endA--; endB--; }
    return { start, oldEnd: endA, newEnd: endB };
  }

  /** 差分に合わせて指摘範囲をずらす（編集箇所に重なる指摘は捨てる） */
  function shiftRanges(items, diff) {
    const delta = (diff.newEnd - diff.start) - (diff.oldEnd - diff.start);
    const out = [];
    items.forEach((it) => {
      if (it.end <= diff.start) out.push(it);
      else if (it.start >= diff.oldEnd) out.push(Object.assign({}, it, { start: it.start + delta, end: it.end + delta }));

    return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    FILLER,
    PAIRS,
    maskRuby,
    stripRuby,
    rubyToHtml,
    escapeHtml,
    splitParagraphs,
    analyze,
    innerSentences,

    toKanjiNumber,

<script>
// js/readings.js
/*
 * 綴り — 特殊な読み方（ルビ）の登録簿
 * アイデア帳（種類「読み方」や、本文に 足《アルファ》 のように書いたメモ）と、
 * 設定資料の「読み」から、作者が意図した読み方を集める。添削・AI・辞書で使う。
 */
(function (NS) {
  'use strict';
  const KANJI = '一-鿿㐀-䶿々〆ヵヶ';
  const RE_PIPE = /[|｜]([^|｜《》\n]{1,20})《([^《》\n]*)》/g;
  const RE_KANJI = new RegExp('([' + KANJI + ']+)《([^《》\\n]*)》', 'g');

  /** カタカナ→ひらがな、空白除去（読みの比較用） */
  function normReading(s) {
    return String(s || '').replace(/[\s　・]/g, '').replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
  }

  function hasKanji(s) { return new RegExp('[' + KANJI + ']').test(s); }

  /** 文章中のルビ記法を位置付きで取り出す */
  function findRubies(text) {
    const out = [];
    let m;
    RE_PIPE.lastIndex = 0;
    while ((m = RE_PIPE.exec(text)) !== null) {
      const baseStart = m.index + 1;
      const readingStart = baseStart + m[1].length + 1;
      out.push({ start: m.index, end: m.index + m[0].length, base: m[1], reading: m[2], baseStart, readingStart, readingEnd: readingStart + m[2].length, pipe: true });
    }
    RE_KANJI.lastIndex = 0;
    while ((m = RE_KANJI.exec(text)) !== null) {
      const prevEnd = out.find((r) => r.pipe && m.index >= r.start && m.index < r.end);
      if (prevEnd) continue;
      const readingStart = m.index + m[1].length + 1;
      out.push({ start: m.index, end: m.index + m[0].length, base: m[1], reading: m[2], baseStart: m.index, readingStart, readingEnd: readingStart + m[2].length, pipe: false });
    }
    return out.sort((a, b) => a.start - b.start);
  }

  /** メモの一行から「表記・読み」の組を読み取る（足＝アルファ、足 → アルファ、足（アルファ） など） */
  function parseLine(line) {
    const t = line.trim();
    if (!t) return null;
    let m = t.match(/^([^＝=→:：（(／/\s]+)\s*(?:＝|=|→|:|：|／|\/)\s*([^\s（(]+)/);
    if (m) return { base: m[1].replace(/^[|｜]/, ''), reading: m[2] };
    m = t.match(/^([^（(\s]+)\s*[（(]([^）)]+)[）)]/);
    if (m) return { base: m[1].replace(/^[|｜]/, ''), reading: m[2] };
    return null;
  }

  /** 作品から登録された読み方を集める */
  function collect(project) {
    const list = [];
    const seen = new Set();
    const add = (base, reading, source, id, note) => {
      base = String(base || '').trim();
      reading = String(reading || '').trim();
      if (!base || !reading) return;
      const k = base + '\u0000' + normReading(reading);
      if (seen.has(k)) return;
      seen.add(k);
      list.push({ base, reading, source, id, note: note || '' });
    };
    ((project && project.ideas) || []).forEach((it) => {
      if (it.word && it.reading) add(it.word, it.reading, 'idea', it.id, it.body);
      findRubies(it.body || '').forEach((r) => add(r.base, r.reading, 'idea', it.id));
      if (it.kind === '読み方') (it.body || '').split('\n').forEach((line) => { const p = parseLine(line); if (p) add(p.base, p.reading, 'idea', it.id); });
    });
    ((project && project.entries) || []).forEach((e) => {
      if (!e.reading) return;
      const name = String(e.name || '').replace(/[\s　]/g, '');
      if (hasKanji(name)) add(name, e.reading.replace(/[\s　]/g, ''), 'lore', e.id);
      // 姓・名に分けて読みも分けて書いてある場合（山田 太郎 / やまだ たろう）
      const parts = String(e.name || '').trim().split(/[\s　]+/);
      const rp = String(e.reading || '').trim().split(/[\s　]+/);
      if (parts.length > 1 && parts.length === rp.length) parts.forEach((p, i) => { if (hasKanji(p)) add(p, rp[i], 'lore', e.id); });
    });
    return list;
  }

  /** 表記 → 読みの集合 */
  function index(list) {
    const map = new Map();
    (list || []).forEach((r) => {
      if (!map.has(r.base)) map.set(r.base, { readings: new Set(), items: [] });
      const v = map.get(r.base);
      v.readings.add(normReading(r.reading));
      v.items.push(r);
    });
    return map;
  }

  /** 普段とは違う読み（当て字）らしいか */
  function looksSpecial(base, reading) {
    if (!hasKanji(base)) return false;
    if (/[ァ-ヺ]/.test(reading)) return true; // カタカナの読み
    if (/[A-Za-zＡ-Ｚａ-ｚ]/.test(reading)) return true;
    const kanjiCount = (base.match(new RegExp('[' + KANJI + ']', 'g')) || []).length;
    return normReading(reading).length > kanjiCount * 4 + 1;
  }

  NS.Readings = { collect, index, findRubies, normReading, looksSpecial, parseLine, hasKanji };
})(typeof globalThis !== 'undefined' ? (globalThis.Tsuzuri = globalThis.Tsuzuri || {}) : (window.Tsuzuri = window.Tsuzuri || {}));

</script>
