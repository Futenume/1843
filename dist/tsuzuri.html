      h('div', { class: 'stack-sm' },
        UI.field('この話の語り手（地の文の視点）', sel),
        h('p', { class: 'small muted' }, note + '。作品全体の設定は「設定資料 → 世界観ルール」で変えられます。')));
    box.addEventListener('toggle', () => { S.narrOpen = box.open; });
    return box;
  }

  function panelCons() {
    const p = P();
    const items = S.issues.filter((i) => i.source === 'consistency');
    const wrap = h('div', { class: 'stack-sm' });
    if (!p.entries.length && !p.rules.ng.length && !(NS.WorldRules && NS.WorldRules.active(p.rules))) {
      wrap.appendChild(h('div', { class: 'empty' },
        h('p', null, '設定資料に人物・場所・用語を登録すると、名前の表記ゆれ、一人称や呼び方、髪や瞳の色、年齢、退場後の登場などの食い違いをチェックします。世界観ルールに通貨・単位・暦・文明の水準を決めると、この世界にない言葉も見つけます。'),
        btn('設定資料を開く', { icon: 'users', onClick: () => App().navigate('lore') })));
    }
    wrap.appendChild(narratorRow());
    // 世界観ルール・NGワードの言い換えを、まとめて
    const worldFix = items.filter((i) => (i.ruleId === 'world' || i.ruleId === 'ng-word') && i.suggestion != null && i.suggestion !== '');
    if (worldFix.length >= 2) wrap.appendChild(btn(`この世界の言い方にまとめて直す（${worldFix.length}件）`, { small: true, icon: 'check', onClick: () => bulkWorldFix(worldFix) }));
    wrap.appendChild(issueList(items, '設定との食い違いは見つかりませんでした。'));

    // 話者推定
    const sp = (S.cons && S.cons.speakers) || [];
    const dCount = T.analyze(S.textarea.value).dialogues.length;
    if (dCount) {
      const counts = {};
      sp.forEach((s) => { counts[s.name] = (counts[s.name] || 0) + 1; });
      wrap.appendChild(h('details', { class: 'sub-section', open: true },
        h('summary', null, `台詞の話者（推定） ${sp.length}/${dCount}`),
        h('p', { class: 'small muted' }, '「」の直前・直後の「〇〇は」「〇〇が」や「〇〇「…」」の形、台詞だけの行なら次の行の「〇〇は言った」や前の行の主語から推定しています。一人称・呼び方のチェックはこの推定に基づきます（前の行の主語からの推定は確度が低いため「参考」として出します）。'),
        h('div', { class: 'chips' }, Object.keys(counts).map((n) => h('span', { class: 'chip static' }, `${n} ${counts[n]}`)),
          dCount - sp.length > 0 ? h('span', { class: 'chip static muted' }, `不明 ${dCount - sp.length}`) : null),
        h('div', { class: 'speaker-list' }, sp.slice(0, 60).map((s) => h('button', {
          type: 'button', class: 'speaker-row', onclick: () => focusRange(s.start, s.end),
        }, h('span', { class: 'speaker-name' }, s.name), h('span', { class: 'speaker-line' }, trunc(S.textarea.value.slice(s.start, s.end), 30)))))));
    }

    // 未登録の固有名詞
    const cands = (S.cons && S.cons.candidates) || [];
    if (cands.length) {
      wrap.appendChild(h('details', { class: 'sub-section', open: true },
        h('summary', null, `設定資料に未登録の固有名詞（候補） ${cands.length}`),
        h('p', { class: 'small muted' }, 'クリックすると設定資料に登録できます。'),
        h('div', { class: 'chips' }, cands.map((c) => {
          const b = h('button', { type: 'button', class: 'chip' }, `${c.word} ${c.count}`);
          b.addEventListener('click', () => UI.menu(b, [
            { label: '人物として登録', icon: 'users', onClick: () => registerEntry(c.word, 'character') },
            { label: '場所として登録', icon: 'map', onClick: () => registerEntry(c.word, 'place') },
            { label: '用語・アイテムとして登録', icon: 'tag', onClick: () => registerEntry(c.word, 'term') },
            { label: '組織として登録', icon: 'flag', onClick: () => registerEntry(c.word, 'org') },
            null,
            { label: '本文で探す', icon: 'search', onClick: () => { S.find.q = c.word; openFind(); } },
          ]));
          return b;
        }))));
    }
    return wrap;
  }

  function registerEntry(name, type) {
    const p = P();
    const e = NS.Lore.newEntry(type, name);
    p.entries.push(e);
    App().touch();
    toast(`「${name}」を${NS.Lore.TYPE_LABEL[type]}として登録しました`);
    runAnalysis(true);
  }

  function panelAI() {
    if (!NS.AIPanel) return h('p', null, 'AI機能を読み込めませんでした');
    const chId = S.ch.id;
    return NS.AIPanel.render({
      getText: () => S.textarea.value,
      getSelection: V.getSelection,
      chapter: S.ch,
      project: P(),
      chapterNo: P().chapters.findIndex((c) => c.id === S.ch.id) + 1,
      addIssues: (items) => V.addAiIssues(items, chId),
      clearIssues: () => V.clearAiIssues(chId),
      focusRange,
      apply: (it) => applyIssue(it),
      aiIssues: () => (S.aiIssues || []),
      rerender: () => { if (S && S.panelTab === 'ai') renderPanel(); },
    });
  }

  /** 辞書タブ（選んでいる語をそのまま調べる） */
  function panelDict() {
    const q = S.dictQuery || '';
    S.dictQuery = '';
    return NS.Dict.render({
      query: q,
      compact: true,
      onInsert: (text) => {
        const ta = S.textarea;
        replaceRange(ta.selectionStart, ta.selectionEnd, text);
        toast(`「${text}」を入れました`);
      },
      onJump: (chapterId, start, end) => {
        if (chapterId === S.ch.id) { focusRange(start, end); return; }
        switchChapter(chapterId);
        setTimeout(() => V.focusRange(start, end), 80);
      },
    });
  }

  function selectedWord() {
    const sel = V.getSelection();
    if (!sel) return '';
    const t = sel.text.trim();
    return t.length <= 30 && t.indexOf('\n') < 0 ? t : '';
  }

  function openDict() {
    S.dictQuery = selectedWord();
    S.panelTab = 'dict';
    PREF.panelTab = 'dict';
    savePref();
    if (S.hidePanel) togglePanel();
    renderPanel();
  }
  V.openDict = function () { if (S) openDict(); };

  function panelRef() {
    const p = P();
    const memo = h('textarea', {
      class: 'input memo', rows: 5, value: S.ch.memo, placeholder: 'この話のメモ（プロット、書きたい場面、伏線など）',
      oninput: (e) => { S.ch.memo = e.target.value; App().touch(); },
    });
    const results = h('div', { class: 'ref-list' });
    const search = h('input', { class: 'input', type: 'search', placeholder: '人物・場所・用語を検索', 'aria-label': '設定資料を検索' });
    const render = () => {
      clear(results);
      const q = search.value.trim();
      const list = p.entries.filter((e) => !q || e.name.indexOf(q) >= 0 || (e.reading || '').indexOf(q) >= 0 || e.aliases.some((a) => a.indexOf(q) >= 0));
      if (!list.length) results.appendChild(h('p', { class: 'muted small' }, p.entries.length ? '見つかりません' : '設定資料はまだありません'));
      list.slice(0, 50).forEach((e) => {
        results.appendChild(h('details', { class: 'ref-item' },
          h('summary', null,
            h('span', { class: 'type-badge t-' + e.type }, NS.Lore.TYPE_LABEL[e.type]),
            h('strong', null, e.name), e.reading ? h('span', { class: 'muted small' }, ' ' + e.reading) : null),
          h('div', { class: 'ref-body' },
            NS.Lore.summaryList(e, p),
            h('div', { class: 'row' },
              btn('本文に挿入', { small: true, onClick: () => insertText(e.name.replace(/[\s　]/g, '')) }),
              btn('開く', { small: true, ghost: true, onClick: () => App().navigate('lore', { id: e.id }) })))));
      });
    };
    search.addEventListener('input', render);
    render();
    const readings = NS.Readings ? NS.Readings.collect(p) : [];
    const readingBox = h('details', { class: 'sub-section' },
      h('summary', null, `登録した読み方（ルビ） ${readings.length}`),
      h('p', { class: 'small muted' }, 'アイデア帳に種類「読み方」で書いたもの、メモ中の 足《アルファ》 のような記法、設定資料の「読み」から集めています。ここにある読みのルビは添削で指摘しません。'),
      readings.length ? h('div', { class: 'reading-list' }, readings.map((r) => h('button', {
        type: 'button', class: 'reading-row', title: '本文に挿入', onclick: () => insertText('|' + r.base + '《' + r.reading + '》'),
      }, h('span', { html: T.rubyToHtml('|' + r.base + '《' + r.reading + '》', { vertical: false }) }), h('span', { class: 'muted small' }, r.source === 'lore' ? '設定資料' : 'アイデア帳')))) : null,
      btn('アイデア帳を開く', { small: true, ghost: true, icon: 'bulb', onClick: () => App().navigate('ideas') }));
    // 伏線（アイデア帳の種類「伏線」）
    const fs = p.ideas.filter((i) => i.kind === '伏線');
    const here = fs.filter((i) => i.plantedIn === S.ch.id || i.payoffIn === S.ch.id);
    const open = fs.filter((i) => !i.resolved);
    const chNo = (id) => { const k = p.chapters.findIndex((c) => c.id === id); return k < 0 ? '' : `第${k + 1}話`; };
    const fsRow = (i) => h('div', { class: 'fs-item' },
      h('label', { class: 'check small', title: '回収済みにする' }, h('input', {
        type: 'checkbox', checked: !!i.resolved, onchange: (e) => { i.resolved = e.target.checked; i.updatedAt = Date.now(); App().touch(); renderPanel(); },
      }), h('span', { class: i.resolved ? 'fs-done' : '' }, (i.body || '').split('\n')[0] || '（無題）')),
      h('span', { class: 'muted small' }, [i.plantedIn ? '張：' + chNo(i.plantedIn) : '', i.payoffIn ? '回収：' + chNo(i.payoffIn) : ''].filter(Boolean).join('　')));
    const fsBox = h('details', { class: 'sub-section', open: here.length > 0 },
      h('summary', null, `伏線　この話 ${here.length}・未回収 ${open.length}`),
      here.length ? h('div', { class: 'stack-sm' }, h('div', { class: 'small muted' }, 'この話で張る・回収する伏線'), here.map(fsRow)) : null,
      open.filter((i) => here.indexOf(i) < 0).length ? h('div', { class: 'stack-sm' }, h('div', { class: 'small muted' }, 'ほかの未回収の伏線'), open.filter((i) => here.indexOf(i) < 0).slice(0, 20).map(fsRow)) : null,
      !fs.length ? h('p', { class: 'small muted' }, 'アイデア帳で種類「伏線」としてメモし、張った話・回収する話を選ぶと、ここで確認できます。') : null,
      btn('アイデア帳を開く', { small: true, ghost: true, icon: 'bulb', onClick: () => App().navigate('ideas') }));
    return h('div', { class: 'stack-sm' }, h('h3', { class: 'panel-h' }, 'この話のメモ'), memo, fsBox, h('h3', { class: 'panel-h' }, '設定資料'), search, results, readingBox);
  }

  function panelStats() {
    const p = P();
    const st = T.stats(S.textarea.value);
    let total = 0;
    const rows = p.chapters.map((c, i) => {
      const n = countOf(c, c.id === S.ch.id ? S.textarea.value : c.body);
      total += n;
      return { i, c, n };
    });
    const pct = (v) => Math.round(v * 100) + '%';
    const goalTotal = p.goal.total || 0;
    const days = Object.keys(p.log).sort().slice(-14);
    const maxDay = Math.max(1, ...days.map((d) => Math.max(0, p.log[d].last - p.log[d].start)));
    const goalInput = (key, label) => UI.field(label, h('input', {
      class: 'input input-num', type: 'number', min: 0, step: 100, value: p.goal[key],
      onchange: (e) => { p.goal[key] = Math.max(0, parseInt(e.target.value, 10) || 0); App().touch(); renderStatus(); renderPanel(); },
    }));
    return h('div', { class: 'stack-sm' },
      h('h3', { class: 'panel-h' }, 'この話'),
      h('dl', { class: 'stat-grid' },
        stat('文字数（空白除く）', UI.fmtNum(st.charsNoSpace) + '字'),
        stat('原稿用紙換算', st.pages + '枚'),
        stat('会話文の割合', pct(st.dialogueRatio)),
        stat('漢字の割合', pct(st.kanjiRatio)),
        stat('文の数', UI.fmtNum(st.sentences)),
        stat('平均の文の長さ', st.avgSentence.toFixed(1) + '字'),
        stat('段落数', UI.fmtNum(st.paragraphs)),
        stat('読了目安', Math.max(1, Math.round(st.readingMinutes)) + '分')),
      h('p', { class: 'small muted' }, '漢字の割合は3割前後が読みやすいと言われます。'),
      h('h3', { class: 'panel-h' }, '作品全体'),
      h('div', { class: 'goal' },
        h('div', { class: 'goal-row' }, h('span', null, UI.fmtNum(total) + '字'), goalTotal ? h('span', { class: 'muted small' }, '目標 ' + UI.fmtNum(goalTotal) + '字') : null),
        goalTotal ? h('div', { class: 'meter big' }, h('span', { style: { width: Math.min(100, (total / goalTotal) * 100) + '%' } })) : null),
      h('div', { class: 'grid-2' }, goalInput('daily', '1日の目標（字）'), goalInput('total', '作品の目標（字）')),
      days.length ? h('div', null,
        h('h3', { class: 'panel-h' }, '最近の執筆量'),
        h('div', { class: 'day-bars', role: 'img', 'aria-label': '日ごとの執筆文字数' }, days.map((d) => {
          const v = Math.max(0, p.log[d].last - p.log[d].start);
          return h('div', { class: 'day-bar', title: d + '：' + UI.fmtNum(v) + '字' },
            h('span', { class: 'day-bar-fill', style: { height: Math.round((v / maxDay) * 100) + '%' } }),
            h('span', { class: 'day-bar-label' }, d.slice(8)));
        }))) : null,
      h('h3', { class: 'panel-h' }, '話ごとの文字数'),
      h('table', { class: 'mini-table' }, h('tbody', null, rows.map((r) => h('tr', { class: r.c.id === S.ch.id ? 'current' : '' },
        h('td', null, r.i + 1), h('td', null, r.c.title), h('td', { class: 'num' }, UI.fmtNum(r.n)))))));
  }

  function stat(label, value) {
    return h('div', { class: 'stat' }, h('dt', null, label), h('dd', null, value));
  }

  NS.Views.write = V;
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
<script>
// js/views/lore.js
/*
 * 綴り — 設定資料（人物・場所・用語・組織・世界観ルール・年表）
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const { h, icon, btn, clear, toast } = UI;

  const TYPE_LABEL = { character: '人物', place: '場所', term: '用語', org: '組織' };
  const TYPE_ICON = { character: 'users', place: 'map', term: 'tag', org: 'flag' };
  const TABS = [
    { id: 'character', label: '人物', icon: 'users' },
    { id: 'place', label: '場所', icon: 'map' },
    { id: 'term', label: '用語・アイテム', icon: 'tag' },
    { id: 'org', label: '組織', icon: 'flag' },
    { id: 'relmap', label: '相関図', icon: 'network' },
    { id: 'rules', label: '世界観ルール', icon: 'shield' },
    { id: 'timeline', label: '年表', icon: 'clock' },
    { id: 'cast', label: '出番表', icon: 'list' },
  ];

  const SCHEMA = {
    character: [
      { section: '基本' },
      { key: 'role', label: '役割', placeholder: '主人公／ヒロイン／師匠 など' },
      { key: 'gender', label: '性別' },
      { key: 'age', label: '年齢', placeholder: '例：17（16〜17 のような幅も可）', hint: '本文の「〇歳」と照合します', check: true },
      { key: 'birthday', label: '誕生日' },
      { key: 'height', label: '身長' },
      { key: 'firstPerson', label: '一人称', placeholder: '俺 ／ 僕 など（複数は／で区切る）', hint: '台詞の一人称と照合します', check: true },
      { key: 'speech', label: '口調・口癖', type: 'textarea', placeholder: '語尾に「〜だぜ」、目上には敬語 など（AIチェックで参照します）' },
      { section: '外見' },
      { key: 'hair', label: '髪', placeholder: '例：黒のショートヘア', hint: '髪色の描写と照合します', check: true },
      { key: 'eyes', label: '瞳', placeholder: '例：琥珀色', hint: '瞳の色の描写と照合します', check: true },
      { key: 'looks', label: '外見の特徴', type: 'textarea', placeholder: '体格、服装、傷跡など' },
      { section: '内面・背景' },
      { key: 'personality', label: '性格', type: 'textarea' },
      { key: 'background', label: '経歴', type: 'textarea' },
      { key: 'goal', label: '目的・動機', type: 'textarea' },
    ],
    place: [
      { key: 'kind', label: '種類', placeholder: '国／都市／村／建物／地形 など' },
      { key: 'parent', label: '所在地・所属', type: 'entry', entryType: 'place' },
      { key: 'climate', label: '気候・地理', type: 'textarea' },
      { key: 'population', label: '人口・規模' },
      { key: 'desc', label: '説明', type: 'textarea' },
    ],
    term: [
      { key: 'kind', label: '分類', placeholder: 'アイテム／魔法／技術／用語 など' },
      { key: 'desc', label: '説明', type: 'textarea' },
      { key: 'rule', label: '制約・ルール', type: 'textarea', placeholder: '使える条件、代償、できないこと など' },
    ],
    org: [
      { key: 'kind', label: '種類', placeholder: '国家／騎士団／ギルド／学校 など' },
      { key: 'base', label: '拠点', type: 'entry', entryType: 'place' },
      { key: 'leader', label: '代表者', type: 'entry', entryType: 'character' },
      { key: 'members', label: '主な構成員', type: 'textarea' },
      { key: 'desc', label: '説明', type: 'textarea' },
    ],
  };

  function newEntry(type, name) {
    return {
      id: UI.uid('e'), type, name: name || ('新しい' + TYPE_LABEL[type]), reading: '', aliases: [], color: '',
      fields: {}, custom: [], relations: [], appear: {}, notes: '', createdAt: Date.now(), updatedAt: Date.now(),
    };
  }

  function entryName(p, id) {
    const e = p.entries.find((x) => x.id === id);
    return e ? e.name : '';
  }

  /** 資料パネル用の要約 */
  function summaryList(e, p) {
    const dl = h('dl', { class: 'kv' });
    const add = (k, v) => { if (v && String(v).trim()) dl.append(h('dt', null, k), h('dd', null, v)); };
    if (e.aliases.length) add('別名', e.aliases.join('、'));
    (SCHEMA[e.type] || []).forEach((f) => {
      if (!f.key) return;
      let v = e.fields[f.key];
      if (f.type === 'entry') v = entryName(p, v);
      add(f.label, v);
    });
    e.custom.forEach((c) => add(c.k, c.v));
    e.relations.forEach((r) => {
      const t = entryName(p, r.targetId);
      if (t) add('→' + t, [r.calls ? `「${r.calls}」と呼ぶ` : '', r.note].filter(Boolean).join('／'));
    });
    if (e.appear.from || e.appear.until) add('登場', `${e.appear.from ? '第' + e.appear.from + '話〜' : ''}${e.appear.until ? '第' + e.appear.until + '話で' + (e.appear.reason || '退場') : ''}`);
    add('メモ', e.notes);
    return dl;
  }

  // ───── 書き出し・AI 用の整形 ─────
  const LoreFormat = {
    entryLines(e, p) {
      const lines = [];
      const head = `${e.name}${e.reading ? '（' + e.reading + '）' : ''}${e.aliases.length ? ' 別名: ' + e.aliases.join('、') : ''}`;
      lines.push('- ' + head);
      (SCHEMA[e.type] || []).forEach((f) => {
        if (!f.key) return;
        let v = e.fields[f.key];
        if (f.type === 'entry') v = entryName(p, v);
        if (v && String(v).trim()) lines.push(`  - ${f.label}: ${String(v).replace(/\n/g, ' ')}`);
      });
      e.custom.forEach((c) => { if (c.k || c.v) lines.push(`  - ${c.k}: ${String(c.v || '').replace(/\n/g, ' ')}`); });
      e.relations.forEach((r) => {
        const t = entryName(p, r.targetId);
        if (t) lines.push(`  - ${t}との関係: ${[r.note, r.calls ? '呼び方「' + r.calls + '」' : ''].filter(Boolean).join('、')}`);
      });
      if (e.appear.from) lines.push(`  - 初登場: 第${e.appear.from}話`);
      if (e.appear.until) lines.push(`  - 第${e.appear.until}話で${e.appear.reason || '退場'}`);
      if (e.notes) lines.push(`  - メモ: ${e.notes.replace(/\n/g, ' ')}`);
      return lines;
    },
    /** 世界観ルール（通貨・単位・暦・文明・設定メモ）を Markdown の行に */
    worldLines(p) {
      const W = NS.WorldRules;
      const r = p.rules;
      const out = [];
      const coins = (r.currency.units || []).filter((u) => u.name && u.value > 0).sort((a, b) => b.value - a.value);
      if (coins.length || r.currency.prices.some((x) => x.item && x.price)) {
        out.push('## 通貨・物価', '');
        if (coins.length) out.push('- ' + coins.map((u, i) => (i === 0 ? `${u.name}1枚` : `${u.name}${Math.round(coins[0].value / u.value * 100) / 100}枚`)).join(' ＝ '));
        coins.filter((u) => u.reading || u.note).forEach((u) => out.push(`- ${u.name}${u.reading ? '（' + u.reading + '）' : ''}${u.note ? '：' + u.note.replace(/\n/g, ' ') : ''}`));
        if (r.currency.yen > 0 && coins.length) out.push(`- ${coins[coins.length - 1].name}1枚 ≒ ${r.currency.yen}円（読者向けの目安）`);
        r.currency.prices.filter((x) => x.item && x.price).forEach((x) => out.push(`- ${x.item}：${x.price}`));
        out.push('');
      }
      const units = (r.units.list || []).filter((u) => u.name && u.amount > 0);
      if (units.length) {
        out.push('## 単位', '');
        units.forEach((u) => out.push(`- ${W.KIND_LABEL[u.kind]}：${W.describeAmount(u)}`));
        out.push('');
      }
      const c = r.calendar;
      if (c.era || c.months.length || c.weekdays.length || c.noWeek || c.noClock || c.timeNote || c.yearNote) {
        out.push('## 暦と時刻', '');
        if (c.era) out.push(`- 年の数え方：${c.era}`);
        if (c.months.length) out.push(`- 月の名前：${c.months.join('、')}`);
        if (c.weekdays.length) out.push(`- 曜日：${c.weekdays.join('、')}`);
        if (c.noWeek) out.push('- 曜日はない');
        if (c.noClock) out.push('- 時計はない');
        if (c.timeNote) out.push(`- 時刻の言い方：${c.timeNote}`);
        if (c.yearNote) out.push(`- ${c.yearNote.replace(/\n/g, ' ')}`);
        out.push('');
      }
      const t = r.tech;
      if (t.cats.length || t.loanwords || t.extra) {
        out.push('## 文明の水準（この世界にないもの）', '');
        if (W.TECH_PRESETS[t.preset]) out.push(`- 時代の目安：${W.TECH_PRESETS[t.preset].label}`);
        W.TECH.filter((x) => t.cats.includes(x.id)).forEach((x) => out.push(`- ${x.label}はない（${x.words.slice(0, 5).map((w) => w[0]).join('・')}など）`));
        if (t.extra) out.push(`- ほかにないもの：${t.extra}`);
        if (t.loanwords) out.push('- カタカナの外来語は控える');
        if (t.allow) out.push(`- この世界にはあるもの：${t.allow}`);
        out.push('');
      }
      BIBLE.forEach(([key, label]) => {
        const v = r.bible[key];
        if (v && v.trim()) out.push(`## ${label}`, '', v.trim(), '');
      });
      return out;
    },
    toMarkdown(p) {
      const out = ['# ' + p.title + '　設定資料', ''];
      if (p.synopsis) out.push('## あらすじ', '', p.synopsis, '');
      ['character', 'place', 'term', 'org'].forEach((t) => {
        const list = p.entries.filter((e) => e.type === t);
        if (!list.length) return;
        out.push('## ' + TYPE_LABEL[t], '');
        list.forEach((e) => out.push(...LoreFormat.entryLines(e, p)));
        out.push('');
      });
      if (p.rules.world) out.push('## 世界観', '', p.rules.world, '');
      LoreFormat.worldLines(p).forEach((x) => out.push(x));
      out.push('## 語り手', '', (NS.Consistency.NARRATORS[p.rules.narrator || 'auto'] || ''), '');
      if (p.rules.ng.length) {
        out.push('## 作中で使わない言葉', '');
        p.rules.ng.forEach((r) => out.push(`- ${r.word}${r.reason ? '：' + r.reason : ''}${r.suggestion ? '（→' + r.suggestion + '）' : ''}${r.scope === 'dialogue' ? '［台詞だけ］' : r.scope === 'all' ? '［台詞も地の文も］' : ''}`));
        out.push('');
      }
      if (p.rules.style.length) {
        out.push('## 表記統一ルール', '');
        p.rules.style.forEach((r) => out.push(`- ${r.from} → ${r.to}`));
        out.push('');
      }
      if (p.timeline.length) {
        out.push('## 年表', '');
        p.timeline.forEach((t) => out.push(`- ${t.when || ''}　${t.title || ''}${t.desc ? '：' + t.desc.replace(/\n/g, ' ') : ''}`));
        out.push('');
      }
      return out.join('\n');
    },
  };

  // ───── 画面 ─────
  const V = {};
  let S = null;
  let lastTab = 'character'; // 画面を出入りしても、開いていた分類を覚えておく
  let openedFromList = false; // 狭い画面で一覧から開いたか（戻るボタンで履歴を戻す）
  function P() { return NS.App.project; }
  function touch() { NS.App.touch(); }

  V.mount = function (view, params) {
    const p = P();
    let tab = (S && S.tab) || lastTab || 'character';
    let selected = null;
    if (params.id) {
      const e = p.entries.find((x) => x.id === params.id);
      if (e) { tab = e.type; selected = e.id; }
    } else openedFromList = false;
    S = { view, tab, selected, q: '', mentionCache: null };
    build();
  };
  V.unmount = function () { if (S) lastTab = S.tab; S = null; };

  function build() {
    clear(S.view);
    const layout = h('div', { class: 'lore-layout' });
    S.tabsEl = h('nav', { class: 'lore-tabs', 'aria-label': '設定資料の分類' });
    S.listPane = h('div', { class: 'lore-list-pane' });
    S.detail = h('section', { class: 'lore-detail' });
    layout.append(h('aside', { class: 'lore-side' }, S.tabsEl, S.listPane), S.detail);
    S.view.appendChild(layout);
    renderTabs();
    renderList();
    renderDetail();
  }

  function renderTabs() {
    const p = P();
    clear(S.tabsEl);
    TABS.forEach((t) => {
      const n = TYPE_LABEL[t.id] ? p.entries.filter((e) => e.type === t.id).length
        : t.id === 'rules' ? p.rules.ng.length + p.rules.style.length : t.id === 'relmap' || t.id === 'cast' ? 0 : p.timeline.length;
      S.tabsEl.appendChild(h('button', {
        type: 'button', class: 'lore-tab' + (S.tab === t.id ? ' active' : ''),
        onclick: () => {
          S.tab = t.id; lastTab = t.id; S.selected = null; S.q = '';
          // 詳細を開いていた（URL に項目がある）なら、一覧の URL に戻す
          if (NS.App.params && NS.App.params.id) { openedFromList = false; NS.App.navigate('lore'); return; }
          renderTabs(); renderList(); renderDetail(); toTop();
        },
      }, icon(t.icon, 16), h('span', null, t.label), n ? h('span', { class: 'count' }, n) : null));
    });
    // 狭い画面（タブが横に並ぶ）では、選んでいるタブが見えるように
    const act = S.tabsEl.querySelector('.lore-tab.active');
    if (act && S.tabsEl.scrollWidth > S.tabsEl.clientWidth) {
      requestAnimationFrame(() => {
        if (!S) return;
        const l = act.offsetLeft - S.tabsEl.offsetLeft;
        if (l < S.tabsEl.scrollLeft + 8 || l + act.offsetWidth > S.tabsEl.scrollLeft + S.tabsEl.clientWidth - 8) {
          S.tabsEl.scrollLeft = l - (S.tabsEl.clientWidth - act.offsetWidth) / 2;
        }
      });
    }
  }

  function openEntry(e) {
    if (narrow()) {
      // 狭い画面では履歴に積み、端末の「戻る」で一覧に戻れるようにする
      lastTab = S.tab;
      openedFromList = true;
      NS.App.navigate('lore', { id: e.id });
      return;
    }
    S.selected = e.id;
    S.renderItems();
    renderDetail();
  }

  function backToList() {
    lastTab = S.tab;
    if (openedFromList) { openedFromList = false; history.back(); return; }
    S.selected = null;
    NS.App.navigate('lore');
  }

  /** 狭い画面では「一覧」と「詳細」を切り替えて表示する（選んでいるかどうかを枠に印す） */
  function syncLayout() {
    const layout = S.view.querySelector('.lore-layout');
    if (!layout) return;
    layout.classList.toggle('no-list', !TYPE_LABEL[S.tab]);
    layout.classList.toggle('has-selection', !!(TYPE_LABEL[S.tab] && S.selected && P().entries.some((x) => x.id === S.selected)));
  }
  const narrow = () => window.matchMedia('(max-width: 899px)').matches;
  function toTop() { if (narrow()) S.view.scrollTop = 0; }

  function renderList() {
    const p = P();
    clear(S.listPane);
    S.listPane.hidden = !TYPE_LABEL[S.tab];
    syncLayout();
    if (!TYPE_LABEL[S.tab]) return;
    const search = h('input', {
      class: 'input', type: 'search', placeholder: '検索', value: S.q, 'aria-label': TYPE_LABEL[S.tab] + 'を検索',
      oninput: (e) => { S.q = e.target.value; renderItems(); },
    });
    const items = h('ul', { class: 'entry-list' });
    const renderItems = () => {
      clear(items);
      const q = S.q.trim();
      const list = p.entries.filter((e) => e.type === S.tab && (!q || e.name.indexOf(q) >= 0 || (e.reading || '').indexOf(q) >= 0 || e.aliases.some((a) => a.indexOf(q) >= 0)));
      if (!list.length) items.appendChild(h('li', { class: 'muted small empty-li' }, q ? '見つかりません' : 'まだ登録がありません'));
      list.forEach((e) => {
        const sub = e.type === 'character' ? [e.fields.role, e.fields.age ? e.fields.age + (/歳|才/.test(e.fields.age) ? '' : '歳') : ''].filter(Boolean).join('・') : (e.fields.kind || '');
        items.appendChild(h('li', {
          class: 'entry-item' + (S.selected === e.id ? ' active' : ''), tabindex: 0,
          onclick: () => openEntry(e),
          onkeydown: (ev) => { if (ev.key === 'Enter') openEntry(e); },
        },
        h('span', { class: 'color-dot', style: { background: e.color || 'var(--line-strong)' } }),
        h('span', { class: 'entry-item-text' }, h('span', { class: 'entry-item-name' }, e.name), sub ? h('span', { class: 'muted small' }, sub) : null)));
      });
    };
    S.renderItems = renderItems;
    S.listPane.append(
      h('div', { class: 'row' }, search, btn('追加', { icon: 'plus', small: true, primary: true, onClick: () => {
        const e = newEntry(S.tab);
        p.entries.push(e);
        S.q = '';
        touch();
        if (narrow()) {
          openEntry(e);
        } else {
          S.selected = e.id;
          renderTabs();
          renderList();
          renderDetail();
        }
        const nameInput = S && S.detail.querySelector('.entry-name-input');
        if (nameInput) { nameInput.focus(); nameInput.select(); }
      } })),
      h('div', { class: 'row' }, btn('名前を考える', { icon: 'dice', small: true, ghost: true, title: '人物名・地名などの候補を出します', onClick: () => namesDialog(S.tab) })),
      items);
    renderItems();
  }

  /** 名前を考える（候補から、そのまま設定資料に足せる） */
  function namesDialog(tab) {
    const p = P();
    const N = NS.Names;
    const placeTab = tab === 'place';
    const styleKeys = Object.keys(N.STYLES).filter((k) => (placeTab ? !N.STYLES[k].person : true));
    const prefs = UI.lsGet('tsuzuri.namePref', {}) || {};
    let style = styleKeys.includes(prefs[tab]) ? prefs[tab] : (placeTab ? 'placeJp' : 'jp');
    let gender = prefs.gender || 'any';
    const chips = h('div', { class: 'chips' });
    const genderBox = h('div', { class: 'chips' });
    const list = h('div', { class: 'name-list' });
    const renderChips = () => {
      clear(chips);
      styleKeys.forEach((k) => chips.appendChild(h('button', { type: 'button', class: 'chip' + (style === k ? ' active' : ''), 'aria-pressed': style === k ? 'true' : 'false',
        onclick: () => { style = k; prefs[tab] = k; UI.lsSet('tsuzuri.namePref', prefs); renderChips(); roll(); } }, N.STYLES[k].label)));
      clear(genderBox);
      genderBox.hidden = !N.STYLES[style].person;
      [['any', 'どちらも'], ['m', '男性'], ['f', '女性']].forEach(([k, l]) => genderBox.appendChild(h('button', { type: 'button', class: 'chip' + (gender === k ? ' active' : ''),
        onclick: () => { gender = k; prefs.gender = k; UI.lsSet('tsuzuri.namePref', prefs); renderChips(); roll(); } }, l)));
    };
    const roll = () => {
      clear(list);
      const avoid = p.entries.map((e) => e.name);
      N.generate(style, { gender, count: 12, avoid }).forEach((n) => {
        const isPerson = N.STYLES[style].person;
        const type = isPerson ? 'character' : 'place';
        const addBtn = btn(isPerson ? '人物に追加' : '場所に追加', { small: true, icon: 'plus', onClick: () => {
          const e = newEntry(type, n.name);
          e.reading = (n.reading || '').replace(/\s/g, '');
          // 名だけ・姓だけで書いても同じ人物と分かるように
          if (n.given && n.family) e.aliases = [n.given, n.family].filter((a) => a && a !== n.name);
          p.entries.push(e);
          touch();
          addBtn.disabled = true;
          addBtn.textContent = '追加しました';
          if (S && S.tab === type) { renderTabs(); renderList(); }
        } });
        list.appendChild(h('div', { class: 'name-row' },
          h('div', { class: 'name-main' }, h('strong', null, n.name), n.reading ? h('span', { class: 'small muted' }, n.reading) : null),
          h('span', { class: 'small muted name-note' }, n.note || ''),
          btn('', { icon: 'copy', small: true, ghost: true, title: 'コピー', onClick: async () => {
            try { await navigator.clipboard.writeText(n.name); UI.toast('コピーしました'); } catch (err) { UI.toast('コピーできませんでした', 'error'); }
          } }),
          addBtn));
      });
    };
    renderChips();
    roll();
    UI.modal({
      title: '名前を考える', wide: true,
      body: h('div', { class: 'stack' },
        h('p', { class: 'small muted' }, '気に入った名前は、そのまま設定資料に足せます（和名は読みと、名だけ・姓だけの呼び方も一緒に登録します）。'),
        chips, genderBox,
        list),
      actions: [{ label: 'ほかの候補', icon: 'dice', onClick: () => { roll(); return false; } }, { label: '閉じる', primary: true }],
    });
  }

  function renderDetail() {
    clear(S.detail);
    syncLayout();
    S.detail.classList.toggle('full', S.tab === 'relmap');
    if (S.tab === 'relmap') { NS.RelMap.mount(S.detail); return; }
    if (S.tab === 'rules') { S.detail.appendChild(rulesPane()); return; }
    if (S.tab === 'timeline') { S.detail.appendChild(timelinePane()); return; }
    if (S.tab === 'cast') { S.detail.appendChild(castPane()); return; }
    const p = P();
    const e = p.entries.find((x) => x.id === S.selected && x.type === S.tab);
    if (!e) {
      S.detail.appendChild(h('div', { class: 'empty big' },
        icon(TYPE_ICON[S.tab], 40),
        h('p', null, `一覧から${TYPE_LABEL[S.tab]}を選ぶか、「追加」で新しく登録します。`),
        S.tab === 'character' ? h('p', { class: 'muted small' }, '一人称・呼び方・髪や瞳の色・年齢・登場範囲を入れておくと、本文との食い違いを自動でチェックします。') : null));
      return;
    }
    // 狭い画面では、一覧へ戻るボタンを付ける
    S.detail.appendChild(h('div', { class: 'lore-back-row' }, btn(`${TYPE_LABEL[S.tab]}の一覧へ`, {
      icon: 'left', small: true, ghost: true, class: 'lore-back',
      onClick: backToList,
    })));
    S.detail.appendChild(entryForm(e));
  }

  function changed(e, rerenderList) {
    e.updatedAt = Date.now();
    touch();
    if (rerenderList && S.renderItems) S.renderItems();
  }

  function textInput(value, onInput, opts) {
    opts = opts || {};
    return h(opts.textarea ? 'textarea' : 'input', Object.assign({
      class: 'input' + (opts.class ? ' ' + opts.class : ''), value: value || '', placeholder: opts.placeholder || '',
      oninput: (ev) => onInput(ev.target.value),
    }, opts.textarea ? { rows: opts.rows || 3 } : { type: 'text' }));
  }

  function entrySelect(p, type, value, onChange, excludeId) {
    const sel = h('select', { class: 'input', onchange: (ev) => onChange(ev.target.value) });
    sel.appendChild(h('option', { value: '' }, '（なし）'));
    p.entries.filter((x) => x.type === type && x.id !== excludeId).forEach((x) => sel.appendChild(h('option', { value: x.id, selected: x.id === value }, x.name)));
    return sel;
  }

  function chapterSelect(p, value, onChange) {
    const sel = h('select', { class: 'input', onchange: (ev) => onChange(ev.target.value ? parseInt(ev.target.value, 10) : null) });
    sel.appendChild(h('option', { value: '' }, '（指定なし）'));
    p.chapters.forEach((c, i) => sel.appendChild(h('option', { value: i + 1, selected: +value === i + 1 }, `第${i + 1}話　${c.title}`)));
    return sel;
  }

  function entryForm(e) {
    const p = P();
    const form = h('div', { class: 'entry-form' });
    const more = btn('', { icon: 'more', ghost: true, title: 'その他' });
    more.addEventListener('click', () => UI.menu(more, [
      { label: '複製', icon: 'copy', onClick: () => {
        const copy = JSON.parse(JSON.stringify(e));
        copy.id = UI.uid('e');
        copy.name += '（複製）';
        p.entries.push(copy);
        touch();
        if (narrow()) { NS.App.navigate('lore', { id: copy.id }); return; }
        S.selected = copy.id;
        renderTabs(); renderList(); renderDetail();
      } },
      { label: '本文で探す', icon: 'search', onClick: () => searchInChapters(e) },
      null,
      { label: '削除', icon: 'trash', danger: true, onClick: async () => {
        if (!(await UI.confirm(`「${e.name}」を削除します。`, { danger: true, okLabel: '削除' }))) return;
        p.entries.splice(p.entries.indexOf(e), 1);
        p.entries.forEach((x) => { x.relations = x.relations.filter((r) => r.targetId !== e.id); });
        S.selected = null;
        touch();
        if (NS.App.params && NS.App.params.id) { lastTab = S.tab; openedFromList = false; NS.App.navigate('lore'); return; }
        renderTabs(); renderList(); renderDetail();
      } },
    ]));

    // 見出し
    const colorRow = h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': '色' }, [''].concat(UI.SWATCHES).map((c) => h('button', {
      type: 'button', class: 'swatch' + ((e.color || '') === c ? ' active' : ''), title: c ? '色' : '色なし', 'aria-label': c || '色なし',
      style: { background: c || 'transparent' },
      onclick: (ev) => { e.color = c; changed(e, true); ev.currentTarget.parentNode.querySelectorAll('.swatch').forEach((s) => s.classList.remove('active')); ev.currentTarget.classList.add('active'); },
    })));
    form.appendChild(h('div', { class: 'entry-head' },
      h('span', { class: 'type-badge t-' + e.type }, TYPE_LABEL[e.type]),
      textInput(e.name, (v) => { e.name = v; changed(e, true); }, { class: 'entry-name-input', placeholder: '名前' }),
      more));
    form.appendChild(h('div', { class: 'grid-2' },
      UI.field('読み', textInput(e.reading, (v) => { e.reading = v; changed(e); }, { placeholder: 'ふりがな' })),
      UI.field('別名・愛称', textInput(e.aliases.join('、'), (v) => { e.aliases = v.split(/[、,，\/／]/).map((s) => s.trim()).filter(Boolean); changed(e); }, { placeholder: '、で区切る' }),
        '本文中の呼び名も登録すると検出精度が上がります')));
    form.appendChild(UI.field('色', colorRow));

    // 項目
    let grid = h('div', { class: 'grid-2' });
    form.appendChild(grid);
    (SCHEMA[e.type] || []).forEach((f) => {
      if (f.section) {
        form.appendChild(h('h3', { class: 'form-section' }, f.section));
        grid = h('div', { class: 'grid-2' });
        form.appendChild(grid);
        return;
      }
      let input;
      if (f.type === 'entry') input = entrySelect(p, f.entryType, e.fields[f.key], (v) => { e.fields[f.key] = v; changed(e); }, e.id);
      else input = textInput(e.fields[f.key], (v) => { e.fields[f.key] = v; changed(e, f.key === 'role' || f.key === 'kind' || f.key === 'age'); }, { textarea: f.type === 'textarea', placeholder: f.placeholder });
      const fl = UI.field(f.label, input, f.hint);
      if (f.check) fl.classList.add('field-checked');
      if (f.type === 'textarea') fl.classList.add('span-2');
      grid.appendChild(fl);
    });

    // 人物：関係・呼び方、登場範囲
    if (e.type === 'character') {
      form.appendChild(h('h3', { class: 'form-section' }, '関係・呼び方', h('span', { class: 'check-note' }, '台詞の呼び方と照合')));
      const relBox = h('div', { class: 'table-like' });
      const renderRel = () => {
        clear(relBox);
        relBox.appendChild(h('div', { class: 'tl-head rel-row' }, h('span', null, '相手'), h('span', null, '種類'), h('span', null, '呼び方'), h('span', null, '関係・メモ'), h('span')));
        e.relations.forEach((r, i) => {
          const kindSel = h('select', { class: 'input', onchange: (ev) => { r.kind = ev.target.value; changed(e); } },
            NS.RelMap.KINDS.map((k) => h('option', { value: k.id, selected: (r.kind || NS.RelMap.guessKind(r.note)) === k.id }, k.label)));
          relBox.appendChild(h('div', { class: 'rel-row' },
            entrySelect(p, 'character', r.targetId, (v) => { r.targetId = v; changed(e); }, e.id),
            kindSel,
            textInput(r.calls, (v) => { r.calls = v; changed(e); }, { placeholder: '例：蓮くん（複数は／）' }),
            textInput(r.note, (v) => { r.note = v; changed(e); }, { placeholder: '幼なじみ、師弟 など' }),
            btn('', { icon: 'trash', ghost: true, small: true, title: '削除', onClick: () => { e.relations.splice(i, 1); changed(e); renderRel(); } })));
        });
        relBox.appendChild(h('div', { class: 'row wrap' },
          btn('関係を追加', { icon: 'plus', small: true, ghost: true, onClick: () => { e.relations.push({ targetId: '', kind: 'friend', calls: '', note: '' }); changed(e); renderRel(); } }),
          btn('相関図で見る', { icon: 'network', small: true, ghost: true, onClick: () => { S.tab = 'relmap'; S.selected = null; renderTabs(); renderList(); renderDetail(); } })));
      };
      renderRel();
      form.appendChild(relBox);

      form.appendChild(h('h3', { class: 'form-section' }, '登場範囲', h('span', { class: 'check-note' }, '退場後の発言などを検出')));
      form.appendChild(h('div', { class: 'grid-3' },
        UI.field('初登場', chapterSelect(p, e.appear.from, (v) => { e.appear.from = v; changed(e); })),
        UI.field('退場・死亡', chapterSelect(p, e.appear.until, (v) => { e.appear.until = v; changed(e); })),

    const wrap = h('div', { class: 'cast-wrap' });

      const nCh = p.chapters.length;

        let last = -1;

        return { e, idx, per, total, first, last };

      if (!rows.length) { wrap.appendChild(h('p', { class: 'muted' }, `${TYPE_LABEL[castType]}がまだ登録されていません。`)); return; }

          const until = +ap.until || 0;
          return h('tr', null,
            h('th', { scope: 'row', class: 'cast-name' }, h('button', { type: 'button', class: 'linkish', title: '設定を開く', onclick: () => { S.tab = r.e.type; lastTab = r.e.type; openEntry(r.e); renderTabs(); renderList(); } },
              h('span', { class: 'color-dot', style: { background: r.e.color || 'var(--line-strong)' } }), r.e.name)),
            r.per.map((n, i) => {
              const ch = i + 1;
              const after = until && ch > until && n > 0;
              const before = from && ch < from && n > 0;
              if (after) warn.push(`${r.e.name}：第${until}話で${ap.reason || '退場'}のはずが、第${ch}話に${n}回出てきます`);
              if (before) warn.push(`${r.e.name}：初登場は第${from}話のはずが、第${ch}話に${n}回出てきます`);
              const gone = until && ch > until && !n;
              const k = n ? 0.15 + 0.85 * (n / max) : 0;
              return h('td', {
                class: 'cast-cell' + (after || before ? ' bad' : '') + (gone ? ' gone' : ''),
                style: n && !(after || before) ? { background: `color-mix(in srgb, var(--accent) ${Math.round(k * 70)}%, transparent)` } : null,
                title: `第${ch}話 ${p.chapters[i].title || ''}：${n}回` + (after ? `（第${until}話で${ap.reason || '退場'}）` : before ? `（初登場は第${from}話）` : ''),
                tabindex: n ? 0 : null,
                onclick: n ? () => NS.App.navigate('write', { id: p.chapters[i].id }) : null,
                onkeydown: n ? (ev) => { if (ev.key === 'Enter') NS.App.navigate('write', { id: p.chapters[i].id }); } : null,
              }, n ? String(n) : (gone ? '†' : ''));
            }),
            h('td', { class: 'cast-total' }, String(r.total)));
        })));
      wrap.appendChild(table);
      // 気づいたこと：長く出てこない主要人物、一度も出てこない項目、設定との食い違い
      const tips = [];
      if (castType === 'character' && nCh >= 4) {
        rows.forEach((r) => {
          if (r.total < 3 || r.last < 0) return;
          const until = +(r.e.appear && r.e.appear.until) || 0;
          if (until) return;
          const away = nCh - 1 - r.last;
          if (away >= Math.max(3, Math.ceil(nCh * 0.3))) tips.push(`${r.e.name}：第${r.last + 1}話を最後に、${away}話出てきていません`);
        });
      }
      const never = rows.filter((r) => !r.total).map((r) => r.e.name);
      if (never.length) tips.push(`まだ本文に出てこない${TYPE_LABEL[castType]}：${never.slice(0, 8).join('・')}${never.length > 8 ? ` ほか${never.length - 8}` : ''}`);
      if (warn.length) notes.appendChild(h('div', { class: 'cast-warn' }, h('strong', null, '設定と違う登場'), h('ul', null, warn.slice(0, 12).map((w) => h('li', null, w)))));
      if (tips.length) notes.appendChild(h('div', { class: 'cast-tips' }, h('strong', null, '気づいたこと'), h('ul', null, tips.map((w) => h('li', null, w)))));
    };
    render();
    box.append(h('div', { class: 'row wrap cast-bar' }, chips, sortSel), notes, wrap,
      h('p', { class: 'muted small' }, '†：退場・死亡したあとの話。登場範囲は人物の「初登場」「退場・死亡」で決めます。'));
    return box;
  }

  NS.Lore = { TYPE_LABEL, TYPE_ICON, SCHEMA, newEntry, summaryList };
  NS.LoreFormat = LoreFormat;
  NS.Views.lore = V;
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
<script>
// js/views/relmap.js
/*
 * 綴り — キャラ相関図
 * 設定資料の人物と「関係・呼び方」から相関図を描く。ドラッグで配置、線を引いて関係を追加、
 * 線をクリックして編集、自動配置、組織の表示、PNG 書き出し。
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const { h, icon, btn, clear, toast } = UI;
  const SVGNS = 'http://www.w3.org/2000/svg';

  const KINDS = [
    { id: 'family', label: '家族', color: '#2a9d8f', dash: '' },
    { id: 'love', label: '恋人・想い', color: '#d6456b', dash: '' },
    { id: 'friend', label: '友人・仲間', color: '#3d7ea6', dash: '' },
    { id: 'mentor', label: '師弟', color: '#7f5539', dash: '' },
    { id: 'lord', label: '主従', color: '#6a4f9a', dash: '' },
    { id: 'colleague', label: '同僚・所属', color: '#6c757d', dash: '4 3' },
    { id: 'rival', label: 'ライバル', color: '#d9a441', dash: '8 4' },
    { id: 'enemy', label: '敵対', color: '#c0392b', dash: '6 3 1.5 3' },
    { id: 'other', label: 'その他', color: '#8a8177', dash: '2 3' },
  ];
  const KIND = {};
  KINDS.forEach((k) => { KIND[k.id] = k; });

  /** メモから種類を推測（古いデータ用） */
  function guessKind(note) {
    const n = String(note || '');
    if (/父|母|兄|姉|弟|妹|祖|叔|伯|娘|息子|夫|妻|家族|親子|兄弟|姉妹|従/.test(n)) return 'family';
    if (/恋|想い|片思い|婚約|好き|愛/.test(n)) return 'love';
    if (/師|弟子/.test(n)) return 'mentor';
    if (/主|従者|部下|上司|臣|仕え/.test(n)) return 'lord';
    if (/敵|仇|宿敵|対立/.test(n)) return 'enemy';
    if (/ライバル|好敵手/.test(n)) return 'rival';
    if (/同僚|所属|仲間|戦友/.test(n)) return 'colleague';
    if (/友|幼なじみ|親友|相棒/.test(n)) return 'friend';
    return 'other';
  }
  function kindOf(rel) { return KIND[rel.kind] || KIND[guessKind(rel.note)]; }

  function P() { return NS.App.project; }
  function touch() { NS.App.touch(); }

  function el(tag, attrs, ...children) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in attrs || {}) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'text') e.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
      else e.setAttribute(k, v);
    }
    children.forEach((c) => { if (c) e.appendChild(c); });
    return e;
  }

  let R = null;

  /** 設定資料の中に相関図を描く */
  function mount(container) {
    const p = P();
    p.relmap = p.relmap || {};
    p.relmap.pos = p.relmap.pos || {};
    if (p.relmap.showCalls == null) p.relmap.showCalls = true;
    R = { container, view: { x: 0, y: 0, k: 1 }, connect: false, drag: null, selected: null };
    build();
  }

  function nodes() {
    const p = P();
    return p.entries.filter((e) => e.type === 'character' || (p.relmap.showOrgs && e.type === 'org'));
  }

  function edges() {
    const p = P();
    const ids = new Set(nodes().map((n) => n.id));
    const out = [];
    p.entries.forEach((e) => {
      if (e.type !== 'character' || !ids.has(e.id)) return;
      e.relations.forEach((rel, i) => {
        if (!rel.targetId || !ids.has(rel.targetId) || rel.targetId === e.id) return;
        out.push({ from: e.id, to: rel.targetId, rel, index: i, owner: e });
      });
    });
    if (p.relmap.showOrgs) {
      p.entries.filter((o) => o.type === 'org').forEach((o) => {
        if (o.fields.leader && ids.has(o.fields.leader)) out.push({ from: o.fields.leader, to: o.id, org: true, label: '代表' });
        const members = String(o.fields.members || '');
        p.entries.filter((c) => c.type === 'character' && c.id !== o.fields.leader).forEach((c) => {
          const forms = [c.name.replace(/[\s　]/g, '')].concat(c.aliases, c.name.split(/[\s　・]/).filter((x) => x.length >= 2));
          if (forms.some((f) => f && members.indexOf(f) >= 0)) out.push({ from: c.id, to: o.id, org: true, label: '所属' });
        });
      });
    }
    return out;
  }

  function ensurePositions() {
    const p = P();
    const list = nodes();
    const missing = list.filter((n) => !p.relmap.pos[n.id]);
    if (!missing.length) return;
    const n = list.length;
    list.forEach((nd, i) => {
      if (p.relmap.pos[nd.id]) return;
      const a = (i / Math.max(1, n)) * Math.PI * 2;
      p.relmap.pos[nd.id] = [Math.cos(a) * 220 + (Math.random() - 0.5) * 20, Math.sin(a) * 160 + (Math.random() - 0.5) * 20];
    });
    if (missing.length === list.length) layout(true);
  }

  /** ばねモデルで自動配置（関係のある人物は約200px、ない人物は離して並べる） */
  function computeLayout(ids, pairs, init) {
    const pos = {};
    ids.forEach((id, i) => { pos[id] = init[id] ? init[id].slice() : [Math.cos(i * 2.4) * 200, Math.sin(i * 2.4) * 150]; });
    const L = 210;
    const REP = 260000;
    const SPR = 0.06;
    const GRAV = 0.012;
    const N = 600;
    for (let it = 0; it < N; it++) {
      const t = 24 * (1 - it / N) + 0.4;
      const disp = {};
      ids.forEach((id) => { disp[id] = [0, 0]; });
      for (let i = 0; i < ids.length; i++) {
        for (let j = i + 1; j < ids.length; j++) {
          const a = pos[ids[i]];
          const b = pos[ids[j]];
          let dx = a[0] - b[0];
          let dy = a[1] - b[1];
          let d = Math.hypot(dx, dy);
          if (d < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = 1; }
          const f = REP / (d * d);
          disp[ids[i]][0] += (dx / d) * f; disp[ids[i]][1] += (dy / d) * f;
          disp[ids[j]][0] -= (dx / d) * f; disp[ids[j]][1] -= (dy / d) * f;
        }
      }
      pairs.forEach(([u, v]) => {
        const a = pos[u];
        const b = pos[v];
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const d = Math.hypot(dx, dy) || 1;
        const f = SPR * (d - L);
        disp[u][0] += (dx / d) * f; disp[u][1] += (dy / d) * f;
        disp[v][0] -= (dx / d) * f; disp[v][1] -= (dy / d) * f;
      });
      ids.forEach((id) => {
        const d = disp[id];
        d[0] -= pos[id][0] * GRAV;
        d[1] -= pos[id][1] * GRAV * 1.4;
        const len = Math.hypot(d[0], d[1]) || 1;
        const m = Math.min(len, t);
        pos[id][0] += (d[0] / len) * m;
        pos[id][1] += (d[1] / len) * m;
      });
    }
    return pos;
  }

  function layout(silent) {
    const p = P();
    const list = nodes();
    if (!list.length) return;
    const ids = list.map((n) => n.id);
    const seen = new Set();
    const pairs = [];
    edges().forEach((e) => {
      const k = e.from < e.to ? e.from + '|' + e.to : e.to + '|' + e.from;
      if (seen.has(k) || !ids.includes(e.from) || !ids.includes(e.to)) return;
      seen.add(k);
      pairs.push([e.from, e.to]);
    });
    const pos = computeLayout(ids, pairs, silent ? p.relmap.pos : {});
    ids.forEach((id) => { p.relmap.pos[id] = [Math.round(pos[id][0]), Math.round(pos[id][1])]; });
    if (!silent) { touch(); render(); fitView(); }
  }

  function build() {
    const p = P();
    clear(R.container);
    const connectBtn = btn('線をつなぐ', { icon: 'link', small: true, title: '人物から人物へドラッグして関係を追加', onClick: () => {
      R.connect = !R.connect;
      connectBtn.classList.toggle('active', R.connect);
      R.svg.classList.toggle('connecting', R.connect);
      toast(R.connect ? '人物から人物へドラッグすると関係を追加できます' : '線をつなぐモードを終了しました');
    } });
    const toolbar = h('div', { class: 'relmap-toolbar' },
      connectBtn,
      btn('自動配置', { icon: 'dice', small: true, onClick: () => layout() }),
      btn('全体', { small: true, ghost: true, onClick: fitView }),
      h('label', { class: 'check small' }, h('input', { type: 'checkbox', checked: !!p.relmap.showOrgs, onchange: (e) => { p.relmap.showOrgs = e.target.checked; touch(); ensurePositions(); render(); } }), '組織も表示'),
      h('label', { class: 'check small' }, h('input', { type: 'checkbox', checked: p.relmap.showCalls !== false, onchange: (e) => { p.relmap.showCalls = e.target.checked; touch(); render(); } }), '呼び方を表示'),
      btn('PNG', { icon: 'image', small: true, title: '画像として書き出す', onClick: exportPng }));
    R.svg = el('svg', { class: 'relmap-svg', role: 'img', 'aria-label': 'キャラ相関図' });
    R.g = el('g');
    R.defs = el('defs');
    R.svg.append(R.defs, R.g);
    R.side = h('div', { class: 'relmap-side' });
    const legend = h('div', { class: 'relmap-legend' }, KINDS.map((k) => h('span', { class: 'legend-item' },
      h('span', { class: 'legend-line', style: { borderTopColor: k.color, borderTopStyle: k.dash ? 'dashed' : 'solid' } }), k.label)));
    const stage = h('div', { class: 'relmap-stage' }, R.svg, legend);
    R.container.append(h('div', { class: 'relmap' }, toolbar, h('div', { class: 'relmap-body' }, stage, R.side)));
    bind();
    ensurePositions();
    render();
    renderSide();
    requestAnimationFrame(fitView);
  }

  function markerFor(color) {
    const id = 'arrow-' + color.replace('#', '');
    if (!R.defs.querySelector('#' + id)) {
      R.defs.appendChild(el('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' },
        el('path', { d: 'M0,0 L10,5 L0,10 z', fill: color })));
    }
    return 'url(#' + id + ')';
  }

  const NODE_R = 30;

  function render() {
    const p = P();
    clear(R.g);
    const list = nodes();
    if (!list.length) {
      R.g.appendChild(el('text', { x: 0, y: 0, 'text-anchor': 'middle', class: 'relmap-empty', text: '人物を登録すると、ここに相関図が表示されます' }));
      return;
    }
    const pos = p.relmap.pos;
    const E = edges();
    const pairKey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
    const pairs = {};
    E.forEach((e) => { const k = pairKey(e.from, e.to); pairs[k] = (pairs[k] || 0) + 1; });
    const edgeLayer = el('g');
    const labelLayer = el('g');
    E.forEach((e) => {
      const a = pos[e.from];
      const b = pos[e.to];
      if (!a || !b) return;
      const kind = e.org ? { color: '#9a8f80', dash: '3 3' } : kindOf(e.rel);
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const d = Math.hypot(dx, dy) || 1;
      const ux = dx / d;
      const uy = dy / d;
      // 双方向なら左右にふくらませる
      const both = pairs[pairKey(e.from, e.to)] > 1;
      const bend = both ? 34 : 0;
      const nx = -uy;
      const ny = ux;
      const r2 = list.find((n) => n.id === e.to && n.type === 'org') ? NODE_R + 6 : NODE_R + 4;
      const sx = a[0] + ux * (NODE_R + 4) + nx * (both ? 8 : 0);
      const sy = a[1] + uy * (NODE_R + 4) + ny * (both ? 8 : 0);
      const ex = b[0] - ux * r2 + nx * (both ? 8 : 0);
      const ey = b[1] - uy * r2 + ny * (both ? 8 : 0);
      const mx = (sx + ex) / 2 + nx * bend;
      const my = (sy + ey) / 2 + ny * bend;
      const path = `M${sx},${sy} Q${mx},${my} ${ex},${ey}`;
      const selected = R.selected && R.selected.kind === 'edge' && R.selected.from === e.from && R.selected.index === e.index;
      const hit = el('path', { d: path, class: 'relmap-edge-hit', onclick: (ev) => { ev.stopPropagation(); if (!e.org) editRelation(e.owner, e.index); } });
      const line = el('path', {
        d: path, fill: 'none', stroke: kind.color, 'stroke-width': selected ? 3.5 : 2, 'stroke-dasharray': kind.dash || null,
        'marker-end': markerFor(kind.color), class: 'relmap-edge',
      });
      edgeLayer.append(line, hit);
      // ラベル
      const lx = (sx + 2 * mx + ex) / 4;
      const ly = (sy + 2 * my + ey) / 4;
      const texts = [];
      if (e.org) texts.push({ t: e.label, cls: 'rl-note' });
      else {
        const note = e.rel.note || (e.rel.kind ? kindOf(e.rel).label : '');
        if (note) texts.push({ t: note, cls: 'rl-note' });
        if (p.relmap.showCalls !== false && e.rel.calls) texts.push({ t: '「' + e.rel.calls.split(/[\/／]/)[0] + '」', cls: 'rl-calls' });
      }
      if (texts.length) {
        const g = el('g', { class: 'relmap-label', transform: `translate(${lx},${ly})`, onclick: (ev) => { ev.stopPropagation(); if (!e.org) editRelation(e.owner, e.index); } });
        texts.forEach((x, i) => g.appendChild(el('text', { x: 0, y: (i - (texts.length - 1) / 2) * 14 + 4, 'text-anchor': 'middle', class: x.cls, fill: i === 0 ? kind.color : null, text: x.t })));
        labelLayer.appendChild(g);
      }
    });
    R.g.appendChild(edgeLayer);
    // ノード
    const nodeLayer = el('g');
    list.forEach((n) => {
      const [x, y] = pos[n.id];
      const isOrg = n.type === 'org';
      const color = n.color || (isOrg ? '#8a8177' : '#6c7a96');
      const dead = n.appear && n.appear.until;
      const sel = R.selected && R.selected.kind === 'node' && R.selected.id === n.id;
      const g = el('g', { class: 'relmap-node' + (sel ? ' selected' : '') + (dead ? ' dead' : ''), transform: `translate(${x},${y})`, 'data-id': n.id });
      if (isOrg) g.appendChild(el('rect', { x: -NODE_R - 6, y: -NODE_R * 0.7, width: (NODE_R + 6) * 2, height: NODE_R * 1.4, rx: 10, fill: color, class: 'node-shape' }));
      else g.appendChild(el('circle', { r: NODE_R, fill: color, class: 'node-shape' }));
      if (dead) g.appendChild(el('circle', { r: NODE_R + 4, fill: 'none', stroke: '#8a8177', 'stroke-dasharray': '3 3', 'stroke-width': 1.5 }));
      const initial = Array.from(n.name.replace(/[\s　]/g, ''))[0] || '？';
      g.appendChild(el('text', { x: 0, y: 7, 'text-anchor': 'middle', class: 'node-initial', text: isOrg ? n.name.slice(0, 4) : initial }));
      g.appendChild(el('text', { x: 0, y: NODE_R + (isOrg ? 4 : 18), 'text-anchor': 'middle', class: 'node-name', text: isOrg ? '' : n.name }));
      const sub = isOrg ? (n.fields.kind || '組織') : [n.fields.role, dead ? `第${n.appear.until}話で${n.appear.reason || '退場'}` : ''].filter(Boolean).join('・');
      if (sub) g.appendChild(el('text', { x: 0, y: NODE_R + (isOrg ? 18 : 33), 'text-anchor': 'middle', class: 'node-sub', text: sub }));
      nodeLayer.appendChild(g);
    });
    R.g.append(nodeLayer, labelLayer);
    applyView();
  }

  function applyView() {
    R.g.setAttribute('transform', `translate(${R.view.x},${R.view.y}) scale(${R.view.k})`);
  }

  function fitView() {
    if (!R || !R.svg) return;
    const p = P();
    const list = nodes();
    const rect = R.svg.getBoundingClientRect();
    if (!list.length || rect.width < 10) { R.view = { x: rect.width / 2, y: rect.height / 2, k: 1 }; applyView(); return; }
    let x0 = Infinity;
    let y0 = Infinity;
    let x1 = -Infinity;
    let y1 = -Infinity;
    list.forEach((n) => { const [x, y] = p.relmap.pos[n.id]; x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });
    const pad = 90;
    const k = Math.min(1.4, Math.min(rect.width / (x1 - x0 + pad * 2), rect.height / (y1 - y0 + pad * 2)));
    R.view = { k, x: rect.width / 2 - ((x0 + x1) / 2) * k, y: rect.height / 2 - ((y0 + y1) / 2) * k };
    applyView();
  }

  function toLocal(e) {
    const r = R.svg.getBoundingClientRect();
    return { x: (e.clientX - r.left - R.view.x) / R.view.k, y: (e.clientY - r.top - R.view.y) / R.view.k, sx: e.clientX, sy: e.clientY };
  }

  function nodeAt(pt) {
    const p = P();
    let best = null;
    nodes().forEach((n) => {
      const [x, y] = p.relmap.pos[n.id];
      const d = Math.hypot(pt.x - x, pt.y - y);
      if (d <= NODE_R + 6 && (!best || d < best.d)) best = { n, d };
    });
    return best ? best.n : null;
  }

  function bind() {
    const svg = R.svg;
    const pointers = new Map();
    svg.addEventListener('pointerdown', (e) => {
      const pt = toLocal(e);
      pointers.set(e.pointerId, pt);
      try { svg.setPointerCapture(e.pointerId); } catch (err) { /* 無視 */ }
      if (pointers.size === 2) {
        const [a, b] = Array.from(pointers.values());
        R.drag = { kind: 'pinch', d: Math.hypot(a.sx - b.sx, a.sy - b.sy), view: Object.assign({}, R.view), cx: (a.sx + b.sx) / 2, cy: (a.sy + b.sy) / 2 };
        return;
      }
      const n = nodeAt(pt);
      if (n && R.connect && n.type === 'character') {
        R.drag = { kind: 'connect', from: n, pt };
      } else if (n) {
        R.drag = { kind: 'node', id: n.id, start: pt, orig: P().relmap.pos[n.id].slice(), moved: false };
      } else {
        R.drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, view: Object.assign({}, R.view), moved: false };
      }
    });
    svg.addEventListener('pointermove', (e) => {
      if (pointers.has(e.pointerId)) pointers.set(e.pointerId, toLocal(e));
      const d = R.drag;
      if (!d) return;
      if (d.kind === 'pinch' && pointers.size === 2) {
        const [a, b] = Array.from(pointers.values());
        const dist = Math.hypot(a.sx - b.sx, a.sy - b.sy);
        zoomAt(d.view, dist / d.d, d.cx, d.cy);
      } else if (d.kind === 'pan') {
        if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 3) d.moved = true;
        R.view.x = d.view.x + (e.clientX - d.sx);
        R.view.y = d.view.y + (e.clientY - d.sy);
        applyView();
      } else if (d.kind === 'node') {
        const pt = toLocal(e);
        if (!d.moved && Math.hypot(pt.x - d.start.x, pt.y - d.start.y) * R.view.k < 3) return;
        d.moved = true;
        P().relmap.pos[d.id] = [Math.round(d.orig[0] + pt.x - d.start.x), Math.round(d.orig[1] + pt.y - d.start.y)];
        render();
      } else if (d.kind === 'connect') {
        const pt = toLocal(e);
        let ghost = R.g.querySelector('.relmap-ghost');
        if (!ghost) { ghost = el('line', { class: 'relmap-ghost' }); R.g.appendChild(ghost); }
        const [x, y] = P().relmap.pos[d.from.id];
        ghost.setAttribute('x1', x); ghost.setAttribute('y1', y); ghost.setAttribute('x2', pt.x); ghost.setAttribute('y2', pt.y);
      }
    });
    const up = (e) => {
      pointers.delete(e.pointerId);
      const d = R.drag;
      R.drag = null;
      if (!d) return;
      if (d.kind === 'node') {
        if (d.moved) touch();
        else { R.selected = { kind: 'node', id: d.id }; render(); renderSide(); }
      } else if (d.kind === 'pan' && !d.moved) {
        R.selected = null;
        render();
        renderSide();
      } else if (d.kind === 'connect') {
        const ghost = R.g.querySelector('.relmap-ghost');
        if (ghost) ghost.remove();
        const target = nodeAt(toLocal(e));
        if (target && target.id !== d.from.id && target.type === 'character') addRelationDialog(d.from, target);
      }
    };
    svg.addEventListener('pointerup', up);
    svg.addEventListener('pointercancel', up);
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoomAt(R.view, Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
    }, { passive: false });
  }

  function zoomAt(base, f, cx, cy) {
    const r = R.svg.getBoundingClientRect();
    const k = Math.max(0.2, Math.min(4, base.k * f));
    const px = cx - r.left;
    const py = cy - r.top;
    const wx = (px - base.x) / base.k;
    const wy = (py - base.y) / base.k;
    R.view = { k, x: px - wx * k, y: py - wy * k };
    applyView();
  }

  // ───── 関係の追加・編集 ─────
  function kindSelect(value) {
    return h('select', { class: 'input' }, KINDS.map((k) => h('option', { value: k.id, selected: k.id === value }, k.label)));
  }

  function addRelationDialog(from, to) {
    const kind = kindSelect('friend');
    const note = h('input', { class: 'input', type: 'text', placeholder: '例：幼なじみ、兄、宿敵' });
    const calls = h('input', { class: 'input', type: 'text', placeholder: `${from.name}は${to.name}を何と呼ぶ？` });
    const back = h('input', { type: 'checkbox', checked: true });
    const backNote = h('input', { class: 'input', type: 'text', placeholder: '相手から見た関係' });
    const backCalls = h('input', { class: 'input', type: 'text', placeholder: `${to.name}は${from.name}を何と呼ぶ？` });
    UI.modal({
      title: `${from.name} → ${to.name}`,
      body: h('div', { class: 'stack' },
        h('div', { class: 'grid-2' }, UI.field('関係の種類', kind), UI.field('関係（メモ）', note)),
        UI.field('呼び方', calls, '台詞の呼び方チェックに使います'),
        h('label', { class: 'check' }, back, `${to.name} → ${from.name} の関係も追加する`),
        h('div', { class: 'grid-2' }, UI.field('相手から見た関係', backNote), UI.field('相手からの呼び方', backCalls))),
      actions: [
        { label: 'キャンセル', ghost: true },
        { label: '追加', primary: true, onClick: () => {
          from.relations.push({ targetId: to.id, kind: kind.value, note: note.value.trim(), calls: calls.value.trim() });
          if (back.checked && !to.relations.some((r) => r.targetId === from.id)) {
            to.relations.push({ targetId: from.id, kind: kind.value, note: backNote.value.trim(), calls: backCalls.value.trim() });
          }
          touch();
          render();
          renderSide();
        } },
      ],
    });
  }

  function editRelation(owner, index) {
    const rel = owner.relations[index];
    if (!rel) return;
    const p = P();
    const target = p.entries.find((e) => e.id === rel.targetId);
    R.selected = { kind: 'edge', from: owner.id, index };
    render();
    const kind = kindSelect(rel.kind || guessKind(rel.note));
    const note = h('input', { class: 'input', type: 'text', value: rel.note || '' });
    const calls = h('input', { class: 'input', type: 'text', value: rel.calls || '' });
    UI.modal({
      title: `${owner.name} → ${target ? target.name : '？'}`,
      onClose: () => { R.selected = null; render(); },
      body: h('div', { class: 'stack' },
        h('div', { class: 'grid-2' }, UI.field('関係の種類', kind), UI.field('関係（メモ）', note)),
        UI.field('呼び方', calls, '複数あるときは／で区切ります')),
      actions: [
        { label: '削除', danger: true, ghost: true, onClick: async () => {
          if (!(await UI.confirm('この関係を削除します。', { danger: true, okLabel: '削除' }))) return false;
          owner.relations.splice(index, 1);
          touch();
          renderSide();
        } },
        { label: '保存', primary: true, onClick: () => {
          rel.kind = kind.value;
          rel.note = note.value.trim();
          rel.calls = calls.value.trim();
          touch();
          renderSide();
        } },
      ],
    });
  }

  function renderSide() {
    const p = P();
    clear(R.side);
    const sel = R.selected && R.selected.kind === 'node' ? p.entries.find((e) => e.id === R.selected.id) : null;
    if (!sel) {
      R.side.append(
        h('h3', { class: 'panel-h' }, '使い方'),
        h('ul', { class: 'hint-list small muted' },
          h('li', null, '人物をドラッグで動かせます。何もない所をドラッグで全体を移動、ホイール／ピンチで拡大縮小'),
          h('li', null, '「線をつなぐ」を押してから人物から人物へドラッグすると、関係を追加できます'),
          h('li', null, '線や関係の文字をクリックすると、種類・呼び方を編集できます'),
          h('li', null, '関係と呼び方は設定資料の人物にも保存され、台詞の呼び方チェックに使われます')),
        h('p', { class: 'small muted' }, `人物 ${p.entries.filter((e) => e.type === 'character').length}人・関係 ${edges().filter((e) => !e.org).length}本`));
      return;
    }
    const others = p.entries.filter((e) => e.type === 'character' && e.id !== sel.id);
    const incoming = [];
    p.entries.forEach((e) => e.relations.forEach((r, i) => { if (r.targetId === sel.id) incoming.push({ e, r, i }); }));
    R.side.append(...[
      h('div', { class: 'row' }, h('span', { class: 'color-dot big', style: { background: sel.color || '#6c7a96' } }), h('h3', null, sel.name)),
      sel.fields && sel.fields.role ? h('p', { class: 'small muted' }, sel.fields.role) : null,
      h('div', { class: 'row wrap' },
        btn('設定資料を開く', { small: true, icon: 'users', onClick: () => NS.App.navigate('lore', { id: sel.id }) }),
        sel.type === 'character' ? btn('関係を追加', { small: true, icon: 'plus', onClick: () => {
          if (!others.length) { toast('ほかの人物を登録してください'); return; }
          const sel2 = h('select', { class: 'input' }, others.map((o) => h('option', { value: o.id }, o.name)));
          UI.modal({
            title: '相手を選ぶ', body: UI.field('相手', sel2),
            actions: [{ label: 'キャンセル', ghost: true }, { label: '次へ', primary: true, onClick: () => { setTimeout(() => addRelationDialog(sel, others.find((o) => o.id === sel2.value)), 50); } }],
          });
        } }) : null),
      h('h3', { class: 'panel-h' }, `${sel.name}から`),
      relList(sel.relations.map((r, i) => ({ owner: sel, r, i, other: p.entries.find((x) => x.id === r.targetId) }))),
      h('h3', { class: 'panel-h' }, `${sel.name}へ`),
      relList(incoming.map(({ e, r, i }) => ({ owner: e, r, i, other: e })))].filter(Boolean));
  }

  function relList(items) {
    if (!items.length) return h('p', { class: 'small muted' }, 'なし');
    return h('div', { class: 'rel-list' }, items.map(({ owner, r, i, other }) => {
      const k = kindOf(r);
      return h('button', { type: 'button', class: 'rel-item', onclick: () => editRelation(owner, i) },
        h('span', { class: 'legend-line', style: { borderTopColor: k.color, borderTopStyle: k.dash ? 'dashed' : 'solid' } }),
        h('span', null, h('strong', null, other ? other.name : '？'), h('span', { class: 'muted small' }, '　' + (r.note || k.label) + (r.calls ? `・「${r.calls}」` : ''))));
    }));
  }

  // ───── 書き出し ─────
  function exportPng() {
    const p = P();
    const list = nodes();
    if (!list.length) return;
    let x0 = Infinity;
    let y0 = Infinity;
    let x1 = -Infinity;
    let y1 = -Infinity;
    list.forEach((n) => { const [x, y] = p.relmap.pos[n.id]; x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });
    const pad = 110;
    const w = x1 - x0 + pad * 2;
    const hgt = y1 - y0 + pad * 2;
    const clone = R.svg.cloneNode(true);
    clone.setAttribute('xmlns', SVGNS);
    clone.setAttribute('width', w * 2);
    clone.setAttribute('height', hgt * 2);
    clone.setAttribute('viewBox', `${x0 - pad} ${y0 - pad} ${w} ${hgt}`);
    const mainG = Array.from(clone.children).find((c) => c.tagName.toLowerCase() === 'g');
    if (mainG) mainG.setAttribute('transform', '');
    const style = document.createElementNS(SVGNS, 'style');
    style.textContent = `text{font-family:"Noto Sans JP","Hiragino Sans",sans-serif}.node-initial{fill:#fff;font-size:22px;font-weight:700}.node-name{fill:#2a2521;font-size:14px;font-weight:700;paint-order:stroke;stroke:#fffdf8;stroke-width:4px}.node-sub{fill:#887f74;font-size:11px;paint-order:stroke;stroke:#fffdf8;stroke-width:3px}.rl-note{font-size:12px;font-weight:700;paint-order:stroke;stroke:#fffdf8;stroke-width:4px}.rl-calls{fill:#5a5248;font-size:11px;paint-order:stroke;stroke:#fffdf8;stroke-width:4px}.relmap-edge-hit{display:none}.node-shape{stroke:#fffdf8;stroke-width:3px}`;
    clone.insertBefore(style, clone.firstChild);
    const bg = document.createElementNS(SVGNS, 'rect');
    bg.setAttribute('x', x0 - pad); bg.setAttribute('y', y0 - pad); bg.setAttribute('width', w); bg.setAttribute('height', hgt); bg.setAttribute('fill', '#fffdf8');
    clone.insertBefore(bg, style.nextSibling);
    const title = document.createElementNS(SVGNS, 'text');
    title.setAttribute('x', x0 - pad + 20); title.setAttribute('y', y0 - pad + 34);
    title.setAttribute('style', 'font-size:20px;font-weight:700;fill:#2a2521');
    title.textContent = p.title + '　相関図';
    clone.appendChild(title);
    const data = new XMLSerializer().serializeToString(clone);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = w * 2;
      c.height = hgt * 2;
      c.getContext('2d').drawImage(img, 0, 0);
      c.toBlob((blob) => { if (blob) { UI.download(UI.safeFilename(p.title) + '_相関図.png', blob); toast('相関図を書き出しました'); } }, 'image/png');
    };
    img.onerror = () => toast('書き出せませんでした', 'error');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(data);
  }

  NS.RelMap = { mount, KINDS, KIND, guessKind, kindOf, computeLayout, refit: () => { if (R) fitView(); } };
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
<script>
// js/views/ideas.js
/*
 * 綴り — アイデア帳 と プロットボード
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const { h, icon, btn, clear, toast } = UI;
  const KINDS = ['アイデア', '台詞', 'シーン', '設定', '伏線', 'タイトル案', '読み方', '資料'];

  function P() { return NS.App.project; }
  function touch() { NS.App.touch(); }

  // ───── 伏線 ─────
  function chapterLabel(p, id) {
    if (!id) return '';
    const i = p.chapters.findIndex((c) => c.id === id);
    return i < 0 ? '（削除された話）' : `第${i + 1}話`;
  }
  function chapterSelect(p, value, label, allowEmpty) {
    return h('select', { class: 'input', 'aria-label': label },
      allowEmpty !== false ? h('option', { value: '' }, '（未定）') : null,
      p.chapters.map((c, i) => h('option', { value: c.id, selected: c.id === value }, `${i + 1}. ${c.title || '無題'}`)));
  }
  /** 伏線の状態の表示（張った話 → 回収する話） */
  function foreshadowLine(p, it) {
    const planted = chapterLabel(p, it.plantedIn);
    const payoff = chapterLabel(p, it.payoffIn);
    return h('div', { class: 'fs-line' },
      h('span', { class: 'fs-badge' + (it.resolved ? ' done' : '') }, it.resolved ? '回収済み' : '未回収'),
      h('span', { class: 'small muted' }, `${planted ? '張った：' + planted : '張った話：未設定'}${payoff ? '　→　' + (it.resolved ? '回収：' : '回収予定：') + payoff : ''}`));
  }
  const unresolvedCount = (p) => p.ideas.filter((i) => i.kind === '伏線' && !i.resolved).length;

  // ───────────── アイデア帳 ─────────────
  const Ideas = {};
  let IS = null;

  Ideas.mount = function (view) {
    IS = { view, q: '', kind: '', tag: '', pinnedOnly: false };
    build();
  };
  Ideas.unmount = function () { IS = null; };

  function build() {
    clear(IS.view);
    const wrap = h('div', { class: 'ideas' });
    IS.view.appendChild(wrap);

    // すばやくメモ
    const body = h('textarea', { class: 'input quick-input', rows: 3, placeholder: '思いついたことをすぐメモ（Ctrl+Enterで追加）\n例：主人公の剣は、実は亡き師匠の形見だった' });
    const kindSel = h('select', { class: 'input', 'aria-label': '種類' }, KINDS.map((k) => h('option', { value: k }, k)));
    const tags = h('input', { class: 'input', type: 'text', placeholder: 'タグ（、区切り）', 'aria-label': 'タグ' });
    // 種類「読み方」のときは、表記と読みを入れる欄を出す
    const word = h('input', { class: 'input', type: 'text', placeholder: '表記（例：足）', 'aria-label': '表記' });
    const reading = h('input', { class: 'input', type: 'text', placeholder: '読み（例：アルファ）', 'aria-label': '読み' });
    const readingRow = h('div', { class: 'reading-inputs', hidden: true },
      h('span', { class: 'small muted' }, '普段とは違う読み方を登録すると、そのルビは添削で指摘しなくなります。'),
      h('div', { class: 'row' }, word, h('span', { class: 'muted' }, '《'), reading, h('span', { class: 'muted' }, '》')));
    const cur = NS.App.currentChapter && NS.App.currentChapter();
    const plantSel = chapterSelect(P(), cur ? cur.id : '', '伏線を張った話');
    const payoffSel = chapterSelect(P(), '', '回収する話');
    const fsRow = h('div', { class: 'reading-inputs', hidden: true },
      h('span', { class: 'small muted' }, '伏線は「張った話」と「回収する話」を記録しておくと、未回収のものを一覧できます。'),
      h('div', { class: 'row wrap' }, h('label', { class: 'small speak-opt' }, '張った話', plantSel), h('label', { class: 'small speak-opt' }, '回収する話', payoffSel)));
    kindSel.addEventListener('change', () => {
      const isReading = kindSel.value === '読み方';
      fsRow.hidden = kindSel.value !== '伏線';
      readingRow.hidden = !isReading;
      body.placeholder = isReading ? 'メモ（任意）：使う場面、由来など' : '思いついたことをすぐメモ（Ctrl+Enterで追加）\n例：主人公の剣は、実は亡き師匠の形見だった';
      if (isReading) word.focus();
    });
    const add = () => {
      const v = body.value.trim();
      const isReading = kindSel.value === '読み方';
      if (isReading && (!word.value.trim() || !reading.value.trim())) { (word.value.trim() ? reading : word).focus(); toast('表記と読みを入れてください'); return; }
      if (!isReading && !v) { body.focus(); return; }
      P().ideas.unshift(Object.assign({
        id: UI.uid('i'), body: v, kind: kindSel.value, tags: splitTags(tags.value), color: '', pinned: false,
        createdAt: Date.now(), updatedAt: Date.now(),
      }, isReading ? { word: word.value.trim().replace(/^[|｜]/, ''), reading: reading.value.trim() } : {},
      kindSel.value === '伏線' ? { plantedIn: plantSel.value, payoffIn: payoffSel.value, resolved: false } : {}));
      touch();
      body.value = '';
      word.value = '';
      reading.value = '';
      renderFilters();
      renderGrid();
      body.focus();
      toast('メモしました');
    };
    body.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); add(); } });
    [word, reading].forEach((el) => el.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); add(); } }));
    wrap.appendChild(h('section', { class: 'quick-add card' },
      readingRow,
      fsRow,
      body,
      h('div', { class: 'row wrap' }, kindSel, tags, btn('メモする', { icon: 'plus', primary: true, onClick: add }))));

    IS.filters = h('div', { class: 'idea-filters' });
    IS.grid = h('div', { class: 'idea-grid' });
    wrap.append(IS.filters, IS.grid);
    renderFilters();
    renderGrid();
  }

  function splitTags(s) {
    return String(s || '').split(/[、,，\s#＃]+/).map((t) => t.trim()).filter(Boolean);
  }

  function renderFilters() {
    const p = P();
    clear(IS.filters);
    const search = h('input', {
      class: 'input', type: 'search', placeholder: 'メモを検索', value: IS.q, 'aria-label': 'メモを検索',
      oninput: (e) => { IS.q = e.target.value; renderGrid(); },
    });
    const allTags = {};
    p.ideas.forEach((i) => i.tags.forEach((t) => { allTags[t] = (allTags[t] || 0) + 1; }));
    const chip = (label, active, onClick) => h('button', { type: 'button', class: 'chip' + (active ? ' active' : ''), onclick: onClick }, label);
    IS.filters.append(
      search,
      h('div', { class: 'chips' },
        chip('すべて', !IS.kind && !IS.tag && !IS.pinnedOnly && !IS.unresolved, () => { IS.kind = ''; IS.tag = ''; IS.pinnedOnly = false; IS.unresolved = false; renderFilters(); renderGrid(); }),
        chip('ピン留め', IS.pinnedOnly, () => { IS.pinnedOnly = !IS.pinnedOnly; renderFilters(); renderGrid(); }),
        unresolvedCount(p) ? chip(`未回収の伏線 ${unresolvedCount(p)}`, IS.unresolved, () => { IS.unresolved = !IS.unresolved; renderFilters(); renderGrid(); }) : null,
        KINDS.filter((k) => p.ideas.some((i) => i.kind === k)).map((k) => chip(k, IS.kind === k, () => { IS.kind = IS.kind === k ? '' : k; renderFilters(); renderGrid(); })),
        Object.keys(allTags).sort().map((t) => chip('#' + t, IS.tag === t, () => { IS.tag = IS.tag === t ? '' : t; renderFilters(); renderGrid(); }))));
  }

  function renderGrid() {
    const p = P();
    clear(IS.grid);
    const q = IS.q.trim();
    const list = p.ideas
      .filter((i) => (!q || (i.body + ' ' + (i.word || '') + ' ' + (i.reading || '')).indexOf(q) >= 0 || i.tags.some((t) => t.indexOf(q) >= 0)) && (!IS.kind || i.kind === IS.kind) && (!IS.tag || i.tags.indexOf(IS.tag) >= 0) && (!IS.pinnedOnly || i.pinned) && (!IS.unresolved || (i.kind === '伏線' && !i.resolved)))
      .sort((a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt));
    if (!list.length) {
      IS.grid.appendChild(h('div', { class: 'empty' }, p.ideas.length ? '条件に合うメモはありません' : 'まだメモがありません。思いついたことは何でも上の欄に書き留めておきましょう。'));
      return;
    }
    list.forEach((it) => IS.grid.appendChild(ideaCard(it)));
  }

  function ideaCard(it) {
    const p = P();
    const lines = it.body.split('\n');
    const more = btn('', { icon: 'more', ghost: true, small: true, title: 'その他' });
    more.addEventListener('click', (e) => {
      e.stopPropagation();
      UI.menu(more, [
        { label: '編集', icon: 'pen', onClick: () => editIdea(it) },
        { label: it.pinned ? 'ピン留めを外す' : 'ピン留め', icon: 'pin', onClick: () => { it.pinned = !it.pinned; touch(); renderGrid(); } },
        it.kind === '伏線' ? { label: it.resolved ? '未回収に戻す' : '回収済みにする', icon: 'check', onClick: () => { it.resolved = !it.resolved; it.updatedAt = Date.now(); touch(); renderFilters(); renderGrid(); } } : null,
        { label: 'プロットボードに送る', icon: 'columns', onClick: () => {
          p.plot.cards.push({ id: UI.uid('c'), columnId: p.plot.columns[0].id, title: lines[0].slice(0, 40), body: lines.slice(1).join('\n'), chapterId: '', color: it.color });
          touch();
          toast('プロットボードの「' + p.plot.columns[0].title + '」に追加しました');
        } },
        { label: '今の話のメモに追記', icon: 'pen', onClick: () => {
          const ch = NS.App.currentChapter();
          if (!ch) return;
          ch.memo = (ch.memo ? ch.memo + '\n' : '') + it.body;
          touch();
          toast(`「${ch.title}」のメモに追記しました`);
        } },
        null,
        { label: '削除', icon: 'trash', danger: true, onClick: async () => {
          if (!(await UI.confirm('このメモを削除します。', { danger: true, okLabel: '削除' }))) return;
          p.ideas.splice(p.ideas.indexOf(it), 1);
          touch();
          renderFilters();
          renderGrid();
        } },
      ]);
    });
    return h('article', {
      class: 'idea-card' + (it.pinned ? ' pinned' : ''), tabindex: 0, style: { borderTopColor: it.color || 'transparent' },
      ondblclick: () => editIdea(it),
      onkeydown: (e) => { if (e.key === 'Enter') editIdea(it); },
    },
    h('div', { class: 'idea-head' },
      h('span', { class: 'kind-badge' }, it.kind || 'アイデア'),
      it.pinned ? icon('pin', 14) : null,
      h('span', { class: 'muted small idea-date' }, UI.relTime(it.updatedAt)),
      more),
    it.word && it.reading
      ? h('div', { class: 'idea-body' }, h('div', { class: 'reading-big', html: NS.Text.rubyToHtml('|' + it.word + '《' + it.reading + '》', { vertical: false }) }), it.body ? h('p', null, it.body) : null)
      : h('div', { class: 'idea-body' }, h('strong', null, lines[0]), lines.length > 1 ? h('p', null, lines.slice(1).join('\n')) : null),
    it.kind === '伏線' ? foreshadowLine(p, it) : null,
    it.tags.length ? h('div', { class: 'idea-tags' }, it.tags.map((t) => h('span', { class: 'tag' }, '#' + t))) : null);
  }

  function editIdea(it) {
    const body = h('textarea', { class: 'input', rows: 8, value: it.body });
    const word = h('input', { class: 'input', type: 'text', value: it.word || '', placeholder: '表記' });
    const reading = h('input', { class: 'input', type: 'text', value: it.reading || '', placeholder: '読み' });
    const kindSel = h('select', { class: 'input' }, KINDS.map((k) => h('option', { value: k, selected: it.kind === k }, k)));
    const tags = h('input', { class: 'input', type: 'text', value: it.tags.join('、') });
    const p = P();
    const plantSel = chapterSelect(p, it.plantedIn || '', '伏線を張った話');
    const payoffSel = chapterSelect(p, it.payoffIn || '', '回収する話');
