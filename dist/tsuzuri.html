  const renderStatusSoon = UI.debounce(() => { if (S) { renderStatus(); renderChapterList(); } }, 500);

  function scheduleAnalysis() {
    if (S.analysisTimer) clearTimeout(S.analysisTimer);
    S.analysisTimer = setTimeout(() => runAnalysis(), 450);
  }

  function runAnalysis(refreshPanel) {
    if (!S) return;
    const p = P();
    const st = App().settings;
    const text = S.textarea.value;
    const ignore = new Set(S.ch.ignored);
    const corpus = p.chapters.map((c) => (c.id === S.ch.id ? text : c.body));
    let proof = [];
    try {
      proof = NS.Proofread.proofread(text, {
        rules: st.rules, maxSentenceLength: st.maxSentenceLength, maxCommas: st.maxCommas, endingRepeat: st.endingRepeat,
        styleRules: p.rules.style, corpus, ignore,
        readings: NS.Readings ? NS.Readings.index(NS.Readings.collect(p)) : null,
      });
    } catch (e) { console.error(e); }
    let cons = { issues: [], speakers: [], candidates: [] };
    try {
      cons = NS.Consistency.check(text, {
        entries: p.entries, rules: p.rules, chapterNo: p.chapters.findIndex((c) => c.id === S.ch.id) + 1,
        enabled: st.consistency, ignore,
      });
    } catch (e) { console.error(e); }
    S.cons = cons;
    const ai = (S.aiIssues || []).filter((x) => text.slice(x.start, x.end) === x.text);
    S.aiIssues = ai;
    S.issues = proof.concat(cons.issues, ai).sort((a, b) => a.start - b.start || SEV_ORDER[b.severity] - SEV_ORDER[a.severity]);
    S.issues.forEach((it, i) => { it.idx = i; });
    if (S.active >= S.issues.length) S.active = -1;
    renderBackdrop();
    fitTextarea();
    renderBadges();
    if (refreshPanel !== false && (S.panelTab === 'proof' || S.panelTab === 'cons' || refreshPanel)) renderPanel();
  }

  V.addAiIssues = function (items, chapterId) {
    if (!S || (chapterId && chapterId !== S.ch.id)) return;
    S.aiIssues = (S.aiIssues || []).concat(items);
    runAnalysis();
  };
  V.clearAiIssues = function (chapterId) {
    if (!S || (chapterId && chapterId !== S.ch.id)) return;
    S.aiIssues = [];
    runAnalysis();
  };
  V.getText = function () { return S ? S.textarea.value : ''; };
  V.getSelection = function () {
    if (!S) return null;
    const { selectionStart: a, selectionEnd: b } = S.textarea;
    return a !== b ? { start: a, end: b, text: S.textarea.value.slice(a, b) } : null;
  };
  V.chapter = function () { return S ? S.ch : null; };
  V.focusRange = function (start, end) { focusRange(start, end); };
  V.replaceRange = function (start, end, text) { replaceRange(start, end, text); };

  /** 重なりのある指摘を平坦化してハイライト用の HTML を作る */
  function renderBackdrop() {
    const text = S.textarea.value;
    const marks = [];
    S.issues.forEach((it) => {
      if (it.end > it.start) marks.push({ s: it.start, e: it.end, cls: 'mk sev-' + it.severity + (it.source === 'ai' ? ' mk-ai' : ''), i: it.idx, pri: SEV_ORDER[it.severity] * 10 });
    });
    if (S.find.open) {
      S.find.matches.forEach((m, i) => marks.push({ s: m.start, e: m.end, cls: 'mk-find' + (i === S.find.cur ? ' cur' : ''), i: -1, pri: 100 }));
    }
    const bounds = new Set([0, text.length]);
    marks.forEach((m) => { bounds.add(Math.max(0, Math.min(text.length, m.s))); bounds.add(Math.max(0, Math.min(text.length, m.e))); });
    const pts = Array.from(bounds).sort((a, b) => a - b);
    // 区間ごとに優先度の高い印を選ぶ（指摘数が多くても速いよう開始位置で並べて走査）
    marks.sort((a, b) => a.s - b.s);
    let html = '';
    let mi = 0;
    const activeSet = [];
    for (let k = 0; k < pts.length - 1; k++) {
      const a = pts[k];
      const b = pts[k + 1];
      while (mi < marks.length && marks[mi].s <= a) { activeSet.push(marks[mi]); mi++; }
      for (let j = activeSet.length - 1; j >= 0; j--) if (activeSet[j].e <= a) activeSet.splice(j, 1);
      const seg = T.escapeHtml(text.slice(a, b));
      if (!activeSet.length) { html += seg; continue; }
      let best = activeSet[0];
      activeSet.forEach((m) => {
        if (m.pri > best.pri || (m.pri === best.pri && (m.e - m.s) < (best.e - best.s))) best = m;
      });
      const isActive = best.i >= 0 && best.i === S.active;
      html += '<mark class="' + best.cls + (isActive ? ' active' : '') + '" data-i="' + best.i + '">' + seg + '</mark>';
    }
    S.backdrop.innerHTML = html + '\n​';
  }

  function onCaret() {
    const pos = S.textarea.selectionStart;
    let found = -1;
    let best = 0;
    S.issues.forEach((it, i) => {
      if (pos >= it.start && pos <= it.end && SEV_ORDER[it.severity] > best) { found = i; best = SEV_ORDER[it.severity]; }
    });
    setActive(found, false);
  }

  function setActive(i, scroll) {
    S.active = i;
    renderBackdrop();
    renderIssueBar();
    S.panelBody.querySelectorAll('.issue-card').forEach((c) => c.classList.toggle('active', +c.dataset.i === i));
    if (i >= 0) {
      const card = S.panelBody.querySelector('.issue-card[data-i="' + i + '"]');
      if (card && !scroll) card.scrollIntoView({ block: 'nearest' });
    }
  }

  function focusRange(start, end) {
    if (S.preview) togglePreview();
    S.textarea.focus({ preventScroll: true });
    S.textarea.setSelectionRange(start, end);
    // ハイライトの位置を使ってスクロール
    const probe = document.createElement('span');
    const text = S.textarea.value;
    S.backdrop.textContent = text.slice(0, start);
    probe.textContent = text.slice(start, end) || '​';
    S.backdrop.appendChild(probe);
    const top = probe.getBoundingClientRect().top - S.scroll.getBoundingClientRect().top + S.scroll.scrollTop;
    renderBackdrop();
    S.scroll.scrollTop = Math.max(0, top - S.scroll.clientHeight / 3);
  }

  function replaceRange(start, end, str) {
    const ta = S.textarea;
    ta.focus({ preventScroll: true });
    ta.setSelectionRange(start, end);
    let ok = false;
    try {
      ok = str === '' ? document.execCommand('delete') : document.execCommand('insertText', false, str);
    } catch (e) { ok = false; }
    if (!ok || ta.value.slice(start, start + str.length) !== str) {
      if (ta.value.slice(start, start + str.length) !== str) {
        ta.setRangeText(str, start, end, 'end');
        ta.dispatchEvent(new Event('input'));
      }
    }
  }

  function applyIssue(it) {
    const text = S.textarea.value;
    if (it.suggestion == null) return;
    if (text.slice(it.start, it.end) !== it.text) { toast('本文が変わったため適用できません。再チェックします'); runAnalysis(); return; }
    replaceRange(it.start, it.end, it.suggestion);
    S.active = -1;
    renderIssueBar();
    runAnalysis();
  }

  function ignoreIssue(it) {
    if (S.ch.ignored.indexOf(it.key) < 0) S.ch.ignored.push(it.key);
    App().touch();
    toast(`「${it.text.slice(0, 12)}」の指摘をこの話で無視します`);
    S.active = -1;
    renderIssueBar();
    runAnalysis();
  }

  function disableRule(it) {
    const st = App().settings;
    if (it.source === 'consistency') st.consistency[it.ruleId] = false;
    else st.rules[it.ruleId] = false;
    App().saveSettings();
    toast(`「${it.rule}」を無効にしました（設定から戻せます）`);
    runAnalysis();
  }

  function renderIssueBar() {
    const it = S.issues[S.active];
    clear(S.issueBar);
    if (!it) { S.issueBar.hidden = true; return; }
    S.issueBar.hidden = false;
    S.issueBar.append(
      h('span', { class: 'sev-dot sev-' + it.severity }),
      h('span', { class: 'issue-bar-msg' }, h('strong', null, it.rule), '　', it.message),
      it.suggestion != null ? btn(it.suggestion === '' ? '削除する' : `「${trunc(it.suggestion, 10)}」にする`, { small: true, primary: true, onClick: () => applyIssue(it) }) : null,
      actionButton(it),
      btn('無視', { small: true, ghost: true, onClick: () => ignoreIssue(it) }),
      btn('', { icon: 'x', small: true, ghost: true, title: '閉じる', onClick: () => setActive(-1) }));
  }

  function trunc(s, n) {
    s = String(s).replace(/\n/g, '↵');
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  // ───── 挿入系 ─────
  function insertText(str) {
    const ta = S.textarea;
    replaceRange(ta.selectionStart, ta.selectionEnd, str);
  }

  function wrapOrInsert(open, close) {
    const ta = S.textarea;
    const a = ta.selectionStart;
    const b = ta.selectionEnd;
    const sel = ta.value.slice(a, b);
    replaceRange(a, b, open + sel + close);
    const caret = sel ? a + open.length + sel.length + close.length : a + open.length;
    ta.setSelectionRange(caret, caret);
  }

  async function insertRuby() {
    const ta = S.textarea;
    const a = ta.selectionStart;
    const b = ta.selectionEnd;
    const sel = ta.value.slice(a, b);
    if (!sel) {
      replaceRange(a, b, '|《》');
      ta.setSelectionRange(a + 1, a + 1);
      toast('「|」と「《」の間に親文字、《》の中に読みを入力します');
      return;
    }
    const r = await UI.prompt(`「${trunc(sel, 12)}」の読み（ルビ）`, '', { placeholder: 'よみがな' });
    if (!r) return;
    replaceRange(a, b, '|' + sel + '《' + r + '》');
  }

  // ───── 検索・置換 ─────
  function openFind() {
    S.find.open = true;
    S.findBar.hidden = false;
    const sel = V.getSelection();
    if (sel && sel.text.length < 40 && sel.text.indexOf('\n') < 0) S.find.q = sel.text;
    renderFindBar();
    computeFind();
    renderBackdrop();
    const inp = S.findBar.querySelector('input');
    inp.focus();
    inp.select();
  }

  function closeFind() {
    S.find.open = false;
    S.findBar.hidden = true;
    renderBackdrop();
    S.textarea.focus();
  }

  function computeFind() {
    const q = S.find.q;
    const text = S.textarea.value;
    S.find.matches = [];
    if (q) {
      let i = text.indexOf(q);
      while (i >= 0 && S.find.matches.length < 2000) {
        S.find.matches.push({ start: i, end: i + q.length });
        i = text.indexOf(q, i + q.length);
      }
    }
    if (S.find.cur >= S.find.matches.length) S.find.cur = S.find.matches.length ? 0 : -1;
    const c = S.findBar.querySelector('.find-count');
    if (c) c.textContent = S.find.matches.length ? `${S.find.cur + 1}/${S.find.matches.length}` : (q ? '0件' : '');
  }

  function findStep(d) {
    const n = S.find.matches.length;
    if (!n) return;
    S.find.cur = (S.find.cur + d + n) % n;
    const m = S.find.matches[S.find.cur];
    computeFind();
    focusRange(m.start, m.end);
    S.findBar.querySelector('input').focus();
  }

  function renderFindBar() {
    clear(S.findBar);
    const q = h('input', {
      class: 'input', type: 'search', value: S.find.q, placeholder: '検索', 'aria-label': '検索する語',
      oninput: (e) => { S.find.q = e.target.value; S.find.cur = 0; computeFind(); renderBackdrop(); },
      onkeydown: (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); } },
    });
    const r = h('input', {
      class: 'input', type: 'text', value: S.find.r, placeholder: '置換後', 'aria-label': '置換後の語',
      oninput: (e) => { S.find.r = e.target.value; },
    });
    S.findBar.append(
      q, h('span', { class: 'find-count muted small' }),
      btn('', { icon: 'up', ghost: true, small: true, title: '前へ', onClick: () => findStep(-1) }),
      btn('', { icon: 'down', ghost: true, small: true, title: '次へ', onClick: () => findStep(1) }),
      r,
      btn('置換', { small: true, onClick: () => {
        const m = S.find.matches[S.find.cur];
        if (!m) return;
        replaceRange(m.start, m.end, S.find.r);
        computeFind();
        findStep(0);
      } }),
      btn('この話ですべて置換', { small: true, onClick: () => replaceAll(false) }),
      btn('全話で置換', { small: true, onClick: () => replaceAll(true) }),
      btn('', { icon: 'x', ghost: true, small: true, title: '閉じる', onClick: closeFind }));
  }

  async function replaceAll(allChapters) {
    const q = S.find.q;
    if (!q) return;
    const rep = S.find.r;
    const p = P();
    syncBody();
    let count = 0;
    const targets = allChapters ? p.chapters : [S.ch];
    targets.forEach((c) => { count += c.body.split(q).length - 1; });
    if (!count) { toast('見つかりませんでした'); return; }
    if (!(await UI.confirm(`${allChapters ? '全話' : 'この話'}の「${q}」${count}件を「${rep}」に置き換えます。`, { okLabel: '置換' }))) return;
    targets.forEach((c) => {
      if (c.body.indexOf(q) < 0) return;
      if (allChapters) pushSnapshot(c, '置換前（' + q + '→' + rep + '）', true);
      c.body = c.body.split(q).join(rep);
      c.updatedAt = Date.now();
    });
    S.textarea.value = S.ch.body;
    S.lastText = S.ch.body;
    App().touch();
    computeFind();
    runAnalysis();
    renderChapterList();
    toast(count + '件を置換しました');
  }

  // ───── 縦書きプレビュー ─────
  function togglePreview() {
    S.preview = !S.preview;
    S.previewBtn.classList.toggle('active', S.preview);
    S.scroll.hidden = S.preview;
    S.previewEl.hidden = !S.preview;
    if (S.preview) {
      const paras = S.textarea.value.split('\n').map((line) => (line.trim() ? '<p>' + T.rubyToHtml(line) + '</p>' : '<p class="blank">　</p>'));
      S.previewEl.innerHTML = '<div class="tate"><h1 class="tate-title">' + T.escapeHtml(S.ch.title) + '</h1>' + paras.join('') + '</div>';
      S.previewEl.onwheel = (e) => {
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { S.previewEl.scrollLeft -= e.deltaY; e.preventDefault(); }
      };
      S.previewEl.focus();
    }
  }

  // ───── 版の保存（履歴） ─────
  function pushSnapshot(c, label, auto) {
    const last = c.snapshots[0];
    if (last && last.body === c.body) return false;
    c.snapshots.unshift({ id: UI.uid('s'), at: Date.now(), label: label || '', body: c.body, auto: !!auto, chars: T.stats(c.body).charsNoSpace });
    // 自動保存分から古い順に間引く
    while (c.snapshots.length > 30) {
      let k = -1;
      for (let i = c.snapshots.length - 1; i >= 0; i--) if (c.snapshots[i].auto) { k = i; break; }
      c.snapshots.splice(k >= 0 ? k : c.snapshots.length - 1, 1);
    }
    App().touch();
    return true;
  }

  function autoSnapshot() {
    if (!S) return;
    syncBody();
    const c = S.ch;
    if (c.body === S.openedBody) return;
    const lastAuto = c.snapshots.find((s) => s.auto);
    if (lastAuto && Date.now() - lastAuto.at < 10 * 60 * 1000 && c.snapshots[0] === lastAuto) {
      lastAuto.body = c.body;
      lastAuto.at = Date.now();
      lastAuto.chars = T.stats(c.body).charsNoSpace;
      App().touch();
      return;
    }
    pushSnapshot(c, '自動保存', true);
  }

  function openHistory() {
    syncBody();
    const c = S.ch;
    const list = h('div', { class: 'snapshot-list' });
    const render = () => {
      clear(list);
      if (!c.snapshots.length) list.appendChild(h('p', { class: 'muted' }, 'まだ保存した版はありません。'));
      c.snapshots.forEach((s, i) => {
        list.appendChild(h('div', { class: 'snapshot' },
          h('div', { class: 'snapshot-meta' },
            h('strong', null, s.label || (s.auto ? '自動保存' : '手動保存')),
            h('span', { class: 'muted small' }, UI.fmtDate(s.at, true) + '・' + UI.fmtNum(s.chars || 0) + '字')),
          h('div', { class: 'row' },
            btn('見る', { small: true, ghost: true, onClick: () => UI.modal({ title: s.label || UI.fmtDate(s.at, true), wide: true, body: h('pre', { class: 'snapshot-text' }, s.body) }) }),
            btn('この版に戻す', { small: true, onClick: async () => {
              if (!(await UI.confirm('今の本文を版として保存してから、この版に戻します。'))) return;
              pushSnapshot(c, '復元前の状態', false);
              S.textarea.value = s.body;
              onInput();
              runAnalysis();
              closeFn();
              toast('復元しました');
            } }),
            btn('', { icon: 'trash', small: true, ghost: true, title: '削除', onClick: () => { c.snapshots.splice(i, 1); App().touch(); render(); } }))));
      });
    };
    render();
    const closeFn = UI.modal({
      title: '版の保存と履歴：' + c.title, wide: true,
      body: h('div', { class: 'stack' },
        h('p', { class: 'muted small' }, '大きく書き直す前に「今の版を保存」しておくと、いつでも戻せます。話を切り替えたときにも自動で保存されます（最大30件）。'),
        h('div', { class: 'row' }, btn('今の版を保存', { icon: 'save', primary: true, onClick: async () => {
          const label = await UI.prompt('版の名前（任意）', '', { placeholder: '例：初稿、推敲前' });
          if (label == null) return;
          if (pushSnapshot(c, label, false)) toast('保存しました'); else toast('前回の版から変更がありません');
          render();
        } })),
        list),
    });
  }

  // ───── 状態表示 ─────
  function renderStatus() {
    const st = T.stats(S.textarea.value);
    const p = P();
    const today = App().todayWritten();
    const goal = p.goal.daily || 0;
    const pct = goal ? Math.min(100, Math.round((today / goal) * 100)) : 0;
    clear(S.status);
    S.status.append(
      h('span', { title: '空白・改行を除く文字数' }, h('strong', null, UI.fmtNum(st.charsNoSpace)), '字'),
      h('span', { title: '400字詰め原稿用紙換算' }, '原稿用紙 ', h('strong', null, st.pages), '枚'),
      h('span', { class: 'status-today', title: '今日書いた文字数 / 1日の目標' },
        '今日 ', h('strong', null, (today >= 0 ? '+' : '') + UI.fmtNum(today)), goal ? ' / ' + UI.fmtNum(goal) : '',
        goal ? h('span', { class: 'meter' }, h('span', { style: { width: pct + '%' } })) : null),
      h('span', { class: 'status-issues' }, issueSummary()));
  }

  function issueSummary() {
    const c = { error: 0, warning: 0, info: 0 };
    S.issues.forEach((i) => { c[i.severity]++; });
    return h('span', null,
      h('span', { class: 'sev-dot sev-error' }), c.error, ' ',
      h('span', { class: 'sev-dot sev-warning' }), c.warning, ' ',
      h('span', { class: 'sev-dot sev-info' }), c.info);
  }

  function renderBadges() {
    const proof = S.issues.filter((i) => i.source === 'proofread').length;
    const cons = S.issues.filter((i) => i.source === 'consistency').length;
    const ai = S.issues.filter((i) => i.source === 'ai').length;
    S.panelTabs.querySelectorAll('[data-badge]').forEach((b) => {
      const n = { proof, cons, ai }[b.dataset.badge];
      b.textContent = n ? String(n) : '';
    });
    renderStatusSoon();
  }

  // ───── パネル ─────
  function renderPanel() {
    if (!S) return;
    S.panelTabs.querySelectorAll('.tab').forEach((t) => {
      t.classList.toggle('active', t.dataset.tab === S.panelTab);
      t.setAttribute('aria-selected', t.dataset.tab === S.panelTab ? 'true' : 'false');
    });
    clear(S.panelBody);
    const fn = { proof: panelProof, cons: panelCons, ai: panelAI, ref: panelRef, stats: panelStats }[S.panelTab];
    S.panelBody.appendChild(fn());
    renderBadges();
  }

  function issueCard(it) {
    const text = S.textarea.value;
    const before = text.slice(Math.max(0, it.start - 14), it.start).replace(/\n/g, '↵');
    const after = text.slice(it.end, it.end + 14).replace(/\n/g, '↵');
    const more = btn('', { icon: 'more', ghost: true, small: true, title: 'その他' });
    more.addEventListener('click', (e) => {
      e.stopPropagation();
      UI.menu(more, [
        { label: 'この指摘を無視', icon: 'eye', onClick: () => ignoreIssue(it) },
        it.source !== 'ai' ? { label: `「${it.rule}」を無効にする`, icon: 'x', onClick: () => disableRule(it) } : null,
      ].filter(Boolean));
    });
    return h('div', {
      class: 'issue-card' + (it.idx === S.active ? ' active' : ''), dataset: { i: it.idx }, tabindex: 0,
      onclick: () => { setActive(it.idx, true); focusRange(it.start, it.end); },
      onkeydown: (e) => { if (e.key === 'Enter') { setActive(it.idx, true); focusRange(it.start, it.end); } },
    },
    h('div', { class: 'issue-head' },
      h('span', { class: 'sev-dot sev-' + it.severity, title: SEV_LABEL[it.severity] }),
      h('span', { class: 'issue-rule' }, it.rule),
      h('span', { class: 'issue-cat' }, it.category),
      more),
    h('div', { class: 'issue-excerpt' }, h('span', { class: 'ctx' }, before), h('mark', null, trunc(it.text, 40) || '　'), h('span', { class: 'ctx' }, after)),
    h('div', { class: 'issue-msg' }, it.message),
    it.suggestion != null || it.action ? h('div', { class: 'issue-actions' },
      it.suggestion != null ? btn(it.suggestion === '' ? '削除する' : `「${trunc(it.suggestion, 14)}」にする`, {
        small: true, onClick: (e) => { e.stopPropagation(); applyIssue(it); },
      }) : null,
      actionButton(it)) : null);
  }

  /** 指摘に付いた追加の操作（読み方の登録など） */
  function actionButton(it) {
    if (!it.action || it.action.type !== 'register-reading') return null;
    return btn('読み方として登録', {
      small: true, icon: 'bulb', onClick: (e) => { if (e) e.stopPropagation(); registerReading(it.action.base, it.action.reading); },
    });
  }

  function registerReading(base, reading) {
    const p = P();
    p.ideas.unshift({
      id: UI.uid('i'), kind: '読み方', word: base, reading, body: '', tags: ['読み方'], color: '', pinned: false,
      createdAt: Date.now(), updatedAt: Date.now(),
    });
    App().touch();
    S.active = -1;
    renderIssueBar();
    runAnalysis(true);
    toast(`アイデア帳に読み方「${base}《${reading}》」を登録しました。以後このルビは指摘しません`);
  }

  function issueList(items, empty) {
    const box = h('div', { class: 'issue-list' });
    if (!items.length) { box.appendChild(h('div', { class: 'empty small' }, empty)); return box; }
    items.slice(0, 400).forEach((it) => box.appendChild(issueCard(it)));
    if (items.length > 400) box.appendChild(h('p', { class: 'muted small' }, `ほか${items.length - 400}件`));
    return box;
  }

  function panelProof() {
    const all = S.issues.filter((i) => i.source === 'proofread');
    const cats = ['all'].concat(Array.from(new Set(all.map((i) => i.category))));
    const items = S.filter === 'all' || cats.indexOf(S.filter) < 0 ? all : all.filter((i) => i.category === S.filter);
    const fixable = all.filter((i) => i.fixable && i.ruleId !== 'hyouki');
    const chips = h('div', { class: 'chips' }, cats.map((c) => h('button', {
      type: 'button', class: 'chip' + ((S.filter === c || (c === 'all' && cats.indexOf(S.filter) < 0)) ? ' active' : ''),
      onclick: () => { S.filter = c; renderPanel(); },
    }, c === 'all' ? `すべて ${all.length}` : `${c} ${all.filter((i) => i.category === c).length}`)));
    return h('div', { class: 'stack-sm' },
      h('div', { class: 'panel-intro' },
        h('p', { class: 'small muted' }, '本文を書くと自動でチェックします。指摘をクリックすると本文の該当箇所へ移動します。'),
        fixable.length ? btn(`記号・表記をまとめて修正（${fixable.length}件）`, { small: true, icon: 'check', onClick: async () => {
          if (!(await UI.confirm(`誤字・記号の作法・表記など、提案のある${fixable.length}件をまとめて修正します。（表記ゆれは対象外）`, { okLabel: '修正' }))) return;
          syncBody();
          pushSnapshot(S.ch, '一括修正前', true);
          const fixed = NS.Proofread.applyFixes(S.textarea.value, fixable);
          S.textarea.value = fixed;
          onInput();
          runAnalysis();
          toast('まとめて修正しました（履歴から元に戻せます）');
        } }) : null),
      chips,
      issueList(items, all.length ? 'この分類の指摘はありません' : '指摘はありません。'));
  }

  function panelCons() {
    const p = P();
    const items = S.issues.filter((i) => i.source === 'consistency');
    const wrap = h('div', { class: 'stack-sm' });
    if (!p.entries.length && !p.rules.ng.length) {
      wrap.appendChild(h('div', { class: 'empty' },
        h('p', null, '設定資料に人物・場所・用語を登録すると、名前の表記ゆれ、一人称や呼び方、髪や瞳の色、年齢、退場後の登場などの食い違いをチェックします。'),
        btn('設定資料を開く', { icon: 'users', onClick: () => App().navigate('lore') })));
    }
    wrap.appendChild(issueList(items, '設定との食い違いは見つかりませんでした。'));

    // 話者推定
    const sp = (S.cons && S.cons.speakers) || [];
    const dCount = T.analyze(S.textarea.value).dialogues.length;
    if (dCount) {
      const counts = {};
      sp.forEach((s) => { counts[s.name] = (counts[s.name] || 0) + 1; });
      wrap.appendChild(h('details', { class: 'sub-section', open: true },
        h('summary', null, `台詞の話者（推定） ${sp.length}/${dCount}`),
        h('p', { class: 'small muted' }, '「」の直前・直後の「〇〇は」「〇〇が」や「〇〇「…」」の形から推定しています。一人称・呼び方のチェックはこの推定に基づきます。'),
        h('div', { class: 'chips' }, Object.keys(counts).map((n) => h('span', { class: 'chip static' }, `${n} ${counts[n]}`)),
          dCount - sp.length > 0 ? h('span', { class: 'chip static muted' }, `不明 ${dCount - sp.length}`) : null),
        h('div', { class: 'speaker-list' }, sp.slice(0, 60).map((s) => h('button', {
          type: 'button', class: 'speaker-row', onclick: () => focusRange(s.start, s.end),
        }, h('span', { class: 'speaker-name' }, s.name), h('span', { class: 'speaker-line' }, trunc(S.textarea.value.slice(s.start, s.end), 30)))))));
    }

    // 未登録の固有名詞
    const cands = (S.cons && S.cons.candidates) || [];
    if (cands.length) {
      wrap.appendChild(h('details', { class: 'sub-section', open: true },
        h('summary', null, `設定資料に未登録の固有名詞（候補） ${cands.length}`),
        h('p', { class: 'small muted' }, 'クリックすると設定資料に登録できます。'),
        h('div', { class: 'chips' }, cands.map((c) => {
          const b = h('button', { type: 'button', class: 'chip' }, `${c.word} ${c.count}`);
          b.addEventListener('click', () => UI.menu(b, [
            { label: '人物として登録', icon: 'users', onClick: () => registerEntry(c.word, 'character') },
            { label: '場所として登録', icon: 'map', onClick: () => registerEntry(c.word, 'place') },
            { label: '用語・アイテムとして登録', icon: 'tag', onClick: () => registerEntry(c.word, 'term') },
            { label: '組織として登録', icon: 'flag', onClick: () => registerEntry(c.word, 'org') },
            null,
            { label: '本文で探す', icon: 'search', onClick: () => { S.find.q = c.word; openFind(); } },
          ]));
          return b;
        }))));
    }
    return wrap;
  }

  function registerEntry(name, type) {
    const p = P();
    const e = NS.Lore.newEntry(type, name);
    p.entries.push(e);
    App().touch();
    toast(`「${name}」を${NS.Lore.TYPE_LABEL[type]}として登録しました`);
    runAnalysis(true);
  }

  function panelAI() {
    if (!NS.AIPanel) return h('p', null, 'AI機能を読み込めませんでした');
    const chId = S.ch.id;
    return NS.AIPanel.render({
      getText: () => S.textarea.value,
      getSelection: V.getSelection,
      chapter: S.ch,
      project: P(),
      chapterNo: P().chapters.findIndex((c) => c.id === S.ch.id) + 1,
      addIssues: (items) => V.addAiIssues(items, chId),
      clearIssues: () => V.clearAiIssues(chId),
      focusRange,
      apply: (it) => applyIssue(it),
      aiIssues: () => (S.aiIssues || []),
      rerender: () => { if (S && S.panelTab === 'ai') renderPanel(); },
    });
  }

  function panelRef() {
    const p = P();
    const memo = h('textarea', {
      class: 'input memo', rows: 5, value: S.ch.memo, placeholder: 'この話のメモ（プロット、書きたい場面、伏線など）',
      oninput: (e) => { S.ch.memo = e.target.value; App().touch(); },
    });
    const results = h('div', { class: 'ref-list' });
    const search = h('input', { class: 'input', type: 'search', placeholder: '人物・場所・用語を検索', 'aria-label': '設定資料を検索' });
    const render = () => {
      clear(results);
      const q = search.value.trim();
      const list = p.entries.filter((e) => !q || e.name.indexOf(q) >= 0 || (e.reading || '').indexOf(q) >= 0 || e.aliases.some((a) => a.indexOf(q) >= 0));
      if (!list.length) results.appendChild(h('p', { class: 'muted small' }, p.entries.length ? '見つかりません' : '設定資料はまだありません'));
      list.slice(0, 50).forEach((e) => {
        results.appendChild(h('details', { class: 'ref-item' },
          h('summary', null,
            h('span', { class: 'type-badge t-' + e.type }, NS.Lore.TYPE_LABEL[e.type]),
            h('strong', null, e.name), e.reading ? h('span', { class: 'muted small' }, ' ' + e.reading) : null),
          h('div', { class: 'ref-body' },
            NS.Lore.summaryList(e, p),
            h('div', { class: 'row' },
              btn('本文に挿入', { small: true, onClick: () => insertText(e.name.replace(/[\s　]/g, '')) }),
              btn('開く', { small: true, ghost: true, onClick: () => App().navigate('lore', { id: e.id }) })))));
      });
    };
    search.addEventListener('input', render);
    render();
    const readings = NS.Readings ? NS.Readings.collect(p) : [];
    const readingBox = h('details', { class: 'sub-section' },
      h('summary', null, `登録した読み方（ルビ） ${readings.length}`),
      h('p', { class: 'small muted' }, 'アイデア帳に種類「読み方」で書いたもの、メモ中の 足《アルファ》 のような記法、設定資料の「読み」から集めています。ここにある読みのルビは添削で指摘しません。'),
      readings.length ? h('div', { class: 'reading-list' }, readings.map((r) => h('button', {
        type: 'button', class: 'reading-row', title: '本文に挿入', onclick: () => insertText('|' + r.base + '《' + r.reading + '》'),
      }, h('span', { html: T.rubyToHtml('|' + r.base + '《' + r.reading + '》', { vertical: false }) }), h('span', { class: 'muted small' }, r.source === 'lore' ? '設定資料' : 'アイデア帳')))) : null,
      btn('アイデア帳を開く', { small: true, ghost: true, icon: 'bulb', onClick: () => App().navigate('ideas') }));
    return h('div', { class: 'stack-sm' }, h('h3', { class: 'panel-h' }, 'この話のメモ'), memo, h('h3', { class: 'panel-h' }, '設定資料'), search, results, readingBox);
  }

  function panelStats() {
    const p = P();
    const st = T.stats(S.textarea.value);
    let total = 0;
    const rows = p.chapters.map((c, i) => {
      const n = countOf(c, c.id === S.ch.id ? S.textarea.value : c.body);
      total += n;
      return { i, c, n };
    });
    const pct = (v) => Math.round(v * 100) + '%';
    const goalTotal = p.goal.total || 0;
    const days = Object.keys(p.log).sort().slice(-14);
    const maxDay = Math.max(1, ...days.map((d) => Math.max(0, p.log[d].last - p.log[d].start)));
    const goalInput = (key, label) => UI.field(label, h('input', {
      class: 'input input-num', type: 'number', min: 0, step: 100, value: p.goal[key],
      onchange: (e) => { p.goal[key] = Math.max(0, parseInt(e.target.value, 10) || 0); App().touch(); renderStatus(); renderPanel(); },
    }));
    return h('div', { class: 'stack-sm' },
      h('h3', { class: 'panel-h' }, 'この話'),
      h('dl', { class: 'stat-grid' },
        stat('文字数（空白除く）', UI.fmtNum(st.charsNoSpace) + '字'),
        stat('原稿用紙換算', st.pages + '枚'),
        stat('会話文の割合', pct(st.dialogueRatio)),
        stat('漢字の割合', pct(st.kanjiRatio)),
        stat('文の数', UI.fmtNum(st.sentences)),
        stat('平均の文の長さ', st.avgSentence.toFixed(1) + '字'),
        stat('段落数', UI.fmtNum(st.paragraphs)),
        stat('読了目安', Math.max(1, Math.round(st.readingMinutes)) + '分')),
      h('p', { class: 'small muted' }, '漢字の割合は3割前後が読みやすいと言われます。'),
      h('h3', { class: 'panel-h' }, '作品全体'),
      h('div', { class: 'goal' },
        h('div', { class: 'goal-row' }, h('span', null, UI.fmtNum(total) + '字'), goalTotal ? h('span', { class: 'muted small' }, '目標 ' + UI.fmtNum(goalTotal) + '字') : null),
        goalTotal ? h('div', { class: 'meter big' }, h('span', { style: { width: Math.min(100, (total / goalTotal) * 100) + '%' } })) : null),
      h('div', { class: 'grid-2' }, goalInput('daily', '1日の目標（字）'), goalInput('total', '作品の目標（字）')),
      days.length ? h('div', null,
        h('h3', { class: 'panel-h' }, '最近の執筆量'),
        h('div', { class: 'day-bars', role: 'img', 'aria-label': '日ごとの執筆文字数' }, days.map((d) => {
          const v = Math.max(0, p.log[d].last - p.log[d].start);
          return h('div', { class: 'day-bar', title: d + '：' + UI.fmtNum(v) + '字' },
            h('span', { class: 'day-bar-fill', style: { height: Math.round((v / maxDay) * 100) + '%' } }),
            h('span', { class: 'day-bar-label' }, d.slice(8)));
        }))) : null,
      h('h3', { class: 'panel-h' }, '話ごとの文字数'),
      h('table', { class: 'mini-table' }, h('tbody', null, rows.map((r) => h('tr', { class: r.c.id === S.ch.id ? 'current' : '' },
        h('td', null, r.i + 1), h('td', null, r.c.title), h('td', { class: 'num' }, UI.fmtNum(r.n)))))));
  }

  function stat(label, value) {
    return h('div', { class: 'stat' }, h('dt', null, label), h('dd', null, value));
  }

  NS.Views.write = V;
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
<script>
// js/views/lore.js
/*
 * 綴り — 設定資料（人物・場所・用語・組織・世界観ルール・年表）
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const { h, icon, btn, clear, toast } = UI;

  const TYPE_LABEL = { character: '人物', place: '場所', term: '用語', org: '組織' };
  const TYPE_ICON = { character: 'users', place: 'map', term: 'tag', org: 'flag' };
  const TABS = [
    { id: 'character', label: '人物', icon: 'users' },
    { id: 'place', label: '場所', icon: 'map' },
    { id: 'term', label: '用語・アイテム', icon: 'tag' },
    { id: 'org', label: '組織', icon: 'flag' },
    { id: 'rules', label: '世界観ルール', icon: 'shield' },
    { id: 'timeline', label: '年表', icon: 'clock' },
  ];

  const SCHEMA = {
    character: [
      { section: '基本' },
      { key: 'role', label: '役割', placeholder: '主人公／ヒロイン／師匠 など' },
      { key: 'gender', label: '性別' },
      { key: 'age', label: '年齢', placeholder: '17 または 16〜17', hint: '本文の「〇歳」と照合します', check: true },
      { key: 'birthday', label: '誕生日' },
      { key: 'height', label: '身長' },
      { key: 'firstPerson', label: '一人称', placeholder: '俺 ／ 僕 など（複数は／で区切る）', hint: '台詞の一人称と照合します', check: true },
      { key: 'speech', label: '口調・口癖', type: 'textarea', placeholder: '語尾に「〜だぜ」、目上には敬語 など（AIチェックで参照します）' },
      { section: '外見' },
      { key: 'hair', label: '髪', placeholder: '黒のショートヘア', hint: '髪色の描写と照合します', check: true },
      { key: 'eyes', label: '瞳', placeholder: '琥珀色', hint: '瞳の色の描写と照合します', check: true },
      { key: 'looks', label: '外見の特徴', type: 'textarea', placeholder: '体格、服装、傷跡など' },
      { section: '内面・背景' },
      { key: 'personality', label: '性格', type: 'textarea' },
      { key: 'background', label: '経歴', type: 'textarea' },
      { key: 'goal', label: '目的・動機', type: 'textarea' },
    ],
    place: [
      { key: 'kind', label: '種類', placeholder: '国／都市／村／建物／地形 など' },
      { key: 'parent', label: '所在地・所属', type: 'entry', entryType: 'place' },
      { key: 'climate', label: '気候・地理', type: 'textarea' },
      { key: 'population', label: '人口・規模' },
      { key: 'desc', label: '説明', type: 'textarea' },
    ],
    term: [
      { key: 'kind', label: '分類', placeholder: 'アイテム／魔法／技術／用語 など' },
      { key: 'desc', label: '説明', type: 'textarea' },
      { key: 'rule', label: '制約・ルール', type: 'textarea', placeholder: '使える条件、代償、できないこと など' },
    ],
    org: [
      { key: 'kind', label: '種類', placeholder: '国家／騎士団／ギルド／学校 など' },
      { key: 'base', label: '拠点', type: 'entry', entryType: 'place' },
      { key: 'leader', label: '代表者', type: 'entry', entryType: 'character' },
      { key: 'members', label: '主な構成員', type: 'textarea' },
      { key: 'desc', label: '説明', type: 'textarea' },
    ],
  };

  function newEntry(type, name) {
    return {
      id: UI.uid('e'), type, name: name || ('新しい' + TYPE_LABEL[type]), reading: '', aliases: [], color: '',
      fields: {}, custom: [], relations: [], appear: {}, notes: '', createdAt: Date.now(), updatedAt: Date.now(),
    };
  }

  function entryName(p, id) {
    const e = p.entries.find((x) => x.id === id);
    return e ? e.name : '';
  }

  /** 資料パネル用の要約 */
  function summaryList(e, p) {
    const dl = h('dl', { class: 'kv' });
    const add = (k, v) => { if (v && String(v).trim()) dl.append(h('dt', null, k), h('dd', null, v)); };
    if (e.aliases.length) add('別名', e.aliases.join('、'));
    (SCHEMA[e.type] || []).forEach((f) => {
      if (!f.key) return;
      let v = e.fields[f.key];
      if (f.type === 'entry') v = entryName(p, v);
      add(f.label, v);
    });
    e.custom.forEach((c) => add(c.k, c.v));
    e.relations.forEach((r) => {
      const t = entryName(p, r.targetId);
      if (t) add('→' + t, [r.calls ? `「${r.calls}」と呼ぶ` : '', r.note].filter(Boolean).join('／'));
    });
    if (e.appear.from || e.appear.until) add('登場', `${e.appear.from ? '第' + e.appear.from + '話〜' : ''}${e.appear.until ? '第' + e.appear.until + '話で' + (e.appear.reason || '退場') : ''}`);
    add('メモ', e.notes);
    return dl;
  }

  // ───── 書き出し・AI 用の整形 ─────
  const LoreFormat = {
    entryLines(e, p) {
      const lines = [];
      const head = `${e.name}${e.reading ? '（' + e.reading + '）' : ''}${e.aliases.length ? ' 別名: ' + e.aliases.join('、') : ''}`;
      lines.push('- ' + head);
      (SCHEMA[e.type] || []).forEach((f) => {
        if (!f.key) return;
        let v = e.fields[f.key];
        if (f.type === 'entry') v = entryName(p, v);
        if (v && String(v).trim()) lines.push(`  - ${f.label}: ${String(v).replace(/\n/g, ' ')}`);
      });
      e.custom.forEach((c) => { if (c.k || c.v) lines.push(`  - ${c.k}: ${String(c.v || '').replace(/\n/g, ' ')}`); });
      e.relations.forEach((r) => {
        const t = entryName(p, r.targetId);
        if (t) lines.push(`  - ${t}との関係: ${[r.note, r.calls ? '呼び方「' + r.calls + '」' : ''].filter(Boolean).join('、')}`);
      });
      if (e.appear.from) lines.push(`  - 初登場: 第${e.appear.from}話`);
      if (e.appear.until) lines.push(`  - 第${e.appear.until}話で${e.appear.reason || '退場'}`);
      if (e.notes) lines.push(`  - メモ: ${e.notes.replace(/\n/g, ' ')}`);
      return lines;
    },
    toMarkdown(p) {
      const out = ['# ' + p.title + '　設定資料', ''];
      if (p.synopsis) out.push('## あらすじ', '', p.synopsis, '');
      ['character', 'place', 'term', 'org'].forEach((t) => {
        const list = p.entries.filter((e) => e.type === t);
        if (!list.length) return;
        out.push('## ' + TYPE_LABEL[t], '');
        list.forEach((e) => out.push(...LoreFormat.entryLines(e, p)));
        out.push('');
      });
      if (p.rules.world) out.push('## 世界観', '', p.rules.world, '');
      if (p.rules.ng.length) {
        out.push('## 作中で使わない言葉', '');
        p.rules.ng.forEach((r) => out.push(`- ${r.word}${r.reason ? '：' + r.reason : ''}${r.suggestion ? '（→' + r.suggestion + '）' : ''}`));
        out.push('');
      }
      if (p.rules.style.length) {
        out.push('## 表記統一ルール', '');
        p.rules.style.forEach((r) => out.push(`- ${r.from} → ${r.to}`));
        out.push('');
      }
      if (p.timeline.length) {
        out.push('## 年表', '');
        p.timeline.forEach((t) => out.push(`- ${t.when || ''}　${t.title || ''}${t.desc ? '：' + t.desc.replace(/\n/g, ' ') : ''}`));
        out.push('');
      }
      return out.join('\n');
    },
  };

  // ───── 画面 ─────
  const V = {};
  let S = null;
  function P() { return NS.App.project; }
  function touch() { NS.App.touch(); }

  V.mount = function (view, params) {
    const p = P();
    let tab = (S && S.tab) || 'character';
    let selected = null;
    if (params.id) {
      const e = p.entries.find((x) => x.id === params.id);
      if (e) { tab = e.type; selected = e.id; }
    }
    S = { view, tab, selected, q: '', mentionCache: null };
    build();
  };
  V.unmount = function () { S = null; };

  function build() {
    clear(S.view);
    const layout = h('div', { class: 'lore-layout' });
    S.tabsEl = h('nav', { class: 'lore-tabs', 'aria-label': '設定資料の分類' });
    S.listPane = h('div', { class: 'lore-list-pane' });
    S.detail = h('section', { class: 'lore-detail' });
    layout.append(h('aside', { class: 'lore-side' }, S.tabsEl, S.listPane), S.detail);
    S.view.appendChild(layout);
    renderTabs();
    renderList();
    renderDetail();
  }

  function renderTabs() {
    const p = P();
    clear(S.tabsEl);
    TABS.forEach((t) => {
      const n = TYPE_LABEL[t.id] ? p.entries.filter((e) => e.type === t.id).length
        : t.id === 'rules' ? p.rules.ng.length + p.rules.style.length : p.timeline.length;
      S.tabsEl.appendChild(h('button', {
        type: 'button', class: 'lore-tab' + (S.tab === t.id ? ' active' : ''),
        onclick: () => { S.tab = t.id; S.selected = null; S.q = ''; renderTabs(); renderList(); renderDetail(); },
      }, icon(t.icon, 16), h('span', null, t.label), n ? h('span', { class: 'count' }, n) : null));
    });
  }

  function renderList() {
    const p = P();
    clear(S.listPane);
    S.listPane.hidden = !TYPE_LABEL[S.tab];
    S.view.querySelector('.lore-layout').classList.toggle('no-list', !TYPE_LABEL[S.tab]);
    if (!TYPE_LABEL[S.tab]) return;
    const search = h('input', {
      class: 'input', type: 'search', placeholder: '検索', value: S.q, 'aria-label': TYPE_LABEL[S.tab] + 'を検索',
      oninput: (e) => { S.q = e.target.value; renderItems(); },
    });
    const items = h('ul', { class: 'entry-list' });
    const renderItems = () => {
      clear(items);
      const q = S.q.trim();
      const list = p.entries.filter((e) => e.type === S.tab && (!q || e.name.indexOf(q) >= 0 || (e.reading || '').indexOf(q) >= 0 || e.aliases.some((a) => a.indexOf(q) >= 0)));
      if (!list.length) items.appendChild(h('li', { class: 'muted small empty-li' }, q ? '見つかりません' : 'まだ登録がありません'));
      list.forEach((e) => {
        const sub = e.type === 'character' ? [e.fields.role, e.fields.age ? e.fields.age + (/歳|才/.test(e.fields.age) ? '' : '歳') : ''].filter(Boolean).join('・') : (e.fields.kind || '');
        items.appendChild(h('li', {
          class: 'entry-item' + (S.selected === e.id ? ' active' : ''), tabindex: 0,
          onclick: () => { S.selected = e.id; renderItems(); renderDetail(); },
          onkeydown: (ev) => { if (ev.key === 'Enter') { S.selected = e.id; renderItems(); renderDetail(); } },
        },
        h('span', { class: 'color-dot', style: { background: e.color || 'var(--line-strong)' } }),
        h('span', { class: 'entry-item-text' }, h('span', { class: 'entry-item-name' }, e.name), sub ? h('span', { class: 'muted small' }, sub) : null)));
      });
    };
    S.renderItems = renderItems;
    S.listPane.append(
      h('div', { class: 'row' }, search, btn('追加', { icon: 'plus', small: true, primary: true, onClick: () => {
        const e = newEntry(S.tab);
        p.entries.push(e);
        S.selected = e.id;
        S.q = '';
        touch();
        renderTabs();
        renderList();
        renderDetail();
        const nameInput = S.detail.querySelector('.entry-name-input');
        if (nameInput) { nameInput.focus(); nameInput.select(); }
      } })),
      items);
    renderItems();
  }

  function renderDetail() {
    clear(S.detail);
    if (S.tab === 'rules') { S.detail.appendChild(rulesPane()); return; }
    if (S.tab === 'timeline') { S.detail.appendChild(timelinePane()); return; }
    const p = P();
    const e = p.entries.find((x) => x.id === S.selected && x.type === S.tab);
    if (!e) {
      S.detail.appendChild(h('div', { class: 'empty big' },
        icon(TYPE_ICON[S.tab], 40),
        h('p', null, `左の一覧から${TYPE_LABEL[S.tab]}を選ぶか、「追加」で新しく登録します。`),
        S.tab === 'character' ? h('p', { class: 'muted small' }, '一人称・呼び方・髪や瞳の色・年齢・登場範囲を入れておくと、本文との食い違いを自動でチェックします。') : null));
      return;
    }
    S.detail.appendChild(entryForm(e));
  }

  function changed(e, rerenderList) {
    e.updatedAt = Date.now();
    touch();
    if (rerenderList && S.renderItems) S.renderItems();
  }

  function textInput(value, onInput, opts) {
    opts = opts || {};
    return h(opts.textarea ? 'textarea' : 'input', Object.assign({
      class: 'input' + (opts.class ? ' ' + opts.class : ''), value: value || '', placeholder: opts.placeholder || '',
      oninput: (ev) => onInput(ev.target.value),
    }, opts.textarea ? { rows: opts.rows || 3 } : { type: 'text' }));
  }

  function entrySelect(p, type, value, onChange, excludeId) {
    const sel = h('select', { class: 'input', onchange: (ev) => onChange(ev.target.value) });
    sel.appendChild(h('option', { value: '' }, '（なし）'));
    p.entries.filter((x) => x.type === type && x.id !== excludeId).forEach((x) => sel.appendChild(h('option', { value: x.id, selected: x.id === value }, x.name)));
    return sel;
  }

  function chapterSelect(p, value, onChange) {
    const sel = h('select', { class: 'input', onchange: (ev) => onChange(ev.target.value ? parseInt(ev.target.value, 10) : null) });
    sel.appendChild(h('option', { value: '' }, '（指定なし）'));
    p.chapters.forEach((c, i) => sel.appendChild(h('option', { value: i + 1, selected: +value === i + 1 }, `第${i + 1}話　${c.title}`)));
    return sel;
  }

  function entryForm(e) {
    const p = P();
    const form = h('div', { class: 'entry-form' });
    const more = btn('', { icon: 'more', ghost: true, title: 'その他' });
    more.addEventListener('click', () => UI.menu(more, [
      { label: '複製', icon: 'copy', onClick: () => {
        const copy = JSON.parse(JSON.stringify(e));
        copy.id = UI.uid('e');
        copy.name += '（複製）';
        p.entries.push(copy);
        S.selected = copy.id;
        touch();
        renderTabs(); renderList(); renderDetail();
      } },
      { label: '本文で探す', icon: 'search', onClick: () => searchInChapters(e) },
      null,
      { label: '削除', icon: 'trash', danger: true, onClick: async () => {
        if (!(await UI.confirm(`「${e.name}」を削除します。`, { danger: true, okLabel: '削除' }))) return;
        p.entries.splice(p.entries.indexOf(e), 1);
        p.entries.forEach((x) => { x.relations = x.relations.filter((r) => r.targetId !== e.id); });
        S.selected = null;
        touch();
        renderTabs(); renderList(); renderDetail();
      } },
    ]));

    // 見出し
    const colorRow = h('div', { class: 'swatches', role: 'radiogroup', 'aria-label': '色' }, [''].concat(UI.SWATCHES).map((c) => h('button', {
      type: 'button', class: 'swatch' + ((e.color || '') === c ? ' active' : ''), title: c ? '色' : '色なし', 'aria-label': c || '色なし',
      style: { background: c || 'transparent' },
      onclick: (ev) => { e.color = c; changed(e, true); ev.currentTarget.parentNode.querySelectorAll('.swatch').forEach((s) => s.classList.remove('active')); ev.currentTarget.classList.add('active'); },
    })));
    form.appendChild(h('div', { class: 'entry-head' },
      h('span', { class: 'type-badge t-' + e.type }, TYPE_LABEL[e.type]),
      textInput(e.name, (v) => { e.name = v; changed(e, true); }, { class: 'entry-name-input', placeholder: '名前' }),
      more));
    form.appendChild(h('div', { class: 'grid-2' },
      UI.field('読み', textInput(e.reading, (v) => { e.reading = v; changed(e); }, { placeholder: 'ふりがな' })),
      UI.field('別名・愛称', textInput(e.aliases.join('、'), (v) => { e.aliases = v.split(/[、,，\/／]/).map((s) => s.trim()).filter(Boolean); changed(e); }, { placeholder: '、で区切る' }),
        '本文中の呼び名も登録すると検出精度が上がります')));
    form.appendChild(UI.field('色', colorRow));

    // 項目
    let grid = h('div', { class: 'grid-2' });
    form.appendChild(grid);
    (SCHEMA[e.type] || []).forEach((f) => {
      if (f.section) {
        form.appendChild(h('h3', { class: 'form-section' }, f.section));
        grid = h('div', { class: 'grid-2' });
        form.appendChild(grid);
        return;
      }
      let input;
      if (f.type === 'entry') input = entrySelect(p, f.entryType, e.fields[f.key], (v) => { e.fields[f.key] = v; changed(e); }, e.id);
      else input = textInput(e.fields[f.key], (v) => { e.fields[f.key] = v; changed(e, f.key === 'role' || f.key === 'kind' || f.key === 'age'); }, { textarea: f.type === 'textarea', placeholder: f.placeholder });
      const fl = UI.field(f.label, input, f.hint);
      if (f.check) fl.classList.add('field-checked');
      if (f.type === 'textarea') fl.classList.add('span-2');
      grid.appendChild(fl);
    });

    // 人物：関係・呼び方、登場範囲
    if (e.type === 'character') {
      form.appendChild(h('h3', { class: 'form-section' }, '関係・呼び方', h('span', { class: 'check-note' }, '台詞の呼び方と照合')));
      const relBox = h('div', { class: 'table-like' });
      const renderRel = () => {
        clear(relBox);
        relBox.appendChild(h('div', { class: 'tl-head rel-row' }, h('span', null, '相手'), h('span', null, '呼び方'), h('span', null, '関係・メモ'), h('span')));
        e.relations.forEach((r, i) => {
          relBox.appendChild(h('div', { class: 'rel-row' },
            entrySelect(p, 'character', r.targetId, (v) => { r.targetId = v; changed(e); }, e.id),
            textInput(r.calls, (v) => { r.calls = v; changed(e); }, { placeholder: '例：蓮くん（複数は／）' }),
            textInput(r.note, (v) => { r.note = v; changed(e); }, { placeholder: '幼なじみ、師弟 など' }),
            btn('', { icon: 'trash', ghost: true, small: true, title: '削除', onClick: () => { e.relations.splice(i, 1); changed(e); renderRel(); } })));
        });
        relBox.appendChild(btn('関係を追加', { icon: 'plus', small: true, ghost: true, onClick: () => { e.relations.push({ targetId: '', calls: '', note: '' }); changed(e); renderRel(); } }));
      };
      renderRel();
      form.appendChild(relBox);

      form.appendChild(h('h3', { class: 'form-section' }, '登場範囲', h('span', { class: 'check-note' }, '退場後の発言などを検出')));
      form.appendChild(h('div', { class: 'grid-3' },
        UI.field('初登場', chapterSelect(p, e.appear.from, (v) => { e.appear.from = v; changed(e); })),
        UI.field('退場・死亡', chapterSelect(p, e.appear.until, (v) => { e.appear.until = v; changed(e); })),
        UI.field('退場の理由', (() => {
          const sel = h('select', { class: 'input', onchange: (ev) => { e.appear.reason = ev.target.value; changed(e); } });
          ['死亡', '退場', '離脱', '封印', '行方不明'].forEach((r) => sel.appendChild(h('option', { value: r, selected: (e.appear.reason || '死亡') === r }, r)));
          return sel;
        })())));
    }

    // 地図との連携（場所）
    if (e.type === 'place') {
      const links = [];
      p.maps.forEach((m) => (m.stamps || m.markers || []).forEach((mk) => { if (mk.entryId === e.id) links.push({ m, mk }); }));
      form.appendChild(h('h3', { class: 'form-section' }, '地図'));
      form.appendChild(links.length
        ? h('div', { class: 'row wrap' }, links.map(({ m, mk }) => btn(`${m.name}で表示`, { icon: 'map', small: true, onClick: () => {
          NS.App.pendingMapFocus = { mapId: m.id, stampId: mk.id };
          NS.App.navigate('map', { id: m.id });
        } })))
        : h('p', { class: 'muted small' }, '地図画面で城や町などの素材を置き、選択して「設定資料とつなぐ」でこの場所を選ぶと、ここから地図を開けます。'));
    }

    // 自由項目
    form.appendChild(h('h3', { class: 'form-section' }, '自由項目'));
    const customBox = h('div', { class: 'table-like' });
    const renderCustom = () => {
      clear(customBox);
      e.custom.forEach((c, i) => {
        customBox.appendChild(h('div', { class: 'kv-row' },
          textInput(c.k, (v) => { c.k = v; changed(e); }, { placeholder: '項目名' }),
          textInput(c.v, (v) => { c.v = v; changed(e); }, { placeholder: '内容' }),
          btn('', { icon: 'trash', ghost: true, small: true, title: '削除', onClick: () => { e.custom.splice(i, 1); changed(e); renderCustom(); } })));
      });
      customBox.appendChild(btn('項目を追加', { icon: 'plus', small: true, ghost: true, onClick: () => { e.custom.push({ k: '', v: '' }); changed(e); renderCustom(); } }));
    };
    renderCustom();
    form.appendChild(customBox);

    form.appendChild(UI.field('メモ', textInput(e.notes, (v) => { e.notes = v; changed(e); }, { textarea: true, rows: 5, placeholder: '自由に書き留めておけます' })));

    // 登場箇所
    form.appendChild(h('h3', { class: 'form-section' }, '登場回数'));
    form.appendChild(mentionsView(e));
    return form;
  }

  function mentionsView(e) {
    const p = P();
    if (!S.mentionCache) S.mentionCache = NS.Consistency.countMentionsByEntry(p.chapters.map((c) => c.body), p.entries);
    const rows = [];
    let total = 0;
    S.mentionCache.forEach((counts, i) => {
      const n = counts[e.id] || 0;
      total += n;
      if (n) rows.push({ i, n });
    });
    if (!total) return h('p', { class: 'muted small' }, '本文にはまだ登場していません（名前・別名で数えています）。');
    const max = Math.max(...rows.map((r) => r.n));
    return h('div', { class: 'mention-bars' },
      h('p', { class: 'small muted' }, `全${total}回`),
      rows.map((r) => h('button', {
        type: 'button', class: 'mention-row', title: '本文を開く',
        onclick: () => NS.App.navigate('write', { id: p.chapters[r.i].id }),
      }, h('span', { class: 'mention-label' }, `第${r.i + 1}話`),
      h('span', { class: 'mention-bar' }, h('span', { style: { width: (r.n / max) * 100 + '%' } })),
      h('span', { class: 'mention-n' }, r.n))));
  }

  function searchInChapters(e) {
    const p = P();
    const forms = [e.name.replace(/[\s　]/g, '')].concat(e.aliases);
    const hits = [];
    p.chapters.forEach((c, i) => {
      forms.forEach((f) => {
        if (!f) return;
        let k = c.body.indexOf(f);
        while (k >= 0 && hits.length < 200) {
          hits.push({ c, i, k, f });
          k = c.body.indexOf(f, k + f.length);
        }
      });
    });
    hits.sort((a, b) => a.i - b.i || a.k - b.k);
    const list = h('div', { class: 'hit-list' }, hits.length ? hits.map((x) => h('button', {
      type: 'button', class: 'hit-row',
      onclick: () => { closeFn(); NS.App.navigate('write', { id: x.c.id }); setTimeout(() => NS.Views.write.focusRange && NS.Views.write.focusRange(x.k, x.k + x.f.length), 60); },
    }, h('span', { class: 'muted small' }, `第${x.i + 1}話`), h('span', null, x.c.body.slice(Math.max(0, x.k - 12), x.k), h('mark', null, x.f), x.c.body.slice(x.k + x.f.length, x.k + x.f.length + 16)))) : h('p', { class: 'muted' }, '見つかりませんでした'));
    const closeFn = UI.modal({ title: `「${e.name}」の登場箇所`, body: list, wide: true });
  }

  // ───── 世界観ルール ─────
  function rulesPane() {
    const p = P();
    const box = h('div', { class: 'entry-form' });
    box.appendChild(h('h2', { class: 'pane-title' }, '世界観ルール'));
    box.appendChild(UI.field('世界観の説明', textInput(p.rules.world, (v) => { p.rules.world = v; touch(); }, {
      textarea: true, rows: 6, placeholder: '例：剣と魔法の世界。火薬や電気は存在しない。魔法は詠唱が必要で、使うと体力を消耗する。…',
    }), 'AIの設定矛盾チェックで参照します'));

    box.appendChild(h('h3', { class: 'form-section' }, '作中で使わない言葉（NGワード）', h('span', { class: 'check-note' }, '本文から自動検出')));
    box.appendChild(h('p', { class: 'muted small' }, '例：中世風の世界なのに「メートル」「スマホ」、和風の世界なのに「ドア」など。言い換えを入れると一発で修正できます。'));
    const ngBox = h('div', { class: 'table-like' });
    const renderNg = () => {
      clear(ngBox);
      ngBox.appendChild(h('div', { class: 'tl-head ng-row' }, h('span', null, '言葉'), h('span', null, '理由'), h('span', null, '言い換え'), h('span')));
      p.rules.ng.forEach((r, i) => ngBox.appendChild(h('div', { class: 'ng-row' },
        textInput(r.word, (v) => { r.word = v; touch(); }, { placeholder: 'メートル' }),
        textInput(r.reason, (v) => { r.reason = v; touch(); }, { placeholder: 'この世界の単位は「歩」' }),
        textInput(r.suggestion, (v) => { r.suggestion = v; touch(); }, { placeholder: '歩' }),
        btn('', { icon: 'trash', ghost: true, small: true, title: '削除', onClick: () => { p.rules.ng.splice(i, 1); touch(); renderNg(); renderTabs(); } }))));
      ngBox.appendChild(btn('NGワードを追加', { icon: 'plus', small: true, ghost: true, onClick: () => { p.rules.ng.push({ word: '', reason: '', suggestion: '' }); touch(); renderNg(); renderTabs(); } }));
    };
    renderNg();
    box.appendChild(ngBox);

    box.appendChild(h('h3', { class: 'form-section' }, '表記統一ルール', h('span', { class: 'check-note' }, '添削で検出')));
    box.appendChild(h('p', { class: 'muted small' }, '作品内で表記を揃えたい語を登録します。例：「出来る→できる」「魔方陣→魔法陣」。'));
    const stBox = h('div', { class: 'table-like' });
    const renderSt = () => {
      clear(stBox);
      stBox.appendChild(h('div', { class: 'tl-head kv-row' }, h('span', null, '置き換え前'), h('span', null, '置き換え後'), h('span')));
      p.rules.style.forEach((r, i) => stBox.appendChild(h('div', { class: 'kv-row' },
        textInput(r.from, (v) => { r.from = v; touch(); }, { placeholder: '魔方陣' }),
        textInput(r.to, (v) => { r.to = v; touch(); }, { placeholder: '魔法陣' }),
        btn('', { icon: 'trash', ghost: true, small: true, title: '削除', onClick: () => { p.rules.style.splice(i, 1); touch(); renderSt(); renderTabs(); } }))));
      stBox.appendChild(btn('ルールを追加', { icon: 'plus', small: true, ghost: true, onClick: () => { p.rules.style.push({ from: '', to: '' }); touch(); renderSt(); renderTabs(); } }));
    };
    renderSt();
    box.appendChild(stBox);

    box.appendChild(h('h3', { class: 'form-section' }, '作品のあらすじ'));
    box.appendChild(textInput(p.synopsis, (v) => { p.synopsis = v; touch(); }, { textarea: true, rows: 4, placeholder: 'AIチェックの参考になります' }));
    return box;
  }

  // ───── 年表 ─────
  function timelinePane() {
    const p = P();
    const box = h('div', { class: 'entry-form' });
    box.appendChild(h('h2', { class: 'pane-title' }, '年表'));
    box.appendChild(h('p', { class: 'muted small' }, '作中の出来事を時系列で並べます。「時期」は自由な書き方でかまいません（例：王国暦312年 春、第3話の三日後）。'));
    const list = h('div', { class: 'timeline' });
    const render = () => {
      clear(list);
      p.timeline.forEach((t, i) => {
        list.appendChild(h('div', { class: 'tl-item' },
          h('div', { class: 'tl-dot' }),
          h('div', { class: 'tl-fields' },
            h('div', { class: 'tl-row' },
              textInput(t.when, (v) => { t.when = v; touch(); }, { placeholder: '時期', class: 'tl-when' }),
              textInput(t.title, (v) => { t.title = v; touch(); }, { placeholder: '出来事', class: 'tl-title' })),
            textInput(t.desc, (v) => { t.desc = v; touch(); }, { textarea: true, rows: 2, placeholder: '詳細・関係する人物など' })),
          h('div', { class: 'tl-actions' },
            btn('', { icon: 'up', ghost: true, small: true, title: '上へ', onClick: () => { if (i > 0) { p.timeline.splice(i - 1, 0, p.timeline.splice(i, 1)[0]); touch(); render(); } } }),
            btn('', { icon: 'down', ghost: true, small: true, title: '下へ', onClick: () => { if (i < p.timeline.length - 1) { p.timeline.splice(i + 1, 0, p.timeline.splice(i, 1)[0]); touch(); render(); } } }),
            btn('', { icon: 'trash', ghost: true, small: true, title: '削除', onClick: () => { p.timeline.splice(i, 1); touch(); render(); renderTabs(); } }))));
      });
      if (!p.timeline.length) list.appendChild(h('p', { class: 'muted' }, 'まだ出来事がありません。'));
    };
    render();
    box.appendChild(list);
    box.appendChild(btn('出来事を追加', { icon: 'plus', onClick: () => { p.timeline.push({ id: UI.uid('t'), when: '', title: '', desc: '' }); touch(); render(); renderTabs(); } }));
    return box;
  }

  NS.Lore = { TYPE_LABEL, TYPE_ICON, SCHEMA, newEntry, summaryList };
  NS.LoreFormat = LoreFormat;
  NS.Views.lore = V;
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
<script>
// js/views/ideas.js
/*
 * 綴り — アイデア帳 と プロットボード
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const { h, icon, btn, clear, toast } = UI;
  const KINDS = ['アイデア', '台詞', 'シーン', '設定', '伏線', 'タイトル案', '読み方', '資料'];

  function P() { return NS.App.project; }
  function touch() { NS.App.touch(); }

  // ───────────── アイデア帳 ─────────────
  const Ideas = {};
  let IS = null;

  Ideas.mount = function (view) {
    IS = { view, q: '', kind: '', tag: '', pinnedOnly: false };
    build();
  };
  Ideas.unmount = function () { IS = null; };

  function build() {
    clear(IS.view);
    const wrap = h('div', { class: 'ideas' });
    IS.view.appendChild(wrap);

    // すばやくメモ
    const body = h('textarea', { class: 'input quick-input', rows: 3, placeholder: '思いついたことをすぐメモ（Ctrl+Enterで追加）\n例：主人公の剣は、実は亡き師匠の形見だった' });
    const kindSel = h('select', { class: 'input', 'aria-label': '種類' }, KINDS.map((k) => h('option', { value: k }, k)));
    const tags = h('input', { class: 'input', type: 'text', placeholder: 'タグ（、区切り）', 'aria-label': 'タグ' });
    // 種類「読み方」のときは、表記と読みを入れる欄を出す
    const word = h('input', { class: 'input', type: 'text', placeholder: '表記（例：足）', 'aria-label': '表記' });
    const reading = h('input', { class: 'input', type: 'text', placeholder: '読み（例：アルファ）', 'aria-label': '読み' });
    const readingRow = h('div', { class: 'reading-inputs', hidden: true },
      h('span', { class: 'small muted' }, '普段とは違う読み方を登録すると、そのルビは添削で指摘しなくなります。'),
      h('div', { class: 'row' }, word, h('span', { class: 'muted' }, '《'), reading, h('span', { class: 'muted' }, '》')));
    kindSel.addEventListener('change', () => {
      const isReading = kindSel.value === '読み方';
      readingRow.hidden = !isReading;
      body.placeholder = isReading ? 'メモ（任意）：使う場面、由来など' : '思いついたことをすぐメモ（Ctrl+Enterで追加）\n例：主人公の剣は、実は亡き師匠の形見だった';
      if (isReading) word.focus();
    });
    const add = () => {
      const v = body.value.trim();
      const isReading = kindSel.value === '読み方';
      if (isReading && (!word.value.trim() || !reading.value.trim())) { (word.value.trim() ? reading : word).focus(); toast('表記と読みを入れてください'); return; }
      if (!isReading && !v) { body.focus(); return; }
      P().ideas.unshift(Object.assign({
        id: UI.uid('i'), body: v, kind: kindSel.value, tags: splitTags(tags.value), color: '', pinned: false,
        createdAt: Date.now(), updatedAt: Date.now(),
      }, isReading ? { word: word.value.trim().replace(/^[|｜]/, ''), reading: reading.value.trim() } : {}));
      touch();
      body.value = '';
      word.value = '';
      reading.value = '';
      renderFilters();
      renderGrid();
      body.focus();
      toast('メモしました');
    };
    body.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); add(); } });
    [word, reading].forEach((el) => el.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); add(); } }));
    wrap.appendChild(h('section', { class: 'quick-add card' },
      readingRow,
      body,
      h('div', { class: 'row wrap' }, kindSel, tags, btn('メモする', { icon: 'plus', primary: true, onClick: add }))));

    IS.filters = h('div', { class: 'idea-filters' });
    IS.grid = h('div', { class: 'idea-grid' });
    wrap.append(IS.filters, IS.grid);
    renderFilters();
    renderGrid();
  }

  function splitTags(s) {
    return String(s || '').split(/[、,，\s#＃]+/).map((t) => t.trim()).filter(Boolean);
  }

  function renderFilters() {
    const p = P();
    clear(IS.filters);
    const search = h('input', {
      class: 'input', type: 'search', placeholder: 'メモを検索', value: IS.q, 'aria-label': 'メモを検索',
      oninput: (e) => { IS.q = e.target.value; renderGrid(); },
    });
    const allTags = {};
    p.ideas.forEach((i) => i.tags.forEach((t) => { allTags[t] = (allTags[t] || 0) + 1; }));
    const chip = (label, active, onClick) => h('button', { type: 'button', class: 'chip' + (active ? ' active' : ''), onclick: onClick }, label);
    IS.filters.append(
      search,
      h('div', { class: 'chips' },
        chip('すべて', !IS.kind && !IS.tag && !IS.pinnedOnly, () => { IS.kind = ''; IS.tag = ''; IS.pinnedOnly = false; renderFilters(); renderGrid(); }),
        chip('ピン留め', IS.pinnedOnly, () => { IS.pinnedOnly = !IS.pinnedOnly; renderFilters(); renderGrid(); }),
        KINDS.filter((k) => p.ideas.some((i) => i.kind === k)).map((k) => chip(k, IS.kind === k, () => { IS.kind = IS.kind === k ? '' : k; renderFilters(); renderGrid(); })),
        Object.keys(allTags).sort().map((t) => chip('#' + t, IS.tag === t, () => { IS.tag = IS.tag === t ? '' : t; renderFilters(); renderGrid(); }))));
  }

  function renderGrid() {
    const p = P();
    clear(IS.grid);
    const q = IS.q.trim();
    const list = p.ideas
      .filter((i) => (!q || (i.body + ' ' + (i.word || '') + ' ' + (i.reading || '')).indexOf(q) >= 0 || i.tags.some((t) => t.indexOf(q) >= 0)) && (!IS.kind || i.kind === IS.kind) && (!IS.tag || i.tags.indexOf(IS.tag) >= 0) && (!IS.pinnedOnly || i.pinned))
      .sort((a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt));
    if (!list.length) {
      IS.grid.appendChild(h('div', { class: 'empty' }, p.ideas.length ? '条件に合うメモはありません' : 'まだメモがありません。思いついたことは何でも上の欄に書き留めておきましょう。'));
      return;
    }
    list.forEach((it) => IS.grid.appendChild(ideaCard(it)));
  }

  function ideaCard(it) {
    const p = P();
    const lines = it.body.split('\n');
    const more = btn('', { icon: 'more', ghost: true, small: true, title: 'その他' });
    more.addEventListener('click', (e) => {
      e.stopPropagation();
      UI.menu(more, [
        { label: '編集', icon: 'pen', onClick: () => editIdea(it) },
        { label: it.pinned ? 'ピン留めを外す' : 'ピン留め', icon: 'pin', onClick: () => { it.pinned = !it.pinned; touch(); renderGrid(); } },
        { label: 'プロットボードに送る', icon: 'columns', onClick: () => {
          p.plot.cards.push({ id: UI.uid('c'), columnId: p.plot.columns[0].id, title: lines[0].slice(0, 40), body: lines.slice(1).join('\n'), chapterId: '', color: it.color });
          touch();
          toast('プロットボードの「' + p.plot.columns[0].title + '」に追加しました');
        } },
        { label: '今の話のメモに追記', icon: 'pen', onClick: () => {
          const ch = NS.App.currentChapter();
          if (!ch) return;
          ch.memo = (ch.memo ? ch.memo + '\n' : '') + it.body;
          touch();
          toast(`「${ch.title}」のメモに追記しました`);
        } },
        null,
        { label: '削除', icon: 'trash', danger: true, onClick: async () => {
          if (!(await UI.confirm('このメモを削除します。', { danger: true, okLabel: '削除' }))) return;
          p.ideas.splice(p.ideas.indexOf(it), 1);
          touch();
          renderFilters();
          renderGrid();
        } },
      ]);
    });
    return h('article', {
      class: 'idea-card' + (it.pinned ? ' pinned' : ''), tabindex: 0, style: { borderTopColor: it.color || 'transparent' },
      ondblclick: () => editIdea(it),
      onkeydown: (e) => { if (e.key === 'Enter') editIdea(it); },
    },
    h('div', { class: 'idea-head' },
      h('span', { class: 'kind-badge' }, it.kind || 'アイデア'),
      it.pinned ? icon('pin', 14) : null,
      h('span', { class: 'muted small idea-date' }, UI.relTime(it.updatedAt)),
      more),
    it.word && it.reading
      ? h('div', { class: 'idea-body' }, h('div', { class: 'reading-big', html: NS.Text.rubyToHtml('|' + it.word + '《' + it.reading + '》', { vertical: false }) }), it.body ? h('p', null, it.body) : null)
      : h('div', { class: 'idea-body' }, h('strong', null, lines[0]), lines.length > 1 ? h('p', null, lines.slice(1).join('\n')) : null),
    it.tags.length ? h('div', { class: 'idea-tags' }, it.tags.map((t) => h('span', { class: 'tag' }, '#' + t))) : null);
  }

  function editIdea(it) {
    const body = h('textarea', { class: 'input', rows: 8, value: it.body });
    const word = h('input', { class: 'input', type: 'text', value: it.word || '', placeholder: '表記' });
    const reading = h('input', { class: 'input', type: 'text', value: it.reading || '', placeholder: '読み' });
    const kindSel = h('select', { class: 'input' }, KINDS.map((k) => h('option', { value: k, selected: it.kind === k }, k)));
    const tags = h('input', { class: 'input', type: 'text', value: it.tags.join('、') });
    let color = it.color || '';
    const sw = h('div', { class: 'swatches' }, [''].concat(UI.SWATCHES).map((c) => h('button', {
      type: 'button', class: 'swatch' + (color === c ? ' active' : ''), style: { background: c || 'transparent' }, 'aria-label': c || '色なし',
      onclick: (e) => { color = c; sw.querySelectorAll('.swatch').forEach((s) => s.classList.remove('active')); e.currentTarget.classList.add('active'); },
    })));
    UI.modal({
      title: 'メモを編集', wide: true,
      body: h('div', { class: 'stack' },
        it.kind === '読み方' || it.word ? h('div', { class: 'grid-2' }, UI.field('表記', word), UI.field('読み', reading)) : null,
        body, h('div', { class: 'grid-2' }, UI.field('種類', kindSel), UI.field('タグ', tags)), UI.field('色', sw)),
      actions: [
        { label: 'キャンセル', ghost: true },
        { label: '保存', primary: true, onClick: () => {
          it.body = body.value.trim() || (it.word ? '' : it.body);
          if (it.kind === '読み方' || it.word) { it.word = word.value.trim(); it.reading = reading.value.trim(); }
          it.kind = kindSel.value;
          it.tags = splitTags(tags.value);
          it.color = color;
          it.updatedAt = Date.now();
          touch();
          renderFilters();
          renderGrid();
        } },
      ],
    });
  }

  // ───────────── プロットボード ─────────────
  const Plot = {};
  let PS = null;

  Plot.mount = function (view) {
    PS = { view };
    build2();
  };
  Plot.unmount = function () { PS = null; };

  function build2() {
    const p = P();
    clear(PS.view);
    const wrap = h('div', { class: 'plot' });
    wrap.appendChild(h('div', { class: 'plot-head' },
      h('p', { class: 'muted small' }, '場面や出来事をカードにして、起承転結（列）に並べます。カードはドラッグで移動でき、話と結びつけられます。'),
      h('div', { class: 'row' },
        btn('列を追加', { icon: 'plus', small: true, onClick: async () => {
          const t = await UI.prompt('列の名前', '', { placeholder: '例：序章、第二幕' });
          if (!t) return;
          p.plot.columns.push({ id: UI.uid('col'), title: t });
          touch();
          build2();
        } }))));
    const board = h('div', { class: 'plot-board' });
    p.plot.columns.forEach((col, ci) => board.appendChild(column(col, ci)));
    wrap.appendChild(board);
    PS.view.appendChild(wrap);
  }

  function column(col, ci) {
    const p = P();
    const cards = p.plot.cards.filter((c) => c.columnId === col.id);
    const list = h('div', { class: 'plot-cards' });
    cards.forEach((c) => list.appendChild(plotCard(c)));
    list.addEventListener('dragover', (e) => {
      e.preventDefault();
      list.classList.add('drop-target');
    });
    list.addEventListener('dragleave', (e) => { if (!list.contains(e.relatedTarget)) list.classList.remove('drop-target'); });
    list.addEventListener('drop', (e) => {
      e.preventDefault();
      list.classList.remove('drop-target');
      const id = e.dataTransfer.getData('text/plain');
      const card = p.plot.cards.find((c) => c.id === id);
      if (!card) return;
      // ドロップ位置から挿入先を決める
      const siblings = Array.from(list.querySelectorAll('.plot-card')).filter((el) => el.dataset.id !== id);
      let beforeId = null;
      for (const el of siblings) {
        const r = el.getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2) { beforeId = el.dataset.id; break; }
      }
      p.plot.cards.splice(p.plot.cards.indexOf(card), 1);
      card.columnId = col.id;
      if (beforeId) p.plot.cards.splice(p.plot.cards.findIndex((c) => c.id === beforeId), 0, card);
      else {
        const lastInCol = p.plot.cards.map((c, i) => (c.columnId === col.id ? i : -1)).filter((i) => i >= 0).pop();
        p.plot.cards.splice(lastInCol == null ? p.plot.cards.length : lastInCol + 1, 0, card);
      }
      touch();
      build2();
    });
    const more = btn('', { icon: 'more', ghost: true, small: true, title: '列の操作' });
    more.addEventListener('click', () => UI.menu(more, [
      { label: '名前を変更', icon: 'pen', onClick: async () => { const t = await UI.prompt('列の名前', col.title); if (t) { col.title = t; touch(); build2(); } } },
      { label: '左へ移動', icon: 'left', onClick: () => { if (ci > 0) { p.plot.columns.splice(ci - 1, 0, p.plot.columns.splice(ci, 1)[0]); touch(); build2(); } } },
      { label: '右へ移動', icon: 'right', onClick: () => { if (ci < p.plot.columns.length - 1) { p.plot.columns.splice(ci + 1, 0, p.plot.columns.splice(ci, 1)[0]); touch(); build2(); } } },
      null,
      { label: '列を削除', icon: 'trash', danger: true, onClick: async () => {
        if (p.plot.columns.length <= 1) { toast('最後の列は削除できません'); return; }
        if (!(await UI.confirm(`列「${col.title}」を削除します。カードは隣の列に移ります。`, { danger: true, okLabel: '削除' }))) return;
        const target = p.plot.columns[ci === 0 ? 1 : ci - 1];
        p.plot.cards.forEach((c) => { if (c.columnId === col.id) c.columnId = target.id; });
        p.plot.columns.splice(ci, 1);
        touch();
        build2();
      } },
    ]));
    return h('section', { class: 'plot-col' },
      h('div', { class: 'plot-col-head' }, h('h3', null, col.title), h('span', { class: 'count' }, cards.length), more),
      list,
      btn('カードを追加', { icon: 'plus', ghost: true, small: true, class: 'plot-add', onClick: () => {
        const c = { id: UI.uid('c'), columnId: col.id, title: '', body: '', chapterId: '', color: '' };
        p.plot.cards.push(c);
        touch();
        editCard(c, true);
      } }));
  }

  function plotCard(c) {
    const p = P();
    const chIndex = p.chapters.findIndex((x) => x.id === c.chapterId);
    const el = h('div', {
      class: 'plot-card', draggable: true, tabindex: 0, dataset: { id: c.id }, style: { borderLeftColor: c.color || 'var(--line-strong)' },
      onclick: () => editCard(c),
      onkeydown: (e) => { if (e.key === 'Enter') editCard(c); },
    },
    h('strong', null, c.title || '（無題の場面）'),
    c.body ? h('p', null, c.body) : null,
    chIndex >= 0 ? h('span', { class: 'chapter-chip' }, icon('book', 12), `第${chIndex + 1}話 ${p.chapters[chIndex].title}`) : null);
    el.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', c.id); el.classList.add('dragging'); });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    return el;
  }

  function editCard(c, isNew) {
    const p = P();
    const title = h('input', { class: 'input', type: 'text', value: c.title, placeholder: '場面・出来事の見出し' });
    const body = h('textarea', { class: 'input', rows: 6, value: c.body, placeholder: '何が起きるか、誰が登場するか、この場面の目的など' });
    const colSel = h('select', { class: 'input' }, p.plot.columns.map((col) => h('option', { value: col.id, selected: col.id === c.columnId }, col.title)));
    const chSel = h('select', { class: 'input' }, h('option', { value: '' }, '（なし）'), p.chapters.map((ch, i) => h('option', { value: ch.id, selected: ch.id === c.chapterId }, `第${i + 1}話 ${ch.title}`)));
    let color = c.color || '';
    const sw = h('div', { class: 'swatches' }, [''].concat(UI.SWATCHES).map((col) => h('button', {
      type: 'button', class: 'swatch' + (color === col ? ' active' : ''), style: { background: col || 'transparent' }, 'aria-label': col || '色なし',
      onclick: (e) => { color = col; sw.querySelectorAll('.swatch').forEach((s) => s.classList.remove('active')); e.currentTarget.classList.add('active'); },
    })));
    let saved = false;
    const save = () => {
      c.title = title.value.trim();
      c.body = body.value;
      c.columnId = colSel.value;
      c.chapterId = chSel.value;
      c.color = color;
      saved = true;
      touch();
      build2();
    };
    UI.modal({
      title: isNew ? 'カードを追加' : 'カードを編集', wide: true,
      onClose: () => { if (isNew && !saved && !c.title && !c.body) { p.plot.cards.splice(p.plot.cards.indexOf(c), 1); build2(); } },
      body: h('div', { class: 'stack' }, title, body,
        h('div', { class: 'grid-2' }, UI.field('列', colSel), UI.field('対応する話', chSel)),
        UI.field('色', sw)),
      actions: [
        { label: '削除', danger: true, ghost: true, onClick: async () => {
          if (!(await UI.confirm('このカードを削除します。', { danger: true, okLabel: '削除' }))) return false;
          p.plot.cards.splice(p.plot.cards.indexOf(c), 1);
          saved = true;
          touch();
          build2();
        } },
        { label: 'この内容で話を作る', onClick: () => {
          save();
          const ch = NS.Store.newChapter(c.title || '新しい話');
          ch.memo = c.body;
          p.chapters.push(ch);
          c.chapterId = ch.id;
          touch();
          toast('話を作成しました');
          NS.App.navigate('write', { id: ch.id });
        } },
        { label: '保存', primary: true, onClick: save },
      ],
    });
    setTimeout(() => title.focus(), 50);
  }

  NS.Views.ideas = Ideas;
  NS.Views.plot = Plot;
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
<script>
// js/views/map.js
/*
 * 綴り — 空想地図エディタ（Inkarnate / Wonderdraft 風）
 * 陸・海のブラシ、起伏、地面の質感、素材（山・木・町・城…）のスタンプと散布ブラシ、消しゴム、
 * 川・道・国境などの線（クリックでもフリーハンドでも）、領域、曲線・縦書きの文字、レイヤー、
 * 複数選択、元に戻す/やり直す、設定資料（場所）との連携、高解像度の PNG 書き出し。
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const { h, icon, btn, clear, toast } = UI;
  const E = NS.MapEngine;
  const AS = NS.MapAssets;

  const TOOLS = [
    { id: 'select', label: '選択', icon: 'cursor', key: 'v', hint: 'クリックで選択、ドラッグで移動。何もない所をドラッグで範囲選択（Shift で追加）。Delete で削除' },
    { id: 'pan', label: '移動', icon: 'hand', key: 'h', hint: 'ドラッグで地図を動かします（スペースキー・中ボタン・2本指でも可）' },
    { id: 'land', label: '陸', icon: 'brush', key: 'b', brush: true, terrain: true, hint: 'なぞった所を陸地にします' },
    { id: 'water', label: '海・湖', icon: 'wave', key: 'n', brush: true, terrain: true, hint: 'なぞった所を海や湖にします' },
    { id: 'relief', label: '起伏', icon: 'mountain', key: 'r', brush: true, terrain: true, hint: '土地を高く・低く・なだらかにします（陰影が変わります）' },
    { id: 'ground', label: '地面', icon: 'layers', key: 'g', brush: true, hint: '森の地面・砂漠・雪原・農地などの質感を塗ります' },
    { id: 'stamp', label: '素材', icon: 'tree', key: 's', hint: 'クリックした所に素材を置きます。Q/E で回転、[ ] で大きさ' },
    { id: 'scatter', label: '散布', icon: 'sparkles', key: 'f', brush: true, hint: 'なぞった所に森や山脈をまとめて描きます' },
    { id: 'erase', label: '消す', icon: 'eraser', key: 'x', brush: true, hint: 'なぞった所の素材を消します' },
    { id: 'path', label: '道・川', icon: 'route', key: 'l', hint: 'ドラッグでフリーハンド、クリックで点を打ってダブルクリック／Enterで確定' },
    { id: 'area', label: '領域', icon: 'polygon', key: 'a', hint: 'ドラッグで囲むか、クリックで頂点を打ち、始点をクリック／Enterで確定' },
    { id: 'label', label: '文字', icon: 'text', key: 't', hint: 'クリックした所に地名などの文字を置きます' },
  ];

  const PATH_KINDS = {
    river: { label: '川', wobble: 0.55 },
    stream: { label: '小川', wobble: 0.6 },
    highway: { label: '街道', wobble: 0.12 },
    road: { label: '道', wobble: 0.18 },
    trail: { label: '小道', wobble: 0.3 },
    rail: { label: '鉄道', wobble: 0 },
    border: { label: '国境・境界', wobble: 0.2 },
    wall: { label: '城壁・長城', wobble: 0.05 },
    route: { label: '航路', wobble: 0.08 },
  };

  const FONTS = {
    serif: { label: '明朝', family: '"Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif' },
    shippori: { label: 'しっぽり明朝', family: '"Shippori Mincho", "Noto Serif JP", serif' },
    antique: { label: '古風（Zen Antique）', family: '"Zen Antique", "Noto Serif JP", serif' },
    brush: { label: '筆文字（佑字肅）', family: '"Yuji Syuku", "Noto Serif JP", serif' },
    klee: { label: '手書き（クレー）', family: '"Klee One", "Noto Sans JP", sans-serif' },
    sans: { label: 'ゴシック', family: '"Noto Sans JP", "Hiragino Sans", sans-serif' },
    dela: { label: '極太（Dela Gothic）', family: '"Dela Gothic One", "Noto Sans JP", sans-serif' },
  };

  const LABEL_STYLES = {
    region: { label: '国名', font: 'shippori', size: 30, weight: 700, spacing: 0.55, color: 'ink' },
    area: { label: '地方・領地', font: 'shippori', size: 18, weight: 600, spacing: 0.4, color: 'ink' },
    sea: { label: '海・湖', font: 'shippori', size: 20, weight: 500, spacing: 0.7, color: 'water' },
    range: { label: '山脈・森', font: 'antique', size: 15, weight: 400, spacing: 0.35, color: 'glyph' },
    river: { label: '川', font: 'serif', size: 11, weight: 500, spacing: 0.2, color: 'water' },
    city: { label: '都市', font: 'serif', size: 13, weight: 700, spacing: 0.08, color: 'ink' },
    place: { label: '小さな地名', font: 'serif', size: 10.5, weight: 500, spacing: 0.05, color: 'ink' },
    title: { label: '題字', font: 'brush', size: 40, weight: 400, spacing: 0.15, color: 'ink' },
  };
  const LABEL_COLORS = [['', '既定'], ['#3a2e24', '墨'], ['#4c7aa3', '青'], ['#8c3b2a', '赤茶'], ['#2f6b3b', '緑'], ['#6a4f9a', '紫'], ['#b8892a', '金'], ['#ffffff', '白']];
  const AREA_COLORS = ['#c8553d', '#d9a441', '#6a994e', '#3d7ea6', '#5f4b8b', '#b5838d', '#2a9d8f', '#7f5539'];

  // 道具の設定（画面を切り替えても保つ）
  const PREF = Object.assign({
    tool: 'select', brush: { size: 6, strength: 0.7 }, relief: 'raise', biome: 1,
    stamp: { a: 'castle', cat: '町・建物', s: 1, r: 0, randVar: true, randFlip: true },
    scatter: { set: 'forest', size: 22, density: 1, scale: 1 }, erase: { size: 16 },
    path: { kind: 'river', w: 1 }, area: { color: AREA_COLORS[0], opacity: 0.22 }, label: { style: 'region' },
  }, UI.lsGet('tsuzuri.mapPref', null) || {});
  function savePref() { UI.lsSet('tsuzuri.mapPref', PREF); }

  function P() { return NS.App.project; }
  const V = {};
  let M = null;

  V.mount = function (view, params) {
    const p = P();
    M = {
      view, draft: null, freehand: null, sel: [], vertex: null, drag: null, undo: [], redo: [], pointers: new Map(),
      hover: null, space: false, labelBoxes: new Map(), clipboard: null, userMoved: false,
    };
    const id = params.id || p.lastMapId;
    const map = p.maps.find((m) => m.id === id) || p.maps[0];
    if (!map) { renderEmpty(); return; }
    openMap(map);
  };

  V.unmount = function () {
    if (!M) return;
    if (M.raf) cancelAnimationFrame(M.raf);
    if (M.job) M.job.cancel = true;
    if (M.ro) M.ro.disconnect();
