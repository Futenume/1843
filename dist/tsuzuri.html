          NS.App.navigate('map', { id: copy.id });
        } }),
        btn('地図を削除', { icon: 'trash', small: true, danger: true, ghost: true, onClick: async () => {
          if (!(await UI.confirm(`地図「${m.name}」を削除します。元に戻せません。`, { danger: true, okLabel: '削除' }))) return;
          p.maps.splice(p.maps.indexOf(m), 1);
          NS.App.touch();
          NS.App.navigate('map', p.maps[0] ? { id: p.maps[0].id } : {});
        } })),
      h('details', { class: 'hint-details' }, h('summary', { class: 'small' }, '操作のヒント'), h('ul', { class: 'hint-list small muted' },
        h('li', null, 'ホイール／ピンチで拡大縮小、スペース＋ドラッグ・2本指で移動'),
        h('li', null, '道具のキー：V 選択・H 移動・B 陸・N 海・R 起伏・G 地面・S 素材・F 散布・X 消す・L 道川・A 領域・T 文字・M 距離'),
        h('li', null, 'Q / E で回転、[ ] で大きさ、Ctrl+D で複製、Ctrl+Z で元に戻す'),
        h('li', null, '何もない所をドラッグで範囲選択、Shift+クリックで追加選択'))));
  }

  V.TOOLS = TOOLS;
  NS.Views.map = V;
})(window.Tsuzuri = window.Tsuzuri || {});

<script>
// js/views/preview.js
/*
 * 綴り — プレビュー（読者目線での表示）
 * 縦書き：本のようにページをめくる（広い画面では見開き）。横書き：Web小説風。
 * 目次、文字サイズ、書体、配色、印刷（PDF 保存）に対応。
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const { h, icon, btn, clear, toast } = UI;
  const T = NS.Text;

  const PREF = Object.assign({ mode: 'tate', size: 18, font: 'serif', theme: 'paper', blank: false }, UI.lsGet('tsuzuri.previewPref', {}));
  const savePref = () => UI.lsSet('tsuzuri.previewPref', PREF);
  const THEMES = { paper: '生成り', white: '白', dark: '黒' };

  let V = null;

  function P() { return NS.App.project; }

  function chapterHtml(c, opts) {
    const vertical = opts.vertical;
    const blank = opts.blank;
    const lines = (c.body || '').split('\n');
    const paras = lines.map((line) => (line.trim() ? '<p>' + T.rubyToHtml(line, { vertical }) + '</p>' : '<p class="pv-blank">　</p>'));
    const body = blank && !vertical ? paras.join('<p class="pv-blank">　</p>') : paras.join('');
    return '<h1 class="pv-title">' + T.escapeHtml(c.title || '') + '</h1>' + body;
  }

  /** プレビューを開く */
  function open(opts) {
    opts = opts || {};
    const p = P();
    if (!p) return;
    if (V) close();
    if (NS.Views.write && NS.Views.write.chapter && NS.Views.write.chapter()) {
      const cur = NS.Views.write.chapter();
      const text = NS.Views.write.getText();
      if (cur && text !== cur.body) { cur.body = text; NS.App.touch(); }
    }
    let idx = p.chapters.findIndex((c) => c.id === opts.chapterId);
    if (idx < 0) idx = 0;
    V = { idx, page: 0, pages: 1, spread: false };
    V.root = h('div', { class: 'pv-overlay pv-theme-' + PREF.theme, role: 'dialog', 'aria-modal': 'true', 'aria-label': 'プレビュー', tabindex: -1 });
    document.body.appendChild(V.root);
    V.onKey = onKey;
    V.onResize = UI.debounce(() => { if (V) layout(true); }, 120);
    document.addEventListener('keydown', V.onKey, true);
    window.addEventListener('resize', V.onResize);
    build();
    V.root.focus();
  }

  function close() {
    if (!V) return;
    document.removeEventListener('keydown', V.onKey, true);
    window.removeEventListener('resize', V.onResize);
    V.root.remove();
    V = null;
  }

  function build() {
    const p = P();
    const c = p.chapters[V.idx];
    clear(V.root);
    V.root.className = 'pv-overlay pv-theme-' + PREF.theme + ' pv-mode-' + PREF.mode;
    V.root.style.setProperty('--pv-size', PREF.size + 'px');
    V.root.style.setProperty('--pv-font', PREF.font === 'sans' ? 'var(--font-sans)' : 'var(--font-serif)');
    const toc = btn('目次', { icon: 'list', small: true, ghost: true });
    toc.addEventListener('click', () => UI.menu(toc, p.chapters.map((ch, i) => ({
      label: `${i + 1}. ${ch.title || '無題'}`, icon: i === V.idx ? 'check' : null, onClick: () => goChapter(i, 0),
    }))));
    const seg = (key, options) => h('div', { class: 'pv-seg' }, options.map(([v, l]) => h('button', {
      type: 'button', class: 'pv-seg-btn' + (PREF[key] === v ? ' active' : ''),
      onclick: () => { PREF[key] = v; savePref(); build(); },
    }, l)));
    const bar = h('div', { class: 'pv-bar' },
      btn('', { icon: 'x', ghost: true, title: '閉じる（Esc）', onClick: close }),
      h('div', { class: 'pv-heading' }, h('span', { class: 'pv-work' }, p.title), h('span', { class: 'pv-chapter' }, c.title || '')),
      h('div', { class: 'pv-tools' },
        toc,
        seg('mode', [['tate', '縦書き'], ['yoko', '横書き']]),
        h('div', { class: 'pv-seg' },
          h('button', { type: 'button', class: 'pv-seg-btn', title: '文字を小さく', 'aria-label': '文字を小さく', onclick: () => { PREF.size = Math.max(12, PREF.size - 1); savePref(); build(); } }, 'A−'),
          h('button', { type: 'button', class: 'pv-seg-btn', title: '文字を大きく', 'aria-label': '文字を大きく', onclick: () => { PREF.size = Math.min(32, PREF.size + 1); savePref(); build(); } }, 'A＋')),
        seg('font', [['serif', '明朝'], ['sans', 'ゴシック']]),
        seg('theme', Object.keys(THEMES).map((k) => [k, THEMES[k]])),
        PREF.mode === 'yoko' ? h('label', { class: 'check small pv-check' }, h('input', { type: 'checkbox', checked: PREF.blank, onchange: (e) => { PREF.blank = e.target.checked; savePref(); build(); } }), '段落の間を空ける') : null,
        btn('印刷・PDF', { icon: 'printer', small: true, ghost: true, onClick: printWork })));
    V.main = h('div', { class: 'pv-main' });
    V.foot = h('div', { class: 'pv-foot' });
    V.root.append(bar, V.main, V.foot);
    if (PREF.mode === 'tate') buildTate(c);
    else buildYoko(c);
  }

  // ───── 縦書き（ページ送り） ─────
  function buildTate(c) {
    V.book = h('div', { class: 'pv-book' });
    V.main.appendChild(V.book);
    V.main.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      const r = V.main.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      if (x < 0.4) step(1);
      else if (x > 0.6) step(-1);
    });
    let sx = null;
    V.main.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
    V.main.addEventListener('touchend', (e) => {
      if (sx == null) return;
      const dx = e.changedTouches[0].clientX - sx;
      sx = null;
      if (Math.abs(dx) > 40) step(dx > 0 ? 1 : -1);
    });
    V.html = chapterHtml(c, { vertical: true });
    layout(false);
  }

  /** ページの大きさを決めて組む */
  function layout(keep) {
    if (!V || PREF.mode !== 'tate') return;
    const size = PREF.size;
    const lh = size * 2;
    const r = V.main.getBoundingClientRect();
    const availH = Math.max(200, r.height - 70);
    const availW = Math.max(200, r.width - 40);
    const pageH = Math.min(availH, size * 42 + 40);
    const linesFor = (w) => Math.max(5, Math.min(20, Math.floor((w - 56) / lh)));
    V.spread = availW >= 2 * (12 * lh + 56) + 24;
    const lines = V.spread ? linesFor((availW - 24) / 2) : linesFor(availW);
    const contentW = lines * lh;
    const firstChar = keep && V.pages > 1 ? V.page / V.pages : 0;
    clear(V.book);
    V.book.classList.toggle('spread', V.spread);
    V.pageEls = [];
    const count = V.spread ? 2 : 1;
    for (let i = 0; i < count; i++) {
      const content = h('div', { class: 'pv-content', html: V.html, style: { width: contentW + 'px', height: (pageH - 64) + 'px', lineHeight: lh + 'px', '--pv-lh': lh + 'px' } });
      const page = h('div', { class: 'pv-page', style: { height: pageH + 'px' } },
        h('div', { class: 'pv-running' }, P().chapters[V.idx].title || ''),
        content,
        h('div', { class: 'pv-nombre' }));
      V.pageEls.push({ page, content });
    }
    // 見開きは右ページが先
    V.pageEls.slice().reverse().forEach((x) => V.book.appendChild(x.page));
    const c0 = V.pageEls[0].content;
    V.pageW = contentW;
    V.pages = Math.max(1, Math.ceil(c0.scrollWidth / contentW - 0.02));
    // 最後のページも1ページ分ずらして表示できるよう、末尾に余白を足す
    V.pageEls.forEach((x) => x.content.appendChild(h('div', { class: 'pv-pad', style: { width: contentW * (V.spread ? 2 : 1) + 'px' } })));
    if (keep) V.page = Math.min(V.pages - 1, Math.floor(firstChar * V.pages));
    if (V.page < 0) V.page = Math.max(0, V.pages - (V.spread ? 2 - (V.pages % 2 ? 1 : 0) : 1));
    if (V.page >= V.pages) V.page = V.pages - 1;
    if (V.spread) V.page -= V.page % 2;
    showPage();
  }

  function showPage() {
    V.pageEls.forEach((x, i) => {
      const n = V.page + i;
      x.content.scrollLeft = -n * V.pageW;
      // 古いブラウザ（scrollLeft が正の値）にも対応
      if (Math.abs(x.content.scrollLeft + n * V.pageW) > 2) x.content.scrollLeft = x.content.scrollWidth - x.content.clientWidth - n * V.pageW;
      x.page.classList.toggle('pv-empty', n >= V.pages);
      x.page.querySelector('.pv-nombre').textContent = n < V.pages ? String(n + 1) : '';
    });
    clear(V.foot);
    const p = P();
    V.foot.append(
      btn('', { icon: 'left', ghost: true, title: '次のページ（←）', onClick: () => step(1) }),
      h('span', { class: 'small' }, `${V.page + 1}${V.spread && V.page + 1 < V.pages ? '–' + (V.page + 2) : ''} / ${V.pages} ページ　（第${V.idx + 1}話／全${p.chapters.length}話）`),
      btn('', { icon: 'right', ghost: true, title: '前のページ（→）', onClick: () => step(-1) }));
  }

  function step(d) {
    const by = V.spread ? 2 : 1;
    const next = V.page + d * by;
    const p = P();
    if (next >= V.pages) {
      if (V.idx < p.chapters.length - 1) goChapter(V.idx + 1, 0);
      else toast('最後のページです');
      return;
    }
    if (next < 0) {
      if (V.idx > 0) goChapter(V.idx - 1, -1);
      return;
    }
    V.page = next;
    showPage();
  }

  function goChapter(i, page) {
    V.idx = i;
    V.page = page;
    build();
  }

  // ───── 横書き（Web小説風） ─────
  function buildYoko(c) {
    const p = P();
    const article = h('article', { class: 'pv-article', html: chapterHtml(c, { vertical: false, blank: PREF.blank }) });
    const nav = h('div', { class: 'pv-chapter-nav' },
      V.idx > 0 ? btn('前の話', { icon: 'left', onClick: () => goChapter(V.idx - 1, 0) }) : h('span'),
      h('span', { class: 'muted small' }, `${T.stats(c.body).charsNoSpace.toLocaleString('ja-JP')}字`),
      V.idx < p.chapters.length - 1 ? btn('次の話', { icon: 'right', onClick: () => goChapter(V.idx + 1, 0) }) : h('span'));
    const scroll = h('div', { class: 'pv-scroll' }, article, nav);
    V.main.appendChild(scroll);
    V.scroll = scroll;
    clear(V.foot);
    V.foot.appendChild(h('span', { class: 'small' }, `第${V.idx + 1}話／全${p.chapters.length}話`));
  }

  function onKey(e) {
    if (!V) return;
    if (document.querySelector('.popmenu') && e.key === 'Escape') return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); return; }
    if (PREF.mode === 'tate') {
      if (['ArrowLeft', 'PageDown', ' ', 'ArrowDown'].includes(e.key)) { e.preventDefault(); step(1); }
      else if (['ArrowRight', 'PageUp', 'ArrowUp'].includes(e.key)) { e.preventDefault(); step(-1); }
    }
  }

  // ───── 印刷 ─────
  function printWork() {
    const p = P();
    if (p.chapters.length < 2) { doPrint([p.chapters[V.idx]]); return; }
    UI.modal({
      title: '印刷・PDF保存',
      body: h('p', null, '印刷する範囲を選んでください。印刷画面で「PDFに保存」を選ぶとPDFになります。'),
      actions: [
        { label: '表示中の話', onClick: () => { setTimeout(() => doPrint([p.chapters[V.idx]]), 80); } },
        { label: '全話', primary: true, onClick: () => { setTimeout(() => doPrint(p.chapters), 80); } },
      ],
    });
  }

  function doPrint(chapters) {
    const p = P();
    const vertical = PREF.mode === 'tate';
    const root = h('div', { class: 'pv-print ' + (vertical ? 'pv-print-tate' : 'pv-print-yoko') });
    root.style.setProperty('--pv-size', PREF.size + 'px');
    root.style.setProperty('--pv-font', PREF.font === 'sans' ? 'var(--font-sans)' : 'var(--font-serif)');
    root.appendChild(h('section', { class: 'pv-print-cover' }, h('h1', null, p.title), p.author ? h('p', null, p.author) : null));
    chapters.forEach((c) => root.appendChild(h('section', { class: 'pv-print-chapter', html: chapterHtml(c, { vertical, blank: PREF.blank && !vertical }) })));
    document.body.appendChild(root);
    document.body.classList.add('printing');
    const done = () => {
      document.body.classList.remove('printing');
      root.remove();
      window.removeEventListener('afterprint', done);
    };
    window.addEventListener('afterprint', done);
    setTimeout(() => { window.print(); setTimeout(() => { if (document.body.classList.contains('printing')) done(); }, 1000); }, 50);
  }

  NS.Preview = { open, close, isOpen: () => !!V };
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
<script>
// js/views/dict.js
/*
 * 綴り — 辞書（調べたいことをすぐ調べる）
 * 作品の中（設定資料・読み方・アイデア・本文）、創作辞典（オフライン）、
 * ネット辞書（Wikipedia の要約・ウィクショナリーの語義）、外部サイト、AI に聞く。
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const { h, icon, btn, clear, toast } = UI;
  const D = NS.DictData;

  const cache = new Map();
  const enc = encodeURIComponent;

  function P() { return NS.App && NS.App.project; }

  // ───── ネット辞書 ─────
  async function fetchJSON(url, signal) {
    const r = await fetch(url, { signal, headers: { Accept: 'application/json' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  function safeUrl(u, host) {
    try {
      const x = new URL(String(u || ''));
      return x.protocol === 'https:' && x.hostname === host ? x.href : '';
    } catch (e) { return ''; }
  }

  async function wikipedia(q, signal) {
    const s = await fetchJSON(`https://ja.wikipedia.org/w/api.php?action=query&list=search&srsearch=${enc(q)}&srlimit=3&format=json&origin=*`, signal);
    const hits = (s.query && s.query.search) || [];
    if (!hits.length) return null;
    const exact = hits.find((x) => x.title === q) || hits[0];
    const sum = await fetchJSON(`https://ja.wikipedia.org/api/rest_v1/page/summary/${enc(exact.title)}`, signal);
    // ネットから来た URL は、決まった場所の https だけを使う（javascript: などは使わない）
    const pageUrl = sum.content_urls && sum.content_urls.desktop && sum.content_urls.desktop.page;
    const thumb = sum.thumbnail && sum.thumbnail.source;
    return {
      title: String(sum.title || exact.title), extract: String(sum.extract || ''),
      url: safeUrl(pageUrl, 'ja.wikipedia.org') || `https://ja.wikipedia.org/wiki/${enc(String(sum.title || exact.title))}`,
      thumb: safeUrl(thumb, 'upload.wikimedia.org'), others: hits.filter((x) => x.title !== exact.title).map((x) => String(x.title)),
    };
  }

  /** ウィクショナリーの HTML から日本語の語義を取り出す */
  function parseWiktionary(html) {
    // 文字だけを取り出すので、スクリプト・画像・イベント属性などは解析の前に取り除く
    const clean = String(html || '')
      .replace(/<(script|style|iframe|object|embed|noscript|template)\b[\s\S]*?<\/\1\s*>/gi, '')
      .replace(/<(img|iframe|object|embed|link|meta|source|video|audio|picture)\b[^>]*>/gi, '')
      .replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '');
    const doc = new DOMParser().parseFromString(clean, 'text/html');
    const h2s = Array.from(doc.querySelectorAll('h2'));
    const jp = h2s.find((x) => /^\s*日本語/.test(x.textContent));
    if (!jp) return [];
    let node = jp.closest('.mw-heading') || jp;
    const out = [];
    let pos = '';
    for (let n = node.nextElementSibling; n; n = n.nextElementSibling) {
      if (n.matches('h2') || n.matches('.mw-heading2') || n.querySelector(':scope > h2')) break;
      const heading = n.matches('h3,h4,h5') ? n : n.matches('.mw-heading') ? n.querySelector('h3,h4,h5') : null;
      if (heading) { pos = heading.textContent.replace(/\[編集\]/g, '').trim(); continue; }
      if (n.tagName === 'OL') {
        Array.from(n.children).forEach((li) => {
          const c = li.cloneNode(true);
          c.querySelectorAll('ul, dl, ol, sup, .mw-editsection, style').forEach((x) => x.remove());
          const t = c.textContent.replace(/\s+/g, ' ').trim();
          if (t && !/^(発音|語源|翻訳)/.test(pos)) out.push({ pos, text: t });
        });
      }
      if (out.length >= 8) break;
    }
    return out;
  }

  async function wiktionary(q, signal) {
    const r = await fetchJSON(`https://ja.wiktionary.org/w/api.php?action=parse&page=${enc(q)}&prop=text&format=json&origin=*&redirects=1`, signal);
    if (!r.parse || !r.parse.text) return null;
    const defs = parseWiktionary(r.parse.text['*'] || '');
    return defs.length ? { title: String(r.parse.title), defs, url: `https://ja.wiktionary.org/wiki/${enc(String(r.parse.title))}` } : null;
  }

  const LINKS = [
    ['Weblio辞書', (q) => `https://www.weblio.jp/content/${enc(q)}`],
    ['類語辞典', (q) => `https://thesaurus.weblio.jp/content/${enc(q)}`],
    ['コトバンク', (q) => `https://kotobank.jp/search?q=${enc(q)}`],
    ['Wikipedia', (q) => `https://ja.wikipedia.org/wiki/Special:Search?search=${enc(q)}`],
    ['Google', (q) => `https://www.google.com/search?q=${enc(q)}`],
    ['画像', (q) => `https://www.google.com/search?tbm=isch&q=${enc(q)}`],
  ];

  // ───── 作品の中 ─────
  function inWork(q, p) {
    if (!p || !q) return null;
    const entries = p.entries.filter((e) => (e.name || '').indexOf(q) >= 0 || (e.reading || '').indexOf(q) >= 0 || (e.aliases || []).some((a) => String(a).indexOf(q) >= 0) || (q.length >= 2 && Object.values(e.fields || {}).some((v) => typeof v === 'string' && v.indexOf(q) >= 0)));
    const readings = NS.Readings ? NS.Readings.collect(p).filter((r) => r.base.indexOf(q) >= 0 || NS.Readings.normReading(r.reading).indexOf(NS.Readings.normReading(q)) >= 0) : [];
    const ideas = p.ideas.filter((i) => ((i.body || '') + ' ' + (i.word || '') + ' ' + (i.reading || '')).indexOf(q) >= 0).slice(0, 6);
    const chapters = [];
    p.chapters.forEach((c, i) => {
      const text = c.body || '';
      let n = 0;
      let k = text.indexOf(q);
      const first = k;
      while (k >= 0) { n++; k = text.indexOf(q, k + q.length); }
      if (n) chapters.push({ c, i, n, first });
    });
    return { entries, readings, ideas, chapters };
  }

  // ───── この世界では ─────
  const fmtV = (v) => (v >= 100 ? UI.fmtNum(Math.round(v)) : String(Math.round(v * 100) / 100));
  /** 調べた言葉を、世界観ルールに照らした結果（お金・単位の説明、換算、この世界での言い方） */
  function worldCards(q, p) {
    const W = NS.WorldRules;
    if (!W || !p || !q) return [];
    const r = p.rules;
    const cards = [];
    const coins = (r.currency.units || []).filter((u) => u.name && u.value > 0).sort((a, b) => b.value - a.value);
    const units = (r.units.list || []).filter((u) => u.name && u.amount > 0);
    // 「銀貨3枚」「三枚の銀貨」→ ほかのお金で
    const m = new RegExp('^(?:([0-9０-９.〇一二三四五六七八九十百千万]+)枚?の?)?(' + coins.map((c) => c.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?:([0-9０-９.〇一二三四五六七八九十百千万]+)枚?)?$').exec(q.replace(/\s/g, ''));
    if (coins.length && m) {
      const coin = coins.find((c) => c.name === m[2]);
      const n = W.parseNum(m[1] || m[3] || '1') || 1;
      const base = n * coin.value;
      cards.push(h('div', { class: 'dict-item world-card' },
        h('div', { class: 'dict-item-head' }, h('strong', null, coin.name), coin.reading ? h('span', { class: 'small muted' }, coin.reading) : null, h('span', { class: 'small muted' }, 'この世界のお金')),
        coin.note ? h('div', { class: 'small' }, coin.note) : null,
        h('div', { class: 'conv-out small' }, h('span', null, `${coin.name}${fmtV(n)}枚 ＝`),
          coins.filter((c) => c !== coin).map((c) => h('span', null, `${c.name} ${fmtV(base / c.value)}枚`)),
          r.currency.yen > 0 ? h('span', { class: 'muted' }, `およそ ${UI.fmtNum(Math.round(base * r.currency.yen))}円`) : null)));
    }
    // 単位の名前
    units.filter((u) => u.name === q).forEach((u) => {
      const same = units.filter((x) => x.kind === u.kind && x !== u);
      cards.push(h('div', { class: 'dict-item world-card' },
        h('div', { class: 'dict-item-head' }, h('strong', null, u.name), h('span', { class: 'small muted' }, `この世界の${W.KIND_LABEL[u.kind]}の単位`)),
        h('div', { class: 'conv-out small' }, h('span', null, `1${u.name} ＝ ${W.describeAmount(u).replace(/^.*（(.*)）$/, '$1')}`),
          // 大きい方の単位を1として書く（「1里 ＝ 5,333歩」）
          same.map((x) => h('span', null, u.amount >= x.amount ? `1${u.name} ＝ ${fmtV(u.amount / x.amount)}${x.name}` : `1${x.name} ＝ ${fmtV(x.amount / u.amount)}${u.name}`)))));
    });
    // 本文に書いたら指摘されるもの（「100メートル」「千円」「月曜日」「電話」など）→ この世界での言い方
    if (W.active(r)) {
      W.scan(q, r).forEach((f) => {
        const word = q.slice(f.start, f.end);
        cards.push(h('div', { class: 'dict-item world-card' },
          h('div', { class: 'dict-item-head' }, h('strong', null, word), f.suggestion ? h('span', null, '→ ', h('strong', { class: 'world-sug' }, f.suggestion)) : null),
          h('div', { class: 'small muted' }, f.message),
          f.suggestion ? h('div', { class: 'chips' }, f.suggestion.split('・').map((x) => h('button', {
            type: 'button', class: 'chip', title: '本文に入れる（選択中の語と置き換え）', onclick: () => { if (currentInsert) currentInsert(x); },
          }, x))) : null));
      });
    }
    return cards;
  }
  let currentInsert = null;

  /**
   * 辞書の画面を作る。
   * opts: { query, onInsert(text), onJump(chapterId, start, end), compact }
   */
  function render(opts) {
    opts = opts || {};
    const root = h('div', { class: 'dict' + (opts.compact ? ' dict-compact' : '') });
    currentInsert = opts.onInsert || null;
    let controller = null;
    let browseCat = D.CATEGORIES[0].id;
    const input = h('input', { class: 'input', type: 'search', value: opts.query || '', placeholder: '調べたい言葉', 'aria-label': '調べたい言葉' });
    const out = h('div', { class: 'dict-results' });
    const go = () => run(input.value.trim());
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); go(); } });
    root.append(h('div', { class: 'row dict-search' }, input, btn('調べる', { icon: 'search', primary: true, small: true, onClick: go })), out);

    const section = (title, ...children) => h('section', { class: 'dict-section' }, h('h3', { class: 'panel-h' }, title), ...children);

    function insertBtn(text) {
      if (!opts.onInsert) return null;
      return btn('', { icon: 'pen', ghost: true, small: true, title: `「${text}」を本文に入れる`, onClick: () => opts.onInsert(text) });
    }

    function itemView(it, cat) {
      const chips = it.s ? h('div', { class: 'chips' }, it.s.map((x) => h('button', {
        type: 'button', class: 'chip', title: opts.onInsert ? '本文に入れる（選択中の語と置き換え）' : '', onclick: () => { if (opts.onInsert) opts.onInsert(x); else run(x); },
      }, x))) : null;
      return h('div', { class: 'dict-item' },
        h('div', { class: 'dict-item-head' },
          it.c ? h('span', { class: 'dict-swatch', style: { background: it.c }, title: it.c }) : null,
          h('strong', null, it.w), h('span', { class: 'muted small' }, it.r), it.c ? h('span', { class: 'muted small mono' }, it.c) : null,
          h('span', { class: 'dict-spacer' }), insertBtn(it.w)),
        it.s ? h('div', { class: 'small muted' }, '言い換えの候補') : h('div', { class: 'small' }, it.m),
        chips);
    }

    function browse() {
      clear(out);
      const cat = D.CATEGORIES.find((c) => c.id === browseCat) || D.CATEGORIES[0];
      out.append(
        h('p', { class: 'small muted' }, '言葉を入れて「調べる」を押すと、作品の中・創作辞典・ネット辞書をまとめて調べます。下は創作辞典の一覧です。'),
        h('div', { class: 'chips' }, D.CATEGORIES.map((c) => h('button', {
          type: 'button', class: 'chip' + (c.id === cat.id ? ' active' : ''), onclick: () => { browseCat = c.id; browse(); },
        }, c.label))),
        h('div', { class: 'dict-list' }, cat.items.map((it) => itemView(it, cat))));
    }

    function run(q) {
      if (controller) controller.abort();
      controller = null;
      input.value = q;
      if (!q) { browse(); return; }
      clear(out);
      const p = P();
      // この世界では（世界観ルールの通貨・単位・暦・文明）
      const wc = worldCards(q, p);
      if (wc.length) out.appendChild(section('この世界では', ...wc));
      // 作品の中
      const w = inWork(q, p);
      if (w && (w.entries.length || w.readings.length || w.ideas.length || w.chapters.length)) {
        const parts = [];
        w.entries.forEach((e) => parts.push(h('details', { class: 'ref-item', open: w.entries.length === 1 },
          h('summary', null, h('span', { class: 'type-badge t-' + e.type }, NS.Lore.TYPE_LABEL[e.type]), h('strong', null, e.name), e.reading ? h('span', { class: 'muted small' }, ' ' + e.reading) : null),
          h('div', { class: 'ref-body' }, NS.Lore.summaryList(e, p), btn('設定資料を開く', { small: true, ghost: true, onClick: () => NS.App.navigate('lore', { id: e.id }) })))));
        if (w.readings.length) {
          parts.push(h('div', { class: 'dict-item' }, h('div', { class: 'small muted' }, '登録した読み方'),
            h('div', { class: 'reading-list' }, w.readings.map((r) => h('div', { class: 'reading-row static', html: NS.Text.rubyToHtml('|' + r.base + '《' + r.reading + '》', { vertical: false }) })))));
        }
        w.ideas.forEach((i) => parts.push(h('div', { class: 'dict-item' }, h('div', { class: 'small muted' }, 'アイデア帳・' + (i.kind || 'アイデア')), h('div', { class: 'small' }, (i.word ? i.word + '《' + (i.reading || '') + '》 ' : '') + (i.body || '').split('\n')[0]))));
        if (w.chapters.length) {
          parts.push(h('div', { class: 'dict-item' }, h('div', { class: 'small muted' }, `本文での使用（全${w.chapters.reduce((a, x) => a + x.n, 0)}回）`),
            h('div', { class: 'chips' }, w.chapters.slice(0, 30).map((x) => h('button', {
              type: 'button', class: 'chip', onclick: () => { if (opts.onJump) opts.onJump(x.c.id, x.first, x.first + q.length); },
            }, `第${x.i + 1}話 ${x.n}回`)))));
        }
        out.appendChild(section('作品の中', ...parts));
      }
      // 創作辞典
      const local = D.search(q);
      if (local.length) {
        out.appendChild(section('創作辞典', ...local.map(({ cat, items }) => h('div', { class: 'dict-cat' },
          h('div', { class: 'small muted' }, cat.label), items.slice(0, 12).map((it) => itemView(it, cat))))));
      }
      // ネット辞書
      const netBox = h('div', { class: 'dict-net' });
      out.appendChild(section('ネット辞書', netBox,
        h('p', { class: 'small muted' }, '入力した言葉だけが Wikipedia／ウィクショナリー（ウィキメディア財団）に送られます。')));
      loadNet(q, netBox);
      // 外部サイト
      out.appendChild(section('ほかのサイトで調べる', h('div', { class: 'row wrap' }, LINKS.map(([label, url]) => h('a', {
        class: 'btn btn-sm', href: url(q), target: '_blank', rel: 'noopener noreferrer',
      }, label)))));
      // AI
      const aiBox = h('div', { class: 'dict-ai' });
      const hasKey = NS.AI && NS.AI.getKey && NS.AI.getKey();
      out.appendChild(section('AIに聞く', hasKey
        ? h('div', { class: 'stack-sm' }, btn(`「${q}」の意味・例文・言い換えを聞く`, { icon: 'sparkles', small: true, onClick: () => askAI(q, aiBox) }), aiBox)
        : h('p', { class: 'small muted' }, '設定 → AI で APIキーを入れると、Claude に意味や例文、言い換えを聞けます。')));
    }

    function loadNet(q, box) {
      clear(box);
      const key = q;
      const show = (res) => {
        clear(box);
        const { wp, wk, error } = res;
        if (wk) {
          box.appendChild(h('div', { class: 'dict-card' },
            h('div', { class: 'dict-card-head' }, h('strong', null, wk.title), h('span', { class: 'muted small' }, 'ウィクショナリー'), h('a', { href: wk.url, target: '_blank', rel: 'noopener noreferrer', class: 'small' }, '開く')),
            h('ol', { class: 'dict-defs' }, wk.defs.map((d) => h('li', null, d.pos ? h('span', { class: 'dict-pos' }, d.pos) : null, d.text)))));
        }
        if (wp) {
          box.appendChild(h('div', { class: 'dict-card' },
            h('div', { class: 'dict-card-head' }, h('strong', null, wp.title), h('span', { class: 'muted small' }, 'Wikipedia'), h('a', { href: wp.url, target: '_blank', rel: 'noopener noreferrer', class: 'small' }, '開く')),
            h('div', { class: 'dict-wp' }, wp.thumb ? h('img', { src: wp.thumb, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' }) : null, h('p', null, wp.extract)),
            wp.others && wp.others.length ? h('div', { class: 'chips' }, h('span', { class: 'small muted' }, 'ほかの候補：'), wp.others.map((t) => h('button', { type: 'button', class: 'chip', onclick: () => run(t) }, t))) : null));
        }
        if (!wk && !wp) box.appendChild(h('p', { class: 'small muted' }, error ? 'ネット辞書に接続できませんでした（オフラインか、通信が制限されています）。' : '見つかりませんでした。'));
      };
      if (cache.has(key)) { show(cache.get(key)); return; }
      box.appendChild(h('div', { class: 'row small muted' }, h('span', { class: 'spinner' }), '調べています…'));
      controller = new AbortController();
      const signal = controller.signal;
      Promise.allSettled([wikipedia(q, signal), wiktionary(q, signal)]).then(([a, b]) => {
        if (signal.aborted) return;
        const res = {
          wp: a.status === 'fulfilled' ? a.value : null,
          wk: b.status === 'fulfilled' ? b.value : null,
          error: a.status === 'rejected' && b.status === 'rejected',
        };
        if (!res.error) cache.set(key, res);
        show(res);
      });
    }

    async function askAI(q, box) {
      clear(box);
      const ans = h('div', { class: 'ai-answer' });
      box.append(h('div', { class: 'row small muted' }, h('span', { class: 'spinner' }), '考えています…'), ans);
      try {
        const text = await NS.AI.askWord(P(), q, null, (snap) => { ans.textContent = snap; });
        clear(box);
        ans.textContent = text;
        box.appendChild(ans);
      } catch (e) {
        clear(box);
        box.appendChild(h('p', { class: 'small', style: { color: 'var(--danger)' } }, e.message));
      }
    }

    run(opts.query ? String(opts.query).trim() : '');
    setTimeout(() => { if (!opts.query) input.focus(); }, 30);
    root.search = run;
    return root;
  }

  function openModal(q) {
    const view = render({
      query: q,
      onJump: (chapterId, start, end) => {
        close();
        NS.App.navigate('write', { id: chapterId });
        setTimeout(() => NS.Views.write.focusRange && NS.Views.write.focusRange(start, end), 80);
      },
    });
    const close = UI.modal({ title: '辞書', body: view, wide: true });
  }

  NS.Dict = { render, openModal, parseWiktionary, wikipedia, wiktionary };
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
<script>
// js/views/publish-dialog.js
/*
 * 綴り — 投稿サイト用の書き出し（画面）
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const { h, btn, clear, toast } = UI;
  const PB = NS.Publish;

  const PREF = Object.assign({ format: 'narou', indent: 'keep', blankLines: false, fullwidthMarks: true, includeTitle: false }, UI.lsGet('tsuzuri.publishPref', {}));
  const savePref = () => UI.lsSet('tsuzuri.publishPref', PREF);

  async function copyText(text, ta) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      // クリップボード API が使えない環境（file:// など）では選択してコピー
      try {
        ta.focus();
        ta.select();
        return document.execCommand('copy');
      } catch (e2) { return false; }
    }
  }

  /** 投稿サイト用に書き出す窓を開く。opts: { chapterId } */
  function open(opts) {
    opts = opts || {};
    const p = NS.App.project;
    if (!p) return;
    if (NS.Views.write && NS.Views.write.chapter && NS.Views.write.chapter()) {
      const cur = NS.Views.write.chapter();
      const text = NS.Views.write.getText();
      if (cur && text !== cur.body) { cur.body = text; NS.App.touch(); }
    }
    let target = opts.chapterId && p.chapters.some((c) => c.id === opts.chapterId) ? opts.chapterId : (p.chapters[0] && p.chapters[0].id);

    const body = h('div', { class: 'publish' });
    const out = h('textarea', { class: 'input publish-out', readonly: true, rows: 14, 'aria-label': '書き出した本文', spellcheck: false });
    const info = h('div', { class: 'publish-info small' });
    const fmtBox = h('div', { class: 'chips' });
    const note = h('p', { class: 'small muted' });

    const chapterSel = h('select', { class: 'input', 'aria-label': '書き出す話', onchange: (e) => { target = e.target.value; update(); } },
      p.chapters.map((c, i) => h('option', { value: c.id, selected: c.id === target }, `${i + 1}. ${c.title || '無題'}`)),
      h('option', { value: '*' }, '全話'));
    const indentSel = h('select', { class: 'input', 'aria-label': '段落頭の字下げ', onchange: (e) => { PREF.indent = e.target.value; savePref(); update(); } },
      [['keep', '字下げはそのまま'], ['add', '地の文に字下げを付ける'], ['remove', '字下げを外す']].map(([v, l]) => h('option', { value: v, selected: PREF.indent === v }, l)));
    const check = (key, label) => h('label', { class: 'check small' },
      h('input', { type: 'checkbox', checked: !!PREF[key], onchange: (e) => { PREF[key] = e.target.checked; savePref(); update(); } }), label);

    function renderFormats() {
      clear(fmtBox);
      Object.keys(PB.FORMATS).forEach((k) => fmtBox.appendChild(h('button', {
        type: 'button', class: 'chip' + (PREF.format === k ? ' active' : ''), 'aria-pressed': PREF.format === k ? 'true' : 'false',
        onclick: () => { PREF.format = k; savePref(); renderFormats(); update(); },
      }, PB.FORMATS[k].label)));
      note.textContent = PB.FORMATS[PREF.format].note;
    }

    function chaptersFor() {
      return target === '*' ? p.chapters : p.chapters.filter((c) => c.id === target);
    }

    function update() {
      const res = PB.convertChapters(chaptersFor(), PREF.format, PREF);
      out.value = res.text;
      clear(info);
      const st = res.stats;
      info.appendChild(h('span', null, `${PB.visibleLength(res.text, PREF.format).toLocaleString('ja-JP')}字（記号・空白を除く）`));
      if (st.emphasis && (PREF.format === 'narou' || PREF.format === 'pixiv')) info.appendChild(h('span', { class: 'muted' }, `傍点 ${st.emphasis}か所をルビの「・」に変換`));
      if (st.parenGuard) info.appendChild(h('span', { class: 'muted' }, `「漢字（かな）」${st.parenGuard}か所がルビにならないよう「|」を追加`));
      if (st.longRuby.length) {
        info.appendChild(h('span', { class: 'warn' }, `なろうでは10文字を超えるルビは表示されません：${st.longRuby.slice(0, 3).join('、')}${st.longRuby.length > 3 ? ' ほか' : ''}`));
      }
    }

    body.append(
      h('div', { class: 'small muted' }, '書き出し先'),
      fmtBox,
      note,
      h('div', { class: 'publish-opts' },
        UI.field('書き出す話', chapterSel),
        UI.field('段落頭', indentSel)),
      h('div', { class: 'row wrap' },
        check('includeTitle', '話の題を入れる'),
        check('blankLines', '段落の間に空行を入れる（Web向け）'),
        check('fullwidthMarks', '半角の ! ? を全角に')),
      out,
      info);
    renderFormats();
    update();

    UI.modal({
      title: '投稿サイト用に書き出す',
      body,
      wide: true,
      actions: [
        { label: '.txt で保存', ghost: true, onClick: () => {
          const name = target === '*' ? p.title : p.title + '_' + ((p.chapters.find((c) => c.id === target) || {}).title || '');
          UI.download(UI.safeFilename(name + '_' + PB.FORMATS[PREF.format].label) + '.txt', out.value);
          return false;
        } },
        { label: 'コピー', primary: true, onClick: async () => {
          const ok = await copyText(out.value, out);
          toast(ok ? 'コピーしました。投稿サイトの本文欄に貼り付けてください' : 'コピーできませんでした。本文を選んでコピーしてください', ok ? undefined : 'error');
          return false;
        } },
      ],
    });
  }

  /** 電子書籍（EPUB）で書き出す */
  function openEpub(opts) {
    opts = opts || {};
    const p = NS.App.project;
    if (!p) return;
    if (NS.Views.write && NS.Views.write.chapter && NS.Views.write.chapter()) {
      const cur = NS.Views.write.chapter();
      const text = NS.Views.write.getText();
      if (cur && text !== cur.body) { cur.body = text; NS.App.touch(); }
    }
    const EP = Object.assign({ vertical: true }, UI.lsGet('tsuzuri.epubPref', {}));
    const title = h('input', { class: 'input', type: 'text', value: p.title, 'aria-label': '本の題' });
    const author = h('input', { class: 'input', type: 'text', value: p.author || '', placeholder: '例：筆名', 'aria-label': '著者名' });
    const dir = h('select', { class: 'input', 'aria-label': '組み方' },
      h('option', { value: 'v', selected: EP.vertical }, '縦書き（右から左へめくる）'),
      h('option', { value: 'h', selected: !EP.vertical }, '横書き（左から右へめくる）'));
    const range = h('select', { class: 'input', 'aria-label': '書き出す範囲' },
      h('option', { value: '*' }, `全話（${p.chapters.length}話）`),
      p.chapters.map((c, i) => h('option', { value: c.id }, `${i + 1}. ${c.title || '無題'}だけ`)));
    UI.modal({
      title: '電子書籍（EPUB）で書き出す',
      body: h('div', { class: 'stack' },
        h('p', { class: 'small muted' }, 'Kindle・Apple Books・楽天Kobo・BOOTH などで読める EPUB 3 の本にします。ルビ・傍点・縦中横（!? や2桁の数字）、目次と扉が付きます。'),
        h('div', { class: 'grid-2' }, UI.field('本の題', title), UI.field('著者名', author)),
        h('div', { class: 'grid-2' }, UI.field('組み方', dir), UI.field('書き出す範囲', range)),
        h('p', { class: 'small muted' }, 'Kindle で出版するときは、この EPUB を Kindle ダイレクト・パブリッシングにそのまま登録できます（表紙の画像は登録の画面で別に付けます）。')),
      actions: [
        { label: 'キャンセル', ghost: true },
        { label: '書き出す', primary: true, onClick: () => {
          EP.vertical = dir.value === 'v';
          UI.lsSet('tsuzuri.epubPref', EP);
          if (!p.author && author.value.trim()) { p.author = author.value.trim(); NS.App.touch(); }
          const chapters = range.value === '*' ? p.chapters : p.chapters.filter((c) => c.id === range.value);
          const r = NS.Epub.build(p, { vertical: EP.vertical, title: title.value.trim() || p.title, author: author.value.trim(), chapters });
          UI.download(UI.safeFilename(title.value.trim() || p.title) + '.epub', new Blob([r.data], { type: 'application/epub+zip' }));
          toast('EPUB を書き出しました');
        } },
      ],
    });
  }

  /** Word（.docx）で書き出す：新人賞などの応募書式に合わせた文書 */
  const DOCX_PRESETS = [
    { id: 'a4v40x34', label: 'A4横・縦書き 40字×34行（よくある応募書式）', vertical: true, chars: 40, lines: 34 },
    { id: 'a4v40x30', label: 'A4横・縦書き 40字×30行', vertical: true, chars: 40, lines: 30 },
    { id: 'a4v42x34', label: 'A4横・縦書き 42字×34行', vertical: true, chars: 42, lines: 34 },
    { id: 'a4v20x20', label: 'A4横・縦書き 20字×20行（原稿用紙の字数）', vertical: true, chars: 20, lines: 20 },
    { id: 'a4h40x30', label: 'A4縦・横書き 40字×30行', vertical: false, chars: 40, lines: 30 },
    { id: 'custom', label: '字数と行数を指定' },
  ];
  function openDocx(opts) {
    opts = opts || {};
    const p = NS.App.project;
    if (!p) return;
    if (NS.Views.write && NS.Views.write.chapter && NS.Views.write.chapter()) {
      const cur = NS.Views.write.chapter();
      const text = NS.Views.write.getText();
      if (cur && text !== cur.body) { cur.body = text; NS.App.touch(); }
    }
    const DP = Object.assign({ preset: 'a4v40x34', vertical: true, chars: 40, lines: 34, ruby: 'word', font: 'mincho', titlePage: true, chapterBreak: true, pageNumbers: true }, UI.lsGet('tsuzuri.docxPref', {}));
    const title = h('input', { class: 'input', type: 'text', value: p.title, 'aria-label': '題' });
    const author = h('input', { class: 'input', type: 'text', value: p.author || '', placeholder: '例：筆名', 'aria-label': '名前' });
    const preset = h('select', { class: 'input', 'aria-label': '書式' }, DOCX_PRESETS.map((x) => h('option', { value: x.id, selected: DP.preset === x.id }, x.label)));
    const dir = h('select', { class: 'input', 'aria-label': '組み方' }, h('option', { value: 'v', selected: DP.vertical }, '縦書き（A4横）'), h('option', { value: 'h', selected: !DP.vertical }, '横書き（A4縦）'));
    const chars = h('input', { class: 'input', type: 'number', min: 10, max: 60, value: DP.chars, 'aria-label': '1行の字数' });
    const lines = h('input', { class: 'input', type: 'number', min: 5, max: 60, value: DP.lines, 'aria-label': '1枚の行数' });
    const custom = h('div', { class: 'grid-3' }, UI.field('組み方', dir), UI.field('1行の字数', chars), UI.field('1枚の行数', lines));
    const ruby = h('select', { class: 'input', 'aria-label': 'ルビ' },
      [['word', 'Word のルビにする'], ['paren', '（）で書く'], ['none', '外す（漢字だけ）']].map(([v, l]) => h('option', { value: v, selected: DP.ruby === v }, l)));
    const font = h('select', { class: 'input', 'aria-label': '書体' },
      [['mincho', '明朝'], ['gothic', 'ゴシック']].map(([v, l]) => h('option', { value: v, selected: DP.font === v }, l)));
    const range = h('select', { class: 'input', 'aria-label': '書き出す範囲' },
      h('option', { value: '*' }, `全話（${p.chapters.length}話）`),
      p.chapters.map((c) => h('option', { value: c.id, selected: opts.only && opts.chapterId === c.id }, `${p.chapters.indexOf(c) + 1}. ${c.title || '無題'}だけ`)));
    const chk = (v, label) => { const i = h('input', { type: 'checkbox', checked: !!v }); return { i, el: h('label', { class: 'check' }, i, label) }; };
    const tp = chk(DP.titlePage, '1枚目に題と名前（扉）');
    const cb = chk(DP.chapterBreak, '話ごとに新しいページから');
    const pn = chk(DP.pageNumbers, 'ページ番号を付ける');
    const info = h('p', { class: 'small muted' });
    const cur = () => {
      const ps = DOCX_PRESETS.find((x) => x.id === preset.value) || DOCX_PRESETS[0];
      return ps.id === 'custom' ? { vertical: dir.value === 'v', chars: +chars.value || 40, lines: +lines.value || 34 } : ps;
    };
    const upd = () => {
      custom.hidden = preset.value !== 'custom';
      const c = cur();
      const chs = range.value === '*' ? p.chapters : p.chapters.filter((x) => x.id === range.value);
      const pages = NS.Docx.estimatePages(chs, { chars: c.chars, lines: c.lines, titlePage: tp.i.checked, chapterBreak: cb.i.checked });
      info.textContent = `${c.vertical ? '縦書き' : '横書き'}・1行${c.chars}字・1枚${c.lines}行（${c.chars * c.lines}字）。およそ${pages}枚になります（扉・改ページを含む目安）。`;
    };
    [preset, dir, chars, lines, range, tp.i, cb.i].forEach((el) => el.addEventListener('change', upd));
    [chars, lines].forEach((el) => el.addEventListener('input', upd));
    upd();
    UI.modal({
      title: 'Word（.docx）で書き出す',
      body: h('div', { class: 'stack' },
        h('p', { class: 'small muted' }, '新人賞などの応募でよく指定される書式（A4・縦書き・40字×34行 など）に合わせた Word の文書にします。ルビ・傍点・縦中横（!? や2桁の数字）も Word の書き方で入ります。Word・Pages・Googleドキュメント・LibreOffice で開けます。'),
        h('div', { class: 'grid-2' }, UI.field('題', title), UI.field('名前', author)),
        UI.field('書式', preset), custom,
        h('div', { class: 'grid-3' }, UI.field('ルビ', ruby), UI.field('書体', font), UI.field('書き出す範囲', range)),
        h('div', { class: 'stack-sm' }, tp.el, cb.el, pn.el),
        info,
        h('p', { class: 'small muted' }, '応募先の決まり（字数・行数・書体・扉の書き方など）は、募集要項で必ず確かめてください。')),
      actions: [
        { label: 'キャンセル', ghost: true },
        { label: '書き出す', primary: true, onClick: () => {
          const c = cur();
          Object.assign(DP, { preset: preset.value, vertical: c.vertical, chars: c.chars, lines: c.lines, ruby: ruby.value, font: font.value, titlePage: tp.i.checked, chapterBreak: cb.i.checked, pageNumbers: pn.i.checked });
          UI.lsSet('tsuzuri.docxPref', DP);
          if (!p.author && author.value.trim()) { p.author = author.value.trim(); NS.App.touch(); }
          const chapters = range.value === '*' ? p.chapters : p.chapters.filter((x) => x.id === range.value);
          const r = NS.Docx.build(p, { title: title.value.trim() || p.title, author: author.value.trim(), chapters, vertical: c.vertical, chars: c.chars, lines: c.lines, ruby: DP.ruby, font: DP.font, titlePage: DP.titlePage, chapterBreak: DP.chapterBreak, pageNumbers: DP.pageNumbers });
          UI.download(UI.safeFilename(title.value.trim() || p.title) + '.docx', new Blob([r.data], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' }));
          toast('Word の文書を書き出しました');
        } },
      ],
    });
  }

  NS.PublishDialog = { open, openEpub, openDocx };
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
<script>
// js/views/import-dialog.js
/*
 * 綴り — テキストの取り込み（画面）
 * .txt / .md を選ぶか貼り付けると、見出しで話に分けた結果を見ながら取り込める。
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const { h, btn, clear, toast } = UI;
  const IT = NS.ImportText;
  const Store = NS.Store;

  const MAX_BYTES = 20 * 1024 * 1024;

  /** opts: { mode: 'append'|'new' }（既定は、作品を開いていれば足す） */
  function open(opts) {
    opts = opts || {};
    const canAppend = !!NS.App.project && opts.mode !== 'new';
    let raw = '';
    let fileName = '';
    let result = null;

    const fileIn = h('input', { type: 'file', accept: '.txt,.md,.text,.markdown,text/plain,text/markdown', hidden: true });
    const fileInfo = h('span', { class: 'small muted' }, '.txt・.md に対応（文字コードは UTF-8・Shift_JIS・UTF-16 を自動で判定）');
    const paste = h('textarea', { class: 'input import-paste', rows: 5, placeholder: 'または、ここに原稿を貼り付けます', 'aria-label': '原稿を貼り付け' });
    const split = h('select', { class: 'input', 'aria-label': '話の分け方' },
      [['auto', '見出しで分ける（第一話・# 題・プロローグ など）'], ['blank', '空行が3つ以上続く所で分ける'], ['none', '分けない（1つの話にする）']]
        .map(([v, l]) => h('option', { value: v }, l)));
    const dest = canAppend ? h('select', { class: 'input', 'aria-label': '取り込み先' },
      h('option', { value: 'append' }, `今の作品「${NS.App.project.title}」の最後に足す`),
      h('option', { value: 'new' }, '新しい作品にする')) : null;
    const listEl = h('ol', { class: 'import-list' });
    const summary = h('div', { class: 'small import-summary' });

    const readFile = (file) => {
      if (!file) return;
      if (file.size > MAX_BYTES) { toast('ファイルが大きすぎます（20MBまで）', 'error'); return; }
      const fr = new FileReader();
      fr.onload = () => {
        const d = IT.decodeBytes(fr.result);
        raw = d.text;
        fileName = file.name.replace(/\.[^.]+$/, '');
        paste.value = '';
        fileInfo.textContent = `${file.name}（${d.encoding}・${UI.fmtNum(Array.from(raw).length)}文字）`;
        update();
      };
      fr.onerror = () => toast('ファイルを読めませんでした', 'error');
      fr.readAsArrayBuffer(file);
    };
    fileIn.addEventListener('change', () => readFile(fileIn.files && fileIn.files[0]));
    paste.addEventListener('input', () => { raw = paste.value; fileName = ''; fileInfo.textContent = '貼り付けた原稿'; update(); });
    split.addEventListener('change', () => update());

    function update() {
      clear(listEl);
      clear(summary);
      if (!raw.trim()) { result = null; summary.appendChild(h('span', { class: 'muted' }, '原稿を選ぶと、ここに話の分かれ方が出ます。')); return; }
      result = IT.parse(raw, split.value);
      const chs = result.chapters;
      let total = 0;
      chs.forEach((c) => {
        const n = NS.Text.stats(c.body).charsNoSpace;
        total += n;
        listEl.appendChild(h('li', null, h('span', { class: 'import-title' }, c.title), h('span', { class: 'muted' }, UI.fmtNum(n) + '字')));
      });
      [h('strong', null, `${chs.length}話・${UI.fmtNum(total)}字`),
        result.title ? h('span', null, `作品名：${result.title}`) : null,
        result.ruby ? h('span', { class: 'muted' }, `pixiv のルビ ${result.ruby}か所を変換`) : null,
        result.emphasis ? h('span', { class: 'muted' }, `傍点 ${result.emphasis}か所を変換`) : null].forEach((el) => { if (el) summary.appendChild(el); });
    }
    update();

    const drop = h('div', { class: 'import-drop' },
      fileIn,
      h('div', { class: 'row wrap' }, btn('ファイルを選ぶ', { icon: 'upload', onClick: () => fileIn.click() }), fileInfo),
      paste);
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); readFile(e.dataTransfer.files && e.dataTransfer.files[0]); });

    UI.modal({
      title: 'テキストを取り込む',
      wide: true,
      body: h('div', { class: 'stack import-dialog' },
        h('p', { class: 'small muted' }, 'ほかのアプリや投稿サイトで書いた原稿を取り込みます。「第一話」「# 題」「プロローグ」のような見出しの行で話に分け、pixiv のルビ（[[rb:漢字 > かんじ]]）や青空文庫の傍点も綴りの書き方に直します。'),
        drop,
        h('div', { class: 'grid-2' }, UI.field('話の分け方', split), dest ? UI.field('取り込み先', dest) : h('span')),
        summary,
        listEl),
      actions: [
        { label: 'キャンセル', ghost: true },
        { label: '取り込む', primary: true, onClick: async () => {
          if (!result || !result.chapters.some((c) => c.body.trim())) { toast('取り込む原稿がありません', 'error'); return false; }
          const chs = result.chapters.map((c) => Store.newChapter(c.title, c.body));
          if (dest && dest.value === 'append') {
            const p = NS.App.project;
            // 何も書いていない最初の話は、取り込んだ話で置き換える
            if (p.chapters.length === 1 && !p.chapters[0].body.trim()) p.chapters = [];
            p.chapters.push(...chs);
            NS.App.touch();
            await NS.App.saveNow();
            NS.App.navigate('write', { id: chs[0].id });
            toast(`${chs.length}話を取り込みました`);
            return undefined;
          }
          const p2 = Store.newProject(result.title || fileName || '取り込んだ作品');
          p2.chapters = chs;
          await Store.saveProject(p2);
          await NS.App.openProject(p2.id, 'write');
          toast(`「${p2.title}」として${chs.length}話を取り込みました`);
          return undefined;
        } },
      ],
    });
  }

  NS.ImportDialog = { open };
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
<script>
// js/views/manuscript.js
/*
 * 綴り — 原稿用紙・応募書式での印刷（画面）
 * 書式を選ぶと、実際の割り付けを見ながら印刷（PDF 保存）できる。
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const { h, btn, clear, toast } = UI;
  const G = NS.Genko;

  const FORMATS = {
    genko: { label: '原稿用紙（20字×20行・マス目つき）', chars: 20, lines: 20, grid: true, hashira: true },
    a4_40x30: { label: 'A4横・40字×30行（応募でよくある書式）', chars: 40, lines: 30, grid: false },
    a4_42x34: { label: 'A4横・42字×34行', chars: 42, lines: 34, grid: false },
    custom: { label: '字数と行数を指定する', chars: 30, lines: 40, grid: false },
  };
  const PREF = Object.assign({ format: 'genko', chars: 30, lines: 40, grid: false, title: true, chapterTitles: true, pageBreak: false, ruby: 'drop', range: '*' }, UI.lsGet('tsuzuri.genkoPref', {}));
  const savePref = () => UI.lsSet('tsuzuri.genkoPref', PREF);

  // A4 横（mm）
  const PAGE = { w: 297, h: 210, mx: 14, top: 12, bottom: 18 };

  function geometry(f) {
    const usableW = PAGE.w - PAGE.mx * 2;
    const usableH = PAGE.h - PAGE.top - PAGE.bottom;
    const cols = f.lines + (f.hashira ? 1 : 0);
    let cell;
    let pitch;
    if (f.grid) {
      cell = Math.min(usableH / f.chars, usableW / (cols * 1.45));
      pitch = cell * 1.45;
    } else {
      cell = Math.min(usableH / f.chars, usableW / (cols * 1.5));
      pitch = Math.min(usableW / cols, cell * 2.1);
    }
    const bodyW = pitch * cols;
    const bodyH = cell * f.chars;
    return { cell, pitch, bodyW, bodyH, right: (PAGE.w - bodyW) / 2, top: PAGE.top + (usableH - bodyH) / 2 };
  }

  function currentFormat() {
    const base = FORMATS[PREF.format] || FORMATS.genko;
    if (PREF.format !== 'custom') return base;
    return Object.assign({}, base, { chars: clampInt(PREF.chars, 10, 60), lines: clampInt(PREF.lines, 5, 60), grid: !!PREF.grid });
  }
  function clampInt(v, a, b) { return Math.max(a, Math.min(b, Math.round(+v || a))); }

  function mm(v) { return v.toFixed(2) + 'mm'; }

  /** 1枚を作る */
  function renderPage(lines, f, g, no, total) {
    const page = h('div', { class: 'genko-page' + (f.grid ? ' genko-grid' : '') });
    const body = h('div', { class: 'genko-body', style: { right: mm(g.right), top: mm(g.top), height: mm(g.bodyH), width: mm(g.bodyW) } });
    const lineStyle = { inlineSize: mm(g.bodyH), blockSize: mm(g.pitch), paddingLeft: mm((g.pitch - g.cell) / 2), paddingRight: mm((g.pitch - g.cell) / 2) };
    if (f.grid) lineStyle.backgroundSize = `100% 100%, 100% ${mm(g.cell)}, 100% 100%`;
    const cellStyle = `inline-size:${mm(g.cell)};block-size:${mm(g.cell)};font-size:${mm(g.cell * 0.86)};line-height:${mm(g.cell)}`;
    for (let i = 0; i < f.lines; i++) {
      if (f.hashira && i === f.lines / 2) body.appendChild(h('div', { class: 'genko-hashira', style: { blockSize: mm(g.pitch) } }));
      const ln = lines[i];
      const el = h('div', { class: 'genko-line', style: lineStyle });
      if (ln) {
        const cells = ln.hang ? ln.cells.concat([Object.assign({ hang: true }, ln.hang)]) : ln.cells;
        let last = cells.length;
        while (last > 0 && !cells[last - 1].t) last--;
        for (let k = 0; k < last; k++) {
          const c = cells[k];
          const s = document.createElement('span');
          s.className = 'gc' + (c.tcy ? ' tcy' : '') + (c.boten ? ' boten' : '') + (c.hang ? ' hang' : '');
          s.setAttribute('style', cellStyle);
          s.textContent = c.t || '　';
          el.appendChild(s);
        }
      }
      body.appendChild(el);
    }
    page.append(body, h('div', { class: 'genko-no' }, total > 1 ? `${no} / ${total}` : ''));
    return page;
  }

  function chaptersFor(p) {
    return PREF.range === '*' ? p.chapters : p.chapters.filter((c) => c.id === PREF.range);
  }

  function compute(p) {
    const f = currentFormat();
    const r = G.layout(chaptersFor(p), {
      chars: f.chars, lines: f.lines, title: PREF.title ? p.title : '', author: PREF.title ? (p.author || '') : '',
      chapterTitles: PREF.chapterTitles, pageBreak: PREF.pageBreak, ruby: PREF.ruby,
    });
    return { f, r, g: geometry(f) };
  }

  function open() {
    const p = NS.App.project;
    if (!p) return;
    if (NS.Views.write && NS.Views.write.chapter && NS.Views.write.chapter()) {
      const cur = NS.Views.write.chapter();
      const text = NS.Views.write.getText();
      if (cur && text !== cur.body) { cur.body = text; NS.App.touch(); }
    }
    if (PREF.range !== '*' && !p.chapters.some((c) => c.id === PREF.range)) PREF.range = '*';
    const fmt = h('select', { class: 'input', 'aria-label': '書式' }, Object.keys(FORMATS).map((k) => h('option', { value: k, selected: PREF.format === k }, FORMATS[k].label)));
    const chars = h('input', { class: 'input input-num', type: 'number', min: 10, max: 60, value: PREF.chars, 'aria-label': '1行の字数' });
    const lines = h('input', { class: 'input input-num', type: 'number', min: 5, max: 60, value: PREF.lines, 'aria-label': '1枚の行数' });
    const grid = h('input', { type: 'checkbox', checked: !!PREF.grid });
    const custom = h('div', { class: 'row wrap small' }, '1行', chars, '字 ×', lines, '行', h('label', { class: 'check' }, grid, 'マス目'));
    const range = h('select', { class: 'input', 'aria-label': '印刷する範囲' }, h('option', { value: '*' }, `全話（${p.chapters.length}話）`),
      p.chapters.map((c, i) => h('option', { value: c.id, selected: PREF.range === c.id }, `${i + 1}. ${c.title || '無題'}だけ`)));
    const ruby = h('select', { class: 'input', 'aria-label': 'ルビ' }, h('option', { value: 'drop', selected: PREF.ruby === 'drop' }, 'ルビは外す（漢字だけ）'), h('option', { value: 'paren', selected: PREF.ruby === 'paren' }, 'ルビは（）で書く'));
    const chk = (key, label) => h('label', { class: 'check small' }, h('input', { type: 'checkbox', checked: !!PREF[key], onchange: (e) => { PREF[key] = e.target.checked; savePref(); update(); } }), label);
    const info = h('div', { class: 'small genko-info' });
    const prevBox = h('div', { class: 'genko-preview' });

    function update() {
      PREF.format = fmt.value;
      PREF.chars = clampInt(chars.value, 10, 60);
      PREF.lines = clampInt(lines.value, 5, 60);
      PREF.grid = grid.checked;
      PREF.range = range.value;
      PREF.ruby = ruby.value;
      savePref();
      custom.hidden = PREF.format !== 'custom';
      const { f, r, g } = compute(p);
      clear(info);
      const n400 = chaptersFor(p).reduce((a, c) => a + NS.Text.stats(c.body).charsNoSpace, 0);
      info.append(h('strong', null, `この書式で ${r.pages.length}枚`), h('span', { class: 'muted' }, `（本文 ${UI.fmtNum(n400)}字・400字詰め換算 ${Math.ceil(n400 / 400)}枚の目安）`));
      clear(prevBox);
      const strip = h('div', { class: 'genko-strip' });
      r.pages.slice(0, 2).forEach((pg, i) => strip.appendChild(h('div', { class: 'genko-thumb' }, renderPage(pg, f, g, i + 1, r.pages.length))));
      prevBox.appendChild(strip);
    }
    [fmt, chars, lines, grid, range, ruby].forEach((el) => el.addEventListener('change', update));

    UI.modal({
      title: '原稿用紙・応募書式で印刷',
      wide: true,
      body: h('div', { class: 'stack' },
        h('p', { class: 'small muted' }, '新人賞などに応募するときの書式で、縦書きに割り付けて印刷します。印刷の画面で「PDFに保存」を選ぶと PDF になります（用紙は A4 横）。'),
        h('div', { class: 'grid-2' }, UI.field('書式', fmt), UI.field('範囲', range)),
        custom,
        h('div', { class: 'grid-2' }, UI.field('ルビ', ruby), h('div', { class: 'stack-sm' }, chk('title', '題と名前を最初に入れる'), chk('chapterTitles', '話の題を入れる'), chk('pageBreak', '話ごとに新しい紙から'))),
        info,
        prevBox,
        h('p', { class: 'small muted' }, '句読点や閉じ括弧が行の頭に来るときは前の行の下にぶら下げ、開き括弧は行の終わりに置かない、半角の数字は2桁で1マス、といった原稿用紙の書き方で割り付けます。応募先の規定（字数・行数・ページ番号など）も確かめてください。')),
      actions: [
        { label: 'キャンセル', ghost: true },
        { label: '印刷・PDF', primary: true, onClick: () => { setTimeout(() => doPrint(p), 80); } },
      ],
    });
    update();
  }

  function doPrint(p) {
    const { f, r, g } = compute(p);
    const root = h('div', { class: 'genko-print' });
    r.pages.forEach((pg, i) => root.appendChild(renderPage(pg, f, g, i + 1, r.pages.length)));
    const style = h('style', null, '@media print { @page { size: A4 landscape; margin: 0; } }');
    document.head.appendChild(style);
    document.body.appendChild(root);
    document.body.classList.add('printing', 'printing-genko');
    const done = () => {
      document.body.classList.remove('printing', 'printing-genko');
      root.remove();
      style.remove();
      window.removeEventListener('afterprint', done);
    };
    window.addEventListener('afterprint', done);
    setTimeout(() => { window.print(); setTimeout(() => { if (document.body.classList.contains('printing-genko')) done(); }, 1500); }, 60);
    toast(`${r.pages.length}枚を印刷します`);
  }

  NS.Manuscript = { open, FORMATS, geometry };
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
<script>
// js/ai.js
/*
 * 綴り — AI 機能（Claude API）
 * AI添削・AI設定矛盾チェック・AIに相談。
 * Anthropic 公式 SDK をブラウザで読み込み、利用者自身の API キーで直接呼び出す。
 * キーはこの端末の localStorage にだけ保存し、作品のバックアップには含めない。
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const { h, icon, btn, clear, toast } = UI;

  // AI ライブラリ（Anthropic 公式 SDK）。Web で公開しているときは、アプリ自身が配る同じ版を使う（外部のサイトからスクリプトを読み込まない）。
  // 1ファイル版（file:// で開いたとき）だけは、ブラウザの制限でファイルから読み込めないため、同じ版を CDN から読み込む。
  const SDK_CDN = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.7.0/+esm';
  const SDK_URL = /^https?:$/.test(location.protocol) ? new URL('js/vendor/anthropic-sdk.js', location.href).href : SDK_CDN;
  const KEY_STORAGE = 'tsuzuri.apiKey';
  const MODELS = [
    ['claude-opus-5-5', 'Claude Opus 5.5（高品質・おすすめ）'],
    ['claude-sonnet-5-5', 'Claude Sonnet 5.5（速くて安価）'],
    ['claude-haiku-5-5', 'Claude Haiku 5.5（最安・簡易チェック向け）'],
  ];
  // サーバー側のフォールバックに対応しているモデル
  const FALLBACK_MODELS = new Set(['claude-opus-5-5', 'claude-sonnet-5-5']);

  let sdkPromise = null;
  function loadSDK() {
    if (!sdkPromise) {
      sdkPromise = import(SDK_URL).catch((e) => {
        sdkPromise = null;
        throw new Error('AIライブラリを読み込めませんでした（インターネット接続を確認してください）');
      });
    }
    return sdkPromise;
  }

  // キーの保存先：この端末（localStorage）か、このタブを閉じるまで（sessionStorage）
  function keyStore() {
    try { return localStorage.getItem(KEY_STORAGE + '.where') === 'session' ? sessionStorage : localStorage; } catch (e) { return null; }
  }
  function keyWhere() {
    try { return localStorage.getItem(KEY_STORAGE + '.where') === 'session' ? 'session' : 'local'; } catch (e) { return 'local'; }
  }
  function setKeyWhere(where) {
    const k = getKey();
    try {
      localStorage.removeItem(KEY_STORAGE);
      sessionStorage.removeItem(KEY_STORAGE);
      if (where === 'session') localStorage.setItem(KEY_STORAGE + '.where', 'session');
      else localStorage.removeItem(KEY_STORAGE + '.where');
    } catch (e) { /* 何もしない */ }
    if (k) setKey(k);
  }
  function getKey() {
    try { const st = keyStore(); return (st && st.getItem(KEY_STORAGE)) || ''; } catch (e) { return ''; }
  }
  function setKey(k) {
    try {
      const st = keyStore();
      if (!st) return false;
      if (k) st.setItem(KEY_STORAGE, k);
      else { localStorage.removeItem(KEY_STORAGE); sessionStorage.removeItem(KEY_STORAGE); }
      return true;
    } catch (e) { return false; }
  }

  function settings() { return NS.App ? NS.App.settings : {}; }

  async function makeClient() {
    const key = getKey();
    if (!key) throw new Error('APIキーが設定されていません');
    const mod = await loadSDK();
    const Anthropic = mod.default || mod.Anthropic;
    return { Anthropic, client: new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true }) };
  }

  function friendlyError(e, Anthropic) {
    if (!e) return '不明なエラー';
    if (Anthropic) {
      if (e instanceof Anthropic.APIUserAbortError) return 'キャンセルしました';
      if (e instanceof Anthropic.AuthenticationError) return 'APIキーが正しくありません。設定を確認してください';
      if (e instanceof Anthropic.PermissionDeniedError) return 'このAPIキーではこのモデルを使えません';
      if (e instanceof Anthropic.NotFoundError) return 'モデルが見つかりません。設定でモデルを選び直してください';
      if (e instanceof Anthropic.RateLimitError) return '利用上限に達したか混み合っています。少し待ってからやり直してください';
      if (e instanceof Anthropic.BadRequestError) return 'リクエストが受け付けられませんでした：' + (e.message || '');
      if (e instanceof Anthropic.InternalServerError) return 'AIサーバーでエラーが起きました。少し待ってからやり直してください';
      if (e instanceof Anthropic.APIConnectionError) return 'AIサーバーに接続できませんでした。インターネット接続を確認してください';
    }
    return e.message || String(e);
  }

  function baseParams(system, user, maxTokens) {
    const st = settings();
    const model = st.aiModel || 'claude-opus-5-5';
    const params = {
      model,
      max_tokens: maxTokens || 32000,
      system,
      messages: [{ role: 'user', content: user }],
      output_config: { effort: st.aiEffort || 'medium' },
    };
    if (FALLBACK_MODELS.has(model)) {
      params.betas = ['server-side-fallback-2026-07-01'];
      params.fallbacks = 'default';
    }
    return params;
  }

  /** ストリーミングで呼び出して最終メッセージを得る */
  async function run(params, opts) {
    opts = opts || {};
    let Anthropic = null;
    try {
      const c = await makeClient();
      Anthropic = c.Anthropic;
      const stream = c.client.beta.messages.stream(params, { signal: opts.signal });
      if (opts.onText) stream.on('text', (delta, snapshot) => opts.onText(snapshot));
      const msg = await stream.finalMessage();
      if (msg.stop_reason === 'refusal') throw new Error('AIがこの依頼に応じませんでした。内容や範囲を変えて試してください');
      if (msg.stop_reason === 'max_tokens') throw new Error('出力が長すぎて途中で切れました。選択範囲を絞ってやり直してください');
      return msg.content.filter((b) => b.type === 'text').map((b) => b.text).join('');
    } catch (e) {
      throw new Error(friendlyError(e, Anthropic));
    }
  }

  async function runJSON(system, user, schema, opts) {
    const params = baseParams(system, user);
    params.output_config.format = { type: 'json_schema', schema };
    const text = await run(params, opts);
    try {
      return JSON.parse(text);
    } catch (e) {
      throw new Error('AIの応答を読み取れませんでした');
    }
  }

  // ───── プロンプト ─────
  const PROOF_SYSTEM = [
    'あなたは日本語の小説を専門とする経験豊富な編集者・校正者です。作者の文体と意図を尊重しながら、原稿の問題点を指摘してください。',
    '指摘の対象：誤字脱字・誤変換、文法の誤り、主語と述語のねじれ、意味が通りにくい箇所、言葉の誤用、冗長な表現、読みにくい長文、視点の揺れ（一人称と三人称の混在など）、時制の不統一、同じ語の過剰な繰り返し。',
    'ルール：',
    '- quote には原稿からそのまま抜き出した文字列（10〜40文字程度、原稿内で場所が一つに決まる長さ）を入れる。改変・要約しない。',
    '- suggestion には quote をそのまま置き換えられる修正後の文字列を入れる。置き換え案を示せない指摘（構成上の問題など）は空文字にする。',
    '- reason は日本語で簡潔に（60字程度まで）。',
    '- 台詞の口語表現（い抜き言葉など）や、登場人物の個性としての言葉遣いは、明らかな誤りでない限り指摘しない。',
    '- 好みの問題にすぎない書き換えは控え、本当に直すべき箇所を優先する。多くても40件まで。',
    '- ルビ記法（|漢字《かんじ》、漢字《かんじ》）や傍点記法（《《強調》》）は作者が意図した表記なので、記法そのものを誤りとして指摘しない。',
    '- 「作者が登録した読み方」にある読み・ルビは、普段と違う読み方でも誤りとして指摘しない。',
    '- summary には原稿全体の講評（良い点と改善点）を2〜4文で書く。',
  ].join('\n');

  const CONS_SYSTEM = [
    'あなたは日本語の小説の編集者で、設定の整合性チェックを担当しています。設定資料と原稿を照らし合わせ、原稿の中で設定と食い違っている箇所や、原稿の前後で矛盾している箇所を見つけてください。',
    '確認する観点：人物の外見・年齢・一人称・口調・呼び方・性格・能力、人物同士の関係、地名や用語の表記と意味、世界観のルール（存在しない技術・単位・概念など）、時系列（退場した人物の登場など）、原稿内の前後矛盾。',
    'ルール：',
    '- quote には原稿からそのまま抜き出した該当箇所（10〜40文字程度）を入れる。改変しない。',
    '- problem に何が食い違っているかを書き、setting にはその根拠となる設定資料の記述を短く引用する（原稿内の前後矛盾なら、食い違う相手の箇所）。',
    '- suggestion には quote をそのまま置き換えられる、設定に合わせた修正案を入れる。示せない場合は空文字。',
    '- 設定資料に書かれていないことを推測で矛盾扱いしない。確実なものだけを、多くても30件まで。',
    '- 「作者が登録した読み方」にある読み・ルビは意図したものなので指摘しない。',
    '- 「作中で使わない言葉」は台詞では常に指摘する。地の文では「語り手」に従う：一人称なら指摘し、三人称・一元視点なら軽め（info）に、神視点（作品の外の語り手）なら地の文では指摘しない。［台詞だけ］と書かれた語は地の文では指摘しない。',
    '- summary には全体の所見を1〜3文で書く。食い違いがなければ items は空配列にする。',
  ].join('\n');

  const ASK_SYSTEM = [
    'あなたは日本語の小説の執筆を支える、率直で頼れる編集者です。作者からの相談に、設定資料と原稿を踏まえて答えてください。',
    'アイデア出しを求められたら具体的な案を複数出し、批評を求められたら良い点と改善点を具体的な箇所を挙げて伝えます。',
    '作者の作品なので、方向性を勝手に決めつけず、選択肢として提示してください。回答は日本語で、見出しや箇条書きを適度に使って読みやすく。',
  ].join('\n');

  const PROOF_SCHEMA = {
    type: 'object',
    additionalProperties: false,
    required: ['summary', 'items'],
    properties: {
      summary: { type: 'string' },
      items: {
        type: 'array',
        items: {
          type: 'object',
          additionalProperties: false,
          required: ['quote', 'suggestion', 'reason', 'category', 'severity'],
          properties: {
            quote: { type: 'string' },
            suggestion: { type: 'string' },
            reason: { type: 'string' },
            category: { type: 'string', enum: ['誤字脱字', '文法', '表現', '読みやすさ', '視点・時制', 'その他'] },
            severity: { type: 'string', enum: ['error', 'warning', 'info'] },
          },
        },
      },
    },
  };

  const CONS_SCHEMA = {
    type: 'object',
    additionalProperties: false,
    required: ['summary', 'items'],
    properties: {
      summary: { type: 'string' },
      items: {
        type: 'array',
        items: {
          type: 'object',
          additionalProperties: false,
          required: ['quote', 'problem', 'setting', 'suggestion', 'severity'],
          properties: {
            quote: { type: 'string' },
            problem: { type: 'string' },
            setting: { type: 'string' },
            suggestion: { type: 'string' },
            severity: { type: 'string', enum: ['error', 'warning', 'info'] },
          },
        },
      },
    },
  };

  function narratorLine(ctx) {
    const C = NS.Consistency;
    const p = ctx.project;
    const v = (ctx.chapter && ctx.chapter.narrator) || (p && p.rules && p.rules.narrator) || 'auto';
    if (!C || v === 'auto') return '';
    return `この話の語り手：${C.NARRATORS[v] || v}\n`;
  }

  function manuscriptBlock(ctx, text) {
    return `## 原稿（第${ctx.chapterNo}話「${ctx.chapter.title}」）\n${narratorLine(ctx)}<manuscript>\n${text}\n</manuscript>`;
  }

  function settingsBlock(project) {
    const md = NS.LoreFormat.toMarkdown(project);
    return `## 設定資料\n<settings>\n${md}\n</settings>`;
  }

  function readingsBlock(project) {
    const list = NS.Readings ? NS.Readings.collect(project) : [];
    if (!list.length) return '';
    return '## 作者が登録した読み方（ルビ）\n' + list.map((r) => `- ${r.base}《${r.reading}》`).join('\n') + '\nこれらは意図した読み方なので、誤りとして指摘しないこと。\n\n';
  }

  /** AI の引用を本文中の位置に結びつける */
  function locate(text, quote, offset, from) {
    if (!quote) return null;
    const tryFind = (q) => {
      let i = text.indexOf(q, from || 0);
      if (i < 0) i = text.indexOf(q);
      return i;
    };
    let i = tryFind(quote);
    let q = quote;
    if (i < 0) {
      q = quote.trim().replace(/^[「『（\s　]+|[」』）。、\s　]+$/g, '');
      if (q.length >= 4) i = tryFind(q);
    }
    if (i < 0) return null;
    return { start: i + (offset || 0), end: i + (offset || 0) + q.length, text: q };
  }

  // 話ごとの直近の結果
  const results = {};

  async function proofread(ctx, scope, signal, onText) {
    const full = ctx.getText();
    const sel = scope === 'selection' ? ctx.getSelection() : null;
    const text = sel ? sel.text : full;
    const offset = sel ? sel.start : 0;
    const user = (ctx.project.synopsis ? `## 作品のあらすじ\n${ctx.project.synopsis}\n\n` : '') + readingsBlock(ctx.project) + manuscriptBlock(ctx, text);
    const data = await runJSON(PROOF_SYSTEM, user, PROOF_SCHEMA, { signal, onText });
    let cursor = 0;
    const items = (data.items || []).map((it) => {
      const loc = locate(text, it.quote, offset, cursor);
      if (loc) cursor = loc.end - offset;
      return {
        ruleId: 'ai-proof', rule: 'AI添削：' + it.category, category: 'AI', severity: it.severity || 'warning',
        start: loc ? loc.start : -1, end: loc ? loc.end : -1, text: loc ? loc.text : it.quote,
        message: it.reason, suggestion: it.suggestion && loc && loc.text === it.quote ? it.suggestion : null,
        rawSuggestion: it.suggestion || '', fixable: false, source: 'ai', key: 'ai|' + it.quote, found: !!loc,
      };
    });
    return { kind: 'proof', summary: data.summary || '', items, at: Date.now() };
  }

  async function checkConsistency(ctx, scope, signal, onText) {
    const full = ctx.getText();
    const sel = scope === 'selection' ? ctx.getSelection() : null;
    const text = sel ? sel.text : full;
    const offset = sel ? sel.start : 0;
    const user = settingsBlock(ctx.project) + '\n\n' + readingsBlock(ctx.project) + manuscriptBlock(ctx, text);
    const data = await runJSON(CONS_SYSTEM, user, CONS_SCHEMA, { signal, onText });
    let cursor = 0;
    const items = (data.items || []).map((it) => {
      const loc = locate(text, it.quote, offset, cursor);
      if (loc) cursor = loc.end - offset;
      return {
        ruleId: 'ai-cons', rule: 'AI設定チェック', category: 'AI', severity: it.severity || 'warning',
        start: loc ? loc.start : -1, end: loc ? loc.end : -1, text: loc ? loc.text : it.quote,
        message: it.problem + (it.setting ? `（設定：${it.setting}）` : ''),
        suggestion: it.suggestion && loc && loc.text === it.quote ? it.suggestion : null,
        rawSuggestion: it.suggestion || '', fixable: false, source: 'ai', key: 'ai|' + it.quote, found: !!loc,
      };
    });
    return { kind: 'cons', summary: data.summary || '', items, at: Date.now() };
  }

  const WORD_SYSTEM = [
    'あなたは国語辞典と類語辞典を兼ねた、小説を書く人のための辞書です。調べたい語について、次の見出しで簡潔に答えてください。',
    '【読み】',
    '【意味】（複数あれば番号を付ける）',
    '【例文】小説の文章らしい例を2つ',
    '【言い換え・類語】',
    '【使うときの注意】誤用しやすい点、時代や場面に合うかなど（なければ省く）',
    '固有名詞や専門用語なら、概要を3〜5文で説明してください。確かでないことは「〜とされる」「不確か」と明記してください。',
  ].join('\n');

  async function askWord(project, word, signal, onText) {
    const params = baseParams(WORD_SYSTEM, '調べたい語：' + word, 4000);
    params.output_config.effort = 'low';
    return run(params, { signal, onText });
  }

  async function ask(ctx, question, scope, signal, onText) {
    const sel = scope === 'selection' ? ctx.getSelection() : null;
    const text = sel ? sel.text : ctx.getText();
    const user = settingsBlock(ctx.project) + '\n\n' + manuscriptBlock(ctx, text) + '\n\n## 相談\n' + question;
    const params = baseParams(ASK_SYSTEM, user, 16000);
    return run(params, { signal, onText });
  }

  // ───── 執筆画面の AI タブ ─────
  const Panel = {};
  let running = null;

  Panel.render = function (ctx) {
    const wrap = h('div', { class: 'stack-sm ai-panel' });
    if (!getKey()) {
      wrap.appendChild(h('div', { class: 'empty' },
        icon('sparkles', 32),
        h('p', null, 'Claude（AI）による添削・設定矛盾チェック・相談が使えます。'),
        h('p', { class: 'small muted' }, '利用には Anthropic の APIキー が必要です（利用料は従量課金で、キーの持ち主に請求されます）。ルールベースの「添削」「設定チェック」タブはAIなしでも使えます。'),
        btn('APIキーを設定する', { icon: 'sliders', primary: true, onClick: () => openKeyDialog(() => ctx.rerender()) })));
      return wrap;
    }
    const chId = ctx.chapter.id;
    const sel = ctx.getSelection();
    let scope = sel ? 'selection' : 'all';
    const scopeRow = h('div', { class: 'seg', role: 'radiogroup', 'aria-label': '対象' },
      h('label', null, h('input', { type: 'radio', name: 'ai-scope', value: 'all', checked: scope === 'all', onchange: () => { scope = 'all'; } }), 'この話全体'),
      h('label', { class: sel ? '' : 'disabled' }, h('input', { type: 'radio', name: 'ai-scope', value: 'selection', disabled: !sel, checked: scope === 'selection', onchange: () => { scope = 'selection'; } }), sel ? `選択範囲（${sel.text.length}字）` : '選択範囲'));
    const status = h('div', { class: 'ai-status', hidden: !running });
    const resultBox = h('div', { class: 'ai-results' });

    const start = async (kind, question) => {
      if (running) return;
      const text = ctx.getText();
      if (!text.trim()) { toast('本文がありません'); return; }
      const controller = new AbortController();
      running = { controller, kind };
      setRunning(true);
      const onText = (snap) => { status.querySelector('.ai-progress').textContent = `受信中… ${snap.length}字`; };
      try {
        if (kind === 'ask') {
          answer.textContent = '';
          answerBox.hidden = false;
          const out = await ask(ctx, question, scope, controller.signal, (snap) => { answer.textContent = snap; });
          answer.textContent = out;
          results[chId + ':ask'] = { q: question, a: out };
        } else {
          const r = kind === 'proof'
            ? await proofread(ctx, scope, controller.signal, onText)
            : await checkConsistency(ctx, scope, controller.signal, onText);
          results[chId] = r;
          ctx.clearIssues();
          ctx.addIssues(r.items.filter((i) => i.found));
          renderResults();
          toast(r.items.length ? `${r.items.length}件の指摘がありました` : '指摘はありませんでした');
        }
      } catch (e) {
        toast(e.message, 'error');
        if (kind === 'ask') answer.textContent = '（エラー）' + e.message;
      } finally {
        running = null;
        setRunning(false);
      }
    };

    const setRunning = (on) => {
      status.hidden = !on;
      clear(status);
      if (on) {
        status.append(h('span', { class: 'spinner', 'aria-hidden': 'true' }), h('span', { class: 'ai-progress' }, 'AIが原稿を読んでいます…'),
          btn('中止', { small: true, ghost: true, onClick: () => running && running.controller.abort() }));
      }
      wrap.querySelectorAll('.ai-run').forEach((b) => { b.disabled = on; });
    };

    const renderResults = () => {
      clear(resultBox);
      const r = results[chId];
      if (!r) return;
      const text = ctx.getText();
      resultBox.appendChild(h('div', { class: 'ai-summary' },
        h('div', { class: 'ai-summary-head' }, icon('sparkles', 16), h('strong', null, r.kind === 'proof' ? 'AI添削の講評' : 'AI設定チェックの所見'),
          h('span', { class: 'muted small' }, UI.relTime(r.at))),
        h('p', null, r.summary || '—')));
      if (!r.items.length) { resultBox.appendChild(h('p', { class: 'muted small' }, '指摘はありませんでした。')); return; }
      r.items.forEach((it) => {
        const stillThere = it.found && text.slice(it.start, it.end) === it.text;
        resultBox.appendChild(h('div', { class: 'issue-card ai-card' + (stillThere ? '' : ' stale') },
          h('div', { class: 'issue-head' }, h('span', { class: 'sev-dot sev-' + it.severity }), h('span', { class: 'issue-rule' }, it.rule)),
          h('div', { class: 'issue-excerpt' }, h('mark', null, it.text)),
          h('div', { class: 'issue-msg' }, it.message),
          it.rawSuggestion ? h('div', { class: 'ai-suggest' }, h('span', { class: 'muted small' }, '修正案'), h('div', null, it.rawSuggestion)) : null,
          h('div', { class: 'issue-actions' },
            stillThere ? btn('該当箇所へ', { small: true, ghost: true, onClick: () => ctx.focusRange(it.start, it.end) }) : h('span', { class: 'muted small' }, it.found ? '本文が変更されました' : '本文中に見つかりません'),
            stillThere && it.suggestion != null ? btn('修正案を適用', { small: true, onClick: () => {
              ctx.apply(it);
              it.found = false;
              renderResults();
            } }) : null)));
      });
    };

    const question = h('textarea', { class: 'input', rows: 3, placeholder: '例：この話の展開に無理はない？／ラストを盛り上げるアイデアを3つ出して／セレナの台詞をもっと彼女らしくするには？' });
    const answer = h('div', { class: 'ai-answer' });
    const answerBox = h('div', { class: 'ai-answer-box', hidden: true }, answer);
    const prev = results[chId + ':ask'];
    if (prev) { question.value = prev.q; answer.textContent = prev.a; answerBox.hidden = false; }

    const st = settings();
    wrap.append(
      h('p', { class: 'small muted' }, `モデル：${(MODELS.find((m) => m[0] === st.aiModel) || MODELS[0])[1].replace(/（.*）/, '')}。本文と設定資料がAnthropicのAPIに送信されます。`),
      scopeRow,
      h('div', { class: 'grid-2' },
        btn('AIで添削', { icon: 'sparkles', primary: true, class: 'ai-run', onClick: () => start('proof') }),
        btn('AIで設定チェック', { icon: 'users', class: 'ai-run', onClick: () => start('cons') })),
      status,
      resultBox,
      h('h3', { class: 'panel-h' }, 'AIに相談'),
      question,
      h('div', { class: 'row' }, btn('相談する', { icon: 'feather', class: 'ai-run', onClick: () => {
        const q = question.value.trim();
        if (!q) { question.focus(); return; }
        start('ask', q);
      } }), btn('', { icon: 'sliders', ghost: true, small: true, title: 'AIの設定', onClick: () => openKeyDialog(() => ctx.rerender()) })),
      answerBox);
    renderResults();
    if (running) setRunning(true);
    return wrap;
  };

  function openKeyDialog(after) {
    const pane = Panel.settingsPane(() => { NS.App.saveSettings(); });
    UI.modal({ title: 'AIの設定', body: pane, wide: true, onClose: after });
  }

  /** 設定画面の「AI」タブ */
  Panel.settingsPane = function (changed) {
    const st = settings();
    const key = h('input', { class: 'input', type: 'password', value: getKey(), placeholder: 'sk-ant-…', autocomplete: 'off', 'aria-label': 'APIキー' });
    const show = h('input', { type: 'checkbox', onchange: (e) => { key.type = e.target.checked ? 'text' : 'password'; } });
    const model = h('select', { class: 'input', onchange: (e) => { st.aiModel = e.target.value; changed(); } },
      MODELS.map(([v, l]) => h('option', { value: v, selected: st.aiModel === v }, l)));
    const effort = h('select', { class: 'input', onchange: (e) => { st.aiEffort = e.target.value; changed(); } },
      [['low', '速さ優先'], ['medium', '標準'], ['high', '丁寧']].map(([v, l]) => h('option', { value: v, selected: (st.aiEffort || 'medium') === v }, l)));
    const testOut = h('span', { class: 'small muted' });
    return h('div', { class: 'stack' },
      h('p', { class: 'small muted' }, 'Anthropic の Claude を使ってAI添削・設定チェック・相談を行います。APIキーは Anthropic Console（console.anthropic.com）で発行できます。キーはこの端末のブラウザにだけ保存され、作品のバックアップには含まれません。共用のパソコンでは保存先を「このタブを閉じるまで」にするか、使い終わったら削除してください。'),
      UI.field('APIキー', h('div', { class: 'row' }, key, btn('保存', { primary: true, small: true, onClick: () => {
        const v = key.value.trim();
        if (v && !/^sk-/.test(v)) { toast('APIキーの形式が正しくないようです', 'error'); return; }
        setKey(v);
        toast(v ? 'APIキーを保存しました' : 'APIキーを削除しました');
      } }), btn('削除', { small: true, ghost: true, onClick: () => { setKey(''); key.value = ''; toast('APIキーを削除しました'); } }))),
      h('label', { class: 'check small' }, show, 'キーを表示'),
      UI.field('キーの保存先', h('select', { class: 'input', onchange: (e) => { setKeyWhere(e.target.value); toast(e.target.value === 'session' ? 'キーはこのタブを閉じると消えます' : 'キーをこの端末に保存します'); } },
        [['local', 'この端末に保存する（次に開いたときも使える）'], ['session', 'このタブを閉じるまで（共用の端末向け）']].map(([v, l]) => h('option', { value: v, selected: keyWhere() === v }, l))),
        'どちらの場合も、キーは作品のバックアップには含まれず、Anthropic 以外には送られません'),
      h('div', { class: 'grid-2' }, UI.field('モデル', model), UI.field('考える深さ', effort)),
      h('div', { class: 'row' }, btn('接続テスト', { small: true, icon: 'check', onClick: async () => {
        if (key.value.trim() && key.value.trim() !== getKey()) setKey(key.value.trim());
        testOut.textContent = '確認中…';
        try {
          const params = baseParams('「OK」とだけ返してください。', 'テスト', 64);
          params.output_config.effort = 'low';
          const out = await run(params);
          testOut.textContent = '接続できました（応答：' + out.trim().slice(0, 20) + '）';
        } catch (e) {
          testOut.textContent = e.message;
        }
      } }), testOut));
  };

  NS.AI = { getKey, setKey, proofread, checkConsistency, ask, askWord, locate, MODELS };
  NS.AIPanel = Panel;
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
