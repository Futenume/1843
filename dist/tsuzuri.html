<title>綴り 小説執筆スタジオ</title>
<meta name="description" content="小説だけに特化した執筆アプリ。添削、設定資料と設定矛盾チェック、アイデア帳、プロットボード、空想地図をひとつに。">
<meta name="theme-color" content="#f4f1ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233a5a9b'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='white' font-family='serif'%3E綴%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600;700&family=Shippori+Mincho:wght@500;700&family=Zen+Antique&family=Yuji+Syuku&family=Klee+One:wght@600&family=Dela+Gothic+One&display=swap">
<style>
/* 綴り — 小説執筆スタジオ */

:root {
  --bg: #f4f1ea;
  --surface: #fffdf8;
  --surface-2: #f6f1e7;
  --surface-3: #ede6d8;
  --paper: #fffdf8;
  --ink: #2a2521;
  --ink-2: #5a5248;
  --muted: #887f74;
  --line: #e4ddd0;
  --line-strong: #cfc5b4;
  --accent: #34528f;
  --accent-ink: #ffffff;
  --accent-soft: #e2e8f5;
  --danger: #b03d2a;
  --sev-error: #d0442c;
  --sev-warning: #d4900f;
  --sev-info: #4a87c0;
  --mark-error: rgba(208, 68, 44, 0.13);
  --mark-warning: rgba(212, 144, 15, 0.15);
  --mark-info: rgba(74, 135, 192, 0.10);
  --mark-active: rgba(52, 82, 143, 0.24);
  --mark-find: rgba(255, 205, 40, 0.5);
  --mark-find-cur: rgba(255, 140, 0, 0.6);
  --map-bg: #e9e4da;
  --shadow: 0 1px 2px rgba(40, 30, 20, 0.06), 0 6px 20px rgba(40, 30, 20, 0.07);
  --shadow-lg: 0 10px 40px rgba(30, 20, 10, 0.18);
  --radius: 10px;
  --font-sans: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  --editor-font: var(--font-serif);
  --editor-size: 17px;
  --editor-lh: 1.9;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="sepia"]) {
    --bg: #161514;
    --surface: #1f1d1b;
    --surface-2: #272421;
    --surface-3: #312d29;
    --paper: #1c1a18;
    --ink: #ebe5db;
    --ink-2: #c3bbaf;
    --muted: #958c80;
    --line: #33302b;
    --line-strong: #4a443c;
    --accent: #93abe6;
    --accent-ink: #10141d;
    --accent-soft: #263150;
    --danger: #f08a75;
    --sev-error: #f0745d;
    --sev-warning: #e8b04a;
    --sev-info: #7fb2e5;
    --mark-error: rgba(240, 116, 93, 0.2);
    --mark-warning: rgba(232, 176, 74, 0.2);
    --mark-info: rgba(127, 178, 229, 0.14);
    --mark-active: rgba(147, 171, 230, 0.3);
    --mark-find: rgba(255, 205, 40, 0.35);
    --mark-find-cur: rgba(255, 140, 0, 0.5);
    --map-bg: #121110;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161514;
  --surface: #1f1d1b;
  --surface-2: #272421;
  --surface-3: #312d29;
  --paper: #1c1a18;
  --ink: #ebe5db;
  --ink-2: #c3bbaf;
  --muted: #958c80;
  --line: #33302b;
  --line-strong: #4a443c;
  --accent: #93abe6;
  --accent-ink: #10141d;
  --accent-soft: #263150;
  --danger: #f08a75;
  --sev-error: #f0745d;
  --sev-warning: #e8b04a;
  --sev-info: #7fb2e5;
  --mark-error: rgba(240, 116, 93, 0.2);
  --mark-warning: rgba(232, 176, 74, 0.2);
  --mark-info: rgba(127, 178, 229, 0.14);
  --mark-active: rgba(147, 171, 230, 0.3);
  --mark-find: rgba(255, 205, 40, 0.35);
  --mark-find-cur: rgba(255, 140, 0, 0.5);
  --map-bg: #121110;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
:root[data-theme="sepia"] {
  --bg: #e9dfca;
  --surface: #f6eedc;
  --surface-2: #efe4cd;
  --surface-3: #e5d7bb;
  --paper: #f8f0de;
  --ink: #3a2e22;
  --ink-2: #625240;
  --muted: #8f7d66;
  --line: #ddcfb3;
  --line-strong: #c9b794;
  --accent: #8a4b2a;
  --accent-ink: #fffaf0;
  --accent-soft: #ecd9c2;
  --map-bg: #e2d6bd;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.35; }
p { margin: 0; }
a { color: var(--accent); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon { flex: none; }

/* ───── 枠 ───── */
#app {
  display: grid;
  grid-template-columns: 76px minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}
#sidebar {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 2px;
  padding: 10px 6px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  overflow-y: auto;
}
.brand { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0 12px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font-family: var(--font-serif); font-size: 22px; font-weight: 700;
}
.brand-name { font-family: var(--font-serif); font-size: 11px; color: var(--muted); letter-spacing: 0.2em; }
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px; border-radius: 10px;
  color: var(--ink-2); text-decoration: none; font-size: 11.5px; line-height: 1.2; text-align: center;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item.disabled { opacity: 0.4; }
.nav-spacer { flex: 1; }
#main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#topbar {
  height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.project-title { min-width: 0; flex: 1; display: flex; }
.project-title-btn {
  border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: pointer; max-width: 100%;
  font-family: var(--font-serif); font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.project-title-btn:hover { background: var(--surface-2); }
.view-title { color: var(--muted); font-size: 13px; white-space: nowrap; }
.top-actions { display: flex; align-items: center; gap: 6px; }
.save-state { font-size: 12px; color: var(--muted); white-space: nowrap; }
.save-state[data-state="dirty"], .save-state[data-state="saving"] { color: var(--sev-warning); }
.save-state[data-state="error"] { color: var(--danger); font-weight: 600; }
.view { flex: 1; min-height: 0; overflow: auto; }
.view-write, .view-map, .view-lore, .view-plot { overflow: hidden; }

/* ───── 部品 ───── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px;
  border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-size: 14px; line-height: 1.3; cursor: pointer; white-space: nowrap; transition: background 0.12s, border-color 0.12s;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn-primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-danger { color: var(--danger); }
.btn-sm { padding: 4px 9px; font-size: 13px; border-radius: 7px; }
.btn-icon { padding: 6px; }
.btn-icon.btn-sm { padding: 4px; }
.btn.active { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.btn-text { font-family: var(--font-serif); padding: 5px 8px; font-size: 14px; }
.input {
  width: 100%; min-width: 0; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--surface); color: var(--ink); font-size: 14px; line-height: 1.5;
}
textarea.input { resize: vertical; line-height: 1.65; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input-num { width: 120px; }
select.input { padding-right: 28px; }
.range { width: 100%; accent-color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field-label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.field-hint { font-size: 11.5px; color: var(--muted); }
.field-checked .field-label::after {
  content: "照合"; margin-left: 6px; font-size: 10px; padding: 0 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent);
}
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.check input { accent-color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: end; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; }
.span-2 { grid-column: span 2; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.empty { padding: 28px 20px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty.small { padding: 16px; font-size: 13px; color: var(--muted); }
.empty.big { padding: 60px 24px; max-width: 520px; margin: 0 auto; }
.empty .icon { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 2px 10px;
  font-size: 12.5px; cursor: pointer; color: var(--ink-2);
}
.chip.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.chip.static { cursor: default; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab {
  border: 0; background: none; padding: 9px 10px 8px; border-bottom: 2px solid transparent; cursor: pointer;
  color: var(--ink-2); white-space: nowrap; font-size: 13px; display: inline-flex; align-items: center; gap: 4px;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab-badge:not(:empty) {
  font-size: 10.5px; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); font-weight: 500; text-align: center;
}
.sev-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; vertical-align: middle; margin-right: 2px; }
.sev-dot.sev-error { background: var(--sev-error); }
.sev-dot.sev-warning { background: var(--sev-warning); }
.sev-dot.sev-info { background: var(--sev-info); }
.meter { display: inline-block; width: 60px; height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; vertical-align: middle; margin-left: 6px; }
.meter > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meter.big { display: block; width: 100%; height: 8px; margin: 4px 0 0; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line-strong); cursor: pointer; padding: 0;
  background-image: linear-gradient(135deg, transparent 45%, var(--line-strong) 45%, var(--line-strong) 55%, transparent 55%);
}
.swatch[style*="rgb"], .swatch[style*="#"] { background-image: none; }
.swatch.active { box-shadow: 0 0 0 2px var(--accent); }
.color-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.type-badge {
  font-size: 11px; padding: 1px 7px; border-radius: 5px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; flex: none;
}
.type-badge.t-character { background: rgba(61, 126, 166, 0.15); color: #2f6a8f; }
.type-badge.t-place { background: rgba(106, 153, 78, 0.16); color: #4c7a36; }
.type-badge.t-term { background: rgba(217, 164, 65, 0.18); color: #946812; }
.type-badge.t-org { background: rgba(140, 59, 94, 0.14); color: #8c3b5e; }
:root[data-theme="dark"] .type-badge { filter: brightness(1.6); }
.spinner {
  width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--accent);
  animation: spin 0.8s linear infinite; flex: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

/* モーダル・メニュー・トースト */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(20, 16, 12, 0.45); display: flex; align-items: center; justify-content: center;
  padding: 16px; z-index: 100;
}
.modal {
  background: var(--surface); border-radius: 14px; width: min(520px, 100%); max-height: calc(100dvh - 32px);
  display: flex; flex-direction: column; box-shadow: var(--shadow-lg);
}
.modal-wide { width: min(860px, 100%); }
.modal-header { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px 20px; border-bottom: 1px solid var(--line); }
.modal-header h2 { flex: 1; font-size: 16px; }
.modal-body { padding: 16px 20px; overflow: auto; }
.modal-footer { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
.popmenu {
  position: fixed; z-index: 200; min-width: 200px; max-width: calc(100vw - 16px); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow-lg); padding: 5px;
}
.popmenu-item {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 0; background: none; border-radius: 7px;
  cursor: pointer; text-align: left; font-size: 13.5px;
}
.popmenu-item:hover, .popmenu-item:focus { background: var(--surface-2); outline: none; }
.popmenu-item.danger { color: var(--danger); }
.popmenu-sep { height: 1px; background: var(--line); margin: 4px 6px; }
.icon-spacer { width: 16px; }
#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: var(--surface);
  padding: 9px 16px; border-radius: 10px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
  z-index: 300; max-width: calc(100vw - 32px); box-shadow: var(--shadow-lg);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.error { background: var(--danger); color: #fff; }

/* ───── ホーム ───── */
.home { max-width: 1040px; margin: 0 auto; padding: 32px 24px 60px; }
.home-hero { display: flex; flex-direction: column; gap: 14px; padding: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.home-hero h1 { font-family: var(--font-serif); font-size: 34px; letter-spacing: 0.08em; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.home-hero h1 small { font-size: 15px; color: var(--muted); letter-spacing: 0.2em; font-weight: 400; }
.home-hero p { max-width: 640px; }
.section-title { font-size: 15px; margin: 28px 0 12px; color: var(--ink-2); }
.project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.project-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; cursor: pointer;
  display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); transition: border-color 0.15s, transform 0.15s;
}
.project-card:hover { border-color: var(--accent); }
.project-card.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.project-card-head { display: flex; align-items: flex-start; gap: 6px; }
.project-card h3 { flex: 1; font-family: var(--font-serif); font-size: 16px; }
.project-card-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--muted); }

/* ───── 執筆 ───── */
.write-layout {
  --ch: 240px; --pn: 360px;
  display: grid; grid-template-columns: var(--ch) minmax(0, 1fr) var(--pn); height: 100%; position: relative;
}
.write-layout.hide-chapters { --ch: 0px; }
.write-layout.hide-panel { --pn: 0px; }
.write-layout.hide-chapters .chapters, .write-layout.hide-panel .side-panel { display: none; }
.drawer-scrim { display: none; }
.chapters { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-right: 1px solid var(--line); }
.pane-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px 6px 14px; border-bottom: 1px solid var(--line); min-height: 44px; }
.pane-head h2 { flex: 1; font-size: 14px; }
.side-panel .pane-head { padding: 0 6px 0 8px; }
.side-panel .pane-head .tabs { flex: 1; }
.pane-foot { padding: 8px 14px; border-top: 1px solid var(--line); }
.chapter-list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
.chapter-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 4px 7px 8px; border-radius: 8px; cursor: pointer; font-size: 13.5px;
}
.chapter-item:hover { background: var(--surface-2); }
.chapter-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.chapter-item.dragging { opacity: 0.4; }
.chapter-item.drop-target { box-shadow: inset 0 2px 0 var(--accent); }
.chapter-no { width: 20px; text-align: right; color: var(--muted); font-size: 11.5px; flex: none; }
.chapter-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chapter-count { font-size: 11px; color: var(--muted); font-weight: 400; }
.chapter-item .btn { opacity: 0; }
.chapter-item:hover .btn, .chapter-item.active .btn, .chapter-item:focus-within .btn { opacity: 1; }

.editor-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.editor-toolbar {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--surface); border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.chapter-title-input {
  flex: 1; min-width: 120px; border: 0; background: none; font-family: var(--font-serif); font-size: 16px; font-weight: 600; padding: 5px 6px; border-radius: 6px;
}
.chapter-title-input:hover { background: var(--surface-2); }
.chapter-title-input:focus { outline: none; background: var(--surface-2); }
.toolbar-group { display: flex; align-items: center; gap: 2px; padding-left: 6px; border-left: 1px solid var(--line); }
.findbar {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.findbar .input { width: 180px; padding: 5px 8px; }
.find-count { min-width: 40px; }
.editor-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 16px 80px; }
.editor-sheet {
  position: relative; max-width: calc(var(--editor-size) * 42 + 112px); margin: 0 auto; background: var(--paper);
  border-radius: 6px; box-shadow: var(--shadow); border: 1px solid var(--line);
}
.editor-backdrop, .editor-input {
  margin: 0; border: 0; padding: 44px 56px 60px; width: 100%;
  font-family: var(--editor-font); font-size: var(--editor-size); line-height: var(--editor-lh); letter-spacing: 0.03em;

.side-panel { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); }

}

/* ───── 地図 ───── */

.map-tools { display: flex; flex-direction: column; gap: 2px; padding: 6px; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); }

  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 8px; border: 0; background: none;
  cursor: pointer; font-size: 11px; color: var(--ink-2); white-space: nowrap;
}

.map-hint {
  position: absolute; left: 12px; bottom: 12px; max-width: min(560px, calc(100% - 24px)); padding: 6px 10px; border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 90%, transparent); color: var(--ink-2); font-size: 12px; pointer-events: none; box-shadow: var(--shadow);
}

  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); z-index: 5; max-width: calc(100% - 16px); flex-wrap: wrap;
}

  font-size: 12px; color: var(--ink-2); pointer-events: none;
}

.check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; }

.gen-preview { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: var(--map-bg); }
.popover {

}
.layers-pane { display: flex; flex-direction: column; gap: 2px; }
.layer-row { display: grid; grid-template-columns: 1fr 32px 32px; align-items: center; gap: 2px; padding: 2px 0 2px 4px; font-size: 13.5px; }

.rule-text { display: flex; flex-direction: column; }

.only-mobile { display: none !important; }

  .write-layout { --pn: 320px; --ch: 210px; }

}

  .toolbar-group { border-left: 0; padding-left: 0; }
  .editor-toolbar { gap: 2px; }

  .lore-side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 44vh; }

  .map-layout, .map-layout.sheet-open { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .map-tools { grid-row: 2; flex-direction: row; overflow-x: auto; border-right: 0; border-top: 1px solid var(--line); padding: 4px; }
  .map-tool { flex: 0 0 54px; }

  .map-inspector {

  .ideas { padding: 16px 16px 40px; }

  .modal-overlay { padding: 8px; align-items: flex-end; }

}

<script>
// js/textstats.js
/*
 * 綴り — 文章解析ユーティリティ
 * 文・段落・会話文の分割、ルビ記法の処理、文字数などの統計。
 * ブラウザでも Node でも動く純粋関数のみ。
 */
(function (NS) {
  'use strict';

  // ルビ記法などを「位置を保ったまま」無視するための埋め字（私用領域の文字）
  const FILLER = '';

  const QUOTE_OPEN = '「『（(【〈〔［“';
  const PAIRS = {
    '「': '」', '『': '』', '（': '）', '(': ')', '【': '】',
    '〈': '〉', '〔': '〕', '［': '］', '“': '”', '《': '》',
  };
  const CLOSERS = {};
  Object.keys(PAIRS).forEach((k) => { CLOSERS[PAIRS[k]] = k; });

  const KANJI = '一-鿿㐀-䶿々〆ヵヶ';
  const RE_KANJI_RUBY = new RegExp('([' + KANJI + ']+)《([^《》\\n]{1,30})》', 'g');
  const RE_PIPE_RUBY = /[|｜]([^|｜《》\n]{1,20})《([^《》\n]{1,30})》/g;
  const RE_EMPHASIS = /《《([^《》\n]*)》》/g;

  /** ルビ・傍点の記法を、文字位置を変えずに埋め字へ置き換える（本文の解析用） */
  function maskRuby(text) {
    return text
      .replace(RE_EMPHASIS, (m, inner) => FILLER + FILLER + inner + FILLER + FILLER)
      .replace(RE_PIPE_RUBY, (m, base, ruby) => FILLER + base + FILLER.repeat(ruby.length + 2))
      .replace(RE_KANJI_RUBY, (m, base, ruby) => base + FILLER.repeat(ruby.length + 2));
  }

  /** ルビ・傍点の記法を取り除いた素の本文 */
  function stripRuby(text) {
    return text
      .replace(RE_EMPHASIS, '$1')
      .replace(RE_PIPE_RUBY, '$1')
      .replace(RE_KANJI_RUBY, '$1');
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /** プレビュー用：ルビ・傍点・縦中横を HTML に変換（1 段落分） */
  function rubyToHtml(text, opts) {
    const vertical = !opts || opts.vertical !== false;
    let s = escapeHtml(text);
    s = s.replace(RE_EMPHASIS, '<em class="boten">$1</em>');
    s = s.replace(RE_PIPE_RUBY, '<ruby>$1<rt>$2</rt></ruby>');
    s = s.replace(RE_KANJI_RUBY, '<ruby>$1<rt>$2</rt></ruby>');
    if (vertical) {
      s = s.replace(/(^|[^0-9A-Za-z])([0-9]{2})(?![0-9A-Za-z])/g, '$1<span class="tcy">$2</span>');
      s = s.replace(/[!！][?？]|[?？][!！]|!!|！！|\?\?|？？/g, (m) => '<span class="tcy">' + m.replace(/！/g, '!').replace(/？/g, '?') + '</span>');
    }
    return s;
  }

  /** 段落（改行区切り） */
  function splitParagraphs(text) {
    const out = [];
    let start = 0;
    for (let i = 0; i <= text.length; i++) {
      if (i === text.length || text[i] === '\n') {
        out.push({ start, end: i, text: text.slice(start, i) });
        start = i + 1;
      }
    }
    return out;
  }

  function isSpace(c) {
    return c === ' ' || c === '　' || c === '\t' || c === '\r';
  }

  /**
   * 本文を解析し、段落・文・会話文の位置を返す。
   * - sentences: 地の文/会話文の「文」単位（会話を含む地の文は 1 文として扱う）
   * - dialogues: 最上位の「」『』の範囲
   * - inDialogue: 各文字が会話文の中にあるか (1/0)
   */
  function analyze(rawText) {
    const text = maskRuby(rawText);
    const paragraphs = splitParagraphs(text);
    const sentences = [];
    const dialogues = [];
    const inDialogue = new Uint8Array(text.length);

    paragraphs.forEach((p, pIndex) => {
      const stack = [];
      let sStart = p.start;
      let dlg = null;
      const pushSentence = (end) => {
        let s = sStart;
        while (s < end && isSpace(text[s])) s++;
        if (s < end) {
          const t = text.slice(s, end);
          const first = t[0];
          let kind = 'narration';
          if ((first === '「' || first === '『') && dialogues.length) {
            const d = dialogues[dialogues.length - 1];
            if (d.start === s && d.end === end) kind = 'dialogue';
          }
          sentences.push({ start: s, end, text: t, kind, para: pIndex });
        }
        sStart = end;
      };

      for (let i = p.start; i < p.end; i++) {
        const c = text[i];
        if (QUOTE_OPEN.indexOf(c) >= 0) {
          if (stack.length === 0 && (c === '「' || c === '『')) {
            dlg = { start: i, innerStart: i + 1, para: pIndex, open: c };
          }
          stack.push(c);
          continue;
        }
        if (CLOSERS[c] && QUOTE_OPEN.indexOf(CLOSERS[c]) >= 0) {
          if (stack.length && PAIRS[stack[stack.length - 1]] === c) {
            stack.pop();
            if (stack.length === 0 && dlg) {
              dlg.innerEnd = i;
              dlg.end = i + 1;
              dlg.closed = true;
              dialogues.push(dlg);
              dlg = null;
              // 会話の直後が次の会話 or 段落末なら文の区切り
              let j = i + 1;
              while (j < p.end && isSpace(text[j])) j++;
              if (j >= p.end || text[j] === '「' || text[j] === '『') {
                pushSentence(i + 1);
              }
            }
          }
          continue;
        }
        if (stack.length === 0 && '。！？!?'.indexOf(c) >= 0) {
          let j = i + 1;
          while (j < p.end && '。！？!?'.indexOf(text[j]) >= 0) j++;
          pushSentence(j);
          i = j - 1;
        }
      }
      if (dlg) {
        dlg.innerEnd = p.end;
        dlg.end = p.end;
        dlg.closed = false;
        dialogues.push(dlg);
      }
      pushSentence(p.end);
    });

    dialogues.forEach((d) => {
      for (let i = d.start; i < d.end; i++) inDialogue[i] = 1;
    });

    return { text: rawText, masked: text, paragraphs, sentences, dialogues, inDialogue };
  }

  /** 会話文の中身を文に分割（読みやすさチェック用） */
  function innerSentences(masked, d) {
    const out = [];
    const TERM = '。！？!?';
    let s = d.innerStart;
    let i = d.innerStart;
    while (i < d.innerEnd) {
      if (TERM.indexOf(masked[i]) >= 0) {
        let j = i + 1;
        while (j < d.innerEnd && TERM.indexOf(masked[j]) >= 0) j++;
        out.push({ start: s, end: j, text: masked.slice(s, j), kind: 'dialogue-inner' });
        s = j;
        i = j;
      } else {
        i++;
      }
    }
    if (s < d.innerEnd) out.push({ start: s, end: d.innerEnd, text: masked.slice(s, d.innerEnd), kind: 'dialogue-inner' });
    return out;
  }

  function visibleLength(s) {
    let n = 0;
    for (const c of s) {
      if (c === FILLER || c === '\n' || isSpace(c)) continue;
      n++;
    }
    return n;
  }

  /** 文字数・原稿用紙換算などの統計 */
  function stats(rawText) {
    const plain = stripRuby(rawText || '');
    const chars = plain.replace(/\n/g, '').length;
    const charsNoSpace = plain.replace(/[\s　]/g, '').length;
    const lines = plain.replace(/\n+$/, '').split('\n');
    let gridLines = 0;
    if (plain.trim()) {
      lines.forEach((line) => { gridLines += Math.max(1, Math.ceil(line.length / 20)); });
    }
    const pages = gridLines ? Math.ceil(gridLines / 20) : 0;
    const a = analyze(plain);
    let dialogueChars = 0;
    a.dialogues.forEach((d) => { dialogueChars += visibleLength(plain.slice(d.innerStart, d.innerEnd)); });
    const kanji = (plain.match(/[一-鿿㐀-䶿々]/g) || []).length;
    const kana = (plain.match(/[ぁ-ゖァ-ヺー]/g) || []).length;
    const sentenceCount = a.sentences.length;
    const paraCount = a.paragraphs.filter((p) => p.text.trim()).length;
    return {
      chars,
      charsNoSpace,
      pages,
      gridLines,
      dialogueRatio: charsNoSpace ? dialogueChars / charsNoSpace : 0,
      kanjiRatio: kanji + kana ? kanji / (kanji + kana) : 0,
      sentences: sentenceCount,
      paragraphs: paraCount,
      avgSentence: sentenceCount ? charsNoSpace / sentenceCount : 0,
      dialogues: a.dialogues.length,
      readingMinutes: charsNoSpace / 500,
    };
  }

  const KANJI_DIGITS = { '〇': 0, '零': 0, '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };

  /** 「17」「１７」「十七」「二〇二六」などを数値に */
  function parseJaNumber(str) {
    let s = String(str).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
    if (/^\d+$/.test(s)) return parseInt(s, 10);
    if (/^[〇零一二三四五六七八九]{2,}$/.test(s)) {
      return parseInt(Array.from(s).map((c) => KANJI_DIGITS[c]).join(''), 10);
    }
    let total = 0;
    let cur = 0;
    for (const c of s) {
      if (c in KANJI_DIGITS) cur = KANJI_DIGITS[c];
      else if (c === '十') { total += (cur || 1) * 10; cur = 0; }
      else if (c === '百') { total += (cur || 1) * 100; cur = 0; }
      else if (c === '千') { total += (cur || 1) * 1000; cur = 0; }
      else return NaN;
    }
    return total + cur;
  }

  /** 数値を漢数字に（縦書き向けの提案用） */
  function toKanjiNumber(n) {
    const digits = '〇一二三四五六七八九';
    if (!isFinite(n) || n < 0) return String(n);
    if (n === 0) return '〇';
    if (n >= 10000) return String(n).split('').map((c) => digits[+c]).join('');
    let s = '';
    [[1000, '千'], [100, '百'], [10, '十']].forEach(([u, ch]) => {
      const q = Math.floor(n / u);
      if (q) { s += (q === 1 ? '' : digits[q]) + ch; n %= u; }
    });
    if (n) s += digits[n];
    return s;
  }

  /** 二つの本文の差分位置（入力中のハイライト位置補正用） */
  function diffRange(a, b) {
    let start = 0;
    const min = Math.min(a.length, b.length);
    while (start < min && a.charCodeAt(start) === b.charCodeAt(start)) start++;
    let endA = a.length;
    let endB = b.length;
    while (endA > start && endB > start && a.charCodeAt(endA - 1) === b.charCodeAt(endB - 1)) { endA--; endB--; }
    return { start, oldEnd: endA, newEnd: endB };
  }

  /** 差分に合わせて指摘範囲をずらす（編集箇所に重なる指摘は捨てる） */
  function shiftRanges(items, diff) {
    const delta = (diff.newEnd - diff.start) - (diff.oldEnd - diff.start);
    const out = [];
    items.forEach((it) => {
      if (it.end <= diff.start) out.push(it);
      else if (it.start >= diff.oldEnd) out.push(Object.assign({}, it, { start: it.start + delta, end: it.end + delta }));
    });
    return out;
  }

  function escapeRegExp(s) {
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  NS.Text = {
    FILLER,
    PAIRS,
    maskRuby,
    stripRuby,
    rubyToHtml,
    escapeHtml,
    splitParagraphs,
    analyze,
    innerSentences,
    visibleLength,
    stats,
    parseJaNumber,
    toKanjiNumber,
    diffRange,
    shiftRanges,
    escapeRegExp,
  };
})(typeof globalThis !== 'undefined' ? (globalThis.Tsuzuri = globalThis.Tsuzuri || {}) : (window.Tsuzuri = window.Tsuzuri || {}));

</script>
<script>
// js/readings.js
/*
 * 綴り — 特殊な読み方（ルビ）の登録簿
 * アイデア帳（種類「読み方」や、本文に 足《アルファ》 のように書いたメモ）と、
 * 設定資料の「読み」から、作者が意図した読み方を集める。添削・AI・辞書で使う。
 */
(function (NS) {
  'use strict';
  const KANJI = '一-鿿㐀-䶿々〆ヵヶ';
  const RE_PIPE = /[|｜]([^|｜《》\n]{1,20})《([^《》\n]*)》/g;
  const RE_KANJI = new RegExp('([' + KANJI + ']+)《([^《》\\n]*)》', 'g');

  /** カタカナ→ひらがな、空白除去（読みの比較用） */
  function normReading(s) {
    return String(s || '').replace(/[\s　・]/g, '').replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60));
  }

  function hasKanji(s) { return new RegExp('[' + KANJI + ']').test(s); }

  /** 文章中のルビ記法を位置付きで取り出す */
  function findRubies(text) {
    const out = [];
    let m;
    RE_PIPE.lastIndex = 0;
    while ((m = RE_PIPE.exec(text)) !== null) {
      const baseStart = m.index + 1;
      const readingStart = baseStart + m[1].length + 1;
      out.push({ start: m.index, end: m.index + m[0].length, base: m[1], reading: m[2], baseStart, readingStart, readingEnd: readingStart + m[2].length, pipe: true });
    }
    RE_KANJI.lastIndex = 0;
    while ((m = RE_KANJI.exec(text)) !== null) {
      const prevEnd = out.find((r) => r.pipe && m.index >= r.start && m.index < r.end);
      if (prevEnd) continue;
      const readingStart = m.index + m[1].length + 1;
      out.push({ start: m.index, end: m.index + m[0].length, base: m[1], reading: m[2], baseStart: m.index, readingStart, readingEnd: readingStart + m[2].length, pipe: false });
    }
    return out.sort((a, b) => a.start - b.start);
  }

  /** メモの一行から「表記・読み」の組を読み取る（足＝アルファ、足 → アルファ、足（アルファ） など） */
  function parseLine(line) {
    const t = line.trim();
    if (!t) return null;
    let m = t.match(/^([^＝=→:：（(／/\s]+)\s*(?:＝|=|→|:|：|／|\/)\s*([^\s（(]+)/);
    if (m) return { base: m[1].replace(/^[|｜]/, ''), reading: m[2] };
    m = t.match(/^([^（(\s]+)\s*[（(]([^）)]+)[）)]/);
    if (m) return { base: m[1].replace(/^[|｜]/, ''), reading: m[2] };
    return null;
  }

  /** 作品から登録された読み方を集める */
  function collect(project) {
    const list = [];
    const seen = new Set();
    const add = (base, reading, source, id, note) => {
      base = String(base || '').trim();
      reading = String(reading || '').trim();
      if (!base || !reading) return;
      const k = base + '\u0000' + normReading(reading);
      if (seen.has(k)) return;
      seen.add(k);
      list.push({ base, reading, source, id, note: note || '' });
    };
    ((project && project.ideas) || []).forEach((it) => {

    ['すでに', [['すでに', 'すでに'], ['既に', '既に']]],
    ['振り返る', [['振り返', '振り返'], ['振りかえ', '振りかえ'], ['ふりかえ', 'ふりかえ'], ['振返', '振返']]],
    ['ありがとう', [['ありがとう', 'ありがとう'], ['有難う', '有難う'], ['有り難う', '有り難う']]],
    ['眼鏡', [['眼鏡', '眼鏡'], ['メガネ', 'メガネ'], ['めがね', 'めがね']]],
    ['かもしれない', [['かもしれ', 'かもしれ'], ['かも知れ', 'かも知れ']]],
    ['ちょうど', [['ちょうど', 'ちょうど'], ['丁度', '丁度']]],
    ['もちろん', [['もちろん', 'もちろん'], ['勿論', '勿論']]],
    ['たとえ', [['たとえ', 'たとえ(?!る|て|た|ら|れ)'], ['例え', '例え(?!る|て|た|ら|れ)']]],
    ['すぐ', [['すぐ', 'すぐ(?![れるさ])'], ['直ぐ', '直ぐ']]],
    ['少し', [['少し', '少し'], ['すこし', 'すこし']]],
    ['本当', [['本当', '本当'], ['ほんとう', 'ほんとう']]],
  ].map(([label, variants]) => ({
    label,
    variants: variants.map(([form, src]) => ({ form, re: new RegExp(src, 'g') })),
  }));

  const CONJUNCTIONS = ['しかし', 'だが', 'そして', 'それから', 'けれど', 'けれども', 'でも', 'ところが', 'また', 'さらに',
    'つまり', 'だから', 'なので', 'ただ', 'すると', 'それでも', 'とはいえ', 'そのため', 'ところで', 'やがて'];

  function eachMatch(re, text, fn) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      if (m[0].length === 0) { re.lastIndex++; continue; }
      fn(m);
    }
  }

  function expand(rep, m) {
    if (rep == null) return null;
    return rep.replace(/\$(\d)/g, (_, n) => m[+n] || '');
  }

  function isJa(c) {
    return !!c && /[぀-ヿ一-鿿㐀-䶿\uFF61-\uFF9F々〆ー。、「」『』…―]/.test(c);
  }

  /**
   * 本文を添削する。
   * @param {string} text
   * @param {object} opts { rules:{id:bool}, maxSentenceLength, maxCommas, endingRepeat,
   *                       styleRules:[{from,to}], corpus:[string] (表記ゆれ集計用の作品全文), ignore:Set }
   */
  function proofread(text, opts) {
    opts = opts || {};
    const enabled = (id) => (opts.rules && Object.prototype.hasOwnProperty.call(opts.rules, id) ? !!opts.rules[id] : RULE_MAP[id].default);
    const a = T.analyze(text || '');
    const m = a.masked;
    const issues = [];

    const add = (ruleId, start, end, message, suggestion, extra) => {
      const r = RULE_MAP[ruleId];
      issues.push(Object.assign({
        ruleId,
        rule: r.name,
        category: r.category,
        severity: r.severity,
        start,
        end,
        text: text.slice(start, end),
        message,
        suggestion: suggestion == null ? null : suggestion,
        fixable: suggestion != null && !!r.fix,
        source: 'proofread',
      }, extra || {}));
    };

    const dict = (ruleId, list, label) => {
      if (!enabled(ruleId)) return;
      list.forEach(({ re, rep, msg }) => {
        eachMatch(re, m, (mm) => {
          const sug = expand(rep, mm);
          const message = sug
            ? `${label}：「${mm[0]}」→「${sug}」${msg ? '。' + msg : ''}`
            : `${label}：「${mm[0]}」${msg ? '。' + msg : ''}`;
          add(ruleId, mm.index, mm.index + mm[0].length, message, sug);
        });
      });
    };
    dict('typo', TYPO, '誤字の可能性');
    dict('misuse', MISUSE, '慣用句の誤用');
    dict('redundant', REDUNDANT, '重複表現');

    if (enabled('ranuki')) {
      [RE_RANUKI, RE_RANUKI_KANA].forEach((re) => {
        eachMatch(re, m, (mm) => {
          const stem = mm[1];
          add('ranuki', mm.index, mm.index + mm[0].length, `ら抜き言葉：「${stem}れ」→「${stem}られ」`, stem + 'られ');
        });
      });
    }

    if (enabled('inuki')) {
      eachMatch(RE_INUKI, m, (mm) => {
        if (a.inDialogue[mm.index]) return;
        const te = mm[2] || mm[3];
        const teIndex = mm.index + mm[1].length - 1;
        const before2 = m.slice(Math.max(0, teIndex - 2), teIndex + 1);
        if (before2 === 'なんで' || before2 === 'ないで') return;
        const end = mm.index + mm[0].length;
        const suffix = mm[4];
        add('inuki', teIndex, end, `い抜き言葉：「${te}${suffix}」→「${te}い${suffix}」（地の文）`, te + 'い' + suffix);
      });
    }

    if (enabled('brackets')) checkBrackets(a, add);

    if (enabled('bracket-period')) {
      eachMatch(/。(?=[」』])/g, m, (mm) => {
        add('bracket-period', mm.index, mm.index + 1, '閉じ括弧の直前の句点は省くのが一般的です', '');
      });
    }

    if (enabled('ellipsis')) {
      eachMatch(/…+/g, m, (mm) => {
        if (mm[0].length % 2 === 1) {
          const sug = '…'.repeat(mm[0].length + 1);
          add('ellipsis', mm.index, mm.index + mm[0].length, `三点リーダーは2つ重ねて「${sug}」とするのが一般的です`, sug);
        }
      });
      eachMatch(/・{2,}|\.{3,}|．{3,}|‥+/g, m, (mm) => {
        add('ellipsis', mm.index, mm.index + mm[0].length, `「${mm[0]}」は三点リーダー「……」にするのが一般的です`, '……');
      });
    }

    if (enabled('dash')) {
      eachMatch(/[―─]+/g, m, (mm) => {
        if (mm[0].length === 1) {
          add('dash', mm.index, mm.index + 1, 'ダッシュは2つ重ねて「――」とするのが一般的です', mm[0] + mm[0]);
        }
      });
      eachMatch(/[—–]+/g, m, (mm) => {
        add('dash', mm.index, mm.index + mm[0].length, '欧文ダッシュは和文用の「――」に揃えるのが一般的です', '――');
      });
    }

    if (enabled('exclamation-space')) {
      eachMatch(/[！？!?]+/g, m, (mm) => {
        const next = m[mm.index + mm[0].length];
        if (next === undefined || next === '\n') return;
        if (/[\s　」』）)】〉》〕］”…―─]/.test(next)) return;
        add('exclamation-space', mm.index, mm.index + mm[0].length,
          '文中の「！」「？」の後には全角スペースを入れるのが一般的です', mm[0].replace(/!/g, '！').replace(/\?/g, '？') + '　');
      });
    }

    if (enabled('halfwidth')) {
      eachMatch(/[｡-ﾟ]+/g, m, (mm) => {
        add('halfwidth', mm.index, mm.index + mm[0].length, '半角カナが使われています', mm[0].normalize('NFKC'), { severity: 'error' });
      });
      eachMatch(/[!?]+/g, m, (mm) => {
        const prev = m[mm.index - 1];
        if (!isJa(prev)) return;
        const sug = mm[0].replace(/!/g, '！').replace(/\?/g, '？');
        add('halfwidth', mm.index, mm.index + mm[0].length, '和文中の半角「!?」は全角にするのが一般的です', sug);
      });
      eachMatch(/ +/g, m, (mm) => {
        const prev = m[mm.index - 1];
        const next = m[mm.index + mm[0].length];
        if (!isJa(prev) || !isJa(next)) return;
        add('halfwidth', mm.index, mm.index + mm[0].length, '和文中に半角スペースがあります', '　', { severity: 'info' });
      });
    }

    if (enabled('indent')) checkIndent(a, add);

    const maxLen = opts.maxSentenceLength || 100;
    const maxCommas = opts.maxCommas || 4;
    const readable = [];
    a.sentences.forEach((s) => {
      if (s.kind === 'narration') readable.push(s);
    });
    a.dialogues.forEach((d) => {
      T.innerSentences(m, d).forEach((s) => readable.push(s));
    });
    if (enabled('sentence-length')) {
      readable.forEach((s) => {
        const len = T.visibleLength(s.text);
        if (len > maxLen) {
          add('sentence-length', s.start, s.end, `一文が${len}文字あります（目安：${maxLen}文字以内）。分けると読みやすくなります`, null);
        }
      });
    }
    if (enabled('commas')) {
      readable.forEach((s) => {
        const n = (s.text.match(/[、，]/g) || []).length;
        if (n > maxCommas) {
          add('commas', s.start, s.end, `一文に読点が${n}個あります（目安：${maxCommas}個以内）`, null);
        }
      });
    }

    if (enabled('ending-repeat')) checkEndingRepeat(a, add, opts.endingRepeat || 3);
    if (enabled('conj-repeat')) checkConjunctions(a, add);
    if (enabled('no-chain')) {
      a.sentences.forEach((s) => {
        const pos = [];
        for (let i = s.start; i < s.end - 1; i++) {
          if (m[i] === 'の' && /[一-鿿々ァ-ヶ]/.test(m[i + 1]) && !/[こそあどもか]/.test(m[i - 1] || '')) pos.push(i);
        }
        for (let k = 0; k + 2 < pos.length; k++) {
          if (pos[k + 2] - pos[k] <= 16 && !/[、，]/.test(m.slice(pos[k], pos[k + 2]))) {
            let last = k + 2;
            while (last + 1 < pos.length && pos[last + 1] - pos[last] <= 8 && !/[、，]/.test(m.slice(pos[last], pos[last + 1]))) last++;
            const start = Math.max(s.start, pos[k] - 4);
            const end = Math.min(s.end, pos[last] + 3);
            add('no-chain', start, end, `「の」が${last - k + 1}回続いています。言い換えると読みやすくなります`, null);
            k = last;
          }
        }
      });
    }

    if (enabled('hyouki')) checkHyouki(m, add, opts.corpus);

    if (enabled('style-rule') && Array.isArray(opts.styleRules)) {
      opts.styleRules.forEach((r) => {
        if (!r || !r.from || r.from === r.to) return;
        const re = new RegExp(T.escapeRegExp(r.from), 'g');
        eachMatch(re, m, (mm) => {
          add('style-rule', mm.index, mm.index + mm[0].length,
            r.to ? `表記統一ルール：「${r.from}」→「${r.to}」` : `表記統一ルール：「${r.from}」は使わない設定です`,
            r.to != null ? r.to : null);
        });
      });
    }

    if (enabled('ruby')) checkRuby(text, add, opts);

    if (enabled('numbers')) {
      eachMatch(/[0-9０-９]+/g, m, (mm) => {
        const prev = m[mm.index - 1] || '';
        const next = m[mm.index + mm[0].length] || '';
        if (/[A-Za-z.．,:：]/.test(prev) || /[A-Za-z.．:：%]/.test(next)) return;
        const n = T.parseJaNumber(mm[0]);
        add('numbers', mm.index, mm.index + mm[0].length, '縦書きでは漢数字が一般的です', T.toKanjiNumber(n));
      });
    }

    return finalize(issues, opts.ignore, m);
  }

  function checkBrackets(a, add) {
    const m = a.masked;
    a.paragraphs.forEach((p) => {
      const stack = [];
      for (let i = p.start; i < p.end; i++) {
        const c = m[i];
        if (T.PAIRS[c]) {
          stack.push({ c, i });
        } else {
          let isCloser = false;
          for (const k in T.PAIRS) { if (T.PAIRS[k] === c) { isCloser = true; break; } }
          if (!isCloser) continue;
          if (stack.length && T.PAIRS[stack[stack.length - 1].c] === c) {
            stack.pop();
          } else {
            // 一つ下の階層と対応していれば、間の開き括弧が閉じられていない
            let found = -1;
            for (let k = stack.length - 1; k >= 0; k--) {
              if (T.PAIRS[stack[k].c] === c) { found = k; break; }
            }
            if (found >= 0) {
              for (let k = stack.length - 1; k > found; k--) {
                add('brackets', stack[k].i, stack[k].i + 1, `「${stack[k].c}」が閉じられていません`, null);
              }
              stack.length = found;
            } else {
              add('brackets', i, i + 1, `対応する開き括弧のない「${c}」があります`, null);
            }
          }
        }
      }
      stack.forEach((s) => {
        add('brackets', s.i, s.i + 1, `「${s.c}」が段落内で閉じられていません`, null);
      });
    });
  }

  function checkIndent(a, add) {
    const m = a.masked;
    const narr = [];
    const dlg = [];
    a.paragraphs.forEach((p) => {
      const t = p.text;
      if (!t.trim()) return;
      const first = t[0];
      const firstVisible = t.replace(/^[\s　]+/, '')[0] || '';
      if (/[◇◆■□○●＊*※☆★〜~＝=－\-#]/.test(firstVisible) && t.trim().length <= 12) return; // 場面転換記号
      if (firstVisible === '「' || firstVisible === '『' || firstVisible === '（' || firstVisible === '(') {
        dlg.push({ p, indented: first === '　' || first === ' ' });
      } else {
        narr.push({ p, indented: first === '　', half: first === ' ' });
      }
    });
    if (narr.length >= 2) {
      const ratio = narr.filter((x) => x.indented || x.half).length / narr.length;
      if (ratio >= 0.3) {
        narr.forEach((x) => {
          if (x.half) {
            let e = x.p.start;
            while (m[e] === ' ') e++;
            add('indent', x.p.start, e, '段落頭は半角ではなく全角スペースで字下げするのが一般的です', '　');
          } else if (!x.indented) {
            add('indent', x.p.start, x.p.start + 1, '段落の先頭が字下げされていません', '　' + a.text[x.p.start]);
          }
        });
      }
    }
    if (dlg.length >= 2) {
      const ratio = dlg.filter((x) => x.indented).length / dlg.length;
      if (ratio < 0.5) {
        dlg.forEach((x) => {
          if (x.indented) {
            let e = x.p.start;
            while (m[e] === '　' || m[e] === ' ') e++;
            add('indent', x.p.start, e, '会話文の鉤括弧の前は字下げしないのが一般的です', '');
          }
        });
      }
    }
  }

  function endingKey(sentText) {
    const t = sentText.replace(/[。！？!?\s　]+$/g, '');
    const last = t[t.length - 1];
    return last || '';
  }

  function checkEndingRepeat(a, add, threshold) {
    let run = [];
    let key = null;
    const flush = () => {
      if (run.length >= threshold) {
        for (let i = threshold - 1; i < run.length; i++) {
          const s = run[i];
          const k = endingKey(s.text);
          const endPos = s.end - 1;
          add('ending-repeat', Math.max(s.start, endPos - 2), s.end,
            `「〜${k}。」で終わる文が${i + 1}回続いています。文末に変化をつけると単調さが和らぎます`, null);
        }
      }
      run = [];
      key = null;
    };
    a.sentences.forEach((s) => {
      if (s.kind !== 'narration' || !/。$/.test(s.text)) { flush(); return; }
      const k = endingKey(s.text);
      if (k === key) run.push(s);
      else { flush(); run = [s]; key = k; }
    });
    flush();
  }

  function checkConjunctions(a, add) {
    const starts = [];
    const sorted = CONJUNCTIONS.slice().sort((x, y) => y.length - x.length);
    a.sentences.forEach((s, idx) => {
      if (s.kind !== 'narration') return;
      const lead = s.text.replace(/^[\s　]+/, '');
      const offset = s.text.length - lead.length;
      for (const c of sorted) {
        if (lead.startsWith(c) && /[、，\s　]/.test(lead[c.length] || '')) {
          starts.push({ c, idx, pos: s.start + offset });
          break;
        }
      }
    });
    for (let i = 1; i < starts.length; i++) {
      for (let j = i - 1; j >= 0; j--) {
        if (starts[i].idx - starts[j].idx > 3) break;
        if (starts[j].c === starts[i].c) {
          add('conj-repeat', starts[i].pos, starts[i].pos + starts[i].c.length,
            `接続詞「${starts[i].c}」が近い位置で繰り返されています`, null);
          break;
        }
      }
    }
  }

  function countVariants(group, texts) {
    return group.variants.map((v) => {
      let n = 0;
      texts.forEach((t) => {
        v.re.lastIndex = 0;
        const mm = t.match(v.re);
        if (mm) n += mm.length;
      });
      return n;
    });
  }

  function checkHyouki(m, add, corpus) {
    const texts = Array.isArray(corpus) && corpus.length ? corpus.map((t) => T.maskRuby(t || '')) : [m];
    HYOUKI_GROUPS.forEach((g) => {
      const counts = countVariants(g, texts);
      const used = counts.filter((n) => n > 0).length;
      if (used < 2) return;
      let best = 0;
      counts.forEach((n, i) => { if (n > counts[best]) best = i; });
      const summary = g.variants.map((v, i) => `「${v.form}」${counts[i]}回`).filter((_, i) => counts[i] > 0).join('・');
      g.variants.forEach((v, i) => {
        if (i === best) return;
        eachMatch(v.re, m, (mm) => {
          add('hyouki', mm.index, mm.index + mm[0].length,
            `表記ゆれ（${g.label}）：${summary}。多い方の「${g.variants[best].form}」に揃えますか？`,
            g.variants[best].form);
        });
      });
    });
  }

  /** ルビ：空のルビ・登録と違う読み・揺れ・当て字（登録済みの読みは指摘しない） */
  function checkRuby(text, add, opts) {
    const R = NS.Readings;
    if (!R) return;
    const reg = opts.readings instanceof Map ? opts.readings : R.index(opts.readings || []);
    const corpusR = new Map();
    (Array.isArray(opts.corpus) && opts.corpus.length ? opts.corpus : [text]).forEach((t) => {
      R.findRubies(t || '').forEach((r) => {
        if (!r.reading.trim()) return;
        const n = R.normReading(r.reading);
        if (!corpusR.has(r.base)) corpusR.set(r.base, new Map());
        const mm = corpusR.get(r.base);
        const v = mm.get(n) || { count: 0, reading: r.reading };
        v.count++;
        mm.set(n, v);
      });
    });
    R.findRubies(text).forEach((r) => {
      if (!r.reading.trim()) {
        add('ruby', r.start, r.end, `「${r.base}」のルビが空です`, null, { severity: 'error' });
        return;
      }
      const n = R.normReading(r.reading);
      const entry = reg.get(r.base);
      if (entry) {
        if (entry.readings.has(n)) return; // 登録済みの読み → 指摘しない
        if (R.looksSpecial(r.base, r.reading) || entry.items.some((it) => R.looksSpecial(it.base, it.reading))) {
          const want = entry.items[0].reading;
          add('ruby', r.readingStart, r.readingEnd, `「${r.base}」は「${want}」と読む設定です（本文：「${r.reading}」）`, want, { severity: 'warning' });
        }
        return;
      }
      const variants = corpusR.get(r.base);
      if (variants && variants.size > 1) {
        let best = null;
        variants.forEach((v, k) => { if (!best || v.count > best.count) best = { k, count: v.count, reading: v.reading }; });
        if (best.k !== n) {
          const list = Array.from(variants.values()).map((v) => `「${v.reading}」${v.count}回`).join('・');
          add('ruby', r.readingStart, r.readingEnd,
            `ルビの揺れ：「${r.base}」に${list}。意図した使い分けなら、アイデア帳に読み方を登録すると指摘しなくなります`,
            best.reading, { action: { type: 'register-reading', base: r.base, reading: r.reading } });
          return;
        }
      }
      if (R.looksSpecial(r.base, r.reading)) {
        add('ruby', r.start, r.end,
          `特殊な読み：「${r.base}」を「${r.reading}」と読ませています。意図した読みなら、アイデア帳に「読み方」として登録すると、この指摘は出なくなります`,
          null, { action: { type: 'register-reading', base: r.base, reading: r.reading } });
      }
    });
  }

  function issueKey(it) {
    return it.ruleId + '|' + it.text;
  }

  function finalize(issues, ignore, masked) {
    const seen = new Set();
    const out = [];
    issues.sort((x, y) => x.start - y.start || y.end - x.end);
    issues.forEach((it) => {
      const k = it.ruleId + ':' + it.start + ':' + it.end;
      if (seen.has(k)) return;
      seen.add(k);
      it.key = issueKey(it);
      if (ignore && ignore.has && ignore.has(it.key)) return;
      if (it.ruleId !== 'ruby' && masked && masked.slice(it.start, it.end).indexOf(FILLER) >= 0 && it.suggestion != null) {
        it.suggestion = null;
        it.fixable = false;
      }
      out.push(it);
    });
    return out;
  }

  /** 修正を一括適用する（後ろから順に） */
  function applyFixes(text, issues) {
    const list = issues.filter((it) => it.suggestion != null).sort((x, y) => y.start - x.start);
    let out = text;
    let lastStart = Infinity;
    list.forEach((it) => {
      if (it.end > lastStart) return; // 重なる修正は飛ばす
      if (out.slice(it.start, it.end) !== it.text) return;
      out = out.slice(0, it.start) + it.suggestion + out.slice(it.end);
      lastStart = it.start;
    });
    return out;
  }

  NS.Proofread = { RULES, RULE_MAP, proofread, applyFixes, issueKey, HYOUKI_GROUPS };
})(typeof globalThis !== 'undefined' ? (globalThis.Tsuzuri = globalThis.Tsuzuri || {}) : (window.Tsuzuri = window.Tsuzuri || {}));

</script>
<script>
// js/consistency.js
/*
 * 綴り — 設定矛盾チェック（ルールベース）
 * 設定資料（人物・場所・用語・世界観ルール）と本文を照らし合わせ、
 * 名前の表記ゆれ・一人称・呼び方・外見・年齢・退場後の登場・世界観NGワードなどを検出する。
 */
(function (NS) {
  'use strict';
  const T = NS.Text;

  function levenshtein(a, b) {
    if (a === b) return 0;
    const m = a.length;
    const n = b.length;
    if (Math.abs(m - n) > 2) return 3;
    let prev = new Array(n + 1);
    for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[n];
  }

  function isKatakana(s) {
    return /^[ァ-ヴー・]+$/.test(s);

  /** 設定資料から名前の索引を作る */
  function buildNameIndex(entries) {
    const forms = new Map(); // form -> [entryId]
    const byId = {};
    (entries || []).forEach((e) => {
      if (!e || !e.name) return;
      byId[e.id] = e;
      const set = new Set();
      const full = e.name.trim();
      const compact = full.replace(/[\s　]/g, '');
      if (compact) set.add(compact);
      const parts = full.split(/[\s　・＝=]+/).filter(Boolean);
      // 姓・名に分けた形も登録（1文字の名は漢字のみ。前後が漢字でない場合だけ一致させる）
      if (parts.length > 1) parts.forEach((p) => { if (p.length >= 2 || /^[\u4E00-\u9FFF々]$/.test(p)) set.add(p); });
      if (/・|＝/.test(compact)) set.add(compact.replace(/[・＝=]/g, ''));
      (e.aliases || []).forEach((al) => {
        const a2 = String(al || '').trim();
        if (a2) set.add(a2.replace(/[\s　]/g, ''));
      });
      set.forEach((f) => {
        if (!forms.has(f)) forms.set(f, []);
        if (forms.get(f).indexOf(e.id) < 0) forms.get(f).push(e.id);
      });
    });
    const list = Array.from(forms.keys()).sort((a, b) => b.length - a.length);
    let re = null;
    if (list.length) {
      re = new RegExp(list.map((f) => {
        const ef = T.escapeRegExp(f);
        if (isKatakana(f)) return '(?<![ァ-ヴー])' + ef + '(?![ァ-ヴー])';
        if (/^[ぁ-ん]+$/.test(f)) return '(?<![ぁ-ん])' + ef + '(?=[はがのをにもとへでやっさくちねよ、。！？!?…」』\\s\\u3000]|$)';
        if (f.length === 1) return '(?<![\\u4E00-\\u9FFF々])' + ef + '(?![\\u4E00-\\u9FFF々])';
        return ef;
      }).join('|'), 'g');
    }
    const normKanaMap = new Map();
    list.forEach((f) => { if (isKatakana(f) && !normKanaMap.has(normKana(f))) normKanaMap.set(normKana(f), f); });
    return { forms, list, re, byId, normKanaMap };
  }

  function findMentions(masked, index) {
    const out = [];
    if (!index.re) return out;
    index.re.lastIndex = 0;
    let m;
    while ((m = index.re.exec(masked)) !== null) {
      const ids = index.forms.get(m[0]) || [];
      out.push({ start: m.index, end: m.index + m[0].length, form: m[0], ids, entryId: ids.length === 1 ? ids[0] : null });
    }
    return out;
  }

  /** 名前の後ろの敬称を含めた終端と、その直後の文字 */
  function afterName(masked, end) {
    const rest = masked.slice(end, end + 8);
    const h = rest.match(RE_HONORIFIC);
    const e2 = end + (h ? h[0].length : 0);
    return { end: e2, next: masked[e2] || '', honorific: h ? h[0] : '' };
  }

  /** 台詞の話者を推定する */
  function attributeSpeakers(a, mentions) {
    const m = a.masked;
    const out = [];
    const narrMentions = mentions.filter((x) => !a.inDialogue[x.start] && x.entryId);
    a.dialogues.forEach((d, di) => {
      const para = a.paragraphs[d.para];
      let prevEnd = para.start;
      for (let k = di - 1; k >= 0; k--) {
        if (a.dialogues[k].para !== d.para) break;
        prevEnd = a.dialogues[k].end;
        break;
      }
      let speaker = null;
      let method = null;
      // (a) 台本形式：太郎「……」
      const beforeTrim = m.slice(prevEnd, d.start).replace(/[\s　:：]/g, '');
      const pre = narrMentions.filter((x) => x.start >= prevEnd && x.end <= d.start);
      if (beforeTrim && pre.length === 1 && beforeTrim === pre[0].form) {
        speaker = pre[0].entryId;
        method = 'prefix';
      }
      // (b) 台詞の後：「……」と太郎は言った
      if (!speaker && d.closed) {
        let stop = para.end;
        const nextQ = m.slice(d.end, para.end).search(/[「『]/);
        if (nextQ >= 0) stop = Math.min(stop, d.end + nextQ);
        const nextP = m.slice(d.end, para.end).search(/。/);
        if (nextP >= 0) stop = Math.min(stop, d.end + nextP + 1);
        const after = m.slice(d.end, stop);
        if (/^(?:と|って|、と|とだけ|という)/.test(after)) {
          const cands = narrMentions.filter((x) => x.start >= d.end && x.start < d.end + 24 && x.end <= stop);
          for (const c of cands) {
            const an = afterName(m, c.end);
            if (/[はがも]/.test(an.next)) { speaker = c.entryId; method = 'after'; break; }
          }
        }
      }
      // (c) 台詞の前の地の文：太郎は振り返った。「……」
      if (!speaker) {
        const cands = narrMentions.filter((x) => x.start >= Math.max(prevEnd, d.start - 60) && x.end <= d.start);
        for (let k = cands.length - 1; k >= 0; k--) {
          const an = afterName(m, cands[k].end);
          if (/[はがも]/.test(an.next)) { speaker = cands[k].entryId; method = 'before'; break; }
        }
      }
      if (speaker) out.push({ start: d.start, end: d.end, innerStart: d.innerStart, innerEnd: d.innerEnd, entryId: speaker, method });
    });
    return out;
  }

  function sentenceAt(a, pos) {
    // 二分探索
    let lo = 0;
    let hi = a.sentences.length - 1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      const s = a.sentences[mid];
      if (pos < s.start) hi = mid - 1;
      else if (pos >= s.end) lo = mid + 1;
      else return s;
    }
    return null;
  }

  function splitList(v) {
    return String(v || '').split(/[\/／、,，]+/).map((s) => s.trim()).filter(Boolean);
  }

  function parseAgeSetting(v) {
    const nums = (String(v || '').match(/[0-9０-９]+|[一二三四五六七八九十百]+/g) || []).map(T.parseJaNumber).filter((n) => !isNaN(n));
    if (!nums.length) return null;
    return { min: Math.min.apply(null, nums), max: Math.max.apply(null, nums) };
  }

  /**
   * 設定との矛盾をチェックする。
   * @param {string} text 本文
   * @param {object} ctx { entries, rules:{ng:[{word,reason,suggestion}]}, chapterNo, enabled:{id:bool}, ignore:Set }
   */
  function check(text, ctx) {
    ctx = ctx || {};
    const enabled = (id) => (ctx.enabled && Object.prototype.hasOwnProperty.call(ctx.enabled, id) ? !!ctx.enabled[id] : RULE_MAP[id].default);
    const a = T.analyze(text || '');
    const m = a.masked;
    const entries = ctx.entries || [];
    const index = ctx.index || buildNameIndex(entries);
    const mentions = findMentions(m, index);
    const issues = [];
    const add = (ruleId, start, end, message, suggestion, extra) => {
      const r = RULE_MAP[ruleId];
      issues.push(Object.assign({
        ruleId, rule: r.name, category: '設定', severity: r.severity, start, end,
        text: text.slice(start, end), message, suggestion: suggestion == null ? null : suggestion,
        fixable: suggestion != null && !!r.fix, source: 'consistency',
      }, extra || {}));
    };
    const nameOf = (id) => (index.byId[id] ? index.byId[id].name : '？');

    // 世界観NGワード
    if (enabled('ng-word')) {
      ((ctx.rules && ctx.rules.ng) || []).forEach((r) => {
        if (!r || !r.word) return;
        const re = new RegExp(T.escapeRegExp(r.word), 'g');
        let mm;
        while ((mm = re.exec(m)) !== null) {
          add('ng-word', mm.index, mm.index + mm[0].length,
            `世界観NGワード「${r.word}」${r.reason ? '：' + r.reason : ''}${r.suggestion ? `（言い換え例：「${r.suggestion}」）` : ''}`,
            r.suggestion || null);
        }
      });
    }

    // 固有名詞の表記ゆれ
    if (enabled('name-variant') && index.list.length) {
      const registered = new Set(index.list);
      const seenVariant = new Set();
      index.list.forEach((form) => {
        if (isKatakana(form)) return;
        const chars = Array.from(form);
        chars.forEach((c, i) => {
          const vs = KANJI_VARIANTS[c];
          if (!vs) return;
          Array.from(vs).forEach((v) => {
            const variant = chars.slice(0, i).concat([v], chars.slice(i + 1)).join('');
            if (registered.has(variant) || seenVariant.has(variant)) return;
            seenVariant.add(variant);
            let pos = m.indexOf(variant);
            while (pos >= 0) {
              add('name-variant', pos, pos + variant.length,
                `「${variant}」は設定資料では「${form}」と表記されています`, form, { entryId: (index.forms.get(form) || [])[0] });
              pos = m.indexOf(variant, pos + variant.length);
            }
          });
        });
      });
      // カタカナ名
      const runs = {};
      const reRun = /[ァ-ヴ][ァ-ヴー・]{2,}/g;
      let mm;
      while ((mm = reRun.exec(m)) !== null) {
        (runs[mm[0]] = runs[mm[0]] || []).push(mm.index);
      }
      Object.keys(runs).forEach((run) => {
        if (registered.has(run)) return;
        const nk = normKana(run);
        const exact = index.normKanaMap.get(nk);
        if (exact && exact !== run) {
          runs[run].forEach((pos) => add('name-variant', pos, pos + run.length,
            `「${run}」は設定資料では「${exact}」と表記されています`, exact, { severity: 'warning', entryId: (index.forms.get(exact) || [])[0] }));
          return;
        }
        // 似た名前（誤字の可能性）
        if (run.length < 4 || runs[run].length >= 3 || LOANWORDS.has(run)) return;
        // 登録名の前方一致・後方一致（「アレン」→「アレンス」等）は別名の可能性が高いので除外
        for (const [nf, form] of index.normKanaMap) {
          if (form.length < 4) continue;
          if (run.indexOf(form) >= 0 || form.indexOf(run) >= 0) continue;
          if (levenshtein(nk, nf) === 1) {
            runs[run].forEach((pos) => add('name-variant', pos, pos + run.length,
              `「${run}」は登録名「${form}」の誤字ではありませんか？`, form, { severity: 'info', entryId: (index.forms.get(form) || [])[0] }));
            break;
          }
        }
      });
    }

    // 話者推定
    const speakers = attributeSpeakers(a, mentions);

    speakers.forEach((sp) => {
      const e = index.byId[sp.entryId];
      if (!e) return;
      const f = e.fields || {};
      const inner = m.slice(sp.innerStart, sp.innerEnd).replace(/『[^』]*』/g, (s) => T.FILLER.repeat(s.length));
      const methodNote = '（推定話者）';

      // 一人称
      if (enabled('first-person') && f.firstPerson && f.firstPerson.trim()) {
        const allowed = parsePronounSetting(f.firstPerson);
        RE_PRONOUN.lastIndex = 0;
        let pm;
        while ((pm = RE_PRONOUN.exec(inner)) !== null) {
          const fam = PRONOUN_INDEX[pm[0]];
          if (!fam) continue;
          const pos = sp.innerStart + pm.index;
          if (allowed.has(fam.key)) {
            // 同じ一人称で表記違い（俺／オレ）
            const rawForms = Array.from(allowed).filter((x) => x.indexOf('raw:') !== 0);
            const settingForms = splitList(f.firstPerson.replace(/[\s　・]/g, '/'));
            if (settingForms.length && settingForms.indexOf(pm[0]) < 0 && rawForms.length) {
              const same = settingForms.find((sf) => PRONOUN_INDEX[sf] === fam);
              if (same) {
                add('first-person', pos, pos + pm[0].length,
                  `${e.name}${methodNote}の一人称は設定では「${same}」です（表記ゆれ：「${pm[0]}」）`, same,
                  { severity: 'info', entryId: e.id });
              }
            }
            continue;
          }
          if (fam.weak) continue;
          add('first-person', pos, pos + pm[0].length,
            `${e.name}${methodNote}の一人称は設定では「${f.firstPerson}」ですが、「${pm[0]}」が使われています`, null,
            { entryId: e.id });
        }
      }

      // 呼び方
      if (enabled('calls') && Array.isArray(e.relations)) {
        e.relations.forEach((rel) => {
          if (!rel || !rel.targetId || !rel.calls) return;
          const calls = splitList(rel.calls);
          if (!calls.length) return;
          mentions.forEach((mt) => {
            if (mt.start < sp.innerStart || mt.end > sp.innerEnd) return;
            if (mt.entryId !== rel.targetId) return;
            const an = afterName(m, mt.end);
            const said = m.slice(mt.start, an.end);
            if (calls.indexOf(said) >= 0) return;
            if (calls.some((c) => c.length > said.length && m.slice(mt.start, mt.start + c.length) === c)) return;
            add('calls', mt.start, an.end,
              `設定では${e.name}は${nameOf(rel.targetId)}を「${calls.join('／')}」と呼びます（本文：「${said}」）${methodNote}`,
              calls[0], { entryId: e.id, fixable: false });
          });
        });
      }

      // 登場範囲
      if (enabled('timeline') && ctx.chapterNo && e.appear) {
        const until = parseInt(e.appear.until, 10);
        const from = parseInt(e.appear.from, 10);
        if (until && ctx.chapterNo > until) {
          add('timeline', sp.start, sp.end,
            `${e.name}は第${until}話で${e.appear.reason || '退場'}していますが、第${ctx.chapterNo}話で発言しています${methodNote}`, null,
            { entryId: e.id });
        } else if (from && ctx.chapterNo < from) {
          add('timeline', sp.start, sp.end,
            `${e.name}の初登場は第${from}話の設定ですが、第${ctx.chapterNo}話で発言しています${methodNote}`, null,
            { severity: 'info', entryId: e.id });
        }
      }
    });

    // 外見（髪・瞳）
    if (enabled('appearance')) checkAppearance(a, mentions, index, add);
    // 年齢
    if (enabled('age')) checkAge(a, mentions, index, add);

    const out = [];
    const seen = new Set();
    issues.sort((x, y) => x.start - y.start || y.end - x.end).forEach((it) => {
      const k = it.ruleId + ':' + it.start + ':' + it.end;
      if (seen.has(k)) return;
      seen.add(k);
      it.key = it.ruleId + '|' + it.text;
      if (ctx.ignore && ctx.ignore.has && ctx.ignore.has(it.key)) return;
      out.push(it);
    });

    return {
      issues: out,
      speakers: speakers.map((s) => Object.assign({ name: nameOf(s.entryId) }, s)),
      mentions,
      candidates: findCandidates(m, index),
    };
  }

  function nearestCharacter(mentions, index, from, to, pos) {
    let best = null;
    mentions.forEach((mt) => {
      if (!mt.entryId || mt.start < from || mt.end > to) return;
      const e = index.byId[mt.entryId];
      if (!e || e.type !== 'character') return;
      if (mt.end <= pos) {
        if (!best || best.after || mt.end > best.mt.end) best = { mt, after: false };
      } else if (!best) {
        if (mt.start - pos < 24) best = { mt, after: true };
      }
    });
    return best ? best.mt : null;
  }

  function checkAppearance(a, mentions, index, add) {
    const m = a.masked;
    const parts = [
      { field: 'hair', label: '髪', re: /髪|ヘア|赤毛|毛先/g },
      { field: 'eyes', label: '瞳', re: /瞳|双眸|眸|眼(?![鏡差前下中科力球光])|目(?![的標指覚立線安撃印次録上下玉頭元配処盛尻])/g },
    ];
    parts.forEach((part) => {
      part.re.lastIndex = 0;
      let km;
      while ((km = part.re.exec(m)) !== null) {
        const kw = km[0];
        const kwStart = km.index;
        const kwEnd = kwStart + kw.length;
        const s = sentenceAt(a, kwStart);
        if (!s) continue;
        const sent = m.slice(s.start, s.end);
        if (/染め|染ま|ウィッグ|かつら|カツラ|変装|カラコン|コンタクト|白髪(?:交じ|まじ|が増)|幻|夢の中|見間違/.test(sent)) continue;
        let found = null;
        let foundStart = -1;
        if (kw === '赤毛') { found = new Set(['赤']); foundStart = kwStart; }
        const strict = kw === '目' || kw === '眼';
        if (!found) {
          const winStart = Math.max(s.start, kwStart - (strict ? 6 : 10));
          const win = m.slice(winStart, kwStart);
          let last = null;
          RE_COLOR.lastIndex = 0;
          let cm;
          while ((cm = RE_COLOR.exec(win)) !== null) last = { w: cm[0], i: cm.index };
          if (last) {
            const tail = win.slice(last.i + last.w.length);
            const ok = strict ? /^(?:色)?(?:の|い|な)?$/.test(tail) : !/[、。」』]/.test(tail);
            if (ok) { found = COLOR_WORDS[last.w]; foundStart = winStart + last.i; }
          }
        }
        if (!found && !strict) {
          const after = m.slice(kwEnd, Math.min(s.end, kwEnd + 12));
          const am = after.match(/^(?:の色)?[はがも]、?/);
          if (am) {
            const rest = after.slice(am[0].length);
            RE_COLOR.lastIndex = 0;
            const cm = RE_COLOR.exec(rest);
            if (cm && cm.index <= 4 && !/^(?:では|じゃ)な/.test(rest.slice(cm.index + cm[0].length).replace(/^色/, ''))) {
              found = COLOR_WORDS[cm[0]];
              foundStart = kwEnd + am[0].length + cm.index;
            }
          }
        }
        if (!found) continue;
        // 慣用句・別の意味の除外
        const ctxStr = m.slice(Math.max(0, foundStart - 2), Math.min(m.length, kwEnd + 4));
        if (COLOR_EXCLUDE.some((x) => ctxStr.indexOf(x) >= 0)) continue;
        if (part.field === 'eyes') {
          if (/白い目で|白目|目を白黒|目の前が真っ|色目/.test(m.slice(Math.max(0, foundStart - 2), kwEnd + 4))) continue;
          if (found.has('赤') && /泣|涙|充血|寝不足|腫ら|擦/.test(sent)) continue;
        }
        const ch = nearestCharacter(mentions, index, s.start, s.end, Math.min(foundStart, kwStart));
        if (!ch) continue;
        const e = index.byId[ch.entryId];
        const setting = e.fields && e.fields[part.field];
        if (!setting) continue;
        const settingGroups = colorGroupsIn(setting);
        if (!settingGroups.size) continue;
        if (compatible(found, settingGroups)) continue;
        const start = Math.min(foundStart, kwStart);
        const end = Math.max(kwEnd, foundStart + 1);
        add('appearance', start, end,
          `設定では${e.name}の${part.label}は「${setting}」です（本文：「${m.slice(start, end)}」）`, null, { entryId: e.id });
      }
    });
  }

  function checkAge(a, mentions, index, add) {
    const m = a.masked;
    const re = /([0-9０-９]{1,3}|[一二三四五六七八九十百]{1,4})(?:歳|才)(?!年上|年下|上|下|差|違|以上|以下|未満|くらい|ぐらい|前後|頃|ごろ|から|まで|の頃|の時|のとき|の子|児)/g;
    let mm;
    while ((mm = re.exec(m)) !== null) {
      const age = T.parseJaNumber(mm[1]);
      if (isNaN(age)) continue;
      const s = sentenceAt(a, mm.index);
      if (!s) continue;
      const end = mm.index + mm[0].length;
      let ch = null;
      // 「十七歳の太郎」
      const afterM = m.slice(end, end + 3);
      if (/^の/.test(afterM)) {
        ch = mentions.find((x) => x.entryId && x.start >= end + 1 && x.start <= end + 2 && index.byId[x.entryId].type === 'character') || null;
      }
      // 「太郎は十七歳」
      if (!ch) {
        const cands = mentions.filter((x) => x.entryId && x.start >= s.start && x.end <= mm.index && index.byId[x.entryId].type === 'character');
        for (let k = cands.length - 1; k >= 0; k--) {
          const an = afterName(m, cands[k].end);
          if (/[はがも]/.test(an.next) && mm.index - an.end <= 12) { ch = cands[k]; break; }
        }
      }
      if (!ch) continue;
      const e = index.byId[ch.entryId];
      const set = parseAgeSetting(e.fields && e.fields.age);
      if (!set) continue;
      if (age >= set.min && age <= set.max) continue;
      add('age', mm.index, end,
        `設定では${e.name}は${e.fields.age}${/歳|才/.test(e.fields.age) ? '' : '歳'}です（本文：「${mm[0]}」）`, null, { entryId: e.id });
    }
  }

  /** 設定資料に未登録の固有名詞らしき語（カタカナ語・「〇〇王国」など） */
  function findCandidates(m, index) {
    const counts = {};
    const registeredNorm = new Set(Array.from(index.normKanaMap.keys()));
    const registered = new Set(index.list);
    const reRun = /[ァ-ヴ][ァ-ヴー・]{2,}/g;
    let mm;
    while ((mm = reRun.exec(m)) !== null) {
      const w = mm[0].replace(/・+$/, '');
      if (w.length < 3) continue;
      if (LOANWORDS.has(w) || registered.has(w) || registeredNorm.has(normKana(w))) continue;
      if (/^(.{1,3})\1+$/.test(w) || /ッ$/.test(w)) continue;
      if (Array.from(registered).some((r) => isKatakana(r) && w.indexOf(r) >= 0)) continue;
      counts[w] = counts[w] || { word: w, count: 0, kind: 'katakana' };

      .filter((c) => c.count >= 2 || c.kind === 'place')
      .sort((x, y) => y.count - x.count)
      .slice(0, 20);
  }

  /** 各話での人物・用語の登場回数（設定資料の「登場箇所」用） */
  function countMentionsByEntry(texts, entries) {
    const index = buildNameIndex(entries);
    return texts.map((t) => {
      const counts = {};
      findMentions(T.maskRuby(t || ''), index).forEach((mt) => {
        mt.ids.forEach((id) => { counts[id] = (counts[id] || 0) + 1; });

  NS.Consistency = {
    RULES, RULE_MAP, check, buildNameIndex, findMentions, attributeSpeakers, countMentionsByEntry,
