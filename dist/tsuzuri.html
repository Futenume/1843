        const b = pos[v];
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const d = Math.hypot(dx, dy) || 1;
        const f = SPR * (d - L);
        disp[u][0] += (dx / d) * f; disp[u][1] += (dy / d) * f;
        disp[v][0] -= (dx / d) * f; disp[v][1] -= (dy / d) * f;
      });
      ids.forEach((id) => {
        const d = disp[id];
        d[0] -= pos[id][0] * GRAV;
        d[1] -= pos[id][1] * GRAV * 1.4;
        const len = Math.hypot(d[0], d[1]) || 1;
        const m = Math.min(len, t);
        pos[id][0] += (d[0] / len) * m;
        pos[id][1] += (d[1] / len) * m;
      });
    }
    return pos;
  }

  function layout(silent) {
    const p = P();
    const list = nodes();
    if (!list.length) return;
    const ids = list.map((n) => n.id);
    const seen = new Set();
    const pairs = [];
    edges().forEach((e) => {
      const k = e.from < e.to ? e.from + '|' + e.to : e.to + '|' + e.from;
      if (seen.has(k) || !ids.includes(e.from) || !ids.includes(e.to)) return;
      seen.add(k);
      pairs.push([e.from, e.to]);
    });
    const pos = computeLayout(ids, pairs, silent ? p.relmap.pos : {});
    ids.forEach((id) => { p.relmap.pos[id] = [Math.round(pos[id][0]), Math.round(pos[id][1])]; });
    if (!silent) { touch(); render(); fitView(); }
  }

  function build() {
    const p = P();
    clear(R.container);
    const connectBtn = btn('線をつなぐ', { icon: 'link', small: true, title: '人物から人物へドラッグして関係を追加', onClick: () => {
      R.connect = !R.connect;
      connectBtn.classList.toggle('active', R.connect);
      R.svg.classList.toggle('connecting', R.connect);
      toast(R.connect ? '人物から人物へドラッグすると関係を追加できます' : '線をつなぐモードを終了しました');
    } });
    const toolbar = h('div', { class: 'relmap-toolbar' },
      connectBtn,
      btn('自動配置', { icon: 'dice', small: true, onClick: () => layout() }),
      btn('全体', { small: true, ghost: true, onClick: fitView }),
      h('label', { class: 'check small' }, h('input', { type: 'checkbox', checked: !!p.relmap.showOrgs, onchange: (e) => { p.relmap.showOrgs = e.target.checked; touch(); ensurePositions(); render(); } }), '組織も表示'),
      h('label', { class: 'check small' }, h('input', { type: 'checkbox', checked: p.relmap.showCalls !== false, onchange: (e) => { p.relmap.showCalls = e.target.checked; touch(); render(); } }), '呼び方を表示'),
      btn('PNG', { icon: 'image', small: true, title: '画像として書き出す', onClick: exportPng }));
    R.svg = el('svg', { class: 'relmap-svg', role: 'img', 'aria-label': 'キャラ相関図' });
    R.g = el('g');
    R.defs = el('defs');
    R.svg.append(R.defs, R.g);
    R.side = h('div', { class: 'relmap-side' });
    const legend = h('div', { class: 'relmap-legend' }, KINDS.map((k) => h('span', { class: 'legend-item' },
      h('span', { class: 'legend-line', style: { borderTopColor: k.color, borderTopStyle: k.dash ? 'dashed' : 'solid' } }), k.label)));
    const stage = h('div', { class: 'relmap-stage' }, R.svg, legend);
    R.container.append(h('div', { class: 'relmap' }, toolbar, h('div', { class: 'relmap-body' }, stage, R.side)));
    bind();
    ensurePositions();
    render();
    renderSide();
    requestAnimationFrame(fitView);
  }

  function markerFor(color) {
    const id = 'arrow-' + color.replace('#', '');
    if (!R.defs.querySelector('#' + id)) {
      R.defs.appendChild(el('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' },
        el('path', { d: 'M0,0 L10,5 L0,10 z', fill: color })));
    }
    return 'url(#' + id + ')';
  }

  const NODE_R = 30;

  function render() {
    const p = P();
    clear(R.g);
    const list = nodes();
    if (!list.length) {
      R.g.appendChild(el('text', { x: 0, y: 0, 'text-anchor': 'middle', class: 'relmap-empty', text: '人物を登録すると、ここに相関図が表示されます' }));
      return;
    }
    const pos = p.relmap.pos;
    const E = edges();
    const pairKey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
    const pairs = {};
    E.forEach((e) => { const k = pairKey(e.from, e.to); pairs[k] = (pairs[k] || 0) + 1; });
    const edgeLayer = el('g');
    const labelLayer = el('g');
    E.forEach((e) => {
      const a = pos[e.from];
      const b = pos[e.to];
      if (!a || !b) return;
      const kind = e.org ? { color: '#9a8f80', dash: '3 3' } : kindOf(e.rel);
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const d = Math.hypot(dx, dy) || 1;
      const ux = dx / d;
      const uy = dy / d;
      // 双方向なら左右にふくらませる
      const both = pairs[pairKey(e.from, e.to)] > 1;
      const bend = both ? 34 : 0;
      const nx = -uy;
      const ny = ux;
      const r2 = list.find((n) => n.id === e.to && n.type === 'org') ? NODE_R + 6 : NODE_R + 4;
      const sx = a[0] + ux * (NODE_R + 4) + nx * (both ? 8 : 0);
      const sy = a[1] + uy * (NODE_R + 4) + ny * (both ? 8 : 0);
      const ex = b[0] - ux * r2 + nx * (both ? 8 : 0);
      const ey = b[1] - uy * r2 + ny * (both ? 8 : 0);
      const mx = (sx + ex) / 2 + nx * bend;
      const my = (sy + ey) / 2 + ny * bend;
      const path = `M${sx},${sy} Q${mx},${my} ${ex},${ey}`;
      const selected = R.selected && R.selected.kind === 'edge' && R.selected.from === e.from && R.selected.index === e.index;
      const hit = el('path', { d: path, class: 'relmap-edge-hit', onclick: (ev) => { ev.stopPropagation(); if (!e.org) editRelation(e.owner, e.index); } });
      const line = el('path', {
        d: path, fill: 'none', stroke: kind.color, 'stroke-width': selected ? 3.5 : 2, 'stroke-dasharray': kind.dash || null,
        'marker-end': markerFor(kind.color), class: 'relmap-edge',
      });
      edgeLayer.append(line, hit);
      // ラベル
      const lx = (sx + 2 * mx + ex) / 4;
      const ly = (sy + 2 * my + ey) / 4;
      const texts = [];
      if (e.org) texts.push({ t: e.label, cls: 'rl-note' });
      else {
        const note = e.rel.note || (e.rel.kind ? kindOf(e.rel).label : '');
        if (note) texts.push({ t: note, cls: 'rl-note' });
        if (p.relmap.showCalls !== false && e.rel.calls) texts.push({ t: '「' + e.rel.calls.split(/[\/／]/)[0] + '」', cls: 'rl-calls' });
      }
      if (texts.length) {
        const g = el('g', { class: 'relmap-label', transform: `translate(${lx},${ly})`, onclick: (ev) => { ev.stopPropagation(); if (!e.org) editRelation(e.owner, e.index); } });
        texts.forEach((x, i) => g.appendChild(el('text', { x: 0, y: (i - (texts.length - 1) / 2) * 14 + 4, 'text-anchor': 'middle', class: x.cls, fill: i === 0 ? kind.color : null, text: x.t })));
        labelLayer.appendChild(g);
      }
    });
    R.g.appendChild(edgeLayer);
    // ノード
    const nodeLayer = el('g');
    list.forEach((n) => {
      const [x, y] = pos[n.id];
      const isOrg = n.type === 'org';
      const color = n.color || (isOrg ? '#8a8177' : '#6c7a96');
      const dead = n.appear && n.appear.until;
      const sel = R.selected && R.selected.kind === 'node' && R.selected.id === n.id;
      const g = el('g', { class: 'relmap-node' + (sel ? ' selected' : '') + (dead ? ' dead' : ''), transform: `translate(${x},${y})`, 'data-id': n.id });
      if (isOrg) g.appendChild(el('rect', { x: -NODE_R - 6, y: -NODE_R * 0.7, width: (NODE_R + 6) * 2, height: NODE_R * 1.4, rx: 10, fill: color, class: 'node-shape' }));
      else g.appendChild(el('circle', { r: NODE_R, fill: color, class: 'node-shape' }));
      if (dead) g.appendChild(el('circle', { r: NODE_R + 4, fill: 'none', stroke: '#8a8177', 'stroke-dasharray': '3 3', 'stroke-width': 1.5 }));
      const initial = Array.from(n.name.replace(/[\s　]/g, ''))[0] || '？';
      g.appendChild(el('text', { x: 0, y: 7, 'text-anchor': 'middle', class: 'node-initial', text: isOrg ? n.name.slice(0, 4) : initial }));
      g.appendChild(el('text', { x: 0, y: NODE_R + (isOrg ? 4 : 18), 'text-anchor': 'middle', class: 'node-name', text: isOrg ? '' : n.name }));
      const sub = isOrg ? (n.fields.kind || '組織') : [n.fields.role, dead ? `第${n.appear.until}話で${n.appear.reason || '退場'}` : ''].filter(Boolean).join('・');
      if (sub) g.appendChild(el('text', { x: 0, y: NODE_R + (isOrg ? 18 : 33), 'text-anchor': 'middle', class: 'node-sub', text: sub }));
      nodeLayer.appendChild(g);
    });
    R.g.append(nodeLayer, labelLayer);
    applyView();
  }

  function applyView() {
    R.g.setAttribute('transform', `translate(${R.view.x},${R.view.y}) scale(${R.view.k})`);
  }

  function fitView() {
    if (!R || !R.svg) return;
    const p = P();
    const list = nodes();
    const rect = R.svg.getBoundingClientRect();
    if (!list.length || rect.width < 10) { R.view = { x: rect.width / 2, y: rect.height / 2, k: 1 }; applyView(); return; }
    let x0 = Infinity;
    let y0 = Infinity;
    let x1 = -Infinity;
    let y1 = -Infinity;
    list.forEach((n) => { const [x, y] = p.relmap.pos[n.id]; x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });
    const pad = 90;
    const k = Math.min(1.4, Math.min(rect.width / (x1 - x0 + pad * 2), rect.height / (y1 - y0 + pad * 2)));
    R.view = { k, x: rect.width / 2 - ((x0 + x1) / 2) * k, y: rect.height / 2 - ((y0 + y1) / 2) * k };
    applyView();
  }

  function toLocal(e) {
    const r = R.svg.getBoundingClientRect();
    return { x: (e.clientX - r.left - R.view.x) / R.view.k, y: (e.clientY - r.top - R.view.y) / R.view.k, sx: e.clientX, sy: e.clientY };
  }

  function nodeAt(pt) {
    const p = P();
    let best = null;
    nodes().forEach((n) => {
      const [x, y] = p.relmap.pos[n.id];
      const d = Math.hypot(pt.x - x, pt.y - y);
      if (d <= NODE_R + 6 && (!best || d < best.d)) best = { n, d };
    });
    return best ? best.n : null;
  }

  function bind() {
    const svg = R.svg;
    const pointers = new Map();
    svg.addEventListener('pointerdown', (e) => {
      const pt = toLocal(e);
      pointers.set(e.pointerId, pt);
      try { svg.setPointerCapture(e.pointerId); } catch (err) { /* 無視 */ }
      if (pointers.size === 2) {
        const [a, b] = Array.from(pointers.values());
        R.drag = { kind: 'pinch', d: Math.hypot(a.sx - b.sx, a.sy - b.sy), view: Object.assign({}, R.view), cx: (a.sx + b.sx) / 2, cy: (a.sy + b.sy) / 2 };
        return;
      }
      const n = nodeAt(pt);
      if (n && R.connect && n.type === 'character') {
        R.drag = { kind: 'connect', from: n, pt };
      } else if (n) {
        R.drag = { kind: 'node', id: n.id, start: pt, orig: P().relmap.pos[n.id].slice(), moved: false };
      } else {
        R.drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, view: Object.assign({}, R.view), moved: false };
      }
    });
    svg.addEventListener('pointermove', (e) => {
      if (pointers.has(e.pointerId)) pointers.set(e.pointerId, toLocal(e));
      const d = R.drag;
      if (!d) return;
      if (d.kind === 'pinch' && pointers.size === 2) {
        const [a, b] = Array.from(pointers.values());
        const dist = Math.hypot(a.sx - b.sx, a.sy - b.sy);
        zoomAt(d.view, dist / d.d, d.cx, d.cy);
      } else if (d.kind === 'pan') {
        if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 3) d.moved = true;
        R.view.x = d.view.x + (e.clientX - d.sx);
        R.view.y = d.view.y + (e.clientY - d.sy);
        applyView();
      } else if (d.kind === 'node') {
        const pt = toLocal(e);
        if (!d.moved && Math.hypot(pt.x - d.start.x, pt.y - d.start.y) * R.view.k < 3) return;
        d.moved = true;
        P().relmap.pos[d.id] = [Math.round(d.orig[0] + pt.x - d.start.x), Math.round(d.orig[1] + pt.y - d.start.y)];
        render();
      } else if (d.kind === 'connect') {
        const pt = toLocal(e);
        let ghost = R.g.querySelector('.relmap-ghost');
        if (!ghost) { ghost = el('line', { class: 'relmap-ghost' }); R.g.appendChild(ghost); }
        const [x, y] = P().relmap.pos[d.from.id];
        ghost.setAttribute('x1', x); ghost.setAttribute('y1', y); ghost.setAttribute('x2', pt.x); ghost.setAttribute('y2', pt.y);
      }
    });
    const up = (e) => {
      pointers.delete(e.pointerId);
      const d = R.drag;
      R.drag = null;
      if (!d) return;
      if (d.kind === 'node') {
        if (d.moved) touch();
        else { R.selected = { kind: 'node', id: d.id }; render(); renderSide(); }
      } else if (d.kind === 'pan' && !d.moved) {
        R.selected = null;
        render();
        renderSide();
      } else if (d.kind === 'connect') {
        const ghost = R.g.querySelector('.relmap-ghost');
        if (ghost) ghost.remove();
        const target = nodeAt(toLocal(e));
        if (target && target.id !== d.from.id && target.type === 'character') addRelationDialog(d.from, target);
      }
    };
    svg.addEventListener('pointerup', up);
    svg.addEventListener('pointercancel', up);
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoomAt(R.view, Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
    }, { passive: false });
  }

  function zoomAt(base, f, cx, cy) {
    const r = R.svg.getBoundingClientRect();
    const k = Math.max(0.2, Math.min(4, base.k * f));
    const px = cx - r.left;
    const py = cy - r.top;
    const wx = (px - base.x) / base.k;
    const wy = (py - base.y) / base.k;
    R.view = { k, x: px - wx * k, y: py - wy * k };
    applyView();
  }

  // ───── 関係の追加・編集 ─────
  function kindSelect(value) {
    return h('select', { class: 'input' }, KINDS.map((k) => h('option', { value: k.id, selected: k.id === value }, k.label)));
  }

  function addRelationDialog(from, to) {
    const kind = kindSelect('friend');
    const note = h('input', { class: 'input', type: 'text', placeholder: '例：幼なじみ、兄、宿敵' });
    const calls = h('input', { class: 'input', type: 'text', placeholder: `${from.name}は${to.name}を何と呼ぶ？` });
    const back = h('input', { type: 'checkbox', checked: true });
    const backNote = h('input', { class: 'input', type: 'text', placeholder: '相手から見た関係' });
    const backCalls = h('input', { class: 'input', type: 'text', placeholder: `${to.name}は${from.name}を何と呼ぶ？` });
    UI.modal({
      title: `${from.name} → ${to.name}`,
      body: h('div', { class: 'stack' },
        h('div', { class: 'grid-2' }, UI.field('関係の種類', kind), UI.field('関係（メモ）', note)),
        UI.field('呼び方', calls, '台詞の呼び方チェックに使います'),
        h('label', { class: 'check' }, back, `${to.name} → ${from.name} の関係も追加する`),
        h('div', { class: 'grid-2' }, UI.field('相手から見た関係', backNote), UI.field('相手からの呼び方', backCalls))),
      actions: [
        { label: 'キャンセル', ghost: true },
        { label: '追加', primary: true, onClick: () => {
          from.relations.push({ targetId: to.id, kind: kind.value, note: note.value.trim(), calls: calls.value.trim() });
          if (back.checked && !to.relations.some((r) => r.targetId === from.id)) {
            to.relations.push({ targetId: from.id, kind: kind.value, note: backNote.value.trim(), calls: backCalls.value.trim() });
          }
          touch();
          render();
          renderSide();
        } },
      ],
    });
  }

  function editRelation(owner, index) {
    const rel = owner.relations[index];
    if (!rel) return;
    const p = P();
    const target = p.entries.find((e) => e.id === rel.targetId);
    R.selected = { kind: 'edge', from: owner.id, index };
    render();
    const kind = kindSelect(rel.kind || guessKind(rel.note));
    const note = h('input', { class: 'input', type: 'text', value: rel.note || '' });
    const calls = h('input', { class: 'input', type: 'text', value: rel.calls || '' });
    UI.modal({
      title: `${owner.name} → ${target ? target.name : '？'}`,
      onClose: () => { R.selected = null; render(); },
      body: h('div', { class: 'stack' },
        h('div', { class: 'grid-2' }, UI.field('関係の種類', kind), UI.field('関係（メモ）', note)),
        UI.field('呼び方', calls, '複数あるときは／で区切ります')),
      actions: [
        { label: '削除', danger: true, ghost: true, onClick: async () => {
          if (!(await UI.confirm('この関係を削除します。', { danger: true, okLabel: '削除' }))) return false;
          owner.relations.splice(index, 1);
          touch();
          renderSide();
        } },
        { label: '保存', primary: true, onClick: () => {
          rel.kind = kind.value;
          rel.note = note.value.trim();
          rel.calls = calls.value.trim();
          touch();
          renderSide();
        } },
      ],
    });
  }

  function renderSide() {
    const p = P();
    clear(R.side);
    const sel = R.selected && R.selected.kind === 'node' ? p.entries.find((e) => e.id === R.selected.id) : null;
    if (!sel) {
      R.side.append(
        h('h3', { class: 'panel-h' }, '使い方'),
        h('ul', { class: 'hint-list small muted' },
          h('li', null, '人物をドラッグで動かせます。何もない所をドラッグで全体を移動、ホイール／ピンチで拡大縮小'),
          h('li', null, '「線をつなぐ」を押してから人物から人物へドラッグすると、関係を追加できます'),
          h('li', null, '線や関係の文字をクリックすると、種類・呼び方を編集できます'),
          h('li', null, '関係と呼び方は設定資料の人物にも保存され、台詞の呼び方チェックに使われます')),
        h('p', { class: 'small muted' }, `人物 ${p.entries.filter((e) => e.type === 'character').length}人・関係 ${edges().filter((e) => !e.org).length}本`));
      return;
    }
    const others = p.entries.filter((e) => e.type === 'character' && e.id !== sel.id);
    const incoming = [];
    p.entries.forEach((e) => e.relations.forEach((r, i) => { if (r.targetId === sel.id) incoming.push({ e, r, i }); }));
    R.side.append(...[
      h('div', { class: 'row' }, h('span', { class: 'color-dot big', style: { background: sel.color || '#6c7a96' } }), h('h3', null, sel.name)),
      sel.fields && sel.fields.role ? h('p', { class: 'small muted' }, sel.fields.role) : null,
      h('div', { class: 'row wrap' },
        btn('設定資料を開く', { small: true, icon: 'users', onClick: () => NS.App.navigate('lore', { id: sel.id }) }),
        sel.type === 'character' ? btn('関係を追加', { small: true, icon: 'plus', onClick: () => {
          if (!others.length) { toast('ほかの人物を登録してください'); return; }
          const sel2 = h('select', { class: 'input' }, others.map((o) => h('option', { value: o.id }, o.name)));
          UI.modal({
            title: '相手を選ぶ', body: UI.field('相手', sel2),
            actions: [{ label: 'キャンセル', ghost: true }, { label: '次へ', primary: true, onClick: () => { setTimeout(() => addRelationDialog(sel, others.find((o) => o.id === sel2.value)), 50); } }],
          });
        } }) : null),
      h('h3', { class: 'panel-h' }, `${sel.name}から`),
      relList(sel.relations.map((r, i) => ({ owner: sel, r, i, other: p.entries.find((x) => x.id === r.targetId) }))),
      h('h3', { class: 'panel-h' }, `${sel.name}へ`),
      relList(incoming.map(({ e, r, i }) => ({ owner: e, r, i, other: e })))].filter(Boolean));
  }

  function relList(items) {
    if (!items.length) return h('p', { class: 'small muted' }, 'なし');
    return h('div', { class: 'rel-list' }, items.map(({ owner, r, i, other }) => {
      const k = kindOf(r);
      return h('button', { type: 'button', class: 'rel-item', onclick: () => editRelation(owner, i) },
        h('span', { class: 'legend-line', style: { borderTopColor: k.color, borderTopStyle: k.dash ? 'dashed' : 'solid' } }),
        h('span', null, h('strong', null, other ? other.name : '？'), h('span', { class: 'muted small' }, '　' + (r.note || k.label) + (r.calls ? `・「${r.calls}」` : ''))));
    }));
  }

  // ───── 書き出し ─────
  function exportPng() {
    const p = P();
    const list = nodes();
    if (!list.length) return;
    let x0 = Infinity;
    let y0 = Infinity;
    let x1 = -Infinity;
    let y1 = -Infinity;
    list.forEach((n) => { const [x, y] = p.relmap.pos[n.id]; x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });
    const pad = 110;
    const w = x1 - x0 + pad * 2;
    const hgt = y1 - y0 + pad * 2;
    const clone = R.svg.cloneNode(true);
    clone.setAttribute('xmlns', SVGNS);
    clone.setAttribute('width', w * 2);
    clone.setAttribute('height', hgt * 2);
    clone.setAttribute('viewBox', `${x0 - pad} ${y0 - pad} ${w} ${hgt}`);
    const mainG = Array.from(clone.children).find((c) => c.tagName.toLowerCase() === 'g');
    if (mainG) mainG.setAttribute('transform', '');
    const style = document.createElementNS(SVGNS, 'style');
    style.textContent = `text{font-family:"Noto Sans JP","Hiragino Sans",sans-serif}.node-initial{fill:#fff;font-size:22px;font-weight:700}.node-name{fill:#2a2521;font-size:14px;font-weight:700;paint-order:stroke;stroke:#fffdf8;stroke-width:4px}.node-sub{fill:#887f74;font-size:11px;paint-order:stroke;stroke:#fffdf8;stroke-width:3px}.rl-note{font-size:12px;font-weight:700;paint-order:stroke;stroke:#fffdf8;stroke-width:4px}.rl-calls{fill:#5a5248;font-size:11px;paint-order:stroke;stroke:#fffdf8;stroke-width:4px}.relmap-edge-hit{display:none}.node-shape{stroke:#fffdf8;stroke-width:3px}`;
    clone.insertBefore(style, clone.firstChild);
    const bg = document.createElementNS(SVGNS, 'rect');
    bg.setAttribute('x', x0 - pad); bg.setAttribute('y', y0 - pad); bg.setAttribute('width', w); bg.setAttribute('height', hgt); bg.setAttribute('fill', '#fffdf8');
    clone.insertBefore(bg, style.nextSibling);
    const title = document.createElementNS(SVGNS, 'text');
    title.setAttribute('x', x0 - pad + 20); title.setAttribute('y', y0 - pad + 34);
    title.setAttribute('style', 'font-size:20px;font-weight:700;fill:#2a2521');
    title.textContent = p.title + '　相関図';
    clone.appendChild(title);
    const data = new XMLSerializer().serializeToString(clone);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = w * 2;
      c.height = hgt * 2;
      c.getContext('2d').drawImage(img, 0, 0);
      c.toBlob((blob) => { if (blob) { UI.download(UI.safeFilename(p.title) + '_相関図.png', blob); toast('相関図を書き出しました'); } }, 'image/png');
    };
    img.onerror = () => toast('書き出せませんでした', 'error');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(data);
  }

  NS.RelMap = { mount, KINDS, KIND, guessKind, kindOf, computeLayout, refit: () => { if (R) fitView(); } };
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
<script>
// js/views/ideas.js
/*
 * 綴り — アイデア帳 と プロットボード
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const { h, icon, btn, clear, toast } = UI;
  const KINDS = ['アイデア', '台詞', 'シーン', '設定', '伏線', 'タイトル案', '読み方', '資料'];

  function P() { return NS.App.project; }
  function touch() { NS.App.touch(); }

  // ───── 伏線 ─────
  function chapterLabel(p, id) {
    if (!id) return '';
    const i = p.chapters.findIndex((c) => c.id === id);
    return i < 0 ? '（削除された話）' : `第${i + 1}話`;
  }
  function chapterSelect(p, value, label, allowEmpty) {
    return h('select', { class: 'input', 'aria-label': label },
      allowEmpty !== false ? h('option', { value: '' }, '（未定）') : null,
      p.chapters.map((c, i) => h('option', { value: c.id, selected: c.id === value }, `${i + 1}. ${c.title || '無題'}`)));
  }
  /** 伏線の状態の表示（張った話 → 回収する話） */
  function foreshadowLine(p, it) {
    const planted = chapterLabel(p, it.plantedIn);
    const payoff = chapterLabel(p, it.payoffIn);
    return h('div', { class: 'fs-line' },
      h('span', { class: 'fs-badge' + (it.resolved ? ' done' : '') }, it.resolved ? '回収済み' : '未回収'),
      h('span', { class: 'small muted' }, `${planted ? '張った：' + planted : '張った話：未設定'}${payoff ? '　→　' + (it.resolved ? '回収：' : '回収予定：') + payoff : ''}`));
  }
  const unresolvedCount = (p) => p.ideas.filter((i) => i.kind === '伏線' && !i.resolved).length;

  // ───────────── アイデア帳 ─────────────
  const Ideas = {};
  let IS = null;

  Ideas.mount = function (view) {
    IS = { view, q: '', kind: '', tag: '', pinnedOnly: false };
    build();
  };
  Ideas.unmount = function () { IS = null; };

  function build() {
    clear(IS.view);
    const wrap = h('div', { class: 'ideas' });
    IS.view.appendChild(wrap);

    // すばやくメモ
    const body = h('textarea', { class: 'input quick-input', rows: 3, placeholder: '思いついたことをすぐメモ（Ctrl+Enterで追加）\n例：主人公の剣は、実は亡き師匠の形見だった' });
    const kindSel = h('select', { class: 'input', 'aria-label': '種類' }, KINDS.map((k) => h('option', { value: k }, k)));
    const tags = h('input', { class: 'input', type: 'text', placeholder: 'タグ（、区切り）', 'aria-label': 'タグ' });
    // 種類「読み方」のときは、表記と読みを入れる欄を出す
    const word = h('input', { class: 'input', type: 'text', placeholder: '表記（例：足）', 'aria-label': '表記' });
    const reading = h('input', { class: 'input', type: 'text', placeholder: '読み（例：アルファ）', 'aria-label': '読み' });
    const readingRow = h('div', { class: 'reading-inputs', hidden: true },
      h('span', { class: 'small muted' }, '普段とは違う読み方を登録すると、そのルビは添削で指摘しなくなります。'),
      h('div', { class: 'row' }, word, h('span', { class: 'muted' }, '《'), reading, h('span', { class: 'muted' }, '》')));
    const cur = NS.App.currentChapter && NS.App.currentChapter();
    const plantSel = chapterSelect(P(), cur ? cur.id : '', '伏線を張った話');
    const payoffSel = chapterSelect(P(), '', '回収する話');
    const fsRow = h('div', { class: 'reading-inputs', hidden: true },
      h('span', { class: 'small muted' }, '伏線は「張った話」と「回収する話」を記録しておくと、未回収のものを一覧できます。'),
      h('div', { class: 'row wrap' }, h('label', { class: 'small speak-opt' }, '張った話', plantSel), h('label', { class: 'small speak-opt' }, '回収する話', payoffSel)));
    kindSel.addEventListener('change', () => {
      const isReading = kindSel.value === '読み方';
      fsRow.hidden = kindSel.value !== '伏線';
      readingRow.hidden = !isReading;
      body.placeholder = isReading ? 'メモ（任意）：使う場面、由来など' : '思いついたことをすぐメモ（Ctrl+Enterで追加）\n例：主人公の剣は、実は亡き師匠の形見だった';
      if (isReading) word.focus();
    });
    const add = () => {
      const v = body.value.trim();
      const isReading = kindSel.value === '読み方';
      if (isReading && (!word.value.trim() || !reading.value.trim())) { (word.value.trim() ? reading : word).focus(); toast('表記と読みを入れてください'); return; }
      if (!isReading && !v) { body.focus(); return; }
      P().ideas.unshift(Object.assign({
        id: UI.uid('i'), body: v, kind: kindSel.value, tags: splitTags(tags.value), color: '', pinned: false,
        createdAt: Date.now(), updatedAt: Date.now(),
      }, isReading ? { word: word.value.trim().replace(/^[|｜]/, ''), reading: reading.value.trim() } : {},
      kindSel.value === '伏線' ? { plantedIn: plantSel.value, payoffIn: payoffSel.value, resolved: false } : {}));
      touch();
      body.value = '';
      word.value = '';
      reading.value = '';
      renderFilters();
      renderGrid();
      body.focus();
      toast('メモしました');
    };
    body.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); add(); } });
    [word, reading].forEach((el) => el.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); add(); } }));
    wrap.appendChild(h('section', { class: 'quick-add card' },
      readingRow,
      fsRow,
      body,
      h('div', { class: 'row wrap' }, kindSel, tags, btn('メモする', { icon: 'plus', primary: true, onClick: add }))));

    IS.filters = h('div', { class: 'idea-filters' });
    IS.grid = h('div', { class: 'idea-grid' });
    wrap.append(IS.filters, IS.grid);
    renderFilters();
    renderGrid();
  }

  function splitTags(s) {
    return String(s || '').split(/[、,，\s#＃]+/).map((t) => t.trim()).filter(Boolean);
  }

  function renderFilters() {
    const p = P();
    clear(IS.filters);
    const search = h('input', {
      class: 'input', type: 'search', placeholder: 'メモを検索', value: IS.q, 'aria-label': 'メモを検索',
      oninput: (e) => { IS.q = e.target.value; renderGrid(); },
    });
    const allTags = {};
    p.ideas.forEach((i) => i.tags.forEach((t) => { allTags[t] = (allTags[t] || 0) + 1; }));
    const chip = (label, active, onClick) => h('button', { type: 'button', class: 'chip' + (active ? ' active' : ''), onclick: onClick }, label);
    IS.filters.append(
      search,
      h('div', { class: 'chips' },
        chip('すべて', !IS.kind && !IS.tag && !IS.pinnedOnly && !IS.unresolved, () => { IS.kind = ''; IS.tag = ''; IS.pinnedOnly = false; IS.unresolved = false; renderFilters(); renderGrid(); }),
        chip('ピン留め', IS.pinnedOnly, () => { IS.pinnedOnly = !IS.pinnedOnly; renderFilters(); renderGrid(); }),
        unresolvedCount(p) ? chip(`未回収の伏線 ${unresolvedCount(p)}`, IS.unresolved, () => { IS.unresolved = !IS.unresolved; renderFilters(); renderGrid(); }) : null,
        KINDS.filter((k) => p.ideas.some((i) => i.kind === k)).map((k) => chip(k, IS.kind === k, () => { IS.kind = IS.kind === k ? '' : k; renderFilters(); renderGrid(); })),
        Object.keys(allTags).sort().map((t) => chip('#' + t, IS.tag === t, () => { IS.tag = IS.tag === t ? '' : t; renderFilters(); renderGrid(); }))));
  }

  function renderGrid() {
    const p = P();
    clear(IS.grid);
    const q = IS.q.trim();
    const list = p.ideas
      .filter((i) => (!q || (i.body + ' ' + (i.word || '') + ' ' + (i.reading || '')).indexOf(q) >= 0 || i.tags.some((t) => t.indexOf(q) >= 0)) && (!IS.kind || i.kind === IS.kind) && (!IS.tag || i.tags.indexOf(IS.tag) >= 0) && (!IS.pinnedOnly || i.pinned) && (!IS.unresolved || (i.kind === '伏線' && !i.resolved)))
      .sort((a, b) => (b.pinned - a.pinned) || (b.updatedAt - a.updatedAt));
    if (!list.length) {
      IS.grid.appendChild(h('div', { class: 'empty' }, p.ideas.length ? '条件に合うメモはありません' : 'まだメモがありません。思いついたことは何でも上の欄に書き留めておきましょう。'));
      return;
    }
    list.forEach((it) => IS.grid.appendChild(ideaCard(it)));
  }

  function ideaCard(it) {
    const p = P();
    const lines = it.body.split('\n');
    const more = btn('', { icon: 'more', ghost: true, small: true, title: 'その他' });
    more.addEventListener('click', (e) => {
      e.stopPropagation();
      UI.menu(more, [
        { label: '編集', icon: 'pen', onClick: () => editIdea(it) },
        { label: it.pinned ? 'ピン留めを外す' : 'ピン留め', icon: 'pin', onClick: () => { it.pinned = !it.pinned; touch(); renderGrid(); } },
        it.kind === '伏線' ? { label: it.resolved ? '未回収に戻す' : '回収済みにする', icon: 'check', onClick: () => { it.resolved = !it.resolved; it.updatedAt = Date.now(); touch(); renderFilters(); renderGrid(); } } : null,
        { label: 'プロットボードに送る', icon: 'columns', onClick: () => {
          p.plot.cards.push({ id: UI.uid('c'), columnId: p.plot.columns[0].id, title: lines[0].slice(0, 40), body: lines.slice(1).join('\n'), chapterId: '', color: it.color });
          touch();
          toast('プロットボードの「' + p.plot.columns[0].title + '」に追加しました');
        } },
        { label: '今の話のメモに追記', icon: 'pen', onClick: () => {
          const ch = NS.App.currentChapter();
          if (!ch) return;
          ch.memo = (ch.memo ? ch.memo + '\n' : '') + it.body;
          touch();
          toast(`「${ch.title}」のメモに追記しました`);
        } },
        null,
        { label: '削除', icon: 'trash', danger: true, onClick: async () => {
          if (!(await UI.confirm('このメモを削除します。', { danger: true, okLabel: '削除' }))) return;
          p.ideas.splice(p.ideas.indexOf(it), 1);
          touch();
          renderFilters();
          renderGrid();
        } },
      ]);
    });
    return h('article', {
      class: 'idea-card' + (it.pinned ? ' pinned' : ''), tabindex: 0, style: { borderTopColor: it.color || 'transparent' },
      ondblclick: () => editIdea(it),
      onkeydown: (e) => { if (e.key === 'Enter') editIdea(it); },
    },
    h('div', { class: 'idea-head' },
      h('span', { class: 'kind-badge' }, it.kind || 'アイデア'),
      it.pinned ? icon('pin', 14) : null,
      h('span', { class: 'muted small idea-date' }, UI.relTime(it.updatedAt)),
      more),
    it.word && it.reading
      ? h('div', { class: 'idea-body' }, h('div', { class: 'reading-big', html: NS.Text.rubyToHtml('|' + it.word + '《' + it.reading + '》', { vertical: false }) }), it.body ? h('p', null, it.body) : null)
      : h('div', { class: 'idea-body' }, h('strong', null, lines[0]), lines.length > 1 ? h('p', null, lines.slice(1).join('\n')) : null),
    it.kind === '伏線' ? foreshadowLine(p, it) : null,
    it.tags.length ? h('div', { class: 'idea-tags' }, it.tags.map((t) => h('span', { class: 'tag' }, '#' + t))) : null);
  }

  function editIdea(it) {
    const body = h('textarea', { class: 'input', rows: 8, value: it.body });
    const word = h('input', { class: 'input', type: 'text', value: it.word || '', placeholder: '表記' });
    const reading = h('input', { class: 'input', type: 'text', value: it.reading || '', placeholder: '読み' });
    const kindSel = h('select', { class: 'input' }, KINDS.map((k) => h('option', { value: k, selected: it.kind === k }, k)));
    const tags = h('input', { class: 'input', type: 'text', value: it.tags.join('、') });
    const p = P();
    const plantSel = chapterSelect(p, it.plantedIn || '', '伏線を張った話');
    const payoffSel = chapterSelect(p, it.payoffIn || '', '回収する話');
    const resolved = h('input', { type: 'checkbox', checked: !!it.resolved });
    const fsBox = h('div', { class: 'grid-2' }, UI.field('張った話', plantSel), UI.field('回収する話', payoffSel), h('label', { class: 'check' }, resolved, '回収済み'));
    fsBox.hidden = it.kind !== '伏線';
    kindSel.addEventListener('change', () => { fsBox.hidden = kindSel.value !== '伏線'; });
    let color = it.color || '';
    const sw = h('div', { class: 'swatches' }, [''].concat(UI.SWATCHES).map((c) => h('button', {
      type: 'button', class: 'swatch' + (color === c ? ' active' : ''), style: { background: c || 'transparent' }, 'aria-label': c || '色なし',
      onclick: (e) => { color = c; sw.querySelectorAll('.swatch').forEach((s) => s.classList.remove('active')); e.currentTarget.classList.add('active'); },
    })));
    UI.modal({
      title: 'メモを編集', wide: true,
      body: h('div', { class: 'stack' },
        it.kind === '読み方' || it.word ? h('div', { class: 'grid-2' }, UI.field('表記', word), UI.field('読み', reading)) : null,
        body, h('div', { class: 'grid-2' }, UI.field('種類', kindSel), UI.field('タグ', tags)), fsBox, UI.field('色', sw)),
      actions: [
        { label: 'キャンセル', ghost: true },
        { label: '保存', primary: true, onClick: () => {
          it.body = body.value.trim() || (it.word ? '' : it.body);
          if (it.kind === '読み方' || it.word) { it.word = word.value.trim(); it.reading = reading.value.trim(); }
          it.kind = kindSel.value;
          if (it.kind === '伏線') { it.plantedIn = plantSel.value; it.payoffIn = payoffSel.value; it.resolved = resolved.checked; }
          it.tags = splitTags(tags.value);
          it.color = color;
          it.updatedAt = Date.now();
          touch();
          renderFilters();
          renderGrid();
        } },
      ],
    });
  }

  // ───────────── プロットボード ─────────────
  const Plot = {};
  let PS = null;

  Plot.mount = function (view) {
    PS = { view };
    build2();
  };
  Plot.unmount = function () { PS = null; };

  function build2() {
    const p = P();
    clear(PS.view);
    const wrap = h('div', { class: 'plot' });
    wrap.appendChild(h('div', { class: 'plot-head' },
      h('p', { class: 'muted small' }, '場面や出来事をカードにして、起承転結（列）に並べます。カードはドラッグで移動でき、話と結びつけられます。'),
      h('div', { class: 'row' },
        btn('列を追加', { icon: 'plus', small: true, onClick: async () => {
          const t = await UI.prompt('列の名前', '', { placeholder: '例：序章、第二幕' });
          if (!t) return;
          p.plot.columns.push({ id: UI.uid('col'), title: t });
          touch();
          build2();
        } }))));
    const board = h('div', { class: 'plot-board' });
    p.plot.columns.forEach((col, ci) => board.appendChild(column(col, ci)));
    wrap.appendChild(board);
    PS.view.appendChild(wrap);
  }

  function column(col, ci) {
    const p = P();
    const cards = p.plot.cards.filter((c) => c.columnId === col.id);
    const list = h('div', { class: 'plot-cards' });
    cards.forEach((c) => list.appendChild(plotCard(c)));
    list.addEventListener('dragover', (e) => {
      e.preventDefault();
      list.classList.add('drop-target');
    });
    list.addEventListener('dragleave', (e) => { if (!list.contains(e.relatedTarget)) list.classList.remove('drop-target'); });
    list.addEventListener('drop', (e) => {
      e.preventDefault();
      list.classList.remove('drop-target');
      const id = e.dataTransfer.getData('text/plain');
      const card = p.plot.cards.find((c) => c.id === id);
      if (!card) return;
      // ドロップ位置から挿入先を決める
      const siblings = Array.from(list.querySelectorAll('.plot-card')).filter((el) => el.dataset.id !== id);
      let beforeId = null;
      for (const el of siblings) {
        const r = el.getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2) { beforeId = el.dataset.id; break; }
      }
      p.plot.cards.splice(p.plot.cards.indexOf(card), 1);
      card.columnId = col.id;
      if (beforeId) p.plot.cards.splice(p.plot.cards.findIndex((c) => c.id === beforeId), 0, card);
      else {
        const lastInCol = p.plot.cards.map((c, i) => (c.columnId === col.id ? i : -1)).filter((i) => i >= 0).pop();
        p.plot.cards.splice(lastInCol == null ? p.plot.cards.length : lastInCol + 1, 0, card);
      }
      touch();
      build2();
    });
    const more = btn('', { icon: 'more', ghost: true, small: true, title: '列の操作' });
    more.addEventListener('click', () => UI.menu(more, [
      { label: '名前を変更', icon: 'pen', onClick: async () => { const t = await UI.prompt('列の名前', col.title); if (t) { col.title = t; touch(); build2(); } } },
      { label: '左へ移動', icon: 'left', onClick: () => { if (ci > 0) { p.plot.columns.splice(ci - 1, 0, p.plot.columns.splice(ci, 1)[0]); touch(); build2(); } } },
      { label: '右へ移動', icon: 'right', onClick: () => { if (ci < p.plot.columns.length - 1) { p.plot.columns.splice(ci + 1, 0, p.plot.columns.splice(ci, 1)[0]); touch(); build2(); } } },
      null,
      { label: '列を削除', icon: 'trash', danger: true, onClick: async () => {
        if (p.plot.columns.length <= 1) { toast('最後の列は削除できません'); return; }
        if (!(await UI.confirm(`列「${col.title}」を削除します。カードは隣の列に移ります。`, { danger: true, okLabel: '削除' }))) return;
        const target = p.plot.columns[ci === 0 ? 1 : ci - 1];
        p.plot.cards.forEach((c) => { if (c.columnId === col.id) c.columnId = target.id; });
        p.plot.columns.splice(ci, 1);
        touch();
        build2();
      } },
    ]));
    return h('section', { class: 'plot-col' },
      h('div', { class: 'plot-col-head' }, h('h3', null, col.title), h('span', { class: 'count' }, cards.length), more),
      list,
      btn('カードを追加', { icon: 'plus', ghost: true, small: true, class: 'plot-add', onClick: () => {
        const c = { id: UI.uid('c'), columnId: col.id, title: '', body: '', chapterId: '', color: '' };
        p.plot.cards.push(c);
        touch();
        editCard(c, true);
      } }));
  }

  function plotCard(c) {
    const p = P();
    const chIndex = p.chapters.findIndex((x) => x.id === c.chapterId);
    const el = h('div', {
      class: 'plot-card', draggable: true, tabindex: 0, dataset: { id: c.id }, style: { borderLeftColor: c.color || 'var(--line-strong)' },
      onclick: () => editCard(c),
      onkeydown: (e) => { if (e.key === 'Enter') editCard(c); },
    },
    h('strong', null, c.title || '（無題の場面）'),
    c.body ? h('p', null, c.body) : null,
    chIndex >= 0 ? h('span', { class: 'chapter-chip' }, icon('book', 12), `第${chIndex + 1}話 ${p.chapters[chIndex].title}`) : null);
    el.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', c.id); el.classList.add('dragging'); });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    return el;
  }

  function editCard(c, isNew) {
    const p = P();
    const title = h('input', { class: 'input', type: 'text', value: c.title, placeholder: '場面・出来事の見出し' });
    const body = h('textarea', { class: 'input', rows: 6, value: c.body, placeholder: '何が起きるか、誰が登場するか、この場面の目的など' });
    const colSel = h('select', { class: 'input' }, p.plot.columns.map((col) => h('option', { value: col.id, selected: col.id === c.columnId }, col.title)));
    const chSel = h('select', { class: 'input' }, h('option', { value: '' }, '（なし）'), p.chapters.map((ch, i) => h('option', { value: ch.id, selected: ch.id === c.chapterId }, `第${i + 1}話 ${ch.title}`)));
    let color = c.color || '';
    const sw = h('div', { class: 'swatches' }, [''].concat(UI.SWATCHES).map((col) => h('button', {
      type: 'button', class: 'swatch' + (color === col ? ' active' : ''), style: { background: col || 'transparent' }, 'aria-label': col || '色なし',
      onclick: (e) => { color = col; sw.querySelectorAll('.swatch').forEach((s) => s.classList.remove('active')); e.currentTarget.classList.add('active'); },
    })));
    let saved = false;
    const save = () => {
      c.title = title.value.trim();
      c.body = body.value;
      c.columnId = colSel.value;
      c.chapterId = chSel.value;
      c.color = color;
      saved = true;
      touch();
      build2();
    };
    UI.modal({
      title: isNew ? 'カードを追加' : 'カードを編集', wide: true,
      onClose: () => { if (isNew && !saved && !c.title && !c.body) { p.plot.cards.splice(p.plot.cards.indexOf(c), 1); build2(); } },
      body: h('div', { class: 'stack' }, title, body,
        h('div', { class: 'grid-2' }, UI.field('列', colSel), UI.field('対応する話', chSel)),
        UI.field('色', sw)),
      actions: [
        { label: '削除', danger: true, ghost: true, onClick: async () => {
          if (!(await UI.confirm('このカードを削除します。', { danger: true, okLabel: '削除' }))) return false;
          p.plot.cards.splice(p.plot.cards.indexOf(c), 1);
          saved = true;
          touch();
          build2();
        } },
        { label: 'この内容で話を作る', onClick: () => {
          save();
          const ch = NS.Store.newChapter(c.title || '新しい話');
          ch.memo = c.body;
          p.chapters.push(ch);
          c.chapterId = ch.id;
          touch();
          toast('話を作成しました');
          NS.App.navigate('write', { id: ch.id });
        } },
        { label: '保存', primary: true, onClick: save },
      ],
    });
    setTimeout(() => title.focus(), 50);
  }

  NS.Views.ideas = Ideas;
  NS.Views.plot = Plot;
})(window.Tsuzuri = window.Tsuzuri || {});

</script>
<script>
// js/views/map.js
/*
 * 綴り — 空想地図エディタ（Inkarnate / Wonderdraft 風）
 * 陸・海のブラシ、起伏、地面の質感、素材（山・木・町・城…）のスタンプと散布ブラシ、消しゴム、
 * 川・道・国境などの線（クリックでもフリーハンドでも）、領域、曲線・縦書きの文字、レイヤー、
 * 複数選択、元に戻す/やり直す、設定資料（場所）との連携、高解像度の PNG 書き出し。
 */
(function (NS) {
  'use strict';
  const UI = NS.UI;
  const { h, icon, btn, clear, toast } = UI;
  const E = NS.MapEngine;
  const AS = NS.MapAssets;

  const TOOLS = [
    { id: 'select', label: '選択', icon: 'cursor', key: 'v', hint: 'クリックで選択、ドラッグで移動。何もない所をドラッグで範囲選択（Shift で追加）。Delete で削除' },
    { id: 'pan', label: '移動', icon: 'hand', key: 'h', hint: 'ドラッグで地図を動かします（スペースキー・中ボタン・2本指でも可）' },
    { id: 'land', label: '陸', icon: 'brush', key: 'b', brush: true, terrain: true, hint: 'なぞった所を陸地にします' },
    { id: 'water', label: '海・湖', icon: 'wave', key: 'n', brush: true, terrain: true, hint: 'なぞった所を海や湖にします' },
    { id: 'relief', label: '起伏', icon: 'mountain', key: 'r', brush: true, terrain: true, hint: '土地を高く・低く・なだらかにします（陰影が変わります）' },
    { id: 'ground', label: '地面', icon: 'layers', key: 'g', brush: true, hint: '森の地面・砂漠・雪原・農地などの質感を塗ります' },
    { id: 'stamp', label: '素材', icon: 'tree', key: 's', hint: 'クリックした所に素材を置きます。Q/E で回転、[ ] で大きさ' },
    { id: 'scatter', label: '散布', icon: 'sparkles', key: 'f', brush: true, hint: 'なぞった所に森や山脈をまとめて描きます' },
    { id: 'erase', label: '消す', icon: 'eraser', key: 'x', brush: true, hint: 'なぞった所の素材を消します' },
    { id: 'path', label: '道・川', icon: 'route', key: 'l', hint: 'ドラッグでフリーハンド、クリックで点を打ってダブルクリック／Enterで確定' },
    { id: 'area', label: '領域', icon: 'polygon', key: 'a', hint: 'ドラッグで囲むか、クリックで頂点を打ち、始点をクリック／Enterで確定' },
    { id: 'label', label: '文字', icon: 'text', key: 't', hint: 'クリックした所に地名などの文字を置きます' },
  ];

  const PATH_KINDS = {
    river: { label: '川', wobble: 0.55 },
    stream: { label: '小川', wobble: 0.6 },
    highway: { label: '街道', wobble: 0.12 },
    road: { label: '道', wobble: 0.18 },
    trail: { label: '小道', wobble: 0.3 },
    rail: { label: '鉄道', wobble: 0 },
    border: { label: '国境・境界', wobble: 0.2 },
    wall: { label: '城壁・長城', wobble: 0.05 },
    route: { label: '航路', wobble: 0.08 },
  };

  const FONTS = {
    serif: { label: '明朝', family: '"Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif' },
    shippori: { label: 'しっぽり明朝', family: '"Shippori Mincho", "Noto Serif JP", serif' },
    antique: { label: '古風（Zen Antique）', family: '"Zen Antique", "Noto Serif JP", serif' },
    brush: { label: '筆文字（佑字肅）', family: '"Yuji Syuku", "Noto Serif JP", serif' },
    klee: { label: '手書き（クレー）', family: '"Klee One", "Noto Sans JP", sans-serif' },
    sans: { label: 'ゴシック', family: '"Noto Sans JP", "Hiragino Sans", sans-serif' },
    dela: { label: '極太（Dela Gothic）', family: '"Dela Gothic One", "Noto Sans JP", sans-serif' },
  };

  const LABEL_STYLES = {
    region: { label: '国名', font: 'shippori', size: 30, weight: 700, spacing: 0.55, color: 'ink' },
    area: { label: '地方・領地', font: 'shippori', size: 18, weight: 600, spacing: 0.4, color: 'ink' },
    sea: { label: '海・湖', font: 'shippori', size: 20, weight: 500, spacing: 0.7, color: 'water' },
    range: { label: '山脈・森', font: 'antique', size: 15, weight: 400, spacing: 0.35, color: 'glyph' },
    river: { label: '川', font: 'serif', size: 11, weight: 500, spacing: 0.2, color: 'water' },
    city: { label: '都市', font: 'serif', size: 13, weight: 700, spacing: 0.08, color: 'ink' },
    place: { label: '小さな地名', font: 'serif', size: 10.5, weight: 500, spacing: 0.05, color: 'ink' },
    title: { label: '題字', font: 'brush', size: 40, weight: 400, spacing: 0.15, color: 'ink' },
  };
  const LABEL_COLORS = [['', '既定'], ['#3a2e24', '墨'], ['#4c7aa3', '青'], ['#8c3b2a', '赤茶'], ['#2f6b3b', '緑'], ['#6a4f9a', '紫'], ['#b8892a', '金'], ['#ffffff', '白']];
  const AREA_COLORS = ['#c8553d', '#d9a441', '#6a994e', '#3d7ea6', '#5f4b8b', '#b5838d', '#2a9d8f', '#7f5539'];

  // 道具の設定（画面を切り替えても保つ）
  const PREF = Object.assign({
    tool: 'select', brush: { size: 6, strength: 0.7 }, relief: 'raise', biome: 1,
    stamp: { a: 'castle', cat: '町・建物', s: 1, r: 0, randVar: true, randFlip: true },
    scatter: { set: 'forest', size: 22, density: 1, scale: 1 }, erase: { size: 16 },
    path: { kind: 'river', w: 1 }, area: { color: AREA_COLORS[0], opacity: 0.22 }, label: { style: 'region' },
  }, UI.lsGet('tsuzuri.mapPref', null) || {});
  function savePref() { UI.lsSet('tsuzuri.mapPref', PREF); }

  function P() { return NS.App.project; }
  const V = {};
  let M = null;

  V.mount = function (view, params) {
    const p = P();
    M = {
      view, draft: null, freehand: null, sel: [], vertex: null, drag: null, undo: [], redo: [], pointers: new Map(),
      hover: null, space: false, labelBoxes: new Map(), clipboard: null, userMoved: false,
    };
    const id = params.id || p.lastMapId;
    const map = p.maps.find((m) => m.id === id) || p.maps[0];
    if (!map) { renderEmpty(); return; }
    openMap(map);
  };

  V.unmount = function () {
    if (!M) return;
    if (M.raf) cancelAnimationFrame(M.raf);
    if (M.job) M.job.cancel = true;
    if (M.ro) M.ro.disconnect();
    if (M.onKey) { document.removeEventListener('keydown', M.onKey); document.removeEventListener('keyup', M.onKeyUp); }
    document.querySelectorAll('.popover').forEach((x) => x.remove());
    M = null;
  };

  // ───── 地図がないとき ─────
  function renderEmpty() {
    clear(M.view);
    M.view.appendChild(h('div', { class: 'map-empty' },
      h('div', { class: 'empty big' },
        icon('map', 48),
        h('h2', null, '空想地図をつくる'),
        h('p', null, '大陸や島を自動で生成し、山・森・町・城などの素材を置いたり、ブラシでまとめて描いたりして地図を仕上げます。地名は設定資料の「場所」とつなげられます。'),
        btn('新しい地図', { icon: 'plus', primary: true, onClick: () => newMapDialog() }))));
  }

  /** 新しい地図・地形の作り直し */
  function newMapDialog(regenerate) {
    const name = h('input', { class: 'input', type: 'text', value: regenerate ? M.map.name : '世界地図' });
    const preset = h('select', { class: 'input' }, Object.keys(E.PRESETS).map((k) => h('option', { value: k }, E.PRESETS[k].label)));
    const size = h('select', { class: 'input' }, [['s', '小'], ['m', '中'], ['l', '大']].map(([v, l]) => h('option', { value: v, selected: v === 'm' }, l)));
    const palette = h('select', { class: 'input' }, Object.keys(E.PALETTES).map((k) => h('option', { value: k, selected: regenerate ? M.map.style.palette === k : k === 'parchment' }, E.PALETTES[k].label)));
    const land = h('input', { type: 'range', min: 10, max: 80, value: 42, class: 'range' });
    const landOut = h('span', { class: 'muted small range-out' }, '42%');
    land.addEventListener('input', () => { landOut.textContent = land.value + '%'; });
    const seed = h('input', { class: 'input input-num', type: 'number', value: Math.floor(Math.random() * 99999) });
    const autoB = h('input', { type: 'checkbox', checked: true });
    const autoS = h('input', { type: 'checkbox', checked: true });
    const preview = h('canvas', { class: 'gen-preview', width: 300, height: 195, 'aria-label': 'プレビュー' });
    const drawPreview = () => {
      const tmp = E.newMap('p', { preset: preset.value, size: 's', seed: +seed.value || 1, land: land.value / 100, palette: palette.value, biome: autoB.checked, stamps: autoS.checked, compass: false });
      const n = tmp.gw * tmp.gh;
      const H = E.decodeHeights(tmp.height, n);
      const B = E.decodeBiomes(tmp.biome, n);
      const ctx = preview.getContext('2d');
      const res = preview.width / (tmp.gw * tmp.cell);
      const img = ctx.createImageData(preview.width, preview.height);
      E.renderTerrain(tmp, H, B, img, 0, 0, preview.width, preview.height, res);
      ctx.putImageData(img, 0, 0);
      const pk = E.PALETTES[palette.value].assets;
      tmp.stamps.forEach((st) => {
        const sp = AS.sprite(st.a, st.v, pk);
        const k = st.s * res;
        ctx.setTransform(k * (st.f ? -1 : 1), 0, 0, k, st.x * res, st.y * res);
        ctx.drawImage(sp.canvas, sp.x0, sp.y0, sp.w, sp.h);
      });
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    };
    const redraw = UI.debounce(drawPreview, 150);
    [preset, palette, land, seed, autoB, autoS].forEach((el) => { el.addEventListener('input', redraw); el.addEventListener('change', redraw); });
    UI.modal({
      title: regenerate ? '地形を作り直す' : '新しい地図', wide: true,
      body: h('div', { class: 'gen-dialog' },
        h('div', { class: 'stack' },
          regenerate ? h('p', { class: 'muted small' }, '陸地・地面と、山・木などの自然の素材を作り直します。町や城などの素材、名前を付けた素材、線、領域、文字はそのまま残ります（元に戻すこともできます）。') : UI.field('地図の名前', name),
          h('div', { class: 'grid-2' }, UI.field('地形', preset), regenerate ? UI.field('配色', palette) : UI.field('大きさ', size)),
          regenerate ? null : UI.field('配色', palette),
          UI.field('陸の割合', h('div', { class: 'row' }, land, landOut)),
          UI.field('シード（同じ数なら同じ地形）', h('div', { class: 'row' }, seed, btn('', { icon: 'dice', ghost: true, title: 'ランダム', onClick: () => { seed.value = Math.floor(Math.random() * 99999); drawPreview(); } }))),
          h('label', { class: 'check' }, autoB, '地面（森・砂漠・雪原など）を自動で塗る'),
          h('label', { class: 'check' }, autoS, '山・丘・森の素材を自動で置く')),
        h('div', { class: 'gen-preview-wrap' }, preview, h('p', { class: 'muted small' }, 'プレビュー'))),
      actions: [
        { label: 'キャンセル', ghost: true },
        { label: regenerate ? '作り直す' : '作成', primary: true, onClick: () => {
          if (regenerate) {
            pushUndo();
            const m = M.map;
            const sd = +seed.value || 1;
            M.H = E.generate(m.gw, m.gh, { preset: preset.value, seed: sd, land: land.value / 100 });
            M.B = autoB.checked ? E.autoBiome(M.H, m.gw, m.gh, sd) : new Uint8Array(m.gw * m.gh);
            m.seed = sd;
            const natural = new Set(['山・丘', '木・植物']);
            m.stamps = m.stamps.filter((st) => !(AS.BY_ID[st.a] && natural.has(AS.BY_ID[st.a].cat) && !st.name));
            if (autoS.checked) m.stamps = m.stamps.concat(E.autoStamps(m, M.H, M.B, sd)).sort((a, b) => a.y - b.y);
            m.style.palette = palette.value;
            M.sel = [];
            renderTerrainFull();
            commit(true);
            renderInspector();
            return;
          }
          const m = E.newMap(name.value.trim() || '地図', { preset: preset.value, size: size.value, seed: +seed.value || 1, land: land.value / 100, palette: palette.value, biome: autoB.checked, stamps: autoS.checked });
          P().maps.push(m);
          NS.App.touch();
          NS.App.navigate('map', { id: m.id });
        } },
      ],
    });
    setTimeout(drawPreview, 30);
  }

  // ───── 地図を開く ─────
  function openMap(map) {
    const p = P();
    p.lastMapId = map.id;
    E.migrate(map);
    M.map = map;
    const n = map.gw * map.gh;
    M.H = map.height ? E.decodeHeights(map.height, n) : E.generate(map.gw, map.gh, { preset: 'continent', seed: map.seed || 1 });
    M.B = map.biome ? E.decodeBiomes(map.biome, n) : new Uint8Array(n);
    M.W = map.gw * map.cell;
    M.Hpx = map.gh * map.cell;
    M.res = E.pickRes(M.W, M.Hpx);
    M.base = document.createElement('canvas');
    M.base.width = Math.round(M.W * M.res);
    M.base.height = Math.round(M.Hpx * M.res);
    M.baseCtx = M.base.getContext('2d');
    M.img = M.baseCtx.createImageData(M.base.width, M.base.height);
    // 陸地マスク（川を海岸で切るため）
    M.mask = document.createElement('canvas');
    M.mask.width = M.base.width;
    M.mask.height = M.base.height;
    M.maskCtx = M.mask.getContext('2d');
    M.maskImg = M.maskCtx.createImageData(M.base.width, M.base.height);
    M.baseCtx.fillStyle = '#e9e2d0';
    M.baseCtx.fillRect(0, 0, M.base.width, M.base.height);
    build();
    renderTerrainFull();
    fit();
    const focus = NS.App.pendingMapFocus;
    if (focus && focus.mapId === map.id) {
      NS.App.pendingMapFocus = null;
      const st = map.stamps.find((x) => x.id === (focus.stampId || focus.markerId));
      if (st) { M.sel = [{ k: 'stamp', id: st.id }]; centerOn(st.x, st.y, 2.5); setSheet(true); renderInspector(); }
    }
  }

  function build() {
    if (M.ro) M.ro.disconnect();
    if (M.onKey) { document.removeEventListener('keydown', M.onKey); document.removeEventListener('keyup', M.onKeyUp); }
    clear(M.view);
    const p = P();
    const mapSel = h('select', { class: 'input map-select', 'aria-label': '地図を選ぶ', onchange: (e) => {
      if (e.target.value === '__new') { e.target.value = M.map.id; newMapDialog(); return; }
      NS.App.navigate('map', { id: e.target.value });
    } }, p.maps.map((m) => h('option', { value: m.id, selected: m.id === M.map.id }, m.name)), h('option', { value: '__new' }, '＋ 新しい地図…'));

    M.undoBtn = btn('', { icon: 'undo', ghost: true, title: '元に戻す（Ctrl+Z）', onClick: undo });
    M.redoBtn = btn('', { icon: 'redo', ghost: true, title: 'やり直す（Ctrl+Shift+Z）', onClick: redo });
    const layersBtn = btn('レイヤー', { icon: 'layers', small: true, ghost: true, title: 'レイヤーの表示・ロック' });
    layersBtn.addEventListener('click', () => UI.popover(layersBtn, layersPane()));
    const top = h('div', { class: 'map-topbar' },
      mapSel,
      h('div', { class: 'toolbar-group' }, M.undoBtn, M.redoBtn),
      h('div', { class: 'toolbar-group' },
        btn('', { icon: 'minus', ghost: true, title: '縮小（-）', onClick: () => zoomBy(0.8) }),
        btn('', { icon: 'plus', ghost: true, title: '拡大（+）', onClick: () => zoomBy(1.25) }),
        btn('全体', { ghost: true, small: true, title: '全体を表示（0）', onClick: fit })),
      h('div', { class: 'toolbar-group' },
        layersBtn,
        btn('書き出し', { icon: 'image', small: true, title: '画像（PNG）として書き出す', onClick: exportDialog }),
        btn('', { icon: 'panel', ghost: true, title: 'パネルを表示/隠す', onClick: () => setSheet(!M.layout.classList.contains('sheet-open')) })));

    M.toolbar = h('div', { class: 'map-tools', role: 'toolbar', 'aria-label': '地図の道具' });
    TOOLS.forEach((t) => M.toolbar.appendChild(h('button', {
      type: 'button', class: 'map-tool' + (PREF.tool === t.id ? ' active' : ''), dataset: { tool: t.id }, title: `${t.label}（${t.key.toUpperCase()}）— ${t.hint}`,
      'aria-pressed': PREF.tool === t.id ? 'true' : 'false',
      onclick: () => setTool(t.id, true),
    }, icon(t.icon, 20), h('span', null, t.label))));

    M.canvas = h('canvas', { class: 'map-canvas', tabindex: 0, 'aria-label': '地図キャンバス', dataset: { tool: PREF.tool } });
    M.ctx = M.canvas.getContext('2d');
    M.hint = h('div', { class: 'map-hint' });
    M.draftBar = h('div', { class: 'map-draftbar', hidden: true });
    M.progress = h('div', { class: 'map-progress', hidden: true });
    M.stage = h('div', { class: 'map-stage' }, M.canvas, M.hint, M.draftBar, M.progress);
    M.inspector = h('aside', { class: 'map-inspector', 'aria-label': '地図の詳細' });
    M.layout = h('div', { class: 'map-layout' + (window.innerWidth >= 900 ? ' sheet-open' : '') }, M.toolbar, M.stage, M.inspector);
    M.view.append(top, M.layout);

    bindEvents();
    M.ro = new ResizeObserver(() => resize());
    M.ro.observe(M.stage);
    resize();
    renderInspector();
    updateHint();
    updateUndoButtons();
  }

  function setSheet(open) {
    M.layout.classList.toggle('sheet-open', !!open);
    setTimeout(resize, 0);
  }

  function setTool(id, fromUser) {
    if (M.draft) finishDraft();
    PREF.tool = id;
    savePref();
    M.toolbar.querySelectorAll('.map-tool').forEach((b) => {
      b.classList.toggle('active', b.dataset.tool === id);
      b.setAttribute('aria-pressed', b.dataset.tool === id ? 'true' : 'false');
    });
    M.canvas.dataset.tool = id;
    if (id !== 'select') { M.sel = []; M.vertex = null; }
    if (fromUser && window.innerWidth < 900 && !['select', 'pan', 'erase'].includes(id)) setSheet(true);
    renderInspector();
    updateHint();
    draw();
  }

  function updateHint() {
    const t = TOOLS.find((x) => x.id === PREF.tool);
    M.hint.textContent = t ? t.hint : '';
    clear(M.draftBar);
    M.draftBar.hidden = !M.draft;
    if (M.draft) {
      M.draftBar.append(
        h('span', { class: 'small' }, PREF.tool === 'path' ? `点 ${M.draft.length}個` : `頂点 ${M.draft.length}個`),
        btn('確定', { small: true, primary: true, icon: 'check', onClick: finishDraft }),
        btn('1点戻す', { small: true, onClick: () => { M.draft.pop(); if (!M.draft.length) M.draft = null; updateHint(); draw(); } }),
        btn('取消', { small: true, ghost: true, onClick: () => { M.draft = null; updateHint(); draw(); } }));
    }
  }

  // ───── 表示 ─────
  function resize() {
    if (!M || !M.stage) return;
    const r = M.stage.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    M.dpr = window.devicePixelRatio || 1;
    M.cw = r.width;
    M.ch = r.height;
    M.canvas.width = Math.round(M.cw * M.dpr);
    M.canvas.height = Math.round(M.ch * M.dpr);
    M.canvas.style.width = M.cw + 'px';
    M.canvas.style.height = M.ch + 'px';
    if (M.zoom == null || !M.userMoved) fit(true);
    draw();
  }

  function fit(auto) {
    if (!M.cw) return;
    const pad = M.cw < 500 ? 8 : 24;
    M.zoom = Math.min((M.cw - pad * 2) / M.W, (M.ch - pad * 2) / M.Hpx);
    M.ox = (M.cw - M.W * M.zoom) / 2;
    M.oy = (M.ch - M.Hpx * M.zoom) / 2;
    if (auto !== true) M.userMoved = false;
    draw();
  }

  function centerOn(x, y, zoom) {
    if (zoom) M.zoom = Math.max(M.zoom || 1, zoom);
    M.ox = M.cw / 2 - x * M.zoom;
    M.oy = M.ch / 2 - y * M.zoom;
    M.userMoved = true;
    draw();
  }

  function zoomBy(f, sx, sy) {
    if (sx == null) { sx = M.cw / 2; sy = M.ch / 2; }
    const z = Math.max(0.1, Math.min(16, M.zoom * f));
    const wx = (sx - M.ox) / M.zoom;
    const wy = (sy - M.oy) / M.zoom;
    M.zoom = z;
    M.ox = sx - wx * z;
    M.oy = sy - wy * z;
    M.userMoved = true;
    draw();
  }

  function toWorld(e) {
    const r = M.canvas.getBoundingClientRect();
    const sx = e.clientX - r.left;
    const sy = e.clientY - r.top;
    return { x: (sx - M.ox) / M.zoom, y: (sy - M.oy) / M.zoom, sx, sy };
  }

  // ───── 地形の描画（重いので少しずつ） ─────
  function renderTerrainFull() {
    if (M.job) M.job.cancel = true;
    const job = { y: 0, cancel: false };
    M.job = job;
    const iw = M.base.width;
    const ih = M.base.height;
    M.progress.hidden = false;
    const step = () => {
      if (job.cancel || !M) return;
      const t0 = performance.now();
      const y0 = job.y;
      while (job.y < ih && performance.now() - t0 < 14) {
        const y1 = Math.min(ih, job.y + 16);
        E.renderTerrain(M.map, M.H, M.B, M.img, 0, job.y, iw, y1, M.res, M.maskImg);
        job.y = y1;
      }
      M.baseCtx.putImageData(M.img, 0, 0, 0, y0, iw, job.y - y0);
      M.maskCtx.putImageData(M.maskImg, 0, 0, 0, y0, iw, job.y - y0);
      M.progress.textContent = `地形を描いています… ${Math.round((job.y / ih) * 100)}%`;
      draw();
      if (job.y < ih) requestAnimationFrame(step);
      else { M.progress.hidden = true; M.job = null; }
    };
    requestAnimationFrame(step);
  }

  function terrainRect(wx0, wy0, wx1, wy1) {
    const r = M.res;
    const x0 = Math.max(0, Math.floor(wx0 * r));
    const y0 = Math.max(0, Math.floor(wy0 * r));
    const x1 = Math.min(M.base.width, Math.ceil(wx1 * r));
    const y1 = Math.min(M.base.height, Math.ceil(wy1 * r));
    if (x1 <= x0 || y1 <= y0) return;
    E.renderTerrain(M.map, M.H, M.B, M.img, x0, y0, x1, y1, r, M.maskImg);
    M.baseCtx.putImageData(M.img, 0, 0, x0, y0, x1 - x0, y1 - y0);
    M.maskCtx.putImageData(M.maskImg, 0, 0, x0, y0, x1 - x0, y1 - y0);
  }

  function applyBrush(wx, wy) {
    const m = M.map;
    const tool = PREF.tool;
    if (tool === 'scatter') { scatterAt(wx, wy); return; }
    if (tool === 'erase') { eraseAt(wx, wy); return; }
    const cx = wx / m.cell - 0.5;
    const cy = wy / m.cell - 0.5;
    const r = PREF.brush.size;
    const st = PREF.brush.strength;
    const x0 = Math.max(0, Math.floor(cx - r));
    const x1 = Math.min(m.gw - 1, Math.ceil(cx + r));
    const y0 = Math.max(0, Math.floor(cy - r));
    const y1 = Math.min(m.gh - 1, Math.ceil(cy + r));
    const H = M.H;
    const B = M.B;
    const gw = m.gw;
    const src = tool === 'relief' && PREF.relief === 'smooth' ? H.slice() : null;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const d = Math.hypot(x - cx, y - cy) / r;
        if (d > 1) continue;
        // 中心はしっかり、縁はやわらかく
        const w = (d < 0.6 ? 1 : 1 - (d - 0.6) / 0.4) * st;
        const i = y * gw + x;
        const n = E.hash2(x, y, 77) - 0.5;
        if (tool === 'land') {
          const target = 0.1 + n * 0.05;
          if (H[i] < target) H[i] += (target - H[i]) * Math.min(1, w * 1.2);
        } else if (tool === 'water') {
          const target = -0.28 + n * 0.05;
          if (H[i] > target) H[i] += (target - H[i]) * Math.min(1, w * 1.2);
        } else if (tool === 'relief') {
          if (PREF.relief === 'raise') { if (H[i] > 0) H[i] = Math.min(1, H[i] + w * (0.08 + n * 0.05)); }
          else if (PREF.relief === 'lower') { if (H[i] > 0.02) H[i] = Math.max(0.02, H[i] - w * 0.08); }
          else {
            let s = 0;
            let c = 0;
            for (let yy = -1; yy <= 1; yy++) for (let xx = -1; xx <= 1; xx++) {
              const X = x + xx;
              const Y = y + yy;
              if (X < 0 || Y < 0 || X >= gw || Y >= m.gh) continue;
              s += src[Y * gw + X]; c++;
            }
            H[i] += (s / c - H[i]) * Math.min(1, w);
          }
        } else if (tool === 'ground') {
          if (w > 0.15 || d < 0.85) B[i] = PREF.biome;
        }
      }
    }
    const pad = 3 * m.cell + 2;
    terrainRect(x0 * m.cell - pad, y0 * m.cell - pad, (x1 + 1) * m.cell + pad, (y1 + 1) * m.cell + pad);
    draw();
  }

  // ───── 素材の散布・消しゴム ─────
  function buildHash(cellSize) {
    const grid = new Map();
    const key = (x, y) => Math.floor(x / cellSize) + ',' + Math.floor(y / cellSize);
    M.map.stamps.forEach((st) => {
      const k = key(st.x, st.y);
      if (!grid.has(k)) grid.set(k, []);
      grid.get(k).push(st);
    });
    return { grid, cellSize, add(st) { const k = key(st.x, st.y); if (!grid.has(k)) grid.set(k, []); grid.get(k).push(st); } };
  }

  function nearAny(hash, x, y, r) {
    const cs = hash.cellSize;
    const ix = Math.floor(x / cs);
    const iy = Math.floor(y / cs);
    const n = Math.ceil(r / cs) + 1;
    for (let dy = -n; dy <= n; dy++) {
      for (let dx = -n; dx <= n; dx++) {
        const list = hash.grid.get((ix + dx) + ',' + (iy + dy));
        if (!list) continue;
        for (const st of list) {
          const a = AS.BY_ID[st.a];
          const rr = Math.max(r * 0.55, a ? a.size * 0.32 * st.s : 4);
          if (Math.abs(st.x - x) < rr && Math.abs(st.y - y) < rr * 0.7) return true;
        }
      }
    }
    return false;
  }

  function scatterAt(wx, wy) {
    const set = AS.SCATTER.find((s) => s.id === PREF.scatter.set) || AS.SCATTER[0];
    const R = PREF.scatter.size;
    const spacing = set.spacing / PREF.scatter.density * PREF.scatter.scale;
    if (!M.drag.hash) M.drag.hash = buildHash(Math.max(4, spacing));
    const tries = Math.max(2, Math.round((Math.PI * R * R) / (spacing * spacing) * 0.35));
    const m = M.map;
    let added = 0;
    for (let k = 0; k < tries; k++) {
      const a = Math.random() * Math.PI * 2;
      const rr = Math.sqrt(Math.random()) * R;
      const x = wx + Math.cos(a) * rr;
      const y = wy + Math.sin(a) * rr * 0.85;
      if (x < 2 || y < 2 || x > M.W - 2 || y > M.Hpx - 2) continue;
      const hh = E.sampleH(M.H, m.gw, m.gh, m.cell, x, y);
      if (set.land && hh <= 0.01) continue;
      if (set.water && hh > -0.02) continue;
      if (nearAny(M.drag.hash, x, y, spacing)) continue;
      const aid = set.assets[Math.floor(Math.random() * set.assets.length)];
      const st = { id: E.sid(), a: aid, x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, s: Math.round(PREF.scatter.scale * (0.85 + Math.random() * 0.3) * 100) / 100, r: 0, f: Math.random() < 0.5, v: Math.floor(Math.random() * 8) };
      m.stamps.push(st);
      M.drag.hash.add(st);
      added++;
    }
    if (added) { M.drag.changed = true; sortStamps(); draw(); }
  }

  function eraseAt(wx, wy) {
    if (layerLocked('stamps')) return;
    const R = PREF.erase.size;
    const before = M.map.stamps.length;
    M.map.stamps = M.map.stamps.filter((st) => Math.hypot(st.x - wx, (st.y - wy) * 1.1) > R);
    if (M.map.stamps.length !== before) { M.drag.changed = true; draw(); }
  }

  function sortStamps() { M.map.stamps.sort((a, b) => a.y - b.y); }

  // ───── 元に戻す ─────
  function snapshot() {
    const m = M.map;
    return { H: M.H.slice(), B: M.B.slice(), v: JSON.stringify({ stamps: m.stamps, lines: m.lines, areas: m.areas, labels: m.labels, style: m.style, layers: m.layers, seed: m.seed, name: m.name }) };
  }
  function restore(s) {
    const m = M.map;
    const terrainChanged = !sameArr(M.H, s.H) || !sameArr(M.B, s.B);
    const look = (st) => st.palette + st.hillshade + st.ripples;
    const before = look(m.style);
    M.H = s.H.slice();
    M.B = s.B.slice();
    Object.assign(m, JSON.parse(s.v));
    M.sel = [];
    M.vertex = null;
    if (terrainChanged || before !== look(m.style)) renderTerrainFull();
    commit(terrainChanged);
    renderInspector();
    draw();
  }
  function sameArr(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }
  function pushUndo(snap) {
    M.undo.push(snap || snapshot());
    if (M.undo.length > 40) M.undo.shift();
    M.redo = [];
    updateUndoButtons();
  }
  function undo() {
    if (!M.undo.length) return;
    M.redo.push(snapshot());
    restore(M.undo.pop());
    updateUndoButtons();
  }
  function redo() {
    if (!M.redo.length) return;
    M.undo.push(snapshot());
    restore(M.redo.pop());
    updateUndoButtons();
  }
  function updateUndoButtons() {
    if (M.undoBtn) M.undoBtn.disabled = !M.undo.length;
    if (M.redoBtn) M.redoBtn.disabled = !M.redo.length;
  }

  function commit(terrain) {
    const m = M.map;
    if (terrain) {
      m.height = E.encodeHeights(M.H);
      m.biome = E.encodeBiomes(M.B);
    }
    m.updatedAt = Date.now();
    NS.App.touch();
  }

  // ───── レイヤー ─────
  const LAYERS = [['terrain', '地形'], ['areas', '領域'], ['paths', '道・川'], ['stamps', '素材'], ['labels', '文字'], ['deco', '枠・縮尺・題名・マス目']];
  function layerHidden(k) { return !!(M.map.layers[k] && M.map.layers[k].hidden); }
  function layerLocked(k) { return !!(M.map.layers[k] && (M.map.layers[k].locked || M.map.layers[k].hidden)); }
  function layersPane() {
    const box = h('div', { class: 'layers-pane' }, h('div', { class: 'small muted' }, 'レイヤー（目＝表示、鍵＝ロック）'));
    LAYERS.forEach(([k, label]) => {
      const L = M.map.layers[k] = M.map.layers[k] || {};
      const row = h('div', { class: 'layer-row' + (L.hidden ? ' off' : '') }, h('span', null, label));
      const eye = btn('', { icon: L.hidden ? 'eyeoff' : 'eye', ghost: true, small: true, title: L.hidden ? '表示する' : '隠す' });
      const lock = btn('', { icon: L.locked ? 'lock' : 'unlock', ghost: true, small: true, title: L.locked ? 'ロックを外す' : 'ロック（選択・編集できなくする）' });
      eye.addEventListener('click', () => { L.hidden = !L.hidden; commit(); draw(); clear(eye).appendChild(icon(L.hidden ? 'eyeoff' : 'eye', 18)); row.classList.toggle('off', !!L.hidden); });
      lock.addEventListener('click', () => { L.locked = !L.locked; commit(); clear(lock).appendChild(icon(L.locked ? 'lock' : 'unlock', 18)); });
      row.append(k === 'terrain' || k === 'deco' ? h('span') : lock, eye);
      box.appendChild(row);
    });
    return box;
  }

  // ───── 入力 ─────
  function bindEvents() {
    const c = M.canvas;
    c.addEventListener('pointerdown', onDown);
    c.addEventListener('pointermove', onMove);
    c.addEventListener('pointerup', onUp);
    c.addEventListener('pointercancel', onUp);
    c.addEventListener('pointerleave', () => { M.hover = null; draw(); });
    c.addEventListener('contextmenu', (e) => e.preventDefault());
    c.addEventListener('dblclick', (e) => { if (M.draft) { e.preventDefault(); finishDraft(); } });
    c.addEventListener('wheel', (e) => {
      e.preventDefault();
      const w = toWorld(e);
      if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) >= Math.abs(e.deltaX)) {
        zoomBy(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), w.sx, w.sy);
      } else {
        M.ox -= e.deltaX;
        M.userMoved = true;
        draw();
      }
    }, { passive: false });
    M.onKey = onKey;
    M.onKeyUp = (e) => { if (e.key === ' ' && M) { M.space = false; if (M.canvas) M.canvas.classList.remove('panning'); } };
    document.addEventListener('keydown', M.onKey);
    document.addEventListener('keyup', M.onKeyUp);
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function onKey(e) {
    if (!M || !M.map) return;
    const tag = (e.target && e.target.tagName) || '';
    const typing = /INPUT|TEXTAREA|SELECT/.test(tag) || (e.target && e.target.isContentEditable);
    const mod = e.ctrlKey || e.metaKey;
    if (document.querySelector('.modal-overlay')) return;
    if (mod && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if (mod && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); return; }
    if (typing) return;
    if (mod && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSel(); return; }
    if (mod && e.key.toLowerCase() === 'c') { copySel(); return; }
    if (mod && e.key.toLowerCase() === 'v') { pasteSel(); return; }
    if (mod && e.key.toLowerCase() === 'a') { e.preventDefault(); M.sel = M.map.stamps.map((s) => ({ k: 'stamp', id: s.id })); renderInspector(); draw(); return; }
    if (e.key === ' ') { M.space = true; M.canvas.classList.add('panning'); e.preventDefault(); return; }
    if (e.key === 'Escape') {
      if (M.draft) { M.draft = null; updateHint(); draw(); } else { M.sel = []; M.vertex = null; renderInspector(); draw(); }
      return;
    }
    if (e.key === 'Enter' && M.draft) { finishDraft(); return; }
    if (e.key === 'Backspace' || e.key === 'Delete') {
      if (M.draft) { M.draft.pop(); if (!M.draft.length) M.draft = null; updateHint(); draw(); e.preventDefault(); return; }
      if (M.sel.length) { deleteSelection(); e.preventDefault(); return; }
    }
    if (e.key.startsWith('Arrow') && M.sel.length) {
      e.preventDefault();
      const d = e.shiftKey ? 10 : 1;
      const dx = e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0;
      const dy = e.key === 'ArrowUp' ? -d : e.key === 'ArrowDown' ? d : 0;
      pushUndo();
      moveSel(dx, dy);
      commit();
      draw();
      return;
    }
    if (e.key === '+' || e.key === '=') { zoomBy(1.25); return; }
    if (e.key === '-') { zoomBy(0.8); return; }
    if (e.key === '0') { fit(); return; }
    if (e.key === 'q' || e.key === 'e') {
      const da = e.key === 'q' ? -15 : 15;
      if (PREF.tool === 'stamp') { PREF.stamp.r = ((PREF.stamp.r + da) % 360 + 360) % 360; savePref(); renderInspector(); draw(); return; }
      const items = selObjs().filter((o) => o.k === 'stamp' || o.k === 'label');
      if (items.length) {
        pushUndo();
        items.forEach((o) => { if (o.k === 'stamp') o.obj.r = (((o.obj.r || 0) + da) % 360 + 360) % 360; else o.obj.rotation = clamp((o.obj.rotation || 0) + da, -90, 90); });
        commit();
        renderInspector();
        draw();
      }
      return;
    }
    if (e.key === '[' || e.key === ']') {
      const f = e.key === '[' ? 1 / 1.15 : 1.15;
      if (PREF.tool === 'stamp') PREF.stamp.s = clamp(PREF.stamp.s * f, 0.2, 6);
      else if (PREF.tool === 'scatter') PREF.scatter.size = clamp(PREF.scatter.size * f, 4, 200);
      else if (PREF.tool === 'erase') PREF.erase.size = clamp(PREF.erase.size * f, 3, 200);
      else PREF.brush.size = clamp(Math.round(PREF.brush.size * f) || 1, 1, 40);
      savePref();
      renderInspector();
      draw();
      return;
    }
    if (!mod && !e.altKey) {
      const t = TOOLS.find((x) => x.key === e.key.toLowerCase());
      if (t) setTool(t.id);
    }
  }

  function onDown(e) {
    M.canvas.focus({ preventScroll: true });
    try { M.canvas.setPointerCapture(e.pointerId); } catch (err) { /* 無視 */ }
    const w = toWorld(e);
    M.pointers.set(e.pointerId, { sx: w.sx, sy: w.sy });
    if (M.pointers.size === 2) {
      const [a, b] = Array.from(M.pointers.values());
      M.pinch = { d: Math.hypot(a.sx - b.sx, a.sy - b.sy) || 1, cx: (a.sx + b.sx) / 2, cy: (a.sy + b.sy) / 2, zoom: M.zoom, ox: M.ox, oy: M.oy };
      if (M.drag && M.drag.kind === 'stroke') endStroke();
      M.drag = null;
      M.freehand = null;
      return;
    }
    if (M.pointers.size > 2) return;
    const tool = PREF.tool;
    if (e.button === 1 || e.button === 2 || tool === 'pan' || M.space) {
      M.drag = { kind: 'pan', sx: w.sx, sy: w.sy, ox: M.ox, oy: M.oy };
      return;
    }
    const def = TOOLS.find((t) => t.id === tool);
    if (def && def.brush) {
      if ((def.terrain || tool === 'ground') && layerLocked('terrain')) { toast('地形レイヤーが隠れているか、ロックされています'); return; }
      if ((tool === 'scatter' || tool === 'erase') && layerLocked('stamps')) { toast('素材レイヤーが隠れているか、ロックされています'); return; }
      M.drag = { kind: 'stroke', last: w, snap: snapshot(), changed: false };
      applyBrush(w.x, w.y);
      if (def.terrain || tool === 'ground') M.drag.changed = true;
      return;
    }
    if (tool === 'stamp') {
      if (layerLocked('stamps')) { toast('素材レイヤーが隠れているか、ロックされています'); return; }
      pushUndo();
      const a = AS.BY_ID[PREF.stamp.a] || AS.ASSETS[0];
      const st = {
        id: E.sid(), a: a.id, x: round1(w.x), y: round1(w.y), s: PREF.stamp.s, r: PREF.stamp.r,
        f: PREF.stamp.randFlip && !a.anchor && a.cat !== '地図記号' ? Math.random() < 0.5 : false,
        v: PREF.stamp.randVar ? Math.floor(Math.random() * a.variants) : 0,
      };
      M.map.stamps.push(st);
      sortStamps();
      commit();
      draw();
      return;
    }
    if (tool === 'path' || tool === 'area') {
      if (layerLocked(tool === 'path' ? 'paths' : 'areas')) { toast('レイヤーが隠れているか、ロックされています'); return; }
      if (M.draft) {
        if (tool === 'area' && M.draft.length >= 3) {
          const f = M.draft[0];
          if (Math.hypot(f[0] - w.x, f[1] - w.y) * M.zoom < 12) { finishDraft(); return; }
        }
        M.draft.push([round1(w.x), round1(w.y)]);
        updateHint();
        draw();
        return;
      }
      M.freehand = { start: w, pts: [[round1(w.x), round1(w.y)]], active: false };
      M.drag = { kind: 'freehand' };
      return;
    }
    if (tool === 'label') {
      if (layerLocked('labels')) { toast('文字レイヤーが隠れているか、ロックされています'); return; }
      pushUndo();
      const st = LABEL_STYLES[PREF.label.style] || LABEL_STYLES.region;
      const lb = { id: UI.uid('lb'), x: round1(w.x), y: round1(w.y), text: PREF.label.style === 'title' ? M.map.name : '地名', style: PREF.label.style, size: st.size, rotation: 0, vertical: false, curve: 0 };
      M.map.labels.push(lb);
      setTool('select');
      M.sel = [{ k: 'label', id: lb.id }];
      commit();
      setSheet(true);
      renderInspector(true);
      draw();
      return;
    }
    // 選択
    const hit = hitTest(w.x, w.y);
    if (hit) {
      const already = M.sel.some((s) => s.k === hit.k && s.id === hit.id);
      if (e.shiftKey) {
        if (already) M.sel = M.sel.filter((s) => !(s.k === hit.k && s.id === hit.id));
        else M.sel.push({ k: hit.k, id: hit.id });
      } else if (!already || hit.vertex != null) {
        M.sel = [{ k: hit.k, id: hit.id }];
      }
      M.vertex = hit.vertex != null ? hit.vertex : null;
      M.drag = { kind: 'move', start: w, moved: false, orig: selObjs().map((o) => ({ k: o.k, id: o.id, data: JSON.parse(JSON.stringify(o.obj)) })) };
      if (window.innerWidth < 900) setSheet(true);
    } else if (e.pointerType === 'touch') {
      M.drag = { kind: 'pan', sx: w.sx, sy: w.sy, ox: M.ox, oy: M.oy, clearSel: !e.shiftKey };
    } else {
      if (!e.shiftKey) { M.sel = []; M.vertex = null; }
      M.drag = { kind: 'box', start: w, end: w };
    }
    renderInspector();
    draw();
  }

  function onMove(e) {
    const w = toWorld(e);
    if (M.pointers.has(e.pointerId)) M.pointers.set(e.pointerId, { sx: w.sx, sy: w.sy });
    if (M.pinch && M.pointers.size === 2) {
      const [a, b] = Array.from(M.pointers.values());
      const d = Math.hypot(a.sx - b.sx, a.sy - b.sy);
      const cx = (a.sx + b.sx) / 2;
      const cy = (a.sy + b.sy) / 2;
      const z = clamp(M.pinch.zoom * d / M.pinch.d, 0.1, 16);
      const wx = (M.pinch.cx - M.pinch.ox) / M.pinch.zoom;
      const wy = (M.pinch.cy - M.pinch.oy) / M.pinch.zoom;
      M.zoom = z;
      M.ox = cx - wx * z;
      M.oy = cy - wy * z;
      M.userMoved = true;
      draw();
      return;
    }
    M.hover = w;
    const d = M.drag;
    if (!d) { if (M.draft || ['stamp', 'scatter', 'erase', 'land', 'water', 'relief', 'ground'].includes(PREF.tool)) draw(); return; }
    if (d.kind === 'pan') {
      if (Math.hypot(w.sx - d.sx, w.sy - d.sy) > 4) d.moved = true;
      M.ox = d.ox + (w.sx - d.sx);
      M.oy = d.oy + (w.sy - d.sy);
      M.userMoved = true;
      draw();
    } else if (d.kind === 'stroke') {
      const dist = Math.hypot(w.x - d.last.x, w.y - d.last.y);
      const radius = PREF.tool === 'scatter' ? PREF.scatter.size : PREF.tool === 'erase' ? PREF.erase.size : PREF.brush.size * M.map.cell;
      const step = Math.max(1, radius * 0.35);
      if (dist >= step) {
        const n = Math.floor(dist / step);
        for (let i = 1; i <= n; i++) {
          const t = i / n;
          applyBrush(d.last.x + (w.x - d.last.x) * t, d.last.y + (w.y - d.last.y) * t);
        }
        d.last = w;
      } else {
        draw();
      }
    } else if (d.kind === 'freehand') {
      const f = M.freehand;
