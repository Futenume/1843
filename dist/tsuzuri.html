<script>
// js/publish.js
/*
 * 綴り — 投稿サイト用の書き出し
 * ルビ・傍点の記法を、各サイトの書き方に変換する。
 *   なろう：|漢字《かんじ》（傍点は「・」のルビで代用。漢字（かな）の意図しないルビ化を防ぐ）
 *   カクヨム：|漢字《かんじ》・《《傍点》》（そのまま）
 *   pixiv：[[rb:漢字 > かんじ]]・[chapter:題]・[newpage]
 *   （）書き・ルビなし
 * ブラウザでも Node でも動く純粋関数のみ。
 */
(function (NS) {
  'use strict';

  const KANJI = '一-鿿㐀-䶿々〆ヵヶ';
  // 傍点 → |ルビ → 漢字《ルビ》 の順に見る（textstats.js の記法と同じ）
  const RE_TOKEN = new RegExp('《《([^《》\\n]*)》》|[|｜]([^|｜《》\\n]{1,20})《([^《》\\n]{1,30})》|([' + KANJI + ']+)《([^《》\\n]{1,30})》', 'g');

  const FORMATS = {
    narou: { label: '小説家になろう', note: 'ルビは |漢字《かんじ》、傍点はルビの「・」で代用します。「漢字（かな）」が勝手にルビになるのを防ぎます。' },
    kakuyomu: { label: 'カクヨム', note: 'ルビ |漢字《かんじ》 と傍点 《《傍点》》 をそのまま使えます。' },
    pixiv: { label: 'pixiv', note: 'ルビは [[rb:漢字 > かんじ]]、話の題は [chapter:題]、話の区切りは [newpage] にします。傍点はルビの「・」で代用します。' },
    paren: { label: 'ルビを（）書き', note: '漢字（かんじ）の形にします。傍点の記号は外します。メールや、ルビが使えない場所向け。' },
    plain: { label: 'ルビなし', note: 'ルビと傍点の記号を外した本文だけにします。' },
  };

  /** 1行をテキスト・ルビ・傍点に分ける */
  function tokenize(line) {
    const out = [];
    let last = 0;
    RE_TOKEN.lastIndex = 0;
    let m;
    while ((m = RE_TOKEN.exec(line)) !== null) {
      if (m.index > last) out.push({ type: 'text', text: line.slice(last, m.index) });
      if (m[1] != null) out.push({ type: 'em', text: m[1] });
      else if (m[2] != null) out.push({ type: 'ruby', base: m[2], reading: m[3] });
      else out.push({ type: 'ruby', base: m[4], reading: m[5] });
      last = m.index + m[0].length;
    }
    if (last < line.length) out.push({ type: 'text', text: line.slice(last) });
    return out;
  }

  const isBlankChar = (c) => c === ' ' || c === '　' || c === '\t';
  const eachChar = (s, fn) => Array.from(s).map((c) => (isBlankChar(c) ? c : fn(c))).join('');

  // なろうは「漢字（かな）」「漢字(かな)」を自動でルビにするので、意図しない場合は「|」で止める
  const RE_NAROU_PAREN = new RegExp('([' + KANJI + '])([（(])([ぁ-ゖァ-ヺー・]{1,10})([）)])', 'g');

  function renderLine(line, format, st) {
    const toks = tokenize(line);
    return toks.map((t) => {
      if (t.type === 'text') {
        if (format === 'narou') {
          return t.text.replace(RE_NAROU_PAREN, (all, k, open, kana, close) => { st.parenGuard++; return k + '|' + open + kana + close; });
        }
        return t.text;
      }
      if (t.type === 'ruby') {
        if (format === 'narou') {
          if (Array.from(t.base).length > 10 || Array.from(t.reading).length > 10) st.longRuby.push(t.base + '《' + t.reading + '》');
          return '|' + t.base + '《' + t.reading + '》';
        }
        if (format === 'kakuyomu') return '|' + t.base + '《' + t.reading + '》';
        if (format === 'pixiv') return '[[rb:' + t.base + ' > ' + t.reading + ']]';
        if (format === 'paren') return t.base + '（' + t.reading + '）';
        return t.base;
      }
      // 傍点
      st.emphasis++;
      if (format === 'kakuyomu') return '《《' + t.text + '》》';
      if (format === 'narou') return eachChar(t.text, (c) => '|' + c + '《・》');
      if (format === 'pixiv') return eachChar(t.text, (c) => '[[rb:' + c + ' > ・]]');
      return t.text;
    }).join('');
  }

  const OPENERS = '「『（(【〈《〔［“‘';

  function applyLineOptions(line, opts) {
    let s = line;
    if (opts.fullwidthMarks) {
      s = s.replace(/!/g, '！').replace(/\?/g, '？');
    }
    if (opts.indent === 'remove') s = s.replace(/^[ 　\t]+/, '');
    else if (opts.indent === 'add') {
      const body = s.replace(/^[ 　\t]+/, '');
      if (body && OPENERS.indexOf(body[0]) < 0) s = '　' + body;
      else s = body;
    }
    return s;
  }

  /**
   * 本文を変換する。
   * opts: { indent:'keep'|'add'|'remove', blankLines:bool, fullwidthMarks:bool }
   * 戻り値：{ text, stats:{ parenGuard, emphasis, longRuby:[] } }
   */
  function convert(text, format, opts, st) {
    opts = opts || {};
    st = st || { parenGuard: 0, emphasis: 0, longRuby: [] };
    const fmt = FORMATS[format] ? format : 'plain';
    const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n').map((ln) => applyLineOptions(renderLine(ln, fmt, st), opts));
    let out;
    if (opts.blankLines) {
      // 段落と段落の間に空行（もともとの空行は1つにまとめる）
      out = [];
      lines.forEach((ln) => {
        if (!ln.trim()) { if (out.length && out[out.length - 1] !== '') out.push(''); return; }
        if (out.length && out[out.length - 1] !== '') out.push('');
        out.push(ln);
      });
      while (out.length && out[out.length - 1] === '') out.pop();
      out = out.join('\n');
    } else {
      out = lines.join('\n');
    }
    return { text: out, stats: st };
  }

  /** 複数の話をまとめて変換する */
  function convertChapters(chapters, format, opts) {
    opts = opts || {};
    const st = { parenGuard: 0, emphasis: 0, longRuby: [] };
    const parts = chapters.map((c) => {
      const body = convert(c.body || '', format, opts, st).text;
      if (!opts.includeTitle) return body;
      if (format === 'pixiv') return '[chapter:' + (c.title || '') + ']\n' + body;
      return (c.title || '') + '\n\n' + body;
    });
    const sep = format === 'pixiv' ? '\n[newpage]\n' : '\n\n\n';
    return { text: parts.join(sep), stats: st };
  }

  /** 変換後の文字数（記法を除いた、読者に見える文字数の目安） */
  function visibleLength(text, format) {
    let s = String(text || '');
    if (format === 'pixiv') s = s.replace(/\[\[rb:([^>\]]*?) > [^\]]*\]\]/g, '$1').replace(/\[chapter:[^\]]*\]|\[newpage\]/g, '');
    else if (format === 'narou' || format === 'kakuyomu') s = s.replace(/[|｜]([^|｜《》\n]+)《[^《》\n]*》/g, '$1').replace(/《《([^《》\n]*)》》/g, '$1');
    return Array.from(s.replace(/[\s　]/g, '')).length;
  }

  NS.Publish = { FORMATS, tokenize, convert, convertChapters, visibleLength };
})(typeof globalThis !== 'undefined' ? (globalThis.Tsuzuri = globalThis.Tsuzuri || {}) : (window.Tsuzuri = window.Tsuzuri || {}));

</script>

    ['挙式を挙げ', '式を挙げ', ''],
    ['思いがけないハプニング', 'ハプニング', ''],
    ['(?:あらかじめ|予め)予(約|定)', '予$1', ''],
    ['食事を食べ', '食事をと', ''],
    ['一応念のため', '念のため', ''],
    ['尽力を尽く', '尽力し', ''],
    ['学校に登校', '登校', ''],
    ['家に帰宅', '帰宅', ''],
    ['車に乗車', '乗車', ''],
    ['席に着席', '着席', ''],
    ['後ろ(?:に|へ)後退', '後退', ''],
    ['前(?:に|へ)前進', '前進', ''],
    ['まだ未(定|熟|完|知|解決)', '未$1', ''],
    ['すべてを網羅', '網羅', ''],
    ['過信しすぎ', '過信し', ''],
    ['約[0-9０-９一二三四五六七八九十百千万]+[^\\s、。」]{0,3}?(?:ほど|程|くらい|ぐらい)', null, '「約」と「ほど／くらい」が重なっています'],
    ['もう一度再', null, '「もう一度」と「再」が重なっています'],
    ['新年明けまして', '明けまして', ''],
    ['お体(?:を)?ご自愛', 'ご自愛', '「ご自愛」に体をいたわる意味が含まれます'],
  ];

  function compileDict(dict) {
    return dict.map(([src, rep, msg]) => ({ re: new RegExp(src, 'g'), rep, msg }));
  }
  const TYPO = compileDict(TYPO_DICT);
  const MISUSE = compileDict(MISUSE_DICT);
  const REDUNDANT = compileDict(REDUNDANT_DICT);

  // ら抜き言葉：一段動詞・カ変の語幹
  const RANUKI_STEMS = [
    '見', '来', '着', '寝', '出',
    '食べ', '起き', '考え', '決め', '覚え', '信じ', '感じ', '投げ', '逃げ', '止め', '辞め', '借り', '生き',
    '降り', '落ち', '浴び', '答え', '教え', '変え', '調べ', '比べ', '集め', '始め', '受け', '続け', '助け',
    '避け', '開け', '付け', '着替え', '耐え', '超え', '越え', '燃え', '見せ', '任せ', '乗せ', '伸び', '用い',
    '認め', '求め', '眺め', '勤め', '努め', '諦め', '確かめ', '閉じ', '演じ', '応じ', '過ぎ', '見つけ',
    '片付け', '出かけ', '出掛け',
  ];
  const RE_RANUKI = new RegExp(
    '(' + RANUKI_STEMS.slice().sort((a, b) => b.length - a.length).join('|') + ')れ(?=(?:る|ない|なく|なかっ|ます|ません|まし|た|て|そう|ず))',
    'g'
  );
  // ひらがな表記（誤検出を避けるため活用形を絞る）
  const RE_RANUKI_KANA = /(こ|(?<![まするさ])み|たべ|おき)れ(?=(?:る|ない|なく|なかっ|ます|ません|まし))/g;

  const RE_INUKI = /((?:[しっいきちびみりえけげせぜてべめれじ]|見|着|寝|出|来|居)(て)|[んい](で))(る|た(?!ま)|ます|ません|まし|ない|なかっ|なく)/g;

  // 表記ゆれグループ（先頭が推奨表記。同数のときは先頭に寄せる）
  const HYOUKI_GROUPS = [
    ['できる', [['でき', '(?<![ぁ-んァ-ヶ一-龠])でき(?=[るたなまずれ])|(?<=[がはもをに])でき(?=[るたなまずれ])'], ['出来', '出来(?=[るたなまずれ])']]],
    ['こと', [['こと', '(?<=[ぁ-ん])こと(?=[がをはにもだでな。、])'], ['事', '(?<=[ぁ-ん])事(?=[がをはにもだでな。、])']]],
    ['とき', [['とき', '(?<=[のたるい])とき(?=[、にはのも])'], ['時', '(?<=[のたるい])時(?=[、にはのも])']]],
    ['ため', [['ため', '(?<=[のるたい])ため(?=[にのだ、])'], ['為', '(?<=[のるたい])為(?=[にのだ、])']]],
    ['ように', [['よう', '(?<=[のるたいな])よう(?=[にな])'], ['様', '(?<=[のるたいな])様(?=[にな])']]],
    ['すべて', [['すべて', 'すべて'], ['全て', '全て']]],
    ['ほとんど', [['ほとんど', 'ほとんど'], ['殆ど', '殆ど']]],
    ['たくさん', [['たくさん', 'たくさん'], ['沢山', '沢山']]],
    ['いっしょ', [['一緒', '一緒'], ['いっしょ', 'いっしょ']]],
    ['きれい', [['きれい', 'きれい'], ['綺麗', '綺麗'], ['奇麗', '奇麗']]],
    ['わかる', [['わか', 'わか(?=[るりらっ])'], ['分か', '分か(?=[るりらっ])'], ['解', '解(?=[るりらっ])'], ['判', '判(?=[るりらっ])']]],
    ['ください', [['くださ', 'くださ(?=[いる])'], ['下さ', '下さ(?=[いる])']]],
    ['いただく', [['いただ', 'いただ(?=[くきけかい])'], ['頂', '頂(?=[くきけかい])']]],
    ['〜ている', [['い', '(?<=[てで])い(?=[るたなまれ])'], ['居', '(?<=[てで])居(?=[るたなまれ])']]],
    ['〜てみる', [['み', '(?<=て)み(?=[るたよまな])'], ['見', '(?<=て)見(?=[るたよまな])']]],
    ['〜ていく', [['い', '(?<=て)い(?=[くかきけこっ])'], ['行', '(?<=て)行(?=[くかきけこっ])']]],
    ['〜てくる', [['くる', '(?<=て)くる'], ['来る', '(?<=て)来る']]],
    ['〜てしまう', [['しま', '(?<=[てで])しま(?=[うっいわえお])'], ['仕舞', '(?<=[てで])仕舞(?=[うっいわえお])']]],
    ['〜ておく', [['お', '(?<=[てで])お(?=[くきかけこい])'], ['置', '(?<=[てで])置(?=[くきかけこい])']]],
    ['〜てほしい', [['ほし', '(?<=[てで])ほし(?=[いくかけ])'], ['欲し', '(?<=[てで])欲し(?=[いくかけ])']]],
    ['子ども', [['子ども', '子ども'], ['子供', '子供']]],
    ['なぜ', [['なぜ', 'なぜ'], ['何故', '何故']]],
    ['どこ', [['どこ', 'どこ'], ['何処', '何処']]],
    ['だれ', [['誰', '誰'], ['だれ', '(?<!な)だれ(?![るた])']]],
    ['ひとり', [['一人', '一人(?![称前っ])'], ['ひとり', 'ひとり(?!でに)']]],
    ['ふたり', [['二人', '二人'], ['ふたり', 'ふたり']]],
    ['ひとつ', [['一つ', '一つ'], ['ひとつ', 'ひとつ']]],
    ['気づく', [['気づ', '気づ'], ['気付', '気付']]],
    ['いったん', [['いったん', 'いったん'], ['一旦', '一旦']]],
    ['さまざま', [['さまざま', 'さまざま'], ['様々', '様々']]],
    ['いろいろ', [['いろいろ', 'いろいろ'], ['色々', '色々']]],
    ['おとなしい', [['おとなし', 'おとなし'], ['大人し', '大人し']]],
    ['すばらしい', [['素晴らし', '素晴らし'], ['すばらし', 'すばらし']]],
    ['ころ', [['頃', '(?<=[のた])頃'], ['ころ', '(?<=[のた])ころ']]],
    ['はず', [['はず', '(?<=[るたいの])はず'], ['筈', '(?<=[るたいの])筈']]],
    ['うなずく', [['頷', '頷'], ['うなず', 'うなず']]],
    ['つぶやく', [['呟', '呟'], ['つぶや', 'つぶや']]],
    ['ほほえむ', [['微笑', '微笑(?=[まみむめん])'], ['ほほえ', 'ほほえ(?=[まみむめん])']]],
    ['ため息', [['ため息', 'ため息'], ['溜息', '溜息'], ['溜め息', '溜め息']]],
    ['まぶしい', [['眩し', '眩し'], ['まぶし', 'まぶし']]],
    ['さらに', [['さらに', 'さらに'], ['更に', '更に']]],
    ['すでに', [['すでに', 'すでに'], ['既に', '既に']]],
    ['振り返る', [['振り返', '振り返'], ['振りかえ', '振りかえ'], ['ふりかえ', 'ふりかえ'], ['振返', '振返']]],
    ['ありがとう', [['ありがとう', 'ありがとう'], ['有難う', '有難う'], ['有り難う', '有り難う']]],
    ['眼鏡', [['眼鏡', '眼鏡'], ['メガネ', 'メガネ'], ['めがね', 'めがね']]],
    ['かもしれない', [['かもしれ', 'かもしれ'], ['かも知れ', 'かも知れ']]],
    ['ちょうど', [['ちょうど', 'ちょうど'], ['丁度', '丁度']]],
    ['もちろん', [['もちろん', 'もちろん'], ['勿論', '勿論']]],
    ['たとえ', [['たとえ', 'たとえ(?!る|て|た|ら|れ)'], ['例え', '例え(?!る|て|た|ら|れ)']]],
    ['すぐ', [['すぐ', 'すぐ(?![れるさ])'], ['直ぐ', '直ぐ']]],
    ['少し', [['少し', '少し'], ['すこし', 'すこし']]],
    ['本当', [['本当', '本当'], ['ほんとう', 'ほんとう']]],
  ].map(([label, variants]) => ({
    label,
    variants: variants.map(([form, src]) => ({ form, re: new RegExp(src, 'g') })),
  }));

  const CONJUNCTIONS = ['しかし', 'だが', 'そして', 'それから', 'けれど', 'けれども', 'でも', 'ところが', 'また', 'さらに',
    'つまり', 'だから', 'なので', 'ただ', 'すると', 'それでも', 'とはいえ', 'そのため', 'ところで', 'やがて'];

  function eachMatch(re, text, fn) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      if (m[0].length === 0) { re.lastIndex++; continue; }
      fn(m);
    }
  }

  function expand(rep, m) {
    if (rep == null) return null;
    return rep.replace(/\$(\d)/g, (_, n) => m[+n] || '');
  }

  function isJa(c) {
    return !!c && /[぀-ヿ一-鿿㐀-䶿\uFF61-\uFF9F々〆ー。、「」『』…―]/.test(c);
  }

  /**
   * 本文を添削する。
   * @param {string} text
   * @param {object} opts { rules:{id:bool}, maxSentenceLength, maxCommas, endingRepeat,
   *                       styleRules:[{from,to}], corpus:[string] (表記ゆれ集計用の作品全文), ignore:Set }
   */
  function proofread(text, opts) {
    opts = opts || {};
    const enabled = (id) => (opts.rules && Object.prototype.hasOwnProperty.call(opts.rules, id) ? !!opts.rules[id] : RULE_MAP[id].default);
    const a = T.analyze(text || '');
    const m = a.masked;
    const issues = [];

    const add = (ruleId, start, end, message, suggestion, extra) => {
      const r = RULE_MAP[ruleId];
      issues.push(Object.assign({
        ruleId,
        rule: r.name,
        category: r.category,
        severity: r.severity,
        start,
        end,
        text: text.slice(start, end),
        message,
        suggestion: suggestion == null ? null : suggestion,
        fixable: suggestion != null && !!r.fix,
        source: 'proofread',
      }, extra || {}));
    };

    const dict = (ruleId, list, label) => {
      if (!enabled(ruleId)) return;
      list.forEach(({ re, rep, msg }) => {
        eachMatch(re, m, (mm) => {
          const sug = expand(rep, mm);
          const message = sug
            ? `${label}：「${mm[0]}」→「${sug}」${msg ? '。' + msg : ''}`
            : `${label}：「${mm[0]}」${msg ? '。' + msg : ''}`;
          add(ruleId, mm.index, mm.index + mm[0].length, message, sug);
        });
      });
    };
    dict('typo', TYPO, '誤字の可能性');
    dict('misuse', MISUSE, '慣用句の誤用');
    dict('redundant', REDUNDANT, '重複表現');

    if (enabled('ranuki')) {
      [RE_RANUKI, RE_RANUKI_KANA].forEach((re) => {
        eachMatch(re, m, (mm) => {
          const stem = mm[1];
          add('ranuki', mm.index, mm.index + mm[0].length, `ら抜き言葉：「${stem}れ」→「${stem}られ」`, stem + 'られ');
        });
      });
    }

    if (enabled('inuki')) {
      eachMatch(RE_INUKI, m, (mm) => {
        if (a.inDialogue[mm.index]) return;
        const te = mm[2] || mm[3];
        const teIndex = mm.index + mm[1].length - 1;
        const before2 = m.slice(Math.max(0, teIndex - 2), teIndex + 1);
        if (before2 === 'なんで' || before2 === 'ないで') return;
        const end = mm.index + mm[0].length;
        const suffix = mm[4];
        add('inuki', teIndex, end, `い抜き言葉：「${te}${suffix}」→「${te}い${suffix}」（地の文）`, te + 'い' + suffix);
      });
    }

    if (enabled('brackets')) checkBrackets(a, add);

    if (enabled('bracket-period')) {
      eachMatch(/。(?=[」』])/g, m, (mm) => {
        add('bracket-period', mm.index, mm.index + 1, '閉じ括弧の直前の句点は省くのが一般的です', '');
      });
    }

    if (enabled('ellipsis')) {
      eachMatch(/…+/g, m, (mm) => {
        if (mm[0].length % 2 === 1) {
          const sug = '…'.repeat(mm[0].length + 1);
          add('ellipsis', mm.index, mm.index + mm[0].length, `三点リーダーは2つ重ねて「${sug}」とするのが一般的です`, sug);
        }
      });
      eachMatch(/・{2,}|\.{3,}|．{3,}|‥+/g, m, (mm) => {
        add('ellipsis', mm.index, mm.index + mm[0].length, `「${mm[0]}」は三点リーダー「……」にするのが一般的です`, '……');
      });
    }

    if (enabled('dash')) {
      eachMatch(/[―─]+/g, m, (mm) => {
        if (mm[0].length === 1) {
          add('dash', mm.index, mm.index + 1, 'ダッシュは2つ重ねて「――」とするのが一般的です', mm[0] + mm[0]);
        }
      });
      eachMatch(/[—–]+/g, m, (mm) => {
        add('dash', mm.index, mm.index + mm[0].length, '欧文ダッシュは和文用の「――」に揃えるのが一般的です', '――');
      });
    }

    if (enabled('exclamation-space')) {
      eachMatch(/[！？!?]+/g, m, (mm) => {
        const next = m[mm.index + mm[0].length];
        if (next === undefined || next === '\n') return;
        if (/[\s　」』）)】〉》〕］”…―─]/.test(next)) return;
        add('exclamation-space', mm.index, mm.index + mm[0].length,
          '文中の「！」「？」の後には全角スペースを入れるのが一般的です', mm[0].replace(/!/g, '！').replace(/\?/g, '？') + '　');
      });
    }

    if (enabled('halfwidth')) {
      eachMatch(/[｡-ﾟ]+/g, m, (mm) => {
        add('halfwidth', mm.index, mm.index + mm[0].length, '半角カナが使われています', mm[0].normalize('NFKC'), { severity: 'error' });
      });
      eachMatch(/[!?]+/g, m, (mm) => {
        const prev = m[mm.index - 1];
        if (!isJa(prev)) return;
        const sug = mm[0].replace(/!/g, '！').replace(/\?/g, '？');
        add('halfwidth', mm.index, mm.index + mm[0].length, '和文中の半角「!?」は全角にするのが一般的です', sug);
      });
      eachMatch(/ +/g, m, (mm) => {
        const prev = m[mm.index - 1];
        const next = m[mm.index + mm[0].length];
        if (!isJa(prev) || !isJa(next)) return;
        add('halfwidth', mm.index, mm.index + mm[0].length, '和文中に半角スペースがあります', '　', { severity: 'info' });
      });
    }

    if (enabled('indent')) checkIndent(a, add);

    const maxLen = opts.maxSentenceLength || 100;
    const maxCommas = opts.maxCommas || 4;
    const readable = [];
    a.sentences.forEach((s) => {
      if (s.kind === 'narration') readable.push(s);
    });
    a.dialogues.forEach((d) => {
      T.innerSentences(m, d).forEach((s) => readable.push(s));
    });
    if (enabled('sentence-length')) {
      readable.forEach((s) => {
        const len = T.visibleLength(s.text);
        if (len > maxLen) {
          add('sentence-length', s.start, s.end, `一文が${len}文字あります（目安：${maxLen}文字以内）。分けると読みやすくなります`, null);
        }
      });
    }
    if (enabled('commas')) {
      readable.forEach((s) => {
        const n = (s.text.match(/[、，]/g) || []).length;
        if (n > maxCommas) {
          add('commas', s.start, s.end, `一文に読点が${n}個あります（目安：${maxCommas}個以内）`, null);
        }
      });
    }

    if (enabled('ending-repeat')) checkEndingRepeat(a, add, opts.endingRepeat || 3);
    if (enabled('conj-repeat')) checkConjunctions(a, add);
    if (enabled('no-chain')) {
      a.sentences.forEach((s) => {
        const pos = [];
        for (let i = s.start; i < s.end - 1; i++) {
          if (m[i] === 'の' && /[一-鿿々ァ-ヶ]/.test(m[i + 1]) && !/[こそあどもか]/.test(m[i - 1] || '')) pos.push(i);
        }
        for (let k = 0; k + 2 < pos.length; k++) {
          if (pos[k + 2] - pos[k] <= 16 && !/[、，]/.test(m.slice(pos[k], pos[k + 2]))) {
            let last = k + 2;
            while (last + 1 < pos.length && pos[last + 1] - pos[last] <= 8 && !/[、，]/.test(m.slice(pos[last], pos[last + 1]))) last++;
            const start = Math.max(s.start, pos[k] - 4);
            const end = Math.min(s.end, pos[last] + 3);
            add('no-chain', start, end, `「の」が${last - k + 1}回続いています。言い換えると読みやすくなります`, null);
            k = last;
          }
        }
      });
    }

    if (enabled('word-repeat')) checkWordRepeat(a, m, add, opts.names);
    if (enabled('hyouki')) checkHyouki(m, add, opts.corpus, text || '');

    if (enabled('style-rule') && Array.isArray(opts.styleRules)) {
      opts.styleRules.forEach((r) => {
        if (!r || !r.from || r.from === r.to) return;
        const re = new RegExp(T.escapeRegExp(r.from), 'g');
        eachMatch(re, m, (mm) => {
          add('style-rule', mm.index, mm.index + mm[0].length,
            r.to ? `表記統一ルール：「${r.from}」→「${r.to}」` : `表記統一ルール：「${r.from}」は使わない設定です`,
            r.to != null ? r.to : null);
        });
      });
    }

    if (enabled('ruby')) checkRuby(text, add, opts);

    if (enabled('numbers')) {
      eachMatch(/[0-9０-９]+/g, m, (mm) => {
        const prev = m[mm.index - 1] || '';
        const next = m[mm.index + mm[0].length] || '';
        if (/[A-Za-z.．,:：]/.test(prev) || /[A-Za-z.．:：%]/.test(next)) return;
        const n = T.parseJaNumber(mm[0]);
        add('numbers', mm.index, mm.index + mm[0].length, '縦書きでは漢数字が一般的です', T.toKanjiNumber(n));
      });
    }

    return finalize(issues, opts.ignore, m);
  }

  function checkBrackets(a, add) {
    const m = a.masked;
    a.paragraphs.forEach((p) => {
      const stack = [];
      for (let i = p.start; i < p.end; i++) {
        const c = m[i];
        if (T.PAIRS[c]) {
          stack.push({ c, i });
        } else {
          let isCloser = false;
          for (const k in T.PAIRS) { if (T.PAIRS[k] === c) { isCloser = true; break; } }
          if (!isCloser) continue;
          if (stack.length && T.PAIRS[stack[stack.length - 1].c] === c) {
            stack.pop();
          } else {
            // 一つ下の階層と対応していれば、間の開き括弧が閉じられていない
            let found = -1;
            for (let k = stack.length - 1; k >= 0; k--) {
              if (T.PAIRS[stack[k].c] === c) { found = k; break; }
            }
            if (found >= 0) {
              for (let k = stack.length - 1; k > found; k--) {
                add('brackets', stack[k].i, stack[k].i + 1, `「${stack[k].c}」が閉じられていません`, null);
              }
              stack.length = found;
            } else {
              add('brackets', i, i + 1, `対応する開き括弧のない「${c}」があります`, null);
            }
          }
        }
      }
      stack.forEach((s) => {
        add('brackets', s.i, s.i + 1, `「${s.c}」が段落内で閉じられていません`, null);
      });
    });
  }

  function checkIndent(a, add) {
    const m = a.masked;
    const narr = [];
    const dlg = [];
    a.paragraphs.forEach((p) => {
      const t = p.text;
      if (!t.trim()) return;
      const first = t[0];
      const firstVisible = t.replace(/^[\s　]+/, '')[0] || '';
      if (/[◇◆■□○●＊*※☆★〜~＝=－\-#]/.test(firstVisible) && t.trim().length <= 12) return; // 場面転換記号
      if (firstVisible === '「' || firstVisible === '『' || firstVisible === '（' || firstVisible === '(') {
        dlg.push({ p, indented: first === '　' || first === ' ' });
      } else {
        narr.push({ p, indented: first === '　', half: first === ' ' });
      }
    });
    if (narr.length >= 2) {
      const ratio = narr.filter((x) => x.indented || x.half).length / narr.length;
      if (ratio >= 0.3) {
        narr.forEach((x) => {
          if (x.half) {
            let e = x.p.start;
            while (m[e] === ' ') e++;
            add('indent', x.p.start, e, '段落頭は半角ではなく全角スペースで字下げするのが一般的です', '　');
          } else if (!x.indented) {
            add('indent', x.p.start, x.p.start + 1, '段落の先頭が字下げされていません', '　' + a.text[x.p.start]);
          }
        });
      }
    }
    if (dlg.length >= 2) {
      const ratio = dlg.filter((x) => x.indented).length / dlg.length;
      if (ratio < 0.5) {
        dlg.forEach((x) => {

  };

  function normKana(s) {
    return s.replace(/ヴァ/g, 'バ').replace(/ヴィ/g, 'ビ').replace(/ヴェ/g, 'ベ').replace(/ヴォ/g, 'ボ').replace(/ヴ/g, 'ブ')
      .replace(/[ァィゥェォャュョヮ]/g, (c) => ({ 'ァ': 'ア', 'ィ': 'イ', 'ゥ': 'ウ', 'ェ': 'エ', 'ォ': 'オ', 'ャ': 'ヤ', 'ュ': 'ユ', 'ョ': 'ヨ', 'ヮ': 'ワ' }[c]))
      .replace(/[ー・＝=\s　ッ]/g, '').replace(/ヂ/g, 'ジ').replace(/ヅ/g, 'ズ');
  }

  function levenshtein(a, b) {
    if (a === b) return 0;
    const m = a.length;
    const n = b.length;
    if (Math.abs(m - n) > 2) return 3;
    let prev = new Array(n + 1);
    for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[n];
  }

  const LOANWORDS = new Set(('ドア テーブル ベッド カーテン コーヒー ミルク パン ケーキ チョコ チョコレート ジュース ビール ワイン グラス カップ スプーン フォーク ナイフ ' +
    'テレビ ラジオ スマホ スマートフォン パソコン メール メッセージ ニュース ゲーム アニメ マンガ カメラ ノート ペン ボールペン シャツ スカート ズボン コート ' +
    'ジャケット セーター ブーツ スニーカー ポケット バッグ カバン リュック ハンカチ タオル シャワー トイレ キッチン リビング ソファ ソファー クッション ランプ ' +
    'ライト スイッチ エレベーター ビル マンション アパート ホテル レストラン カフェ コンビニ スーパー デパート バス タクシー トラック バイク ボート ' +
    'ホーム ベンチ ポスト ページ メモ リスト データ システム プログラム コンピュータ コンピューター エネルギー パワー スピード タイミング チャンス ピンチ ' +
    'ミス リズム メロディ メロディー ピアノ ギター ドラム ダンス スポーツ サッカー テニス ボール チーム メンバー クラス グループ リーダー キャプテン ' +
    'マネージャー スタッフ サービス イベント パーティー パーティ プレゼント カード チケット ポイント レベル スキル ステータス モンスター ドラゴン スライム ' +
    'ゴブリン オーク エルフ ドワーフ ギルド クエスト ダンジョン アイテム ポーション スクロール ソード シールド アーマー マジック ゴーレム ヒーロー ヒロイン ' +
    'ストーリー シーン ラスト スタート ゴール ライン ルール ゲート ドラマ ファン アイドル プロ イメージ ショック ストレス トラブル プレッシャー ペース ' +
    'ルート コース エリア ゾーン スペース サイズ カラー ピンク オレンジ グレー ブルー グリーン レッド ホワイト ブラック ゴールド シルバー ブラウン ' +
    'ハート キス デート ジョーク センス マナー ルーム ベランダ フロア ロビー カウンター ガラス プラスチック コンクリート ロープ チェーン ハンマー ' +
    'アクセサリー ネックレス ピアス リボン スカーフ マスク メガネ サングラス ヘルメット タバコ ライター ガス エンジン ハンドル ブレーキ タイヤ ' +
    'シート ベルト ロック キー ネット インターネット サイト アプリ ボタン ウィンドウ モニター スクリーン ポスター ステージ ライブ コンサート ショー ' +
    'チャイム ベル サイレン アラーム ノック カーペット マット パジャマ シーツ クローゼット ナイト モード タイプ ケース パターン ポーズ サイン ' +
    'ストップ ジャンプ ダメージ ヒット ミッション ターゲット チェック セット ピース マップ ルーン ブレス ブレード ランク ギア ハンター ソロ ペア ' +
    'ウイルス ワクチン ベテラン ゲスト ホスト オーナー マスター ボス プリンセス プリンス クイーン キング ナイフ ピストル ライフル スナイパー ' +
    'シャッター ガード タワー ホール ロビー トンネル ルーキー ジム プール ビーチ リゾート テント キャンプ ハイキング ランチ ディナー スープ サラダ ' +
    'ステーキ パスタ ピザ アイス クッキー キャンディ チーズ バター ソース ハム ソーセージ ベーコン トマト レモン メロン バナナ リンゴ イチゴ').split(/\s+/));

  function isKatakana(s) {
    return /^[ァ-ヴー・]+$/.test(s);
  }

  /** 設定資料から名前の索引を作る */
  function buildNameIndex(entries) {
    const forms = new Map(); // form -> [entryId]
    const byId = {};
    (entries || []).forEach((e) => {
      if (!e || !e.name) return;
      byId[e.id] = e;
      const set = new Set();
      const full = e.name.trim();
      const compact = full.replace(/[\s　]/g, '');
      if (compact) set.add(compact);
      const parts = full.split(/[\s　・＝=]+/).filter(Boolean);
      // 姓・名に分けた形も登録（1文字の名は漢字のみ。前後が漢字でない場合だけ一致させる）
      if (parts.length > 1) parts.forEach((p) => { if (p.length >= 2 || /^[\u4E00-\u9FFF々]$/.test(p)) set.add(p); });
      if (/・|＝/.test(compact)) set.add(compact.replace(/[・＝=]/g, ''));
      (e.aliases || []).forEach((al) => {
        const a2 = String(al || '').trim();
        if (a2) set.add(a2.replace(/[\s　]/g, ''));
      });
      set.forEach((f) => {
        if (!forms.has(f)) forms.set(f, []);
        if (forms.get(f).indexOf(e.id) < 0) forms.get(f).push(e.id);
      });
    });
    const list = Array.from(forms.keys()).sort((a, b) => b.length - a.length);
    let re = null;
    if (list.length) {
      re = new RegExp(list.map((f) => {
        const ef = T.escapeRegExp(f);
        if (isKatakana(f)) return '(?<![ァ-ヴー])' + ef + '(?![ァ-ヴー])';
        if (/^[ぁ-ん]+$/.test(f)) return '(?<![ぁ-ん])' + ef + '(?=[はがのをにもとへでやっさくちねよ、。！？!?…」』\\s\\u3000]|$)';
        if (f.length === 1) return '(?<![\\u4E00-\\u9FFF々])' + ef + '(?![\\u4E00-\\u9FFF々])';
        return ef;
      }).join('|'), 'g');
    }
    const normKanaMap = new Map();
    list.forEach((f) => { if (isKatakana(f) && !normKanaMap.has(normKana(f))) normKanaMap.set(normKana(f), f); });
    return { forms, list, re, byId, normKanaMap };
  }

  function findMentions(masked, index) {
    const out = [];
    if (!index.re) return out;
    index.re.lastIndex = 0;
    let m;
    while ((m = index.re.exec(masked)) !== null) {
      const ids = index.forms.get(m[0]) || [];
      out.push({ start: m.index, end: m.index + m[0].length, form: m[0], ids, entryId: ids.length === 1 ? ids[0] : null });
    }
    return out;
  }

  /** 名前の後ろの敬称を含めた終端と、その直後の文字 */
  function afterName(masked, end) {
    const rest = masked.slice(end, end + 8);
    const h = rest.match(RE_HONORIFIC);
    const e2 = end + (h ? h[0].length : 0);
    return { end: e2, next: masked[e2] || '', honorific: h ? h[0] : '' };
  }

  // 設定資料にない「別の主語」（彼女が・少年は・僕が など）。これが間にあると、話者を名前から推定しない
  const RE_OTHER_SUBJECT = /(?:彼女|彼|あいつ|こいつ|そいつ|奴|やつ|少女|少年|男|女|老人|老婆|子供|子ども|誰か|皆|みんな|二人|全員|俺|僕|私|わたし|あたし|おれ|ぼく|自分)(?:たち|達|ら)?[はがも]/;

  /** 台詞の話者を推定する */
  function attributeSpeakers(a, mentions) {
    const m = a.masked;
    const out = [];
    const narrMentions = mentions.filter((x) => !a.inDialogue[x.start] && x.entryId);
    a.dialogues.forEach((d, di) => {
      const para = a.paragraphs[d.para];
      let prevEnd = para.start;
      for (let k = di - 1; k >= 0; k--) {
        if (a.dialogues[k].para !== d.para) break;
        prevEnd = a.dialogues[k].end;
        break;
      }
      let speaker = null;
      let method = null;
      // (a) 台本形式：太郎「……」
      const beforeTrim = m.slice(prevEnd, d.start).replace(/[\s　:：]/g, '');
      const pre = narrMentions.filter((x) => x.start >= prevEnd && x.end <= d.start);
      if (beforeTrim && pre.length === 1 && beforeTrim === pre[0].form) {
        speaker = pre[0].entryId;
        method = 'prefix';
      }
      // (b) 台詞の後：「……」と太郎は言った
      if (!speaker && d.closed) {
        let stop = para.end;
        const nextQ = m.slice(d.end, para.end).search(/[「『]/);
        if (nextQ >= 0) stop = Math.min(stop, d.end + nextQ);
        const nextP = m.slice(d.end, para.end).search(/。/);
        if (nextP >= 0) stop = Math.min(stop, d.end + nextP + 1);
        const after = m.slice(d.end, stop);
        if (/^(?:と|って|、と|とだけ|という)/.test(after)) {
          const cands = narrMentions.filter((x) => x.start >= d.end && x.start < d.end + 24 && x.end <= stop);
          for (const c of cands) {
            // 「……」と彼女が言うと、太郎は頷いた → 話者は太郎ではない
            if (RE_OTHER_SUBJECT.test(m.slice(d.end, c.start))) break;
            const an = afterName(m, c.end);
            if (/[はがも]/.test(an.next)) { speaker = c.entryId; method = 'after'; break; }
          }
        }
      }
      // (c) 台詞の前の地の文：太郎は振り返った。「……」
      if (!speaker) {
        const cands = narrMentions.filter((x) => x.start >= Math.max(prevEnd, d.start - 60) && x.end <= d.start);
        for (let k = cands.length - 1; k >= 0; k--) {
          const an = afterName(m, cands[k].end);
          if (/[はがも]/.test(an.next)) {
            // 太郎が言いかけたとき、彼女が「……」 → 話者は太郎ではない
            if (!RE_OTHER_SUBJECT.test(m.slice(an.end + 1, d.start))) { speaker = cands[k].entryId; method = 'before'; }
            break;
          }
        }
      }
      // (d) 台詞だけの行の次の行：「……」↵　太郎は呆れたように言った。
      if (!speaker && d.closed && !m.slice(d.end, para.end).replace(/[\s　]/g, '') && d.para + 1 < a.paragraphs.length) {
        const np = a.paragraphs[d.para + 1];
        const lead = m.slice(np.start, np.end).match(/^[\s　]*/)[0].length;
        const c = narrMentions.find((x) => x.start === np.start + lead);
        if (c) {
          const an = afterName(m, c.end);
          const rest = m.slice(an.end + 1, Math.min(np.end, an.end + 24));
          if (/[はが]/.test(an.next) && !/[「『]/.test(rest.split(/[。]/)[0]) && RE_SPEECH_VERB.test(rest.split(/[。]/)[0])) { speaker = c.entryId; method = 'next'; }
        }
      }
      // (e) 台詞で始まる行の前の行（地の文だけ）の最後の文の主語：太郎は窓の外を見た。↵「……」
      if (!speaker && !m.slice(para.start, d.start).replace(/[\s　]/g, '') && d.para > 0) {
        const pp = a.paragraphs[d.para - 1];
        const hasDialogue = a.dialogues.some((x) => x.para === d.para - 1);
        if (!hasDialogue && pp.end > pp.start) {
          // 行の中で最後に「名前は／名前が」で始まる文を探し、その後に別の主語が出てこなければ、その人物を話者とみなす
          const sents = a.sentences.filter((x) => x.para === d.para - 1);
          for (let k = sents.length - 1; k >= 0; k--) {
            const st = sents[k];
            const lead = m.slice(st.start, st.end).match(/^[\s　]*/)[0].length;
            const c = narrMentions.find((x) => x.start === st.start + lead);
            if (!c) continue;
            const an = afterName(m, c.end);
            if (!/[はが]/.test(an.next)) break;
            const rest = m.slice(an.end + 1, pp.end);
            const otherName = narrMentions.some((x) => x.start > an.end && x.end <= pp.end && x.entryId !== c.entryId && /[はがも]/.test(afterName(m, x.end).next));
            if (!RE_OTHER_SUBJECT.test(rest) && !otherName) { speaker = c.entryId; method = 'context'; }
            break;
          }
        }
      }
      if (speaker) out.push({ start: d.start, end: d.end, innerStart: d.innerStart, innerEnd: d.innerEnd, entryId: speaker, method });
    });
    return out;
  }
  const RE_SPEECH_VERB = /(?:言[っうい]|答え|応え|叫|呟|つぶや|返し|返す|尋ね|訊|聞き返|怒鳴|囁|ささや|笑っ|微笑|続け|告げ|促し|頷|うなず|ぼやい|漏ら|吐き捨て)/;

  function sentenceAt(a, pos) {
    // 二分探索
    let lo = 0;
    let hi = a.sentences.length - 1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      const s = a.sentences[mid];
      if (pos < s.start) hi = mid - 1;
      else if (pos >= s.end) lo = mid + 1;
      else return s;
    }
    return null;
  }

  function splitList(v) {
    return String(v || '').split(/[\/／、,，]+/).map((s) => s.trim()).filter(Boolean);
  }

  function parseAgeSetting(v) {
    const nums = (String(v || '').match(/[0-9０-９]+|[一二三四五六七八九十百]+/g) || []).map(T.parseJaNumber).filter((n) => !isNaN(n));
    if (!nums.length) return null;
    return { min: Math.min.apply(null, nums), max: Math.max.apply(null, nums) };
  }

  // ───── 語り手（地の文の視点） ─────
  const NARRATORS = {
    auto: '自動（本文から判定）',
    first: '一人称（作中の人物が語る）',
    third: '三人称・一元視点（作中の人物に寄り添って語る）',
    omniscient: '三人称・神視点（作品の外から語る）',
  };
  const NARRATOR_SHORT = { first: '一人称', third: '三人称（一元視点）', omniscient: '神視点' };
  // 地の文の一人称（「私立」「僕ら」などの語の一部は除く）
  const RE_NARR_FP = /(私|わたし|あたし|僕|ぼく|俺|おれ|オレ|儂|わし|拙者|我輩|吾輩)(?=[はがもをにへとのやでだっ、。…―]|たち|達|ら[はがもをにのと、])/g;

  /** 地の文に一人称がよく出てくるかで、一人称の語りかどうかを判定する */
  function detectNarrator(text, analyzed) {
    const a = analyzed || T.analyze(text || '');
    const m = a.masked;
    let count = 0;
    let narrChars = 0;
    const words = {};
    for (let i = 0; i < m.length; i++) if (!a.inDialogue[i] && !/\s/.test(m[i])) narrChars++;
    RE_NARR_FP.lastIndex = 0;
    let mm;
    while ((mm = RE_NARR_FP.exec(m)) !== null) {
      if (a.inDialogue[mm.index]) continue;
      // 「私立」「僕の」などの直前が漢字の語（「公私」など）は数えない
      if (mm.index > 0 && /[一-龠々]/.test(m[mm.index - 1]) && mm[1] === '私') continue;
      count++;
      words[mm[1]] = (words[mm[1]] || 0) + 1;
    }
    const per1000 = narrChars ? (count * 1000) / narrChars : 0;
    const first = count >= 2 && per1000 >= 1.2;
    let top = '';
    Object.keys(words).forEach((w) => { if (!top || words[w] > words[top]) top = w; });
    return { kind: first ? 'first' : 'third', count, pronoun: top, narrChars };
  }

  /**
   * 設定との矛盾をチェックする。
   * @param {string} text 本文
   * @param {object} ctx { entries, rules:{ng:[{word,reason,suggestion,scope}]}, chapterNo, enabled:{id:bool}, ignore:Set,
   *                       narrator:'auto'|'first'|'third'|'omniscient'（地の文の語り手） }
   */
  function check(text, ctx) {
    ctx = ctx || {};
    const enabled = (id) => (ctx.enabled && Object.prototype.hasOwnProperty.call(ctx.enabled, id) ? !!ctx.enabled[id] : RULE_MAP[id].default);
    const a = T.analyze(text || '');
    const m = a.masked;
    const entries = ctx.entries || [];
    const index = ctx.index || buildNameIndex(entries);
    const mentions = findMentions(m, index);
    const issues = [];
    const add = (ruleId, start, end, message, suggestion, extra) => {
      const r = RULE_MAP[ruleId];
      issues.push(Object.assign({
        ruleId, rule: r.name, category: '設定', severity: r.severity, start, end,
        text: text.slice(start, end), message, suggestion: suggestion == null ? null : suggestion,
        fixable: suggestion != null && !!r.fix, source: 'consistency',
      }, extra || {}));
    };
    const nameOf = (id) => (index.byId[id] ? index.byId[id].name : '？');

    // 語り手
    const narrSetting = NARRATORS[ctx.narrator] ? ctx.narrator : 'auto';
    const detected = narrSetting === 'auto' ? detectNarrator(text, a) : null;
    const narrator = { setting: narrSetting, effective: detected ? detected.kind : narrSetting, detected };

    // 世界観NGワード（台詞は常に。地の文は語り手しだい）
    if (enabled('ng-word')) {
      ((ctx.rules && ctx.rules.ng) || []).forEach((r) => {
        if (!r || !r.word) return;
        const scope = r.scope === 'all' || r.scope === 'dialogue' ? r.scope : 'auto';
        const re = new RegExp(T.escapeRegExp(r.word), 'g');
        const base = `世界観NGワード「${r.word}」${r.reason ? '：' + r.reason : ''}${r.suggestion ? `（言い換え例：「${r.suggestion}」）` : ''}`;
        let mm;
        while ((mm = re.exec(m)) !== null) {
          const inDlg = !!a.inDialogue[mm.index];
          let severity = null;
          let note = '';
          if (inDlg) { severity = 'warning'; note = '（台詞）'; }
          else if (scope === 'all') { severity = 'warning'; note = '（地の文）'; }
          else if (scope === 'dialogue') severity = null;
          else if (narrator.effective === 'first') {
            severity = 'warning';
            note = detected ? `（一人称「${detected.pronoun}」の語りの地の文）` : '（一人称の語りの地の文）';
          } else if (narrator.effective === 'third') {
            severity = 'info';
            note = '（三人称の地の文。視点人物に寄り添う語りなら言い換えを。作品の外から語る神視点なら、語り手を「神視点」にするとこの指摘は出ません）';
          }
          if (!severity) continue;
          add('ng-word', mm.index, mm.index + mm[0].length, base + note, r.suggestion || null, { severity, inDialogue: inDlg });
        }
      });
    }

    // 固有名詞の表記ゆれ
    if (enabled('name-variant') && index.list.length) {
      const registered = new Set(index.list);
      const seenVariant = new Set();
      index.list.forEach((form) => {
        if (isKatakana(form)) return;
        const chars = Array.from(form);
        chars.forEach((c, i) => {
          const vs = KANJI_VARIANTS[c];
          if (!vs) return;
          Array.from(vs).forEach((v) => {
            const variant = chars.slice(0, i).concat([v], chars.slice(i + 1)).join('');
            if (registered.has(variant) || seenVariant.has(variant)) return;
            seenVariant.add(variant);
            let pos = m.indexOf(variant);
            while (pos >= 0) {
              add('name-variant', pos, pos + variant.length,
                `「${variant}」は設定資料では「${form}」と表記されています`, form, { entryId: (index.forms.get(form) || [])[0] });
              pos = m.indexOf(variant, pos + variant.length);
            }
          });
        });
      });
      // カタカナ名
      const runs = {};
      const reRun = /[ァ-ヴ][ァ-ヴー・]{2,}/g;
      let mm;
      while ((mm = reRun.exec(m)) !== null) {
        (runs[mm[0]] = runs[mm[0]] || []).push(mm.index);
      }
      Object.keys(runs).forEach((run) => {
        if (registered.has(run)) return;
        const nk = normKana(run);
        const exact = index.normKanaMap.get(nk);
        if (exact && exact !== run) {
          runs[run].forEach((pos) => add('name-variant', pos, pos + run.length,
            `「${run}」は設定資料では「${exact}」と表記されています`, exact, { severity: 'warning', entryId: (index.forms.get(exact) || [])[0] }));
          return;
        }
        // 似た名前（誤字の可能性）
        if (run.length < 4 || runs[run].length >= 3 || LOANWORDS.has(run)) return;
        // 登録名の前方一致・後方一致（「アレン」→「アレンス」等）は別名の可能性が高いので除外
        for (const [nf, form] of index.normKanaMap) {
          if (form.length < 4) continue;
          if (run.indexOf(form) >= 0 || form.indexOf(run) >= 0) continue;
          if (levenshtein(nk, nf) === 1) {
            runs[run].forEach((pos) => add('name-variant', pos, pos + run.length,
              `「${run}」は登録名「${form}」の誤字ではありませんか？`, form, { severity: 'info', entryId: (index.forms.get(form) || [])[0] }));
            break;
          }
        }
      });
    }

    // 話者推定
    const speakers = attributeSpeakers(a, mentions);

    speakers.forEach((sp) => {
      const e = index.byId[sp.entryId];
      if (!e) return;
      const f = e.fields || {};
      const inner = m.slice(sp.innerStart, sp.innerEnd).replace(/『[^』]*』/g, (s) => T.FILLER.repeat(s.length));
      const methodNote = '（推定話者）';
      // 前の行の主語から推定したもの（確度が低い）は控えめに出す
      const weakSev = sp.method === 'context' ? { severity: 'info' } : {};

      // 一人称
      if (enabled('first-person') && f.firstPerson && f.firstPerson.trim()) {
        const allowed = parsePronounSetting(f.firstPerson);
        RE_PRONOUN.lastIndex = 0;
        let pm;
        while ((pm = RE_PRONOUN.exec(inner)) !== null) {
          const fam = PRONOUN_INDEX[pm[0]];
          if (!fam) continue;
          const pos = sp.innerStart + pm.index;
          if (allowed.has(fam.key)) {
            // 同じ一人称で表記違い（俺／オレ）
            const rawForms = Array.from(allowed).filter((x) => x.indexOf('raw:') !== 0);
            const settingForms = splitList(f.firstPerson.replace(/[\s　・]/g, '/'));
            if (settingForms.length && settingForms.indexOf(pm[0]) < 0 && rawForms.length) {
              const same = settingForms.find((sf) => PRONOUN_INDEX[sf] === fam);
              if (same) {
                add('first-person', pos, pos + pm[0].length,
                  `${e.name}${methodNote}の一人称は設定では「${same}」です（表記ゆれ：「${pm[0]}」）`, same,
                  { severity: 'info', entryId: e.id });
              }
            }
            continue;
          }
          if (fam.weak) continue;
          add('first-person', pos, pos + pm[0].length,
            `${e.name}${methodNote}の一人称は設定では「${f.firstPerson}」ですが、「${pm[0]}」が使われています`, null,
            Object.assign({ entryId: e.id }, weakSev));

      // 呼び方
      if (enabled('calls') && Array.isArray(e.relations)) {
        e.relations.forEach((rel) => {
          if (!rel || !rel.targetId || !rel.calls) return;
          const calls = splitList(rel.calls);
          if (!calls.length) return;
          mentions.forEach((mt) => {
            if (mt.start < sp.innerStart || mt.end > sp.innerEnd) return;
            if (mt.entryId !== rel.targetId) return;
            const an = afterName(m, mt.end);
            const said = m.slice(mt.start, an.end);
            if (calls.indexOf(said) >= 0) return;
            if (calls.some((c) => c.length > said.length && m.slice(mt.start, mt.start + c.length) === c)) return;
            add('calls', mt.start, an.end,
              `設定では${e.name}は${nameOf(rel.targetId)}を「${calls.join('／')}」と呼びます（本文：「${said}」）${methodNote}`,
              calls[0], Object.assign({ entryId: e.id, fixable: false }, weakSev));

      }

      if (enabled('timeline') && ctx.chapterNo && e.appear) {
        const until = parseInt(e.appear.until, 10);
        const from = parseInt(e.appear.from, 10);
        if (until && ctx.chapterNo > until) {
          add('timeline', sp.start, sp.end,
            `${e.name}は第${until}話で${e.appear.reason || '退場'}していますが、第${ctx.chapterNo}話で発言しています${methodNote}`, null,

          add('timeline', sp.start, sp.end,
            `${e.name}の初登場は第${from}話の設定ですが、第${ctx.chapterNo}話で発言しています${methodNote}`, null,

    if (enabled('age')) checkAge(a, mentions, index, add);

    const out = [];
    const seen = new Set();
    issues.sort((x, y) => x.start - y.start || y.end - x.end).forEach((it) => {
      const k = it.ruleId + ':' + it.start + ':' + it.end;
      if (seen.has(k)) return;
      seen.add(k);
      it.key = it.ruleId + '|' + it.text;
      if (ctx.ignore && ctx.ignore.has && ctx.ignore.has(it.key)) return;
      out.push(it);
    });

    return {
      issues: out,
      speakers: speakers.map((s) => Object.assign({ name: nameOf(s.entryId) }, s)),
      mentions,
      candidates: findCandidates(m, index),
      narrator,
    };
  }

  function nearestCharacter(mentions, index, from, to, pos) {
    let best = null;
    mentions.forEach((mt) => {
      if (!mt.entryId || mt.start < from || mt.end > to) return;
      const e = index.byId[mt.entryId];
      if (!e || e.type !== 'character') return;
      if (mt.end <= pos) {
        if (!best || best.after || mt.end > best.mt.end) best = { mt, after: false };
      } else if (!best) {
        if (mt.start - pos < 24) best = { mt, after: true };
      }

    return best ? best.mt : null;
  }

  function checkAppearance(a, mentions, index, add) {
    const m = a.masked;
    const parts = [
      { field: 'hair', label: '髪', re: /髪|ヘア|赤毛|毛先/g },
      { field: 'eyes', label: '瞳', re: /瞳|双眸|眸|眼(?![鏡差前下中科力球光])|目(?![的標指覚立線安撃印次録上下玉頭元配処盛尻])/g },
    ];
    parts.forEach((part) => {
      part.re.lastIndex = 0;
      let km;
      while ((km = part.re.exec(m)) !== null) {
        const kw = km[0];
        const kwStart = km.index;
        const kwEnd = kwStart + kw.length;
        const s = sentenceAt(a, kwStart);
        if (!s) continue;
        const sent = m.slice(s.start, s.end);
        if (/染め|染ま|ウィッグ|かつら|カツラ|変装|カラコン|コンタクト|白髪(?:交じ|まじ|が増)|幻|夢の中|見間違/.test(sent)) continue;
        let found = null;
        let foundStart = -1;
        if (kw === '赤毛') { found = new Set(['赤']); foundStart = kwStart; }
        const strict = kw === '目' || kw === '眼';
        if (!found) {
          const winStart = Math.max(s.start, kwStart - (strict ? 6 : 10));
          const win = m.slice(winStart, kwStart);
          let last = null;
          RE_COLOR.lastIndex = 0;
          let cm;
          while ((cm = RE_COLOR.exec(win)) !== null) last = { w: cm[0], i: cm.index };
          if (last) {
            const tail = win.slice(last.i + last.w.length);
            const ok = strict ? /^(?:色)?(?:の|い|な)?$/.test(tail) : !/[、。」』]/.test(tail);
            if (ok) { found = COLOR_WORDS[last.w]; foundStart = winStart + last.i; }
          }
        }
        if (!found && !strict) {
          const after = m.slice(kwEnd, Math.min(s.end, kwEnd + 12));
          const am = after.match(/^(?:の色)?[はがも]、?/);
          if (am) {
            const rest = after.slice(am[0].length);
            RE_COLOR.lastIndex = 0;
            const cm = RE_COLOR.exec(rest);
            if (cm && cm.index <= 4 && !/^(?:では|じゃ)な/.test(rest.slice(cm.index + cm[0].length).replace(/^色/, ''))) {
              found = COLOR_WORDS[cm[0]];
              foundStart = kwEnd + am[0].length + cm.index;
            }
          }
        }
        if (!found) continue;
        // 慣用句・別の意味の除外
        const ctxStr = m.slice(Math.max(0, foundStart - 2), Math.min(m.length, kwEnd + 4));
        if (COLOR_EXCLUDE.some((x) => ctxStr.indexOf(x) >= 0)) continue;
        if (part.field === 'eyes') {
          if (/白い目で|白目|目を白黒|目の前が真っ|色目/.test(m.slice(Math.max(0, foundStart - 2), kwEnd + 4))) continue;
          if (found.has('赤') && /泣|涙|充血|寝不足|腫ら|擦/.test(sent)) continue;
        }
        const ch = nearestCharacter(mentions, index, s.start, s.end, Math.min(foundStart, kwStart));
        if (!ch) continue;
        const e = index.byId[ch.entryId];
        const setting = e.fields && e.fields[part.field];
        if (!setting) continue;
        const settingGroups = colorGroupsIn(setting);
        if (!settingGroups.size) continue;
        if (compatible(found, settingGroups)) continue;
        const start = Math.min(foundStart, kwStart);
        const end = Math.max(kwEnd, foundStart + 1);
        add('appearance', start, end,
          `設定では${e.name}の${part.label}は「${setting}」です（本文：「${m.slice(start, end)}」）`, null, { entryId: e.id });
      }
    });
  }

  function checkAge(a, mentions, index, add) {
    const m = a.masked;
    const re = /([0-9０-９]{1,3}|[一二三四五六七八九十百]{1,4})(?:歳|才)(?!年上|年下|上|下|差|違|以上|以下|未満|くらい|ぐらい|前後|頃|ごろ|から|まで|の頃|の時|のとき|の子|児)/g;
    let mm;
    while ((mm = re.exec(m)) !== null) {
      const age = T.parseJaNumber(mm[1]);
      if (isNaN(age)) continue;
      const s = sentenceAt(a, mm.index);
      if (!s) continue;
      const end = mm.index + mm[0].length;
      let ch = null;
      // 「十七歳の太郎」
      const afterM = m.slice(end, end + 3);
      if (/^の/.test(afterM)) {
        ch = mentions.find((x) => x.entryId && x.start >= end + 1 && x.start <= end + 2 && index.byId[x.entryId].type === 'character') || null;
      }
      // 「太郎は十七歳」
      if (!ch) {
        const cands = mentions.filter((x) => x.entryId && x.start >= s.start && x.end <= mm.index && index.byId[x.entryId].type === 'character');
        for (let k = cands.length - 1; k >= 0; k--) {
          const an = afterName(m, cands[k].end);
          if (/[はがも]/.test(an.next) && mm.index - an.end <= 12) { ch = cands[k]; break; }
        }
      }
      if (!ch) continue;
      const e = index.byId[ch.entryId];
      const set = parseAgeSetting(e.fields && e.fields.age);
      if (!set) continue;
      if (age >= set.min && age <= set.max) continue;
      add('age', mm.index, end,
        `設定では${e.name}は${e.fields.age}${/歳|才/.test(e.fields.age) ? '' : '歳'}です（本文：「${mm[0]}」）`, null, { entryId: e.id });
    }
  }

  /** 設定資料に未登録の固有名詞らしき語（カタカナ語・「〇〇王国」など） */
  function findCandidates(m, index) {
    const counts = {};

    const registered = new Set(index.list);

    let mm;

      const w = mm[0].replace(/・+$/, '');
      if (w.length < 3) continue;
      if (LOANWORDS.has(w) || registered.has(w) || registeredNorm.has(normKana(w))) continue;
      if (/^(.{1,3})\1+$/.test(w) || /ッ$/.test(w)) continue;
      if (Array.from(registered).some((r) => isKatakana(r) && w.indexOf(r) >= 0)) continue;

    while ((mm = rePlace.exec(m)) !== null) {

      if (/^(?:この|その|あの|大きな|小さな)/.test(w)) continue;
      counts[w] = counts[w] || { word: w, count: 0, kind: 'place' };
      counts[w].count++;

    return Object.values(counts)
      .filter((c) => c.count >= 2 || c.kind === 'place')
      .sort((x, y) => y.count - x.count)
      .slice(0, 20);
  }

  /** 各話での人物・用語の登場回数（設定資料の「登場箇所」用） */
  function countMentionsByEntry(texts, entries) {
    const index = buildNameIndex(entries);
    return texts.map((t) => {
      const counts = {};
      findMentions(T.maskRuby(t || ''), index).forEach((mt) => {
        mt.ids.forEach((id) => { counts[id] = (counts[id] || 0) + 1; });
      });
      return counts;
    });
  }

  NS.Consistency = {
    RULES, RULE_MAP, check, buildNameIndex, detectNarrator, NARRATORS, NARRATOR_SHORT, findMentions, attributeSpeakers, countMentionsByEntry,

      for (let x = 0; x < gw; x++) {
        const nx = x / gw;
        const ny = y / gh;
        const wx = (warp(nx * 2, ny * 2, 3) - 0.5) * 0.35;
        const wy = (warp(nx * 2 + 5.2, ny * 2 + 1.3, 3) - 0.5) * 0.35;
        let v = fbm((nx + wx) * freq * aspect, (ny + wy) * freq, 6);
        const dx = (nx - 0.5) * 2;
        const dy = (ny - 0.5) * 2;
        const d = Math.sqrt(dx * dx * 0.85 + dy * dy);
        if (preset.gradient) v += (0.5 - nx) * 0.9;
        else v -= Math.pow(d, 2) * preset.falloff * 0.5;
        if (!preset.gradient) {
          const e = Math.min(nx, ny, 1 - nx, 1 - ny);
          if (e < 0.06) v -= (0.06 - e) * 4;
        }
        H[y * gw + x] = v;
      }
    }
    const sorted = Array.from(H).sort((a, b) => a - b);
    const landRatio = opts.land != null ? opts.land : preset.land;
    const t = sorted[Math.floor((1 - landRatio) * (sorted.length - 1))];
    const min = sorted[0];
    const max = sorted[sorted.length - 1];
    for (let i = 0; i < H.length; i++) {
      const v = H[i];
      H[i] = v >= t ? Math.pow((v - t) / (max - t || 1), 1.3) : -Math.pow((t - v) / (t - min || 1), 0.7);
    }
    if (!preset.gradient) {
      for (let y = 0; y < gh; y++) {
        for (let x = 0; x < gw; x++) {
          const e = Math.min(x, y, gw - 1 - x, gh - 1 - y);
          if (e < 2) H[y * gw + x] = Math.min(H[y * gw + x], -0.2);
        }
      }
    }
    return H;
  }

  /** 高さと乱数から地面の種類を自動で塗る */
  function autoBiome(H, gw, gh, seed) {
    const B = new Uint8Array(gw * gh);
    const moist = makeNoise(((seed >>> 0) || 1) + 104729);
    for (let y = 0; y < gh; y++) {
      const lat = Math.abs(y / gh - 0.5) * 2;
      for (let x = 0; x < gw; x++) {
        const i = y * gw + x;
        const h = H[i];
        if (h <= 0) continue;
        const m = moist(x / gw * 4, y / gh * 4, 4);
        const temp = 1 - lat * 0.9 - h * 0.6;
        let b = 0;
        if (temp < 0.16 || h > 0.86) b = 4;
        else if (h > 0.62) b = 7;
        else if (m > 0.6 && h < 0.12) b = 3;
        else if (m > 0.53) b = temp > 0.72 ? 5 : 1;
        else if (m < 0.36 && temp > 0.55) b = 2;
        else if (m < 0.42) b = 6;
        B[i] = b;
      }
    }
    return B;
  }

  // ───── 描画 ─────
  function mix(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function ramp(stops, v) {
    if (v <= stops[0][0]) return stops[0][1];
    for (let i = 1; i < stops.length; i++) {
      if (v <= stops[i][0]) {
        const t = (v - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]);
        return mix(stops[i - 1][1], stops[i][1], t);
      }
    }
    return stops[stops.length - 1][1];
  }

  /** 地面の質感（色を少し変える） */
  /** 拡大しても四角い模様が見えにくいノイズ（向きを変えた2つの値ノイズを重ねる） */
  function tnoise(x, y) {
    const a = vnoise(x, y);
    const b = vnoise(x * 0.866 - y * 0.5 + 17.3, x * 0.5 + y * 0.866 + 5.1);
    const n = ((a + b) * 0.5 - 0.5) * 1.45 + 0.5;
    return n < 0 ? 0 : n > 1 ? 1 : n;
  }

  function texture(b, c, wx, wy) {
    switch (b) {
      case 1: {
        const k = 0.9 + tnoise(wx * 0.35, wy * 0.35) * 0.16;
        return [c[0] * k, c[1] * k, c[2] * k];
      }
      case 2: {
        const s = Math.sin(wx * 0.22 + vnoise(wx * 0.05, wy * 0.05) * 6 + wy * 0.06);
        const g = (hash2(wx | 0, wy | 0, 3) - 0.5) * 6;
        const k = 1 + s * 0.03;
        return [c[0] * k + g, c[1] * k + g, c[2] * k + g];
      }
      case 3: {
        const n = tnoise(wx * 0.18, wy * 0.18);
        if (n > 0.72) return mix(c, [120, 150, 160], 0.45);
        const k = 0.92 + n * 0.12;
        return [c[0] * k, c[1] * k, c[2] * k];
      }
      case 4: {
        const n = vnoise(wx * 0.07, wy * 0.07);
        return mix(c, [214, 224, 236], Math.max(0, n - 0.45) * 0.8);
      }
      case 5: {
        const k = 0.86 + tnoise(wx * 0.45, wy * 0.45) * 0.2;
        return [c[0] * k, c[1] * k, c[2] * k];
      }
      case 6: {
        const k = 0.94 + vnoise(wx * 0.04, wy * 0.3) * 0.1;
        return [c[0] * k, c[1] * k, c[2] * k];
      }
      case 7: {
        const g = (hash2(wx * 2 | 0, wy * 2 | 0, 7) - 0.5) * 10;
        const k = 0.9 + tnoise(wx * 0.4, wy * 0.4) * 0.16;
        return [c[0] * k + g, c[1] * k + g, c[2] * k + g];
      }
      case 8: {
        const ox = wx + vnoise(wy * 0.03, 1) * 10;
        const oy = wy + vnoise(wx * 0.03, 2) * 10;
        const r = hash2(Math.floor(ox / 16), Math.floor(oy / 12), 8);
        const base = r < 0.33 ? c : r < 0.66 ? [c[0] * 0.92, c[1] * 1.02, c[2] * 0.85] : [c[0] * 1.04, c[1] * 0.98, c[2] * 0.9];
        if (((ox % 16) + 16) % 16 < 0.7 || ((oy % 12) + 12) % 12 < 0.7) return mix(base, [110, 96, 70], 0.4);
        const stripe = Math.sin((r < 0.5 ? ox : oy) * 1.6) > 0.6 ? 0.93 : 1;
        return [base[0] * stripe, base[1] * stripe, base[2] * stripe];
      }
      case 9: {
        if (hash2(wx | 0, wy | 0, 9) > 0.985) return [200, 90, 50];
        const k = 0.9 + vnoise(wx * 0.3, wy * 0.3) * 0.2;
        return [c[0] * k, c[1] * k, c[2] * k];
      }
      default: {
        const k = 0.97 + vnoise(wx * 0.2, wy * 0.2) * 0.06;
        return [c[0] * k, c[1] * k, c[2] * k];
      }
    }
  }

  /**
   * 地形を ImageData に描く。
   * img は「世界座標 × res」の大きさ。rx0..ry1 は画像のピクセル範囲（その部分だけ描き直せる）。
   */
  /**
   * 地形を描く。mask（同じ大きさの ImageData）を渡すと、陸を不透明・水を透明にした
   * 「陸地マスク」も書き込む（川を海岸で切るのに使う。縁はなめらかに）。
   */
  function renderTerrain(map, H, B, img, rx0, ry0, rx1, ry1, res, mask) {
    res = res || 1;
    const md = mask ? mask.data : null;
    const pal = PALETTES[(map.style && map.style.palette) || 'parchment'] || PALETTES.parchment;
    const shade = !map.style || map.style.hillshade !== false;
    const ripples = !map.style || map.style.ripples !== false;
    const { gw, gh, cell } = map;
    const W = img.width;
    const data = img.data;
    rx0 = Math.max(0, rx0 | 0); ry0 = Math.max(0, ry0 | 0);
    rx1 = Math.min(W, Math.ceil(rx1)); ry1 = Math.min(img.height, Math.ceil(ry1));
    for (let py = ry0; py < ry1; py++) {
      const wy = (py + 0.5) / res;
      const gy = wy / cell - 0.5;
      const y0 = Math.floor(gy);
      const fy = gy - y0;
      const ya = Math.max(0, Math.min(gh - 1, y0));
      const yb = Math.max(0, Math.min(gh - 1, y0 + 1));
      for (let px = rx0; px < rx1; px++) {
        const wx = (px + 0.5) / res;
        const gx = wx / cell - 0.5;
        const x0 = Math.floor(gx);
        const fx = gx - x0;
        const xa = Math.max(0, Math.min(gw - 1, x0));
        const xb = Math.max(0, Math.min(gw - 1, x0 + 1));
        const h00 = H[ya * gw + xa];
        const h10 = H[ya * gw + xb];
        const h01 = H[yb * gw + xa];
        const h11 = H[yb * gw + xb];
        const top = h00 + (h10 - h00) * fx;
        const bot = h01 + (h11 - h01) * fx;
        let h = top + (bot - top) * fy;
        const dhdx = ((h10 - h00) * (1 - fy) + (h11 - h01) * fy) / cell;
        const dhdy = (bot - top) / cell;
        const gm = Math.sqrt(dhdx * dhdx + dhdy * dhdy) + 1e-6;
        // 海岸線の細かな凹凸（平らな所では付けない）
        const amp = Math.min(0.05, gm * 3.5);
        if (amp > 0.002) h += ((vnoise(wx * 0.09, wy * 0.09) * 0.65 + vnoise(wx * 0.31, wy * 0.31) * 0.35) - 0.5) * amp;
        const dist = gm < 0.0004 ? 99 : Math.abs(h) / gm;
        let c;
        if (h < 0) {
          const depth = Math.min(1, -h / 0.6);
          c = mix(pal.shallow, pal.deep, depth * depth * (3 - 2 * depth));
          c = mix(c, pal.glow, Math.exp(-dist / 7) * 0.6);
          if (ripples) {
            for (let k = 0; k < 3; k++) {
              const a = 1 - Math.abs(dist - (5 + k * 5.5)) / 0.75;
              if (a > 0) c = mix(c, pal.ripple, a * (0.5 - k * 0.13));
            }
          }
          const n = (vnoise(wx * 0.025, wy * 0.025) - 0.5) * 6;
          c = [c[0] + n, c[1] + n, c[2] + n];
        } else {
          c = ramp(pal.ramp, h);
          // 地面の境目を、マス目の角ばりではなく、ゆるやかに波打つ形にする（細かなざらつきも少し残す）
          const jx = (vnoise(wx * 0.11 + 13.1, wy * 0.11) - 0.5) * 1.7 + (hash2(px, py, 1337) - 0.5) * 0.35;
          const jy = (vnoise(wx * 0.11, wy * 0.11 + 7.7) - 0.5) * 1.7 + (hash2(py, px, 1338) - 0.5) * 0.35;
          const bxi = Math.max(0, Math.min(gw - 1, Math.round(gx + jx)));
          const byi = Math.max(0, Math.min(gh - 1, Math.round(gy + jy)));
          const b = B ? B[byi * gw + bxi] : 0;
          if (b && pal.biome[b] && h < 0.82) c = mix(c, pal.biome[b], b === 4 ? 0.88 : 0.68);
          c = texture(b, c, wx, wy);
          if (dist < 2.4 && h < 0.25) c = mix(c, pal.beach, (1 - dist / 2.4) * 0.55);
          if (shade) {
            const s = 1 + (-dhdx - dhdy) * 0.7071 * 9;
            const k = Math.max(0.6, Math.min(1.3, s));
            c = [c[0] * k, c[1] * k, c[2] * k];
          }
        }
        if (dist < 0.95) c = mix(c, pal.coast, Math.max(0, 1 - dist / 0.95) * 0.92);
        if (pal.paper) {
          const n = (hash2(px, py, 99) - 0.5) * pal.paper * 2;
          c = [c[0] + n, c[1] + n, c[2] + n];
        }
        const o = (py * W + px) * 4;
        if (md) {
          // 海岸線からの符号つき距離（陸が正）を1画素ぶんの幅でなめらかにする
          const sd = gm < 0.0004 ? (h > 0 ? 9 : -9) : h / gm;
          const a = 0.5 + sd * res;
          md[o] = 255; md[o + 1] = 255; md[o + 2] = 255;
          md[o + 3] = a <= 0 ? 0 : a >= 1 ? 255 : a * 255;
        }
        data[o] = c[0] < 0 ? 0 : c[0] > 255 ? 255 : c[0];
        data[o + 1] = c[1] < 0 ? 0 : c[1] > 255 ? 255 : c[1];
        data[o + 2] = c[2] < 0 ? 0 : c[2] > 255 ? 255 : c[2];
        data[o + 3] = 255;
      }
    }
  }

  function sampleH(H, gw, gh, cell, wx, wy) {
    const x = Math.max(0, Math.min(gw - 1, Math.round(wx / cell - 0.5)));
    const y = Math.max(0, Math.min(gh - 1, Math.round(wy / cell - 0.5)));
    return H[y * gw + x];
  }
  function sampleB(B, gw, gh, cell, wx, wy) {
    const x = Math.max(0, Math.min(gw - 1, Math.round(wx / cell - 0.5)));
    const y = Math.max(0, Math.min(gh - 1, Math.round(wy / cell - 0.5)));
    return B[y * gw + x];
  }

  let stampSeq = 0;
  function sid() {
    stampSeq = (stampSeq + 1) % 1e6;
    return 's' + Date.now().toString(36) + stampSeq.toString(36) + Math.floor(Math.random() * 1296).toString(36);
  }

  /** 地形から山・丘・森などの素材を自動で並べる */
  function autoStamps(map, H, B, seed) {
    const { gw, gh, cell } = map;
    const W = gw * cell;
    const Hpx = gh * cell;
    const rnd = mulberry32(((seed >>> 0) || 1) + 31337);
    const out = [];
    const put = (a, x, y, s) => out.push({ id: sid(), a, x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, s: Math.round(s * 100) / 100, r: 0, f: rnd() < 0.5, v: Math.floor(rnd() * 8) });
    const ms = 18;
    let row = 0;
    for (let y = ms; y < Hpx - 4; y += ms * 0.62, row++) {
      for (let x = ms / 2; x < W - 4; x += ms) {
        const jx = x + (rnd() - 0.5) * ms * 0.7 + (row % 2) * ms * 0.5;
        const jy = y + (rnd() - 0.5) * ms * 0.35;
        const h = sampleH(H, gw, gh, cell, jx, jy);
        if (h > 0.44 && rnd() < 0.35 + (h - 0.44) * 1.6) {
          put(h > 0.76 ? (rnd() < 0.5 ? 'mountain-snow' : 'mountain-tall') : 'mountain', jx, jy, 0.85 + Math.min(0.5, (h - 0.44) * 1.0) + rnd() * 0.15);
        } else if (h > 0.28 && h <= 0.44 && rnd() < 0.3) {
          put('hill', jx, jy, 0.85 + rnd() * 0.3);
        }
      }
    }
    const ts = 5.5;
    for (let y = ts; y < Hpx - 2; y += ts * 0.85) {
      for (let x = ts / 2; x < W - 2; x += ts) {
        const jx = x + (rnd() - 0.5) * ts * 0.9;
        const jy = y + (rnd() - 0.5) * ts * 0.7;
        const h = sampleH(H, gw, gh, cell, jx, jy);
        if (h <= 0.02 || h > 0.42) continue;
        const b = B ? sampleB(B, gw, gh, cell, jx, jy) : 0;
        const lat = Math.abs(jy / Hpx - 0.5) * 2;
        if (b === 1 && rnd() < 0.72) put(lat > 0.55 || rnd() < 0.3 ? 'tree-conifer' : 'tree-round', jx, jy, 0.85 + rnd() * 0.3);
        else if (b === 5 && rnd() < 0.75) put(rnd() < 0.82 ? 'tree-jungle' : 'tree-palm', jx, jy, 0.85 + rnd() * 0.3);
        else if (b === 4 && rnd() < 0.06) put('tree-snow', jx, jy, 0.9 + rnd() * 0.2);
        else if (b === 2 && rnd() < 0.05) put('dune', jx, jy, 0.8 + rnd() * 0.4);
        else if (b === 3 && rnd() < 0.2) put('reeds', jx, jy, 0.9 + rnd() * 0.2);
        else if (b === 7 && rnd() < 0.1) put('rocks', jx, jy, 0.8 + rnd() * 0.3);
        else if (b === 0 && rnd() < 0.012) put('tree-round', jx, jy, 0.9);
      }
    }
    out.sort((a, b) => a.y - b.y);
    return out;
  }

  // ───── 保存形式 ─────
  function bytesToB64(bytes) {
    let s = '';
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    return typeof btoa === 'function' ? btoa(s) : Buffer.from(s, 'binary').toString('base64');
  }
  function b64ToBytes(b64) {
    const s = typeof atob === 'function' ? atob(b64) : Buffer.from(b64, 'base64').toString('binary');
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }
  function encodeHeights(H) {
    const q = new Int8Array(H.length);
    for (let i = 0; i < H.length; i++) {
      // 陸と海の区別（符号）が丸めで失われないようにする
      let v = Math.round(H[i] * 127);
      if (v === 0) v = H[i] >= 0 ? 1 : -1;
      q[i] = Math.max(-127, Math.min(127, v));
    }
    return bytesToB64(new Uint8Array(q.buffer));
  }
  function decodeHeights(b64, n) {
    const bytes = b64ToBytes(b64);
    const q = new Int8Array(bytes.buffer, bytes.byteOffset, bytes.length);
    const H = new Float32Array(n);
    for (let i = 0; i < n && i < q.length; i++) H[i] = q[i] / 127;
    return H;
  }
  function encodeBiomes(B) { return bytesToB64(B); }
  function decodeBiomes(b64, n) {
    const bytes = b64ToBytes(b64);
    const B = new Uint8Array(n);
    B.set(bytes.subarray(0, n));
    return B;
  }

  const SIZES = { s: [240, 156], m: [300, 195], l: [380, 247] };

  function defaultStyle(palette) {
    return {
      palette: palette || 'parchment', hillshade: true, ripples: true, grid: 'none', gridSize: 12, gridOpacity: 0.25,
      kmPerCell: 4, scale: true, title: 'banner', frame: 'simple', vignette: true, texture: true,
    };
  }

  function defaultLayers() {
    return { terrain: {}, stamps: {}, paths: {}, areas: {}, labels: {}, deco: {} };
  }

  /** 地図データの雛形 */
  function newMap(name, opts) {
    opts = opts || {};
    const size = SIZES[opts.size || 'm'] || SIZES.m;
    const gw = size[0];
    const gh = size[1];
    const cell = 4;
    const seed = opts.seed || Math.floor(Math.random() * 1e9);
    const H = generate(gw, gh, { preset: opts.preset || 'continent', seed, land: opts.land });
    const B = opts.biome === false ? new Uint8Array(gw * gh) : autoBiome(H, gw, gh, seed);
    const map = {
      id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: name || '新しい地図', gw, gh, cell, seed,
      height: encodeHeights(H), biome: encodeBiomes(B),
      stamps: [], lines: [], areas: [], labels: [],
      style: defaultStyle(opts.palette), layers: defaultLayers(),
      createdAt: Date.now(), updatedAt: Date.now(),
    };
    if (opts.stamps !== false) map.stamps = autoStamps(map, H, B, seed);
    if (opts.compass !== false) map.stamps.push({ id: sid(), a: 'compass', x: gw * cell - 56, y: 68, s: 1, r: 0, f: false, v: 0 });
    return map;
  }

  /** 古い形式の地図（地点・自動の山記号）を新しい形式に直す */
  function migrate(map) {
    map.lines = map.lines || [];
    map.areas = map.areas || [];
    map.labels = map.labels || [];
    const old = map.style || {};
    if (!Array.isArray(map.stamps)) {
      map.stamps = [];
      const n = map.gw * map.gh;
      if (old.glyphs !== false && map.height) {
        const H = decodeHeights(map.height, n);
        const B = map.biome ? decodeBiomes(map.biome, n) : new Uint8Array(n);
        map.stamps = autoStamps(map, H, B, map.seed || 1);
      }
      (map.markers || []).forEach((mk) => {
        map.stamps.push({ id: mk.id || sid(), a: 'sym-' + (mk.type || 'pin'), x: mk.x, y: mk.y, s: 1, r: 0, f: false, v: 0, name: mk.name || '', entryId: mk.entryId || '', note: mk.note || '' });
      });
      if (old.compass) map.stamps.push({ id: sid(), a: 'compass', x: map.gw * map.cell - 56, y: 68, s: 1, r: 0, f: false, v: 0 });
      map.stamps.sort((a, b) => a.y - b.y);
    }
    delete map.markers;
    const st = Object.assign(defaultStyle(old.palette), old);
    if (st.title === true) st.title = 'plain';
    if (st.title === false) st.title = 'none';
    if (st.grid === true) st.grid = 'square';
    if (st.grid === false) st.grid = 'none';
    if (st.kmPerCell == null) st.kmPerCell = 4;
    delete st.glyphs;
    delete st.compass;
    map.style = st;
    map.layers = Object.assign(defaultLayers(), map.layers || {});
    return map;
  }

  function findLand(H, gw, gh, rnd, minH, maxH) {
    for (let k = 0; k < 4000; k++) {
      const x = 6 + Math.floor(rnd() * (gw - 12));
      const y = 6 + Math.floor(rnd() * (gh - 12));
      const h = H[y * gw + x];
      if (h >= (minH == null ? 0.05 : minH) && h <= (maxH == null ? 0.35 : maxH)) return { x, y };
    }
    return { x: gw >> 1, y: gh >> 1 };
  }

  /** 解像度（世界座標 1px あたりの画素数）を地図の大きさから決める */
  function pickRes(W, H, budget) {
    return Math.max(1, Math.min(2, Math.sqrt((budget || 2.4e6) / (W * H))));
  }

  NS.MapEngine = {
    BIOMES, PALETTES, PRESETS, SIZES, mulberry32, makeNoise, hash2, vnoise, generate, autoBiome, renderTerrain, autoStamps,
